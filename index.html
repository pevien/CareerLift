      ["p", "Nợ kỹ thuật là những lối tắt trong code hoặc kiến trúc làm các thay đổi sau này chậm và rủi ro hơn. Hãy hỏi engineer nợ nào đang làm chậm team hoặc gây sự cố, chuyển nó thành tác động dễ hiểu (thời gian ra tính năng, số sự cố, trải nghiệm người dùng), và giữ một phần dung lượng cố định mỗi sprint để trả nợ thay vì đợi \"khi nào rảnh\"."],
      ["warn", ["Ép engineer giảm ước lượng để khớp ngày đã hứa", "Cắt phạm vi bằng cách bỏ kiểm thử, bảo mật hoặc tracking", "Coi nợ kỹ thuật là việc của riêng engineering, không bao giờ đưa vào roadmap", "Không giải thích bối cảnh kinh doanh, chỉ giao việc"]],
      ["q", ["Engineering ước lượng gấp đôi thời gian bạn mong đợi. Bạn làm gì?", "Bạn cân bằng giữa làm tính năng mới và trả nợ kỹ thuật thế nào?", "Kể về một lần bạn cắt phạm vi để kịp ra mắt."]]
    ]},
    {id:"execution-7", t:"Agile và Scrum trong thực tế", m:6, b:[
      ["p", "Hầu hết công ty công nghệ ở Việt Nam nói mình làm Agile, nhưng mỗi nơi làm một kiểu. Người phỏng vấn ít hỏi định nghĩa, mà hỏi bạn đã vận hành nó thế nào, gặp vấn đề gì và điều chỉnh ra sao."],
      ["h", "Vai trò và nghi thức, nhìn từ phía PM"],
      ["ul", ["Backlog refinement: buổi quan trọng nhất với PM; làm rõ và chia nhỏ story trước sprint planning để planning không biến thành buổi thảo luận yêu cầu", "Sprint goal: một câu mô tả sprint này đạt được gì, giúp team quyết định khi có việc phát sinh", "Definition of Done: tiêu chuẩn chung cho mọi story, ví dụ đã test, đã review code, đã có tracking", "Sprint review: demo cho stakeholder và lấy phản hồi thật, không chỉ báo cáo", "Retrospective: PM nên tham gia và lắng nghe, vì nhiều vấn đề bắt nguồn từ yêu cầu không rõ"]],
      ["h", "Scrum hay Kanban"],
      ["p", "Scrum hợp khi team làm tính năng mới với nhịp đều và cần cam kết theo sprint. Kanban hợp với team vận hành, hỗ trợ hoặc nhiều việc nhỏ đến liên tục, tập trung vào giới hạn việc đang làm dở (WIP) và thời gian hoàn thành. Nhiều team kết hợp cả hai."],
      ["ex", "Một team thương mại điện tử liên tục bị chen việc gấp từ bộ phận kinh doanh trước các đợt sale lớn, sprint nào cũng không xong.\nPM đề xuất: giữ một phần dung lượng cố định cho việc gấp, mọi yêu cầu chen ngang phải qua PM và đổi lấy một việc khác có cùng độ lớn ra khỏi sprint. Sau vài sprint, team đo được tỷ lệ hoàn thành sprint goal tăng và stakeholder cũng quen lên kế hoạch sớm hơn."],
      ["warn", ["Làm đủ nghi thức nhưng không có sprint goal, sprint chỉ là danh sách việc", "Dùng velocity để so sánh các team hoặc đánh giá cá nhân", "Đổi phạm vi sprint liên tục mà không có quy tắc", "Coi Agile là lý do để không cần kế hoạch dài hạn"]],
      ["q", ["Sprint của team bạn thường không hoàn thành. Bạn sẽ tìm hiểu và xử lý thế nào?", "Theo bạn vai trò của PM trong các buổi Scrum là gì?"]]
    ]},
    {id:"execution-8", t:"Ra mắt sản phẩm: rollout, feature flag, kế hoạch rủi ro", m:6, b:[
      ["p", "Ra mắt không phải là bấm nút deploy. Một lần ra mắt tốt được chuẩn bị để phát hiện vấn đề sớm, ảnh hưởng ít người nhất có thể và quay lui nhanh khi cần. Với sản phẩm liên quan đến tiền như ví điện tử hay ngân hàng số, điều này càng quan trọng."],
      ["h", "Công cụ để ra mắt an toàn"],
      ["ul", ["Feature flag: bật hoặc tắt tính năng mà không cần phát hành bản mới; giúp tách việc deploy code khỏi việc mở cho người dùng", "Rollout theo tỷ lệ: mở cho nội bộ, rồi 1%, 5%, 20%, 50%, 100%; mỗi bước có tiêu chí để đi tiếp", "Beta hoặc thử nghiệm theo vùng: mở trước ở một thành phố hoặc cho một nhóm người dùng đăng ký", "Kill switch: cách tắt nhanh khi có sự cố, đã thử trước khi ra mắt"]],
      ["h", "Checklist ra mắt"],
      ["ol", ["Tiêu chí thành công và tiêu chí dừng: chỉ số nào xấu đi đến mức nào thì tạm dừng rollout.", "Dashboard và cảnh báo đã sẵn sàng trước ngày ra mắt.", "Kế hoạch quay lui: ai quyết định, ai thực hiện, mất bao lâu.", "CSKH, vận hành, marketing được báo trước, có kịch bản trả lời câu hỏi.", "Kiểm tra yêu cầu pháp lý, bảo mật nếu tính năng chạm đến dữ liệu hay tiền.", "Kênh liên lạc trong ngày ra mắt và người trực."]],
      ["ex", "App xe công nghệ ra mắt tính năng đặt xe hộ người thân.\nTuần 1: nhân viên nội bộ. Tuần 2: 5% người dùng ở một thành phố. Tiêu chí dừng: tỷ lệ hủy chuyến tăng quá mức giả định đặt trước, hoặc số khiếu nại về tài xế không liên lạc được với người đi tăng rõ. Ở 5%, team thấy tài xế hay gọi nhầm cho người đặt thay vì người đi, nên tạm dừng, sửa hiển thị số điện thoại rồi mới mở tiếp."],
      ["warn", ["Mở 100% ngay từ đầu cho tính năng có rủi ro", "Không định nghĩa trước khi nào thì dừng, đến lúc có sự cố mới tranh luận", "Quên báo CSKH, người dùng hỏi mà không ai biết trả lời", "Để feature flag cũ tồn tại mãi, làm code rối và khó kiểm soát"]],
      ["q", ["Hãy mô tả kế hoạch ra mắt cho một tính năng thanh toán mới.", "Sau khi rollout 10%, chỉ số chính tăng nhưng khiếu nại cũng tăng. Bạn làm gì?"]]
    ]},
    {id:"execution-9", t:"Ra quyết định khi thiếu dữ liệu", m:6, b:[
      ["p", "PM hiếm khi có đủ dữ liệu. Sản phẩm mới chưa có lịch sử, thử nghiệm A/B cần thời gian và đủ lượng người dùng, còn thị trường thì không chờ. Kỹ năng quan trọng là quyết định đủ tốt, đủ nhanh, và biết khi nào cần thêm thông tin."],
      ["h", "Phân loại quyết định trước"],
      ["ul", ["Quyết định đảo ngược được (cửa hai chiều): đổi chữ trên nút, thử một ưu đãi nhỏ; nên quyết nhanh, thử và học", "Quyết định khó đảo ngược (cửa một chiều): đổi mô hình phí, xóa tính năng nhiều người dùng, cam kết với đối tác; cần thận trọng và nhiều góc nhìn hơn", "Hỏi thêm: chi phí của việc chờ là bao nhiêu so với chi phí của việc quyết sai?"]],
      ["h", "Các cách bù khi thiếu dữ liệu"],
      ["ol", ["Viết rõ giả định quan trọng nhất và điều gì sẽ chứng minh nó sai.", "Tìm tín hiệu nhanh: phỏng vấn 5 đến 10 người dùng, dữ liệu CSKH, hành vi trên tính năng tương tự.", "Ước lượng nhanh bằng logic (Fermi) để biết bậc độ lớn.", "Làm thử nghiệm nhỏ: fake door, bản thủ công, mở cho một nhóm nhỏ.", "Quyết định, ghi lại lý do, và đặt mốc xem lại."]],
      ["ex", "Một app thương mại điện tử cân nhắc thêm lựa chọn \"giao trong 2 giờ\" ở nội thành nhưng chưa biết người dùng có chịu trả thêm phí không.\nThay vì xây hệ thống giao nhanh ngay, PM đặt một lựa chọn trên trang thanh toán cho một nhóm nhỏ người dùng. Khi khách chọn, họ thấy thông báo dịch vụ sắp có và đơn được giao bình thường kèm một mã giảm giá xin lỗi. Tỷ lệ chọn cho biết nhu cầu thực, chi phí thấp và có thể dừng bất cứ lúc nào."],
      ["warn", ["Chờ dữ liệu hoàn hảo trong khi cơ hội trôi qua", "Ra quyết định theo cảm tính nhưng trình bày như có dữ liệu", "Không ghi lại giả định, sau này không biết mình sai ở đâu", "Áp dụng cùng một mức thận trọng cho mọi quyết định"]],
      ["tip", "Trong phỏng vấn, câu \"Tôi giả định X vì Y, và tôi sẽ kiểm chứng bằng Z\" thường ghi điểm hơn việc cố đưa ra con số chính xác."],
      ["q", ["Kể về một lần bạn phải quyết định khi không có đủ dữ liệu.", "Bạn sẽ quyết định có ra mắt một tính năng không khi kết quả A/B test không có ý nghĩa thống kê?"]]
    ]},
    {id:"execution-10", t:"Sau ra mắt: đo lường, lặp lại hay dừng tính năng", m:6, b:[
      ["p", "Ra mắt là lúc bắt đầu học, không phải lúc kết thúc. Nhiều team ra mắt xong là chuyển sang việc mới, để lại những tính năng không ai dùng nhưng vẫn tốn công bảo trì. PM giỏi đặt sẵn mốc đánh giá và dám đưa ra quyết định: đầu tư thêm, sửa, hay dừng."],
      ["h", "Đánh giá sau ra mắt"],
      ["ol", ["So với mục tiêu đã đặt trong PRD: chỉ số chính và chỉ số đối trọng thay đổi thế nào.", "Xem theo funnel: bao nhiêu người thấy tính năng, thử dùng, dùng lại.", "Tách theo nhóm người dùng: tính năng có thể tốt với nhóm này, kém với nhóm khác.", "Đọc phản hồi định tính: đánh giá trên store, ticket CSKH, phỏng vấn người dùng.", "Phân biệt hiệu ứng mới lạ với thay đổi bền vững; xem retention sau vài tuần chứ không chỉ tuần đầu."]],
      ["h", "Lặp lại hay dừng"],
      ["ul", ["Đầu tư thêm: người dùng tìm thấy và dùng lại đều, chỉ số chính cải thiện rõ", "Sửa và thử lại: người dùng lặp lại cao nhưng ít người biết đến, hoặc vướng ở một bước cụ thể trong funnel", "Dừng: sau vài lần sửa vẫn ít người dùng lại, chi phí bảo trì và độ phức tạp vượt giá trị mang lại", "Khi dừng: báo trước cho người đang dùng, hướng dẫn cách thay thế, gỡ code và feature flag"]],
      ["ex", "Một ví điện tử ra mắt tính năng \"hũ tiết kiệm theo mục tiêu\".\nSau 6 tuần: nhiều người tạo hũ trong tuần đầu nhưng tỷ lệ nạp tiền lần hai thấp. Phỏng vấn cho thấy người dùng quên mất hũ. Team thêm nhắc nạp định kỳ và tự động trích tiền khi nhận lương. Nếu sau hai vòng lặp tỷ lệ nạp lại vẫn không cải thiện so với mức đặt ra, team sẽ thu gọn tính năng thay vì tiếp tục đầu tư."],
      ["warn", ["Không đặt mục tiêu trước nên chỉ số nào tăng cũng gọi là thành công", "Kết luận chỉ sau vài ngày, khi hiệu ứng mới lạ còn mạnh", "Ngại dừng tính năng vì đã tốn nhiều công (chi phí chìm)", "Dừng tính năng đột ngột mà không báo người đang dùng"]],
      ["q", ["Tính năng bạn ra mắt 2 tháng trước có số người dùng thấp hơn kỳ vọng. Bạn làm gì?", "Làm sao bạn quyết định nên dừng một tính năng?", "Bạn đo thành công của một tính năng mới sau ra mắt như thế nào?"]]
    ]}
  ],
  strategy: [
    {id:"strategy-1", t:"Nền tảng tư duy chiến lược", m:5, b:[
      ["p","Câu hỏi chiến lược kiểm tra bạn có nhìn được bức tranh lớn: thị trường, đối thủ, lợi thế của công ty, và sản phẩm nên đi về đâu."],
      ["ul",["Product-market fit: sản phẩm thỏa mãn một thị trường đủ lớn; dấu hiệu là retention đi ngang và tăng trưởng tự nhiên","Hiệu ứng mạng: giá trị tăng khi có thêm người dùng, trực tiếp (app nhắn tin) hoặc gián tiếp (marketplace hai mặt)","Moat: lợi thế khó sao chép như hiệu ứng mạng, chi phí chuyển đổi, dữ liệu riêng, thương hiệu, quy mô","Kinh tế đơn vị: mỗi khách hàng hoặc mỗi đơn có lãi không, so sánh CAC (chi phí có khách) với LTV (giá trị vòng đời)"]],
      ["h","Khung gợi ý khi phân tích"],
      ["ol",["Mục tiêu của công ty và vị trí hiện tại.","Khách hàng và nhu cầu chưa được đáp ứng.","Đối thủ và sản phẩm thay thế.","Lợi thế riêng của mình.","Lựa chọn, đánh đổi và cách thử nghiệm."]],
      ["warn",["Nói chung chung về \"tiềm năng thị trường lớn\" mà không có con số hay lý do","Bỏ qua kinh tế đơn vị"]]
    ]},
    {id:"strategy-2", t:"Dạng câu \"Có nên làm X không?\"", m:5, b:[
      ["p","Dạng \"công ty A có nên mở dịch vụ B hoặc vào thị trường C?\". Hãy trả lời có cấu trúc, và cuối cùng phải đưa ra quan điểm."],
      ["ol",["Mục tiêu chiến lược: vì sao công ty muốn làm (tăng tần suất sử dụng, doanh thu mới, phòng thủ).","Thị trường: quy mô, tăng trưởng, ai đang có mặt.","Lợi thế: tài sản tận dụng được như người dùng, mạng lưới, thương hiệu, dữ liệu.","Rủi ro: vận hành, pháp lý, ăn mòn sản phẩm chính, chi phí cơ hội.","Cách thử: phạm vi nhỏ, chỉ số và ngưỡng để mở rộng hoặc dừng.","Kết luận: có, không, hoặc có với điều kiện."]],
      ["ex","App gọi xe mở dịch vụ đi chợ hộ: tận dụng được tài xế giờ thấp điểm và người dùng sẵn có, tăng tần suất mở app. Rủi ro là vận hành chất lượng hàng tươi và biên lợi nhuận mỏng. Đề xuất thử ở hai quận với vài siêu thị đối tác trong 8 tuần, đo tỉ lệ đặt lại và lợi nhuận mỗi đơn."],
      ["warn",["Không đưa ra kết luận","Quên chi phí cơ hội: làm việc này thì không làm được việc gì khác"]]
    ]},
    {id:"strategy-3", t:"Ước lượng (estimation)", m:5, b:[
      ["p","Câu ước lượng kiểm tra cách bạn chia nhỏ vấn đề và lập luận với số liệu không chắc chắn. Con số cuối cùng ít quan trọng hơn cách đi tới nó."],
      ["ol",["Làm rõ câu hỏi: đếm cái gì, ở đâu, trong khoảng thời gian nào.","Chọn cách tiếp cận: từ trên xuống (dân số nhân tỉ lệ) hoặc từ dưới lên (một điểm bán nhân số điểm bán).","Viết công thức trước, rồi mới điền số.","Dùng số tròn, nói lý do cho mỗi giả định.","Tính thành lời từng bước.","Kiểm tra độ hợp lý và nói giả định nào kém chắc chắn nhất."]],
      ["ex","Người dùng ví điện tử hoạt động hằng tháng ở Việt Nam ≈ dân số (khoảng 100 triệu) × tỉ lệ ở độ tuổi 15 đến 60 (giả định 65%) × tỉ lệ có smartphone và tài khoản thanh toán (giả định 70%) × tỉ lệ dùng ví ít nhất một lần mỗi tháng (giả định 60%) ≈ 27 triệu. Sau đó đối chiếu với số liệu công bố của các ví lớn để kiểm tra."],
      ["warn",["Im lặng tính nhẩm, không nói lập luận","Dùng số lẻ khó tính"]]
    ]},
    {id:"strategy-4", t:"Phân tích cạnh tranh và định vị sản phẩm", m:6, b:[
      ["p", "Phân tích cạnh tranh không phải là lập bảng so sánh tính năng cho đẹp. Mục đích là trả lời: khách hàng đang có những lựa chọn nào, vì sao họ chọn mình hoặc không chọn mình, và mình nên thắng ở điểm nào. Định vị là câu trả lời ngắn gọn cho câu hỏi cuối cùng đó."],
      ["h", "Xác định đúng đối thủ"],
      ["ul", ["Đối thủ trực tiếp: cùng giải quyết một nhu cầu, cùng cách làm, ví dụ hai app giao đồ ăn", "Đối thủ gián tiếp: cùng nhu cầu nhưng cách khác, ví dụ quán cơm văn phòng tự giao qua Zalo, hay căn tin công ty", "Sản phẩm thay thế và thói quen cũ: tiền mặt, sổ ghi chép, Excel, gọi điện thoại. Với nhiều sản phẩm ở Việt Nam, đây mới là đối thủ lớn nhất", "Không làm gì cả: người dùng chấp nhận vấn đề vì chi phí thay đổi cao hơn nỗi đau"]],
      ["h", "Phân tích theo góc nhìn khách hàng"],
      ["ol", ["Chọn một nhóm khách hàng cụ thể, vì mỗi nhóm có bộ tiêu chí chọn khác nhau.", "Liệt kê 4 đến 6 tiêu chí mà nhóm đó thực sự dùng để chọn: giá, tốc độ, độ tin cậy, sự tiện lợi, mức độ phủ.", "Đánh giá mình và từng đối thủ trên các tiêu chí đó, dựa trên dữ liệu, đánh giá của người dùng hoặc tự trải nghiệm.", "Tìm khoảng trống: tiêu chí quan trọng mà chưa ai làm tốt, hoặc nhóm khách hàng đang bị phục vụ kém.", "Kiểm tra xem mình có lợi thế thật để lấp khoảng trống đó không, hay chỉ là mong muốn."]],
      ["p", "Sau khi phân tích, viết câu định vị: Dành cho [nhóm khách hàng] đang gặp [nhu cầu], [sản phẩm] là [loại sản phẩm] giúp [lợi ích chính], khác với [lựa chọn thay thế] ở chỗ [điểm khác biệt]. Nếu không viết được câu này một cách rõ ràng, đội ngũ sẽ khó thống nhất ưu tiên."],
      ["ex", "Một ngân hàng số mới muốn cạnh tranh với app của các ngân hàng lớn.\nNếu so tính năng, các bên gần như giống nhau: chuyển khoản, QR, tiết kiệm. Nhưng khi chọn nhóm sinh viên và người mới đi làm, tiêu chí chính của họ là mở tài khoản nhanh, không phí, giao diện dễ dùng và quản lý chi tiêu.\nĐịnh vị có thể là: dành cho người trẻ mới đi làm muốn kiểm soát tiền của mình, đây là ngân hàng số giúp mở tài khoản trong vài phút và thấy rõ tiền đi đâu, khác với app ngân hàng truyền thống vốn tập trung vào giao dịch hơn là quản lý chi tiêu."],
      ["h", "Khi đối thủ ra tính năng mới"],
      ["ul", ["Hỏi trước: tính năng đó giải quyết vấn đề gì, cho nhóm nào, có liên quan tới khách hàng mục tiêu của mình không", "Xem dữ liệu: người dùng của mình có đang rời đi hay hỏi về tính năng đó không", "Chỉ sao chép khi đó là yêu cầu tối thiểu của thị trường; nếu không, đầu tư vào điểm khác biệt của mình", "Đừng để roadmap bị đối thủ điều khiển"]],
      ["warn", ["Chỉ liệt kê đối thủ trực tiếp, bỏ qua thói quen cũ và cách làm thủ công", "So sánh theo số lượng tính năng thay vì theo tiêu chí khách hàng dùng để chọn", "Định vị cho tất cả mọi người, kết quả là không nổi bật với ai", "Phản ứng với mọi động thái của đối thủ"]],
      ["q", ["Ai là đối thủ của một app giao đồ ăn ở Việt Nam? Bạn sẽ khác biệt hóa thế nào?", "Đối thủ vừa ra một tính năng được nhiều người khen. Bạn có làm theo không?", "Hãy định vị một ví điện tử mới trong một thị trường đã có nhiều ví lớn."]]
    ]},
    {id:"strategy-5", t:"Mô hình kinh doanh và cách kiếm tiền", m:6, b:[
      ["p", "PM không chỉ làm sản phẩm người dùng thích, mà phải làm sản phẩm giúp công ty sống được. Hiểu công ty kiếm tiền từ đâu giúp bạn giải thích vì sao một tính năng được ưu tiên, và tránh đề xuất những thứ đi ngược mô hình kinh doanh."],
      ["h", "Các cách kiếm tiền phổ biến"],
      ["ul", ["Phí giao dịch (take rate): thu phần trăm trên mỗi giao dịch, như sàn thương mại điện tử, app giao đồ ăn, cổng thanh toán", "Thuê bao: thu phí định kỳ theo tháng hoặc năm, như app nghe nhạc, phần mềm B2B (SaaS)", "Quảng cáo: người dùng dùng miễn phí, nhà quảng cáo trả tiền để tiếp cận họ, như mạng xã hội, app tin tức", "Freemium: bản cơ bản miễn phí, trả tiền để mở thêm tính năng hoặc bỏ giới hạn", "Bán hàng trực tiếp: tự nhập hoặc tự sản xuất rồi bán, lợi nhuận đến từ chênh lệch giá", "Dịch vụ tài chính: lãi từ cho vay, phí phân phối bảo hiểm hoặc quỹ đầu tư, thường thấy ở ví điện tử và ngân hàng số"]],
      ["p", "Nhiều sản phẩm kết hợp nhiều nguồn. Một sàn thương mại điện tử có thể thu phí người bán, bán quảng cáo trong sàn và thu phí dịch vụ vận chuyển. Khi phỏng vấn, hãy nói rõ nguồn thu chính và nguồn thu phụ."],
      ["h", "Nhìn kinh tế của một đơn hàng"],
      ["p", "Cách nhanh nhất để hiểu một mô hình là bóc tách một đơn vị: một đơn hàng, một người dùng trả phí, một khoản vay. Tính xem sau khi trừ các chi phí trực tiếp, mỗi đơn còn lại bao nhiêu (contribution margin)."],
      ["ex", "Một đơn giao đồ ăn, toàn bộ số liệu là giả định:\nGiá trị đơn 150.000đ, nền tảng thu hoa hồng 25% từ quán = 37.500đ.\nPhí giao khách trả: 15.000đ. Tổng thu của nền tảng: 52.500đ.\nTrả tài xế: 25.000đ. Mã giảm giá: 10.000đ. Phí thanh toán: 2.000đ.\nCòn lại khoảng 15.500đ mỗi đơn để bù chi phí marketing, công nghệ và vận hành.\nTừ đây thấy ngay: tăng khuyến mãi thêm 10.000đ mỗi đơn sẽ làm mất gần hai phần ba số tiền còn lại, nên cần chứng minh nó tạo thêm đủ đơn."],
      ["h", "Mô hình kinh doanh định hình quyết định sản phẩm"],
      ["ul", ["Quảng cáo: thời gian sử dụng là đòn bẩy doanh thu, nhưng quá nhiều quảng cáo làm hỏng trải nghiệm. PM phải cân bằng hai thứ này", "Take rate: tăng phí thì tăng doanh thu ngắn hạn, nhưng người bán có thể rời đi hoặc tăng giá với người mua", "Thuê bao: retention quan trọng hơn lượt tải; giá trị phải được cảm nhận lặp lại mỗi tháng", "Cho vay: tăng trưởng nhanh dễ, kiểm soát nợ xấu mới là bài toán sống còn"]],
      ["tip", "Khi đề xuất tính năng trong phỏng vấn, hãy nói thêm một câu tính năng đó ảnh hưởng thế nào tới doanh thu hoặc chi phí. Đây là điểm cộng lớn với người phỏng vấn cấp quản lý."],
      ["warn", ["Chỉ nói về doanh thu mà quên chi phí trực tiếp trên mỗi đơn", "Đề xuất tính năng làm giảm nguồn thu chính mà không nhận ra", "Nghĩ miễn phí cho người dùng nghĩa là không có ai trả tiền", "Tăng trưởng bằng trợ giá mà không có đường đến lợi nhuận"]],
      ["q", ["Một app giao đồ ăn kiếm tiền từ đâu? Bạn sẽ cải thiện lợi nhuận mỗi đơn thế nào?", "Một ví điện tử miễn phí chuyển tiền cho người dùng thì sống bằng gì?", "Bạn sẽ quyết định thế nào khi tính năng tăng trải nghiệm lại làm giảm doanh thu quảng cáo?"]]
    ]},
    {id:"strategy-6", t:"Go-to-market: đưa sản phẩm ra thị trường", m:6, b:[
      ["p", "Sản phẩm tốt mà không ai biết, không ai thử thì cũng như không có. Go-to-market (GTM) là kế hoạch đưa sản phẩm đến đúng khách hàng, qua đúng kênh, với đúng thông điệp. PM thường không sở hữu marketing hay sales, nhưng phải dẫn dắt để các bên cùng hiểu sản phẩm dành cho ai và vì sao."],
      ["h", "Các thành phần của một kế hoạch GTM"],
      ["ol", ["Khách hàng đầu tiên: chọn một nhóm hẹp có nhu cầu mạnh nhất để bắt đầu (beachhead), thay vì nhắm cả thị trường.", "Thông điệp: một câu nói rõ lợi ích, bằng ngôn ngữ của khách hàng chứ không phải tên tính năng.", "Kênh: khách hàng biết đến, thử và mua sản phẩm qua đâu.", "Giá và ưu đãi ra mắt: có cần dùng thử miễn phí hay khuyến mãi để giảm rào cản không.", "Phạm vi và thời điểm: ra mắt ở đâu, cho ai trước, có tránh mùa cao điểm vận hành không.", "Chỉ số và ngưỡng: đo gì trong vài tuần đầu, khi nào thì mở rộng, khi nào thì điều chỉnh."]],
      ["h", "Chọn kênh phù hợp"],
      ["ul", ["Product-led: người dùng tự tìm, tự dùng thử, tự nâng cấp; hợp với sản phẩm dễ hiểu, giá thấp", "Sales-led: đội bán hàng tiếp cận từng khách; hợp với sản phẩm B2B giá trị lớn, quy trình mua phức tạp", "Bán hàng tại chỗ: đội thị trường đến từng cửa hàng, như cách các ví và ngân hàng phủ mã QR tới tiểu thương", "Đối tác phân phối: đi qua ngân hàng, nhà mạng, chuỗi bán lẻ đã có sẵn khách hàng", "Cross-sell trong hệ sinh thái: đặt tính năng mới vào luồng mà người dùng đang dùng hằng ngày trong super app", "Cộng đồng và người có ảnh hưởng: nhóm Facebook, Zalo, TikTok; hợp với sản phẩm tiêu dùng cần lan truyền"]],
      ["h", "Ra mắt theo từng bước"],
      ["p", "Thay vì ra mắt một lần cho tất cả, hãy đi theo bậc: dùng nội bộ, beta với một nhóm nhỏ, mở cho một thành phố hoặc một phần trăm người dùng, rồi mới mở rộng. Mỗi bậc có tiêu chí rõ ràng để đi tiếp. Không phải bản cập nhật nào cũng cần một chiến dịch lớn; hãy phân loại mức độ ra mắt để dồn nguồn lực cho thứ quan trọng."],
      ["ex", "Ví điện tử ra mắt tính năng mua trước trả sau.\nKhách hàng đầu tiên: người dùng đã thanh toán thường xuyên trong ví nhiều tháng, có lịch sử tốt, vì có dữ liệu để đánh giá rủi ro.\nThông điệp: mua đồ cần thiết hôm nay, trả vào kỳ lương, không phí nếu trả đúng hạn.\nKênh: hiển thị ngay ở bước thanh toán tại một số đối tác thương mại điện tử, không chạy quảng cáo đại trà.\nPhạm vi: mở cho một phần nhỏ người dùng đủ điều kiện, theo dõi tỉ lệ kích hoạt, tỉ lệ dùng lại và tỉ lệ trả chậm trước khi mở rộng."],
      ["warn", ["Nhắm tới mọi người ngay từ đầu, ngân sách bị dàn mỏng", "Thông điệp mô tả tính năng thay vì lợi ích", "Quên chuẩn bị đội chăm sóc khách hàng và vận hành trước ngày ra mắt", "Đo lượt tải hoặc lượt đăng ký mà không đo người dùng có quay lại không"]],
      ["q", ["Bạn sẽ đưa một app quản lý bán hàng cho tiểu thương ra thị trường thế nào?", "Lên kế hoạch ra mắt một tính năng mới cho hàng triệu người dùng hiện có.", "Sản phẩm vừa ra mắt có nhiều lượt tải nhưng ít người quay lại. Bạn làm gì tiếp?"]]
    ]},
    {id:"strategy-7", t:"Hiệu ứng mạng lưới, marketplace và lợi thế cạnh tranh bền vững", m:7, b:[
      ["p", "Nhiều sản phẩm lớn ở Việt Nam là marketplace: gọi xe, giao đồ ăn, thương mại điện tử, đặt phòng. Chúng mạnh nhờ hiệu ứng mạng lưới, nhưng hiệu ứng này khó tạo ra lúc đầu và thường yếu hơn người ta nghĩ. Bài này đi sâu vào cách xây và đánh giá chúng."],
      ["h", "Bài toán con gà và quả trứng"],
      ["p", "Người mua không đến nếu chưa có người bán, người bán không đến nếu chưa có người mua. Một số cách phá vòng lặp này:"],
      ["ul", ["Bắt đầu từ bên khó có hơn: thường là nguồn cung, như tài xế, quán ăn, người bán uy tín", "Thu hẹp phạm vi: một thành phố, một quận, một danh mục, để đạt mật độ đủ dày trước khi mở rộng", "Trợ giá có chủ đích: thưởng cho bên còn thiếu, nhưng có kế hoạch giảm dần", "Giá trị khi dùng một mình: sản phẩm vẫn hữu ích khi chưa có mạng lưới, như công cụ quản lý đơn cho người bán rồi mới mở chợ", "Mang nguồn cung có sẵn: tự liệt kê hoặc tự vận hành nguồn cung lúc đầu"]],
      ["h", "Đo sức khỏe của một marketplace"],
      ["ul", ["Liquidity: tỉ lệ yêu cầu được đáp ứng, như phần trăm cuốc xe tìm được tài xế", "Thời gian ghép: khách chờ bao lâu để có tài xế, đơn chờ bao lâu để có shipper", "Cân bằng cung cầu: thu nhập mỗi giờ của tài xế, tỉ lệ người bán có đơn mỗi tuần", "Độ tập trung: vài người bán lớn chiếm phần lớn đơn là rủi ro", "Multi-homing: tỉ lệ người dùng và đối tác dùng song song nhiều nền tảng"]],
      ["h", "Khi nào hiệu ứng mạng yếu hơn bạn nghĩ"],
      ["ul", ["Hiệu ứng theo địa phương: tài xế ở Hà Nội không giúp gì khách ở Đà Nẵng, nên đối thủ có thể tấn công từng thành phố", "Multi-homing dễ: tài xế và khách cài nhiều app, chuyển đổi gần như không tốn gì", "Bão hòa: khi thời gian chờ đã đủ ngắn, thêm tài xế không làm khách hài lòng hơn bao nhiêu", "Bỏ qua nền tảng: người mua và người bán quen nhau rồi giao dịch trực tiếp qua Zalo để tránh phí"]],
      ["p", "Vì vậy, lợi thế bền vững thường là sự kết hợp: hiệu ứng mạng cộng với chi phí chuyển đổi (lịch sử, số dư, đánh giá), dữ liệu giúp ghép tốt hơn, quy mô giúp chi phí thấp hơn, và thương hiệu được tin cậy."],
      ["ex", "Một app gọi xe mới muốn vào thị trường đã có hai ông lớn.\nKhông nên đánh trên toàn quốc. Chọn một thành phố, tập trung tuyển đủ tài xế để thời gian chờ ngang đối thủ, giảm phí hoa hồng cho tài xế để họ ưu tiên nhận cuốc, rồi đo thời gian chờ và tỉ lệ khách quay lại. Vì tài xế và khách đều dùng nhiều app, lợi thế của ông lớn ở từng thành phố mỏng hơn tưởng tượng; nhưng duy trì trợ giá lâu dài thì rất tốn kém, nên cần tìm điểm khác biệt khác như an toàn hoặc phục vụ nhóm khách doanh nghiệp."],
      ["warn", ["Nói marketplace nào cũng có hiệu ứng mạng mạnh mà không phân tích", "Cố phát triển cả hai bên cùng lúc trên diện rộng", "Chỉ đo GMV mà không đo liquidity và thời gian ghép", "Quên rằng trợ giá thu hút cả những người dùng chỉ đến vì khuyến mãi"]],
      ["q", ["Bạn sẽ khởi động một marketplace kết nối gia sư và phụ huynh thế nào?", "Vì sao các app gọi xe vẫn cạnh tranh khốc liệt dù đều có hiệu ứng mạng?", "Lợi thế cạnh tranh bền vững của một sàn thương mại điện tử là gì?"]]
    ]},
    {id:"strategy-8", t:"Mở rộng: sản phẩm mới, thị trường mới, tự làm, mua hay hợp tác", m:6, b:[
      ["p", "Khi sản phẩm chính đã ổn, câu hỏi tiếp theo là tăng trưởng từ đâu. Bài này giúp bạn chọn hướng mở rộng và quyết định cách thực hiện: tự xây, mua lại hay hợp tác. Đây là chủ đề hay gặp ở vòng phỏng vấn với lãnh đạo."],
      ["h", "Bốn hướng mở rộng"],
      ["ul", ["Đào sâu thị trường hiện tại: thêm người dùng, tăng tần suất, tăng giá trị mỗi giao dịch với sản phẩm đang có. Rủi ro thấp nhất", "Sản phẩm mới cho khách hàng cũ: tận dụng tệp người dùng và niềm tin sẵn có, như app gọi xe thêm giao đồ ăn", "Sản phẩm cũ cho thị trường mới: đưa sản phẩm sang thành phố khác, nhóm khách hàng khác, hoặc nước khác", "Sản phẩm mới cho thị trường mới: đa dạng hóa, rủi ro cao nhất vì không tận dụng được gì nhiều"]],
      ["p", "Càng đi xa khỏi điểm mạnh hiện tại, rủi ro càng lớn. Một câu trả lời tốt thường bắt đầu bằng việc chỉ ra tài sản nào của công ty được tận dụng trong hướng mở rộng đó."],
      ["h", "Tự làm, mua hay hợp tác"],
      ["ul", ["Tự làm: khi đó là năng lực lõi tạo ra khác biệt, cần kiểm soát trải nghiệm và dữ liệu, và có đủ thời gian. Nhược điểm là chậm và tốn nguồn lực", "Mua lại: khi cần tốc độ, cần đội ngũ, công nghệ hoặc giấy phép khó có. Nhược điểm là đắt và rủi ro hòa nhập văn hóa, hệ thống", "Hợp tác: khi đó không phải lõi, cần giấy phép chuyên ngành, hoặc muốn thử nhanh với chi phí thấp. Nhược điểm là phụ thuộc vào đối tác và chia sẻ doanh thu"]],
      ["ol", ["Đây có phải năng lực tạo khác biệt cốt lõi của mình không?", "Cần ra thị trường nhanh tới mức nào?", "Mình đã có năng lực, dữ liệu, giấy phép cần thiết chưa?", "Tổng chi phí trong vài năm của mỗi phương án là bao nhiêu, gồm cả bảo trì?", "Nếu không hiệu quả, việc rút lui có dễ không?"]],
      ["ex", "Một ví điện tử muốn bán bảo hiểm.\nTự lập công ty bảo hiểm đòi hỏi giấy phép, vốn lớn và năng lực định phí rủi ro, không phải thế mạnh của ví. Mua một công ty bảo hiểm thì quá đắt cho một thử nghiệm.\nHợp lý nhất là hợp tác với công ty bảo hiểm làm sản phẩm, còn ví tự làm phần mình giỏi: trải nghiệm mua vài chạm, chọn đúng thời điểm gợi ý (ví dụ mua vé máy bay thì gợi ý bảo hiểm du lịch) và dữ liệu hành vi. Nếu sau này bảo hiểm thành mảng lớn, có thể xem lại phương án sâu hơn."],
      ["warn", ["Mở rộng khi sản phẩm chính chưa có product-market fit", "Tự làm mọi thứ vì muốn kiểm soát, bỏ qua chi phí cơ hội", "Chọn hợp tác mà không tính tới rủi ro phụ thuộc và cách thoát ra", "Nghĩ thành công ở Hà Nội và TP.HCM nghĩa là sẽ thành công ở các tỉnh"]],
      ["q", ["Một app giao đồ ăn nên mở thêm dịch vụ gì tiếp theo? Vì sao?", "Ngân hàng số nên tự xây hệ thống chấm điểm tín dụng hay dùng của đối tác?", "Bạn đánh giá thế nào việc một sàn thương mại điện tử Việt Nam mở rộng sang một nước Đông Nam Á?"]]
    ]},
    {id:"strategy-9", t:"Định giá (pricing) cho PM", m:6, b:[
      ["p", "Giá là một trong những đòn bẩy mạnh nhất lên doanh thu, nhưng thường bị quyết định theo cảm tính hoặc chỉ nhìn đối thủ. PM cần hiểu giá như một phần của sản phẩm: ai trả, trả cho cái gì, trả bao nhiêu và trả theo cách nào."],
      ["h", "Ba cách tiếp cận định giá"],
      ["ul", ["Theo chi phí: lấy chi phí cộng thêm biên lợi nhuận. Dễ làm nhưng bỏ qua giá trị khách hàng nhận được", "Theo đối thủ: đặt giá gần với các lựa chọn khác trên thị trường. An toàn nhưng dễ rơi vào cuộc đua giảm giá", "Theo giá trị: dựa trên lợi ích khách hàng nhận được và mức họ sẵn sàng trả. Khó đo nhưng thường cho kết quả tốt nhất"]],
      ["p", "Trong thực tế, chi phí là mức sàn, giá trị với khách hàng là mức trần, còn đối thủ cho biết khách hàng đang so sánh với cái gì."],
      ["h", "Thiết kế cấu trúc giá"],
      ["ul", ["Đơn vị tính tiền (value metric): tính theo thứ tăng cùng giá trị khách hàng nhận được, như số đơn hàng, số nhân viên dùng, số giao dịch", "Gói: thường có 2 đến 3 gói từ cơ bản đến cao cấp, gói giữa là gói bạn muốn đa số chọn", "Freemium hay dùng thử: freemium hợp khi bản miễn phí giúp lan truyền; dùng thử có thời hạn hợp khi giá trị cần thời gian để thấy", "Theo tháng hay theo năm: gói năm giảm giá giúp giữ chân và có tiền trước, gói tháng giảm rào cản ban đầu", "Khuyến mãi: giúp thu hút lúc đầu, nhưng dùng quá nhiều sẽ làm khách chỉ mua khi có mã giảm giá"]],
      ["h", "Thử nghiệm giá một cách an toàn"],
      ["ol", ["Hỏi khách hàng về mức sẵn sàng chi trả: mức nào là rẻ đáng ngờ, hợp lý, đắt nhưng vẫn mua, quá đắt.", "Thử giá với người dùng mới hoặc ở một thị trường riêng, tránh để hai người cùng lúc thấy hai mức giá khác nhau cho cùng một thứ.", "Đo không chỉ tỉ lệ chuyển đổi mà cả doanh thu mỗi người dùng, retention, tỉ lệ hoàn tiền và phản hồi.", "Khi tăng giá với khách cũ, báo trước, giải thích giá trị tăng thêm, và cân nhắc giữ giá cũ một thời gian."]],
      ["ex", "App học tiếng Anh, số liệu là giả định.\nGói tháng 149.000đ, gói năm 990.000đ. Người dùng Việt Nam thường nhạy cảm với khoản trả lớn một lần, nên gói tháng giúp nhiều người bắt đầu hơn. Nhưng nếu dữ liệu cho thấy người mua gói tháng thường bỏ sau tháng thứ hai, PM có thể thử: cho dùng thử 7 ngày, rồi gợi ý gói năm vào lúc người học vừa hoàn thành một cột mốc, kèm tùy chọn trả góp qua ví hoặc thẻ. Chỉ số chính là doanh thu sau 6 tháng trên mỗi người dùng mới, không chỉ tỉ lệ mua ngày đầu."],
      ["tip", "Trong phỏng vấn, khi được hỏi nên đặt giá bao nhiêu, đừng vội nói một con số. Hãy hỏi về khách hàng, giá trị họ nhận được, chi phí và các lựa chọn thay thế, rồi đề xuất cách thử."],
      ["warn", ["Định giá chỉ dựa trên chi phí hoặc chỉ sao chép đối thủ", "Giảm giá để tăng trưởng mà không đo khách có ở lại khi hết khuyến mãi", "Đo tỉ lệ chuyển đổi mà quên doanh thu và retention", "Thử nghiệm giá làm khách cảm thấy bị đối xử không công bằng"]],
      ["q", ["Bạn sẽ định giá cho một phần mềm quản lý bán hàng dành cho quán cà phê thế nào?", "Có nên tăng phí giao hàng của app giao đồ ăn không? Bạn sẽ quyết định ra sao?", "Freemium hay dùng thử miễn phí 14 ngày, bạn chọn gì cho một app học ngoại ngữ?"]]
    ]},
    {id:"strategy-10", t:"Đọc bối cảnh thị trường Việt Nam và Đông Nam Á", m:7, b:[
      ["p", "Người phỏng vấn ở Việt Nam đánh giá cao ứng viên hiểu người dùng và thị trường trong nước, thay vì chỉ áp dụng nguyên mẫu từ các công ty Mỹ hay Trung Quốc. Bài này tổng hợp những đặc điểm hay ảnh hưởng tới quyết định sản phẩm. Thị trường thay đổi nhanh, nên hãy coi đây là các câu hỏi cần kiểm tra, và luôn tự cập nhật số liệu từ nguồn đáng tin trước khi dùng."],
      ["h", "Những đặc điểm cần nhớ ở Việt Nam"],
      ["ul", ["Mobile-first: nhiều người dùng internet chủ yếu qua điện thoại, đôi khi là máy cấu hình thấp và mạng không ổn định", "Ứng dụng nhắn tin là kênh chính: Zalo và Facebook vừa để liên lạc, vừa để bán hàng, chăm sóc khách hàng và nhận thông báo", "Thanh toán: chuyển khoản bằng mã QR rất phổ biến, nhưng tiền mặt và giao hàng thu tiền (COD) vẫn còn trong nhiều tình huống", "Nhạy cảm về giá: người dùng quen với mã giảm giá, miễn phí vận chuyển, và so sánh giá giữa các app", "Niềm tin: lo ngại lừa đảo và lộ thông tin cá nhân ảnh hưởng mạnh tới việc đăng ký, xác minh danh tính và thanh toán", "Khác biệt vùng miền: hành vi ở Hà Nội, TP.HCM khác nhiều so với tỉnh nhỏ và nông thôn", "Pháp lý thay đổi: quy định về dữ liệu cá nhân, thanh toán, cho vay và xác minh danh tính có thể thay đổi, cần làm việc sớm với bộ phận pháp chế"]],
      ["h", "Đông Nam Á không phải một thị trường"],
      ["ul", ["Mỗi nước có ngôn ngữ, phương thức thanh toán, ứng dụng nhắn tin phổ biến và quy định riêng", "Mức thu nhập và hạ tầng logistics chênh lệch lớn giữa các nước và trong từng nước", "Nhiều nước có công ty nội địa mạnh hiểu thị trường hơn người mới vào", "Quy định về lưu trữ dữ liệu và cấp phép có thể buộc phải có pháp nhân và hạ tầng tại chỗ", "Một sản phẩm thành công ở Việt Nam vẫn cần bản địa hóa thật sự, không chỉ dịch giao diện"]],
      ["h", "Đưa bối cảnh vào câu trả lời phỏng vấn"],
      ["ol", ["Nói rõ giả định về thị trường, và ghi nhận đó là giả định cần kiểm tra.", "Phân khúc theo vùng, độ tuổi, thu nhập, mức quen thuộc với công nghệ.", "Chọn kênh tiếp cận phù hợp thói quen địa phương, ví dụ Zalo, đội bán hàng tại chỗ, đối tác bán lẻ.", "Thiết kế thanh toán và luồng đăng ký phù hợp với thói quen và mức độ tin tưởng.", "Nhắc tới rủi ro pháp lý và vận hành đặc thù."]],
      ["ex", "Đề: thiết kế chiến lược cho một app đặt lịch khám bệnh.\nCâu trả lời chung chung: làm app đẹp, chạy quảng cáo, tích hợp thanh toán thẻ.\nCâu trả lời có bối cảnh: người đặt thường là con cái đặt cho bố mẹ, nên cho phép quản lý nhiều hồ sơ trong một tài khoản; gửi xác nhận và nhắc lịch qua Zalo vì người lớn tuổi ít mở app; hỗ trợ chuyển khoản QR và trả tại quầy; bắt đầu ở một thành phố lớn với vài phòng khám tư trước khi làm việc với bệnh viện công vốn có quy trình phức tạp hơn."],
      ["warn", ["Đưa ra số liệu thị trường không có nguồn và nói như sự thật", "Áp dụng nguyên mô hình từ nước ngoài mà không điều chỉnh", "Coi Hà Nội và TP.HCM là đại diện cho cả nước", "Coi Đông Nam Á là một thị trường thống nhất", "Bỏ qua yếu tố niềm tin và pháp lý"]],
      ["q", ["Một sản phẩm thành công ở Mỹ muốn vào Việt Nam. Bạn sẽ điều chỉnh những gì?", "Vì sao giao hàng thu tiền vẫn còn tồn tại dù thanh toán QR đã phổ biến?", "Nếu công ty muốn mở rộng sang một nước Đông Nam Á, bạn sẽ tìm hiểu những gì trước?"]]
    ]}
  ],
  ai: [
    {id:"ai-1", t:"LLM hoạt động thế nào, ở mức PM cần biết", m:6, b:[
      ["p","PM không cần biết toán phía sau, nhưng phải hiểu đủ để biết AI làm được gì, sai ở đâu và tốn bao nhiêu."],
      ["ul",["Dự đoán phần tiếp theo: LLM tạo văn bản bằng cách dự đoán từng phần nhỏ (token) dựa trên ngữ cảnh. Nó không tra cứu sự thật, nên có thể sai mà vẫn rất tự tin","Token: đơn vị văn bản model xử lý và cũng là đơn vị tính tiền. Tiếng Việt thường tốn nhiều token hơn tiếng Anh cho cùng một ý","Context window: lượng token tối đa trong một lần gọi, gồm hướng dẫn, tài liệu, lịch sử hội thoại và câu trả lời","Không xác định: cùng một câu hỏi có thể ra câu trả lời khác nhau; temperature càng cao càng đa dạng","Hallucination: bịa thông tin nghe hợp lý. Không loại bỏ được hoàn toàn, chỉ giảm được","Mốc kiến thức: model không biết các sự kiện sau thời điểm huấn luyện nếu không được cung cấp thêm"]],
      ["p","Hệ quả với sản phẩm: mọi tính năng AI đều có tỉ lệ sai. Câu hỏi của PM không phải \"làm sao để không bao giờ sai\", mà là \"sai bao nhiêu thì chấp nhận được, và khi sai thì chuyện gì xảy ra\"."],
      ["q",["Giải thích hallucination cho một stakeholder không làm kỹ thuật.","Vì sao cùng một câu hỏi, chatbot lại trả lời khác nhau?"]]
    ]},
    {id:"ai-2", t:"Các cách xây tính năng AI", m:6, b:[
      ["p","Đi từ đơn giản đến phức tạp, và chỉ lên bậc tiếp theo khi bậc trước không đủ."],
      ["ol",["Prompting: viết hướng dẫn rõ ràng, có ví dụ, định dạng đầu ra cụ thể. Nhanh, rẻ, luôn thử trước.","RAG (Retrieval-Augmented Generation): tìm các đoạn tài liệu liên quan rồi đưa vào prompt. Dùng khi cần kiến thức riêng của công ty hoặc thay đổi thường xuyên; cho phép trích nguồn.","Fine-tuning: huấn luyện thêm trên dữ liệu riêng. Dùng khi cần phong cách hoặc định dạng rất ổn định ở quy mô lớn; tốn công chuẩn bị dữ liệu và bảo trì.","Agent: model tự lập kế hoạch và gọi công cụ (API, tìm kiếm, cơ sở dữ liệu) qua nhiều bước. Mạnh nhưng khó kiểm soát; cần giới hạn quyền và xác nhận trước hành động quan trọng."]],
      ["h","Khi nào không nên dùng AI"],
      ["ul",["Quy tắc rõ ràng, cần chính xác tuyệt đối (tính phí, tính thuế)","Một lần sai gây hậu quả nghiêm trọng mà không có người kiểm tra","Không có cách đánh giá chất lượng","Chi phí và độ trễ lớn hơn giá trị mang lại"]],
      ["ex","Chatbot hỏi đáp chính sách nhân sự: bắt đầu bằng RAG trên sổ tay nhân sự, trả lời kèm trích dẫn mục liên quan, và chuyển cho phòng nhân sự khi câu hỏi liên quan tới trường hợp cá nhân. Không cần fine-tune."]
    ]},
    {id:"ai-3", t:"Đánh giá chất lượng (eval)", m:7, b:[
      ["p","Eval là kỹ năng phân biệt rõ nhất giữa AI PM giỏi và người chỉ nói theo trend. Không có eval thì không biết tính năng tốt đến đâu, cũng không biết thay đổi có làm nó tệ đi không."],
      ["h","Eval offline, trước khi ra mắt"],
      ["ul",["Bộ dữ liệu kiểm thử (golden set): vài chục đến vài trăm ví dụ đại diện, có cả ca khó và ca dễ gây hại","Tiêu chí chấm rõ ràng: đúng nội dung, đầy đủ, đúng giọng, an toàn","Cách chấm: người chấm, so khớp tự động, hoặc LLM-as-judge (cần đối chiếu định kỳ với người chấm)","Chạy lại mỗi khi đổi prompt, model hay dữ liệu để bắt lỗi thoái lui (regression)"]],
      ["h","Eval online, sau khi ra mắt"],
      ["ul",["Tín hiệu trực tiếp: like hoặc dislike, người dùng sửa hay bỏ đầu ra","Chỉ số hành vi: tỉ lệ giải quyết được việc, tỉ lệ chuyển sang người thật, retention","Đọc mẫu log thật thường xuyên"]],
      ["h","Precision và recall"],
      ["p","Precision: trong những gì hệ thống báo là đúng, bao nhiêu thật sự đúng. Recall: trong những gì thật sự đúng, hệ thống bắt được bao nhiêu. Chọn ưu tiên theo cái giá của từng loại sai: lọc gian lận ưu tiên recall, tự động gửi trả lời cho khách ưu tiên precision."],
      ["warn",["Đánh giá bằng cảm giác sau vài lần thử","Bộ test chỉ toàn ca dễ"]]
    ]},
    {id:"ai-4", t:"Thiết kế trải nghiệm AI và quản lý rủi ro", m:7, b:[
      ["p","Vì AI có thể sai, trải nghiệm phải được thiết kế cho cả lúc đúng và lúc sai."],
      ["ul",["Đặt kỳ vọng: cho người dùng biết đây là AI và nó làm tốt việc gì","Cho kiểm chứng: trích nguồn, hiển thị dữ liệu gốc","Cho sửa và hoàn tác: AI đề xuất, người dùng quyết định ở bước quan trọng (human-in-the-loop)","Đường thoát: chuyển sang người thật hoặc cách làm thủ công","Độ trễ: hiển thị kết quả dần (streaming), báo tiến trình, dùng model nhanh cho bước đơn giản"]],
      ["h","Chi phí"],
      ["p","Chi phí ≈ số lượt gọi × (token vào + token ra) × đơn giá. Giảm bằng model nhỏ cho việc đơn giản, cache, rút gọn ngữ cảnh, chỉ gọi AI khi thật cần. Luôn so chi phí với giá trị hoặc doanh thu trên mỗi người dùng."],
      ["h","An toàn và tuân thủ"],
      ["ul",["Prompt injection: nội dung bên ngoài (email, trang web) chứa chỉ dẫn độc hại; coi dữ liệu là dữ liệu và giới hạn quyền của AI","Dữ liệu cá nhân: tuân thủ quy định và chính sách nội bộ, ẩn danh khi có thể","Thiên kiến: kiểm tra kết quả theo nhóm người dùng khi AI ảnh hưởng tới quyết định về con người"]],
      ["q",["Chatbot trả lời sai 5% câu về phí dịch vụ, có nên ra mắt?","Bạn thiết kế trải nghiệm thế nào khi AI không chắc câu trả lời?"]]
    ]},
    {id:"ai-5", t:"Chi phí, độ trễ và cách chọn model", m:6, b:[
      ["p", "Model mạnh nhất chưa chắc là lựa chọn đúng. Với PM, chọn model là một quyết định sản phẩm: cân giữa chất lượng, chi phí và tốc độ sao cho phù hợp với giá trị mà tính năng mang lại cho người dùng và cho doanh nghiệp."],
      ["h", "Ba trục đánh đổi"],
      ["ul", ["Chất lượng: model lớn thường suy luận tốt hơn, xử lý ca khó và tiếng Việt tự nhiên hơn, nhưng đắt và chậm hơn", "Chi phí: tính theo token vào và ra, nhân với số lượt gọi. Tính năng chạy tự động cho mọi người dùng (ví dụ tóm tắt mọi đánh giá sản phẩm) tốn khác hẳn tính năng chỉ chạy khi người dùng bấm", "Độ trễ: thời gian tới khi người dùng thấy chữ đầu tiên và thời gian hoàn tất. Chat chấp nhận vài giây nếu có streaming; gợi ý khi gõ tìm kiếm thì phải gần như tức thì", "Ràng buộc khác: dữ liệu có được gửi ra ngoài không, có cần chạy trong hạ tầng nội bộ không, nhà cung cấp có ổn định và hỗ trợ tốt không"]],
      ["h", "Chọn model theo từng bước"],
      ["ol", ["Xác định yêu cầu tối thiểu: chất lượng bao nhiêu là đủ (đo bằng eval), độ trễ tối đa, ngân sách trên mỗi người dùng hoặc mỗi giao dịch.", "Thử model mạnh trước để biết trần chất lượng. Nếu model mạnh nhất cũng không đạt, vấn đề nằm ở bài toán hoặc dữ liệu chứ không phải ở model.", "Thử dần các model nhỏ hơn trên cùng bộ eval, dừng ở model rẻ nhất vẫn đạt ngưỡng.", "Cân nhắc định tuyến (routing): việc đơn giản như phân loại ý định dùng model nhỏ, chỉ chuyển ca khó sang model lớn.", "Tính unit economics: chi phí AI trên mỗi đơn, mỗi phiên hoặc mỗi người dùng hoạt động, so với doanh thu hoặc chi phí tiết kiệm được.", "Thiết kế để có thể đổi model: model và giá thay đổi nhanh, nên giữ eval và lớp kết nối đủ linh hoạt để chuyển đổi mà không phải làm lại."]],
      ["ex", "Tính năng: tóm tắt đánh giá sản phẩm trên một sàn thương mại điện tử.\nGiả định: 2 triệu trang sản phẩm có đánh giá, mỗi lần tóm tắt tốn khoảng 3.000 token.\nNếu tóm tắt lại mỗi khi có người xem trang, chi phí tăng theo lượt xem và rất lớn. Nếu chỉ tóm tắt khi có thêm 20 đánh giá mới rồi lưu lại kết quả, chi phí gần như cố định và người dùng nhận kết quả tức thì vì không phải chờ model.\nBài học: kiến trúc (khi nào gọi model) thường tiết kiệm nhiều hơn việc đổi sang model rẻ hơn."],
      ["h", "Độ trễ người dùng cảm nhận"],
      ["ul", ["Streaming: hiện chữ dần giúp chờ 5 giây vẫn thấy chấp nhận được", "Xử lý trước: tính sẵn kết quả có thể đoán trước, như tóm tắt hay gợi ý", "Chạy nền: việc dài như phân tích sao kê thì cho chạy nền và báo khi xong, đừng bắt người dùng nhìn màn hình chờ", "Chia nhỏ: bước nhanh trả lời ngay, bước chậm bổ sung sau"]],
      ["warn", ["Chọn model theo bảng xếp hạng hoặc tin tức thay vì theo eval của chính sản phẩm", "Tính chi phí với vài trăm người dùng thử rồi bất ngờ khi mở cho toàn bộ người dùng", "Quên rằng câu trả lời dài cũng tốn tiền và thời gian, không chỉ phần đầu vào", "Gắn chặt sản phẩm vào một model, khó đổi khi có lựa chọn tốt hơn"]],
      ["q", ["Tính năng AI của bạn chạy tốt nhưng chi phí gấp ba ngân sách. Bạn xử lý thế nào?", "Bạn sẽ chọn giữa một model lớn chính xác hơn và một model nhỏ nhanh hơn như thế nào?", "Làm sao biết một tính năng AI có lời hay không?"]]
    ]},
    {id:"ai-6", t:"RAG trong thực tế: dữ liệu, truy xuất và trích dẫn", m:7, b:[
      ["p", "Trên giấy, RAG rất đơn giản: tìm tài liệu liên quan rồi đưa cho model trả lời. Trong thực tế, phần lớn lỗi của hệ thống RAG không nằm ở model mà ở dữ liệu đầu vào và bước tìm kiếm. PM cần hiểu các điểm hỏng này để đặt câu hỏi đúng với đội kỹ thuật."],
      ["h", "Dữ liệu: rác vào thì rác ra"],
      ["ul", ["Nguồn đúng và có chủ: mỗi bộ tài liệu cần một người hoặc một phòng ban chịu trách nhiệm cập nhật. Không có chủ thì tài liệu sẽ cũ dần", "Phiên bản: biểu phí cũ và mới cùng nằm trong kho thì model có thể trích nhầm bản cũ. Cần gắn ngày hiệu lực và gỡ bản hết hạn", "Định dạng: bảng biểu trong PDF, ảnh chụp văn bản, file Excel thường bị đọc sai khi đưa vào hệ thống. Kiểm tra kỹ các loại tài liệu quan trọng", "Quyền truy cập: nhân viên chi nhánh không được thấy tài liệu chỉ dành cho ban điều hành; hệ thống phải lọc theo quyền của người hỏi trước khi đưa vào model"]],
      ["h", "Truy xuất: tìm đúng đoạn cần thiết"],
      ["ul", ["Chia nhỏ (chunking): tài liệu được cắt thành đoạn. Cắt quá nhỏ thì mất ngữ cảnh, quá lớn thì lẫn thông tin không liên quan", "Tìm theo ngữ nghĩa và theo từ khóa: tìm theo nghĩa bắt được cách hỏi khác nhau, tìm theo từ khóa bắt được mã sản phẩm, tên gói cước, số điều khoản. Kết hợp cả hai (hybrid) thường tốt hơn", "Xếp hạng lại (rerank): lấy nhiều kết quả rồi chọn lại vài đoạn sát nhất trước khi đưa vào model", "Lọc theo metadata: sản phẩm, khu vực, ngày hiệu lực, loại khách hàng", "Đo riêng bước truy xuất: với mỗi câu hỏi trong bộ test, đoạn đúng có nằm trong kết quả không. Nếu truy xuất sai thì model giỏi đến đâu cũng trả lời sai"]],
      ["h", "Trích dẫn và khi không tìm thấy"],
      ["p", "Trích dẫn giúp người dùng kiểm chứng và giúp đội ngũ gỡ lỗi. Mỗi ý quan trọng nên gắn với đoạn nguồn cụ thể, bấm vào xem được. Quan trọng không kém là hành vi khi không có tài liệu phù hợp: hệ thống nên nói rõ là không tìm thấy và đưa đường thoát, thay vì để model tự đoán."],
      ["ex", "Trợ lý hỏi đáp cho nhân viên tổng đài một ngân hàng số.\nVấn đề sau ra mắt: trợ lý trả lời sai phí chuyển tiền quốc tế.\nĐiều tra: câu trả lời trích đúng tài liệu, nhưng là biểu phí năm ngoái vẫn còn trong kho. Lỗi nằm ở quy trình dữ liệu, không phải ở model.\nCách sửa: gắn ngày hiệu lực cho mọi tài liệu, ưu tiên bản mới nhất khi truy xuất, giao phòng sản phẩm thẻ làm chủ bộ biểu phí, thêm câu hỏi về phí vào bộ eval để chạy lại mỗi khi cập nhật."],
      ["warn", ["Đổ toàn bộ ổ chung của công ty vào hệ thống mà không dọn dẹp hay phân quyền", "Chỉ đánh giá câu trả lời cuối, không đo bước truy xuất nên không biết lỗi nằm ở đâu", "Có trích dẫn nhưng nguồn không thật sự chứa thông tin được nêu", "Không thiết kế câu trả lời cho trường hợp không tìm thấy"]],
      ["q", ["Chatbot RAG của bạn trả lời sai một câu về chính sách. Bạn điều tra nguyên nhân thế nào?", "Làm sao đảm bảo người dùng chỉ nhận được thông tin họ có quyền xem?", "Bạn đo chất lượng hệ thống RAG bằng những chỉ số nào?"]]
    ]},
    {id:"ai-7", t:"AI agent và gọi công cụ: khi nào nên dùng, cách giới hạn rủi ro", m:7, b:[
      ["p", "Agent là hệ thống mà model tự quyết định bước tiếp theo và gọi công cụ như tra cứu đơn hàng, tạo phiếu hỗ trợ hay hoàn tiền. Agent mở ra nhiều khả năng, nhưng mỗi bước tự quyết là thêm một chỗ có thể sai. Câu hỏi đầu tiên của PM luôn là: việc này có thật sự cần agent không?"],
      ["h", "Khi nào nên dùng agent"],
      ["ul", ["Quy trình cố định (workflow): các bước đã biết trước, AI chỉ làm một vài bước như phân loại hay soạn nội dung. Dễ kiểm soát, dễ đo, nên là lựa chọn mặc định", "Agent: dùng khi đường đi thay đổi theo từng trường hợp, số tổ hợp quá nhiều để viết sẵn, và người dùng chấp nhận chờ lâu hơn để được giải quyết trọn vẹn", "Dấu hiệu nên dừng ở workflow: 80% trường hợp đi theo vài kịch bản quen thuộc, hoặc một bước sai gây thiệt hại tiền bạc ngay", "Thêm một lựa chọn trung gian: AI gợi ý hành động, nhân viên bấm xác nhận. Thường là bước đi đầu tiên hợp lý"]],
      ["h", "Giới hạn rủi ro"],
      ["ol", ["Quyền tối thiểu: agent chỉ có những công cụ cần cho việc của nó. Trợ lý chăm sóc khách hàng không cần quyền sửa giá sản phẩm.", "Phân loại hành động theo mức rủi ro: đọc thông tin thì cho tự làm; thay đổi có thể hoàn tác thì cho làm và báo lại; hành động liên quan đến tiền hoặc không hoàn tác được thì bắt buộc người dùng hoặc nhân viên xác nhận.", "Hạn mức cứng nằm trong hệ thống chứ không nằm trong prompt: ví dụ hoàn tiền tối đa một mức nhất định mỗi đơn, số bước tối đa mỗi phiên.", "Chống prompt injection: nội dung đọc được từ ngoài, như ghi chú của khách hay nội dung email, không được coi là mệnh lệnh.", "Ghi log đầy đủ từng bước để kiểm tra lại và giải thích khi có khiếu nại.", "Có công tắc tắt nhanh và đường chuyển sang người thật."]],
      ["ex", "Trợ lý xử lý sự cố đơn trên app giao đồ ăn.\nKhách nhắn: \"Thiếu một ly trà sữa\".\nAgent tra đơn, xem ảnh xác nhận của tài xế, đối chiếu lịch sử khiếu nại của tài khoản.\nNếu giá trị dưới hạn mức (giả định 50.000đ) và tài khoản không có dấu hiệu bất thường: hoàn tiền vào ví và báo cho khách.\nNếu vượt hạn mức hoặc nghi gian lận: tạo phiếu kèm tóm tắt cho nhân viên duyệt.\nHạn mức và luật kiểm tra nằm trong API hoàn tiền, nên dù prompt bị lừa thì agent vẫn không vượt được."],
      ["h", "Đo lường agent"],
      ["ul", ["Tỉ lệ hoàn thành việc trọn vẹn mà không cần người can thiệp", "Tỉ lệ hành động sai hoặc phải đảo ngược", "Số bước và thời gian trung bình mỗi việc, kéo theo chi phí", "Mức hài lòng của khách và tỉ lệ khiếu nại lại"]],
      ["warn", ["Dùng agent cho việc mà một quy trình vài bước là đủ", "Đặt quy tắc an toàn chỉ trong prompt thay vì chặn ở hệ thống", "Cho agent quyền rộng ngay từ đầu thay vì mở dần theo kết quả đo", "Chỉ demo ca thuận lợi, không thử ca khách cố tình lừa"]],
      ["q", ["Bạn có cho AI tự động hoàn tiền cho khách không? Thiết kế thế nào?", "Khi nào bạn chọn agent thay vì một workflow cố định?", "Làm sao ngăn agent bị người dùng lừa làm việc ngoài phạm vi?"]]
    ]},
    {id:"ai-8", t:"Dữ liệu, quyền riêng tư và tuân thủ khi làm AI", m:6, b:[
      ["p", "Tính năng AI thường cần dữ liệu người dùng để hữu ích, và đó cũng là chỗ dễ gây mất niềm tin nhất. Ở Việt Nam, quy định về bảo vệ dữ liệu cá nhân ngày càng chặt, đặc biệt với ngân hàng, ví điện tử và y tế. PM không cần thuộc điều luật, nhưng phải biết dữ liệu đi đâu và đưa pháp chế, bảo mật vào cuộc từ sớm."],
      ["h", "Theo dõi dữ liệu đi đâu"],
      ["ul", ["Thu thập: tính năng dùng những dữ liệu nào, người dùng có biết và đồng ý không, dữ liệu nhạy cảm (sức khỏe, tài chính, vị trí, giấy tờ tùy thân) có bị kéo vào không", "Gửi ra ngoài: nếu dùng model của nhà cung cấp bên ngoài, dữ liệu có rời khỏi hạ tầng công ty hoặc ra nước ngoài không, hợp đồng có cam kết không dùng dữ liệu để huấn luyện không", "Lưu trữ: prompt, câu trả lời và log hội thoại lưu ở đâu, bao lâu, ai đọc được", "Tái sử dụng: dữ liệu có được dùng để cải thiện model hay làm bộ eval không, và việc đó có nằm trong phạm vi người dùng đã đồng ý không"]],
      ["h", "Nguyên tắc thực hành"],
      ["ol", ["Tối thiểu hóa: chỉ đưa vào model phần dữ liệu cần cho việc đó. Tóm tắt khiếu nại không cần số tài khoản đầy đủ.", "Che hoặc thay thế thông tin định danh (số điện thoại, số CCCD, số thẻ) trước khi gửi đi và trước khi lưu log.", "Minh bạch: cho người dùng biết khi họ đang làm việc với AI và dữ liệu của họ được dùng thế nào, bằng ngôn ngữ dễ hiểu.", "Cho lựa chọn: tắt tính năng, xóa lịch sử, không dùng dữ liệu của mình để cải thiện hệ thống.", "Phân quyền và thời hạn lưu: log nhạy cảm chỉ một nhóm nhỏ được xem, tự xóa sau thời hạn đã định.", "Đánh giá trước khi ra mắt: cùng pháp chế và bảo mật rà soát luồng dữ liệu, ghi lại quyết định."]],
      ["ex", "Ngân hàng số muốn dùng AI tóm tắt cuộc gọi chăm sóc khách hàng để nhân viên khỏi ghi chú tay.\nRủi ro: bản ghi có họ tên, số tài khoản, số dư, đôi khi cả mã OTP khách đọc nhầm.\nThiết kế: chuyển giọng nói thành văn bản trong hạ tầng của ngân hàng, tự động che số tài khoản và mã OTP, chỉ gửi bản đã che cho model, hợp đồng với nhà cung cấp không lưu và không dùng dữ liệu để huấn luyện, bản tóm tắt lưu cùng hồ sơ khách theo đúng thời hạn hiện hành, nhân viên vẫn được sửa trước khi lưu.\nKết quả cần chứng minh với pháp chế: sơ đồ luồng dữ liệu và danh sách trường dữ liệu được gửi đi."],
      ["warn", ["Nghĩ rằng dữ liệu đã có trong hệ thống thì dùng cho AI thế nào cũng được", "Để nhân viên tự dán dữ liệu khách hàng vào công cụ AI công cộng", "Lưu toàn bộ hội thoại vô thời hạn \"để sau này phân tích\"", "Mời pháp chế vào khi sản phẩm đã sắp ra mắt"]],
      ["tip", "Trong phỏng vấn, nhắc đến quyền riêng tư một cách cụ thể (che trường nào, lưu bao lâu, ai duyệt) gây ấn tượng hơn nhiều so với câu chung chung \"sẽ tuân thủ quy định\"."],
      ["q", ["Bạn xây tính năng AI gợi ý chi tiêu trên ví điện tử. Bạn cân nhắc gì về dữ liệu người dùng?", "Nhân viên muốn dùng công cụ AI bên ngoài để xử lý dữ liệu khách hàng. Bạn trả lời thế nào?"]]
    ]},
    {id:"ai-9", t:"Đo lường tác động của tính năng AI sau ra mắt", m:6, b:[
      ["p", "Eval cho biết AI trả lời tốt đến đâu, nhưng không cho biết tính năng có tạo ra giá trị hay không. Sau ra mắt, PM phải trả lời câu hỏi của ban lãnh đạo: tính năng này thay đổi hành vi người dùng và kết quả kinh doanh thế nào, với chi phí bao nhiêu."],
      ["h", "Bốn tầng chỉ số"],
      ["ul", ["Sử dụng: bao nhiêu người thấy tính năng, thử, và quay lại dùng. Tỉ lệ dùng lại quan trọng hơn lượt thử đầu tiên vì AI dễ tạo tò mò", "Chất lượng trong thực tế: tỉ lệ chấp nhận đầu ra, tỉ lệ người dùng sửa, bỏ qua hoặc hỏi lại, phản hồi tiêu cực, tỉ lệ chuyển sang người thật", "Kết quả kinh doanh: chỉ số mà tính năng sinh ra để cải thiện, như tỉ lệ chuyển đổi, thời gian xử lý ticket, retention", "Đối trọng (guardrail): chi phí AI mỗi người dùng, độ trễ, khiếu nại, sự cố an toàn, và chỉ số của các phần khác có thể bị ảnh hưởng"]],
      ["h", "Chứng minh tác động bằng thí nghiệm"],
      ["ol", ["A/B test khi có thể: nhóm có tính năng và nhóm không có, so sánh chỉ số kinh doanh chứ không chỉ mức độ sử dụng.", "Giữ một nhóm holdout lâu dài cho tính năng lớn, để đo tác động tích lũy sau vài tháng.", "Coi chừng hiệu ứng mới lạ: người dùng thử nhiều trong tuần đầu rồi giảm dần. Chạy đủ lâu trước khi kết luận.", "Cẩn thận khi so sánh người dùng tính năng với người không dùng: người chủ động dùng AI thường vốn đã tích cực hơn, chênh lệch đó không phải do tính năng.", "Với công cụ nội bộ như trợ lý cho nhân viên tổng đài, có thể triển khai lần lượt theo nhóm hoặc theo ca để có nhóm so sánh."]],
      ["ex", "Tìm kiếm bằng ngôn ngữ tự nhiên trên app giao đồ ăn (\"món nước ít cay, dưới 50 nghìn, giao nhanh\").\nChỉ số chính: tỉ lệ phiên tìm kiếm dẫn tới đặt đơn.\nChỉ số chất lượng: tỉ lệ tìm lại ngay sau khi xem kết quả, tỉ lệ kết quả không có món nào.\nĐối trọng: độ trễ tìm kiếm, chi phí mỗi lượt tìm, giá trị đơn trung bình, doanh thu của nhà hàng nhỏ (tránh chỉ đẩy về vài thương hiệu lớn).\nTuần đầu lượt dùng cao nhưng chuyển đổi chỉ tương đương tìm kiếm cũ; đọc log thấy nhiều câu tìm theo tên quán vẫn tốt hơn với tìm kiếm cũ. Quyết định: chỉ dùng AI khi câu tìm dài và mô tả nhu cầu, còn lại dùng tìm kiếm thường."],
      ["h", "Theo dõi lâu dài"],
      ["p", "Chất lượng AI có thể trôi theo thời gian: hành vi người dùng đổi, dữ liệu đổi, nhà cung cấp cập nhật model. Cần dashboard theo dõi chất lượng hằng tuần, chạy lại eval khi có thay đổi, và định kỳ đọc mẫu hội thoại thật để thấy vấn đề mà con số chưa thể hiện."],
      ["warn", ["Báo cáo số lượt dùng AI như thể đó là tác động kinh doanh", "Kết luận sau vài ngày, khi hiệu ứng mới lạ còn mạnh", "Không theo dõi chi phí cùng với kết quả, nên không biết tính năng có lời không", "Ngừng đo chất lượng sau khi ra mắt"]],
      ["q", ["Bạn đo thành công của một chatbot chăm sóc khách hàng thế nào?", "Tính năng AI có nhiều người dùng nhưng chỉ số kinh doanh không đổi. Bạn làm gì tiếp?", "Làm sao biết người dùng tin tưởng câu trả lời của AI?"]]
    ]},
    {id:"ai-10", t:"Câu hỏi phỏng vấn AI PM hay gặp và cách trả lời", m:7, b:[
      ["p", "Phỏng vấn AI PM vẫn là phỏng vấn PM: người phỏng vấn muốn thấy bạn bắt đầu từ người dùng và vấn đề. Điểm khác là họ kiểm tra thêm xem bạn có hiểu giới hạn của AI, biết đo chất lượng và biết cân chi phí, rủi ro hay không."],
      ["h", "Các nhóm câu hỏi thường gặp"],
      ["ul", ["Thiết kế tính năng AI: \"Thiết kế trợ lý AI cho người bán trên sàn thương mại điện tử\"", "Có nên dùng AI không: \"Có nên dùng AI để duyệt hồ sơ vay tự động không?\"", "Đo lường và eval: \"Bạn đo chất lượng chatbot thế nào?\", \"Định nghĩa thành công cho tính năng tóm tắt\"", "Xử lý sự cố: \"Chatbot trả lời sai và bị chụp màn hình lan truyền trên mạng xã hội. Bạn làm gì?\"", "Đánh đổi kỹ thuật: chọn model, RAG hay fine-tune, chi phí và độ trễ", "Kinh nghiệm: \"Kể về một sản phẩm AI bạn đã làm và điều bạn sẽ làm khác\""]],
      ["h", "Khung trả lời câu hỏi thiết kế tính năng AI"],
      ["ol", ["Làm rõ mục tiêu và người dùng như mọi câu product sense.", "Chỉ ra vấn đề và hỏi: AI có thật sự là cách tốt nhất không, hay quy tắc đơn giản là đủ.", "Mô tả giải pháp và AI làm phần nào, người làm phần nào.", "Nêu cách AI có thể sai và trải nghiệm khi sai: kiểm chứng, sửa, đường thoát.", "Cách đo: eval trước ra mắt, chỉ số sau ra mắt, chỉ số đối trọng.", "Rủi ro và ràng buộc: dữ liệu, an toàn, chi phí.", "Kế hoạch ra mắt: thử với nhóm nhỏ, mở dần theo kết quả."]],
      ["ex", "Câu hỏi: \"Có nên dùng AI để tự động duyệt khoản vay nhỏ trên ngân hàng số?\"\nTrả lời rút gọn: \"Em xin làm rõ mục tiêu là rút ngắn thời gian duyệt hay mở rộng tệp khách hàng. Đây là quyết định ảnh hưởng trực tiếp tới tài chính của người dùng và chịu quản lý chặt, nên em không để AI quyết định một mình. Em đề xuất mô hình chấm điểm có thể giải thích được để duyệt nhanh các hồ sơ rủi ro rất thấp, ca ở giữa chuyển cho chuyên viên, kèm lý do khi từ chối. Em sẽ theo dõi tỉ lệ nợ xấu theo từng nhóm khách, kiểm tra thiên kiến giữa các nhóm, và mở rộng ngưỡng tự động khi số liệu vài tháng cho thấy an toàn.\"\nĐiểm cộng: không trả lời có hoặc không ngay, có phân tầng rủi ro, có cách đo, có lộ trình."],
      ["h", "Khi được hỏi về kinh nghiệm hoặc xu hướng"],
      ["p", "Nếu chưa làm sản phẩm AI, hãy kể một dự án nhỏ bạn tự làm: tự viết prompt, tự lập bộ test vài chục câu, ghi lại cái gì chạy được và cái gì không. Với câu hỏi về xu hướng, nói về tác động tới người dùng và sản phẩm thay vì kể tên công nghệ mới."],
      ["warn", ["Trả lời mọi vấn đề bằng \"dùng AI\" hoặc \"làm chatbot\"", "Dùng nhiều thuật ngữ nhưng không nói được cách đo chất lượng", "Không nhắc tới khi AI sai thì sao", "Hứa độ chính xác 100%"]],
      ["tip", "Một câu ngắn như \"trước khi xây, em sẽ lập bộ 50 câu hỏi thật để đo\" cho người phỏng vấn thấy bạn đã từng làm thật."],
      ["q", ["Thiết kế tính năng AI giúp tài xế xe công nghệ tăng thu nhập.", "Chatbot của bạn trả lời sai và bị lan truyền trên mạng. 24 giờ đầu bạn làm gì?", "Kể về một lần bạn quyết định không dùng AI cho một vấn đề."]]
    ]}
  ],
  behavioral: [
    {id:"behavioral-1", t:"Kể chuyện theo STAR", m:5, b:[
      ["p","Câu hỏi hành vi (\"Kể về một lần...\") đánh giá cách bạn đã thực sự làm việc. Người phỏng vấn tin vào hành vi trong quá khứ hơn là lời hứa."],
      ["ol",["Situation: bối cảnh ngắn gọn, đủ để hiểu mức độ quan trọng (1 đến 2 câu).","Task: nhiệm vụ hoặc vấn đề của riêng bạn.","Action: bạn đã làm gì, từng bước, vì sao chọn cách đó. Đây là phần dài nhất.","Result: kết quả, có số liệu nếu được, và bạn học được gì."]],
      ["h","Mẹo"],
      ["ul",["Nói \"tôi\" cho hành động của bạn, ghi nhận team ở phần kết quả","Giữ trong khoảng 2 đến 3 phút, để người phỏng vấn hỏi thêm","Có số liệu: \"giảm 30% ticket hỗ trợ\" thuyết phục hơn \"giảm đáng kể\"","Chuẩn bị cho câu hỏi vặn: \"Nếu làm lại, bạn sẽ làm khác gì?\""]],
      ["warn",["Bối cảnh quá dài, phần hành động quá ngắn","Kể chuyện của team, không rõ vai trò của mình","Chọn thất bại giả kiểu \"tôi làm việc quá chăm chỉ\""]]
    ]},
    {id:"behavioral-2", t:"Chuẩn bị ngân hàng câu chuyện", m:5, b:[
      ["p","Thay vì chuẩn bị câu trả lời cho từng câu hỏi, hãy chuẩn bị 6 đến 8 câu chuyện thật, mỗi câu dùng được cho nhiều câu hỏi."],
      ["ul",["Thành công bạn tự hào nhất","Thất bại và bài học","Xung đột với engineer, designer hoặc stakeholder","Ra quyết định khi thiếu dữ liệu","Thuyết phục người có vị trí cao hơn","Dẫn dắt khi không có quyền quản lý","Xử lý khủng hoảng hoặc trễ hạn","Một lần dùng dữ liệu hoặc phản hồi người dùng để đổi hướng sản phẩm"]],
      ["h","Mẫu ghi chú cho mỗi câu chuyện"],
      ["p","Tiêu đề ngắn. Bối cảnh 2 câu. Vai trò của bạn. Ba hành động chính. Kết quả có số liệu. Bài học. Những câu hỏi có thể dùng chuyện này."],
      ["p","Nếu bạn chuyển sang làm product từ vị trí khác, có thể lấy câu chuyện từ công việc cũ, dự án cá nhân hoặc hoạt động ngoài giờ, miễn là thể hiện tư duy sản phẩm: hiểu người dùng, ưu tiên, đo lường."],
      ["tip","Dùng tab Luyện trả lời của chủ đề này để kể thử từng câu chuyện và nhận góp ý."]
    ]},
    {id:"behavioral-3", t:"Câu hỏi hay gặp ở vòng HR và văn hóa", m:5, b:[
      ["ul",["Giới thiệu bản thân: 60 đến 90 giây, theo mạch hiện tại, kinh nghiệm liên quan, vì sao bạn ở đây. Không đọc lại CV","Vì sao muốn làm PM: dựa trên trải nghiệm cụ thể cho thấy bạn đã làm những việc giống PM","Vì sao chọn công ty này: nối sứ mệnh hoặc sản phẩm của họ với kinh nghiệm của bạn, nêu một quan sát thật về sản phẩm","Vì sao rời công ty cũ: tích cực, hướng về cơ hội mới, không nói xấu nơi cũ","Điểm yếu: một điểm yếu thật nhưng không phải yêu cầu cốt lõi của vị trí, kèm việc bạn đang làm để cải thiện","Mức lương mong muốn: tìm hiểu mặt bằng thị trường trước, đưa ra một khoảng, hoặc hỏi khung của công ty","Bạn có câu hỏi gì không: luôn chuẩn bị 2 đến 3 câu về team, cách ra quyết định, thách thức lớn nhất của sản phẩm"]],
      ["warn",["Câu trả lời chung chung, dùng được cho bất kỳ công ty nào","Không chuẩn bị câu hỏi cho người phỏng vấn"]]
    ]},
    {id:"behavioral-4", t:"Kể về thất bại và rút ra bài học", m:6, b:[
      ["p", "\"Kể về một lần bạn thất bại\" là câu hỏi gần như chắc chắn gặp. Người phỏng vấn không tìm người chưa từng sai, họ muốn xem bạn có dám nhận phần trách nhiệm của mình, hiểu vì sao sai và thay đổi cách làm sau đó hay không."],
      ["h", "Chọn câu chuyện thế nào"],
      ["ul", ["Thất bại thật: có hậu quả rõ, ví dụ tính năng ra mắt không ai dùng, trễ hạn ảnh hưởng đối tác, quyết định sai làm giảm chỉ số", "Bạn có phần trách nhiệm: lỗi nằm ở quyết định hoặc cách làm của bạn, không phải hoàn toàn do người khác hay hoàn cảnh", "Không phải thảm họa: tránh chuyện làm lộ dữ liệu khách hàng hay vi phạm pháp lý do sơ suất, vì nó làm người nghe lo về khả năng phán đoán", "Đã đủ lâu: tốt nhất là chuyện bạn đã có dịp áp dụng bài học ở dự án sau"]],
      ["h", "Cấu trúc trả lời"],
      ["ol", ["Bối cảnh và kỳ vọng ban đầu: bạn định làm gì, mục tiêu là gì.", "Điều gì đã xảy ra: nói thẳng kết quả không như mong đợi, có số liệu nếu được.", "Nguyên nhân gốc: phần nào do bạn, nói rõ bằng \"tôi\".", "Bạn xử lý ra sao ngay lúc đó: giảm thiệt hại, báo cáo, sửa sai.", "Bài học cụ thể: thay đổi trong cách làm, không phải câu chung chung.", "Bằng chứng đã áp dụng: một lần sau đó bạn làm khác và kết quả tốt hơn."]],
      ["p", "Phần bài học và bằng chứng áp dụng nên chiếm ít nhất một phần ba câu trả lời. Đây là phần người phỏng vấn chấm điểm nhiều nhất."],
      ["ex", "Bối cảnh: PM ở một ví điện tử, tôi đẩy nhanh tính năng chia hóa đơn nhóm vì đối thủ vừa ra mắt. Tôi bỏ qua bước phỏng vấn người dùng để kịp sprint.\nKết quả: sau một tháng, tỷ lệ dùng thấp hơn nhiều so với mục tiêu (giả định: dưới 2% người dùng hoạt động). Khi xem lại, người dùng chủ yếu chia tiền qua chuyển khoản ngân hàng trong nhóm chat, không mở ví để chia.\nPhần lỗi của tôi: tôi coi việc đối thủ có tính năng là bằng chứng nhu cầu.\nBài học: trước khi build, tôi luôn dành vài ngày kiểm chứng bằng một bản thử nhỏ hoặc 5 đến 8 cuộc phỏng vấn. Ở dự án sau, cách này giúp team bỏ một ý tưởng tốn hai sprint trước khi viết dòng code nào."],
      ["warn", ["Chọn thất bại giả hoặc thực chất là khoe, như \"tôi quá cầu toàn\"", "Đổ lỗi cho engineer, sếp hoặc thị trường", "Kể rất dài phần thất bại, chỉ một câu cho bài học", "Bài học chung chung như \"tôi học được cần giao tiếp tốt hơn\"", "Tỏ ra vẫn còn bức xúc hoặc xấu hổ khi kể"]],
      ["q", ["Kể về một sản phẩm hoặc tính năng bạn ra mắt nhưng không thành công.", "Quyết định sai lầm lớn nhất trong sự nghiệp của bạn là gì?", "Nếu được làm lại dự án đó, bạn sẽ làm khác điều gì?"]]
    ]},
    {id:"behavioral-5", t:"Xử lý xung đột và bất đồng trong team", m:6, b:[
      ["p", "PM làm việc giữa engineer, designer, business, vận hành và pháp chế, nên bất đồng là chuyện hằng ngày. Câu hỏi về xung đột kiểm tra xem bạn có giải quyết được bất đồng mà vẫn giữ quan hệ và đưa ra quyết định tốt cho người dùng hay không."],
      ["h", "Các dạng xung đột hay gặp"],
      ["ul", ["Phạm vi và thời hạn: business muốn ra mắt trước dịp sale lớn, engineer nói cần thêm thời gian để làm đúng", "Ưu tiên: hai team cùng muốn tài nguyên của một squad", "Giải pháp: designer và engineer chọn hai hướng khác nhau cho cùng một vấn đề", "Chất lượng và tốc độ: chấp nhận nợ kỹ thuật để kịp hay chờ", "Với cấp trên: bạn không đồng ý với quyết định của sếp hoặc lãnh đạo"]],
      ["h", "Cách xử lý mà người phỏng vấn muốn thấy"],
      ["ol", ["Hiểu trước khi thuyết phục: hỏi để biết mối lo thật của bên kia, thường nằm sau lập trường bề mặt.", "Quay về mục tiêu chung: người dùng và chỉ số mà cả hai bên cùng quan tâm.", "Đưa dữ liệu hoặc bằng chứng lên bàn thay vì ý kiến cá nhân.", "Tìm phương án thứ ba: chia nhỏ phạm vi, làm thử nghiệm, ra mắt theo giai đoạn.", "Chốt quyết định rõ ràng, ai quyết và vì sao. Nếu không thống nhất được, nêu cách bạn đưa lên cấp trên một cách minh bạch.", "Theo dõi sau đó: quan hệ với người kia ra sao, quyết định có đúng không."]],
      ["ex", "Bối cảnh: app giao đồ ăn, team marketing muốn ra mắt chương trình voucher mới trước một ngày sale lớn, còn tech lead lo hệ thống thanh toán chưa chịu được tải.\nTôi ngồi riêng với tech lead và biết mối lo cụ thể là phần trừ voucher khi lượng đơn tăng đột biến. Tôi hỏi marketing điều họ cần nhất là gì: hóa ra là có chương trình để truyền thông, không nhất thiết đủ mọi loại voucher.\nPhương án: chỉ ra mắt một loại voucher đơn giản, giới hạn số lượt mỗi giờ, phần phức tạp làm sau sale. Cả hai bên đồng ý, ngày sale không có sự cố và chương trình đầy đủ ra mắt hai tuần sau."],
      ["tip", "Nếu được hỏi về lần bất đồng với sếp, một kết thúc tốt là: bạn nêu ý kiến có lý do, sếp vẫn quyết khác, và bạn ủng hộ thực hiện hết mình (disagree and commit)."],
      ["warn", ["Kể chuyện trong đó bạn đúng hoàn toàn, bên kia sai hoàn toàn", "Chọn xung đột quá nhỏ, như tranh luận màu nút bấm", "Thắng bằng cách nhờ sếp ép, không ai thực sự đồng thuận", "Né xung đột hoặc nói \"tôi chưa từng có xung đột\""]],
      ["q", ["Kể về một lần bạn bất đồng với engineer về phạm vi tính năng.", "Bạn làm gì khi không đồng ý với quyết định của cấp trên?", "Kể về một lần bạn phải làm việc với một đồng nghiệp khó tính."]]
    ]},
    {id:"behavioral-6", t:"Tạo ảnh hưởng khi không có quyền quản lý", m:6, b:[
      ["p", "Phần lớn PM không quản lý trực tiếp engineer, designer hay đối tác business, nhưng vẫn phải khiến họ cùng đi một hướng. Câu hỏi về influence kiểm tra xem bạn tạo đồng thuận bằng cách nào khi không thể ra lệnh."],
      ["h", "Nguồn ảnh hưởng của PM"],
      ["ul", ["Hiểu người dùng: dữ liệu, phỏng vấn, ghi chú từ CSKH mà người khác chưa có", "Lý lẽ rõ ràng: nối đề xuất với mục tiêu của công ty và của chính team đó", "Uy tín tích lũy: giữ lời hứa, minh bạch khi sai, ghi nhận công của người khác", "Quan hệ: hiểu mỗi stakeholder bị đánh giá bằng chỉ số gì và đang lo điều gì", "Đưa người khác vào sớm: để họ góp ý từ đầu thay vì chỉ duyệt kết quả cuối"]],
      ["h", "Các bước thuyết phục một stakeholder"],
      ["ol", ["Lập bản đồ stakeholder: ai quyết định, ai bị ảnh hưởng, ai có thể chặn.", "Gặp riêng từng người trước cuộc họp lớn để nghe phản đối và chỉnh đề xuất.", "Đóng khung đề xuất theo điều họ quan tâm: với vận hành là giảm việc thủ công, với tài chính là chi phí và rủi ro.", "Giảm rủi ro khi đồng ý: đề xuất thử nghiệm nhỏ, có điểm dừng rõ.", "Chốt cam kết bằng văn bản sau cuộc họp: quyết định, người phụ trách, thời hạn."]],
      ["ex", "Bối cảnh: tại một ngân hàng số, tôi muốn rút ngắn luồng mở tài khoản online, nhưng team tuân thủ lo về rủi ro gian lận.\nThay vì gửi đề xuất qua email, tôi xin ngồi cùng họ xem lại các ca gian lận gần đây và nhận ra phần lớn bị chặn ở bước xác thực khuôn mặt, không phải ở các câu hỏi khai báo mà tôi muốn bỏ.\nTôi đề xuất thử nghiệm luồng ngắn cho một phần nhỏ người dùng mới trong 4 tuần, team tuân thủ được quyền dừng nếu tỷ lệ gian lận tăng. Kết quả tỷ lệ hoàn tất tăng, gian lận không đổi, và chính team tuân thủ trình bày kết quả với lãnh đạo."],
      ["warn", ["Nói \"tôi thuyết phục được họ\" mà không kể cụ thể đã làm gì", "Dựa vào chức danh hoặc tên sếp để ép người khác làm", "Chỉ dùng dữ liệu, bỏ qua động cơ và mối lo của con người", "Chỉ kể chuyện thuyết phục người ngang cấp, không có ví dụ với cấp cao hơn"]],
      ["q", ["Kể về một lần bạn thuyết phục một team không thuộc quyền quản lý của bạn thay đổi ưu tiên.", "Làm sao bạn có được sự ủng hộ của lãnh đạo cho một ý tưởng mới?", "Kể về một lần bạn không thuyết phục được ai đó. Bạn đã làm gì tiếp?"]]
    ]},
    {id:"behavioral-7", t:"Lãnh đạo, mentor và phát triển người khác", m:6, b:[
      ["p", "Với vị trí Senior PM, Lead hoặc Head of Product, người phỏng vấn sẽ hỏi bạn giúp người khác giỏi lên thế nào. Ngay cả với PM chưa quản lý ai, các câu hỏi về lãnh đạo vẫn xuất hiện: dẫn dắt một dự án, hướng dẫn PM mới, nâng chất lượng chung của team."],
      ["h", "Người phỏng vấn tìm gì"],
      ["ul", ["Bạn nhìn ra điểm mạnh và khoảng trống của từng người, không áp một cách cho tất cả", "Bạn giao việc có độ khó vừa sức và để người đó tự quyết, thay vì làm thay", "Bạn góp ý thẳng nhưng tôn trọng, đúng lúc, có ví dụ cụ thể", "Bạn xử lý được trường hợp người làm chưa tốt", "Bạn đo được sự tiến bộ của người khác, không chỉ kết quả sản phẩm"]],
      ["h", "Khung kể chuyện mentor"],
      ["ol", ["Người đó là ai và đang ở đâu: ví dụ PM mới chuyển từ vận hành sang, viết PRD còn thiếu phần vấn đề.", "Bạn chẩn đoán thế nào: quan sát, hỏi chính người đó muốn phát triển gì.", "Bạn làm gì: cặp đôi làm một tài liệu, sau đó lùi dần, góp ý theo từng bản.", "Kết quả của người đó: họ làm được gì mà trước đây chưa làm được.", "Bạn học được gì về cách dẫn dắt."]],
      ["ex", "Bối cảnh: ở một sàn thương mại điện tử, tôi hướng dẫn một Associate PM phụ trách luồng đổi trả hàng.\nBạn ấy làm việc chăm nhưng hay mang mọi câu hỏi nhỏ lên tôi. Tôi cùng bạn ấy viết ra những loại quyết định bạn được tự chốt (thay đổi text, thứ tự bước) và loại cần bàn (thay đổi chính sách, ảnh hưởng chi phí).\nMỗi tuần chúng tôi xem lại 30 phút các quyết định đã làm. Sau khoảng một quý, bạn ấy tự dẫn buổi review với team vận hành và đề xuất được một thay đổi làm giảm ticket đổi trả. Tôi học được rằng giao quyền rõ ràng hiệu quả hơn là chỉ khuyên \"em cứ tự tin lên\"."],
      ["warn", ["Nói về lãnh đạo bằng khẩu hiệu như \"tôi luôn truyền cảm hứng\" mà không có ví dụ", "Kể việc mentor thực chất là làm thay người khác", "Né câu hỏi về người làm chưa tốt hoặc phải cho nghỉ việc", "Chỉ nói thành tích của team mà không thấy vai trò của bạn trong sự trưởng thành của từng người"]],
      ["q", ["Kể về một người bạn đã giúp phát triển. Họ thay đổi thế nào?", "Bạn xử lý ra sao khi một thành viên trong team liên tục không đạt kỳ vọng?", "Bạn đưa ra góp ý khó nghe cho đồng nghiệp như thế nào?"]]
    ]},
    {id:"behavioral-8", t:"Trả lời \"Vì sao làm PM, vì sao công ty này?\"", m:5, b:[
      ["p", "Hai câu này thường xuất hiện ngay đầu buổi và tạo ấn tượng cho cả buổi. Câu trả lời tốt cho thấy động lực thật, hiểu đúng công việc PM và đã tìm hiểu kỹ công ty, chứ không phải lời khen chung chung."],
      ["h", "Vì sao muốn làm PM"],
      ["ul", ["Bắt đầu từ trải nghiệm thật: một lần bạn đã làm việc giống PM, như tìm ra vấn đề của người dùng, phối hợp nhiều bên, đo kết quả", "Nói về phần việc bạn thích: hiểu người dùng, đánh đổi, nhìn sản phẩm chạy ra số liệu", "Cho thấy bạn hiểu mặt khó: ra quyết định khi thiếu dữ liệu, chịu trách nhiệm kết quả mà không có quyền quản lý", "Nối với điểm mạnh bạn mang theo từ nghề cũ, nếu bạn chuyển ngành"]],
      ["h", "Vì sao chọn công ty này"],
      ["ol", ["Sản phẩm: bạn đã dùng thử, có một quan sát cụ thể, kể cả một điểm có thể cải thiện.", "Vấn đề và thị trường: điều gì ở bài toán họ giải khiến bạn hứng thú.", "Giai đoạn và cách làm việc: startup đang tìm product-market fit hay công ty lớn tối ưu ở quy mô lớn, và vì sao giai đoạn đó hợp với bạn.", "Sự phù hợp: kinh nghiệm nào của bạn giúp được họ ngay."]],
      ["ex", "Ví dụ cho vị trí PM ở một app xe công nghệ, ứng viên chuyển từ vận hành:\n\"Hai năm làm vận hành tài xế, tôi thấy nhiều tài xế bỏ app vì không hiểu cách tính thu nhập. Tôi tự làm một bảng tóm tắt thu nhập gửi qua nhóm chat và số câu hỏi lên tổng đài giảm rõ. Đó là lúc tôi nhận ra tôi thích giải vấn đề bằng sản phẩm hơn là xử lý từng ca. Tôi chọn công ty anh chị vì app tài xế đang là phần cạnh tranh chính giữa các bên, và khi dùng thử tôi thấy màn hình thu nhập còn khó đọc với người lớn tuổi. Kinh nghiệm làm với tài xế giúp tôi đóng góp ngay ở mảng này.\""],
      ["warn", ["\"Tôi muốn làm CEO của sản phẩm\" hoặc \"PM được ra quyết định\": cho thấy hiểu sai công việc", "Khen chung chung như \"công ty lớn, môi trường năng động\" dùng được cho mọi nơi", "Chưa từng dùng sản phẩm của công ty", "Nói lý do chủ yếu là lương hoặc chức danh", "Chê sản phẩm quá gay gắt khi chưa hiểu bối cảnh của họ"]],
      ["q", ["Vì sao bạn muốn làm Product Manager?", "Vì sao bạn chọn công ty chúng tôi mà không phải đối thủ?", "Bạn thích và không thích điều gì ở sản phẩm của chúng tôi?"]]
    ]},
    {id:"behavioral-9", t:"Đặt câu hỏi ngược cho nhà tuyển dụng", m:5, b:[
      ["p", "Phần \"Bạn có câu hỏi gì không?\" không phải phần phụ. Câu hỏi tốt cho thấy bạn nghĩ như một PM, đồng thời giúp bạn biết công việc có hợp với mình không. Không có câu hỏi nào thường bị hiểu là thiếu quan tâm."],
      ["h", "Hỏi ai, hỏi gì"],
      ["ul", ["HR hoặc recruiter: quy trình còn những vòng nào, thời gian dự kiến, team đang tuyển vì mở rộng hay thay người", "Hiring manager: kỳ vọng sau 3 đến 6 tháng, chỉ số team chịu trách nhiệm, thách thức lớn nhất hiện tại", "Engineer hoặc designer: PM và team phối hợp thế nào, ai quyết ưu tiên, quy trình từ ý tưởng đến ra mắt", "Lãnh đạo: chiến lược sản phẩm năm tới, cách công ty cân bằng tăng trưởng và lợi nhuận"]],
      ["h", "Một số câu hỏi hay"],
      ["ol", ["Một PM làm rất tốt ở vị trí này sau 6 tháng sẽ đạt được điều gì?", "Gần đây team có một quyết định sản phẩm khó nào? Quyết định đó được đưa ra thế nào?", "Team đang đo thành công bằng những chỉ số nào, và chỉ số nào đang gặp khó?", "Điều gì khiến anh chị thích nhất và khó nhất khi làm ở đây?", "Có điều gì trong buổi hôm nay khiến anh chị còn băn khoăn về sự phù hợp của tôi không?"]],
      ["ex", "Tình huống: phỏng vấn hiring manager của một ví điện tử, bạn đã đọc tin công ty đang đẩy mạnh mảng thanh toán hóa đơn.\nCâu hỏi tốt: \"Em thấy gần đây app đưa thanh toán hóa đơn lên trang chủ. Team đang ưu tiên số người dùng mới cho mảng này hay tần suất thanh toán lặp lại của người đã dùng? Vị trí này sẽ chịu trách nhiệm phần nào?\"\nCâu hỏi này cho thấy bạn đã dùng sản phẩm, hiểu khác biệt giữa acquisition và retention, và giúp bạn biết rõ phạm vi công việc."],
      ["tip", "Chuẩn bị sẵn 5 đến 6 câu, vì vài câu có thể đã được trả lời trong buổi. Ghi lại câu trả lời để so sánh các offer sau này."],
