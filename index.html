      ["p","Thay vì chia \"sinh viên, nhân viên văn phòng\", hãy chia theo cách họ dùng sản phẩm: tần suất, mục đích, bối cảnh. Ví dụ với app giao đồ ăn: người đặt bữa trưa văn phòng mỗi ngày, gia đình đặt cuối tuần, người đặt đồ ăn khuya."],
      ["h","Jobs To Be Done"],
      ["p","Hỏi \"người dùng thuê sản phẩm này để làm việc gì?\". Người đặt cơm trưa văn phòng không chỉ cần đồ ăn; họ cần ăn trưa nhanh, đủ chất, không phải nghĩ nhiều. Từ đó, \"đặt lại món quen một chạm\" hợp hơn \"thêm 100 quán mới\"."],
      ["h","Chọn nhóm để tập trung"],
      ["ul",["Quy mô: nhóm có đủ lớn không","Mức độ đau: vấn đề có thật sự khó chịu và thường xuyên không","Phù hợp chiến lược: phục vụ nhóm này có giúp mục tiêu của công ty không","Khoảng trống: đối thủ đã làm tốt cho nhóm này chưa"]],
      ["warn",["Phân khúc chỉ theo tuổi và giới tính","Mô tả nỗi đau chung chung như \"bất tiện\", \"tốn thời gian\" mà không nói cụ thể khi nào, vì sao"]],
      ["q",["Ai là người dùng quan trọng nhất của một ví điện tử? Vì sao?"]]
    ]},
    {id:"sense-3", t:"Cải tiến sản phẩm và tư duy MVP", m:5, b:[
      ["p","Với câu \"cải thiện sản phẩm X\", người phỏng vấn muốn xem bạn hiểu sản phẩm phục vụ ai, đang thắng ở đâu, và đâu là cơ hội lớn nhất."],
      ["ol",["Nói sản phẩm dành cho ai và giá trị cốt lõi là gì.","Đoán mục tiêu hiện tại của công ty (tăng trưởng, giữ chân, kiếm tiền).","Chọn một nhóm người dùng và một vấn đề có bằng chứng (trải nghiệm, đánh giá trên store, quan sát).","Đề xuất giải pháp, chọn một, nói cách thử nghiệm nhỏ.","Chỉ số đo thành công."]],
      ["h","MVP để học nhanh"],
      ["p","MVP là phiên bản nhỏ nhất đủ để kiểm chứng giả định rủi ro nhất. Trước khi xây, hãy nói rõ giả định đó là gì: người dùng có muốn không, có trả tiền không, có làm được về kỹ thuật không. Đôi khi MVP chỉ là một trang đăng ký, một nút giả, hoặc làm thủ công phía sau (concierge)."],
      ["ex","Muốn thêm tính năng đặt lịch cắt tóc vào một app gọi xe? Trước khi xây hệ thống đặt lịch, có thể đặt một banner dẫn tới form đăng ký ở một quận, và để nhân viên gọi điện xác nhận thủ công trong hai tuần để xem nhu cầu thật."],
      ["warn",["Đề xuất thứ mình thích thay vì thứ người dùng cần","MVP quá to, mất nhiều tháng mới học được điều gì"]]
    ]},
    {id:"sense-4", t:"Đánh giá và chọn giải pháp: đánh đổi và tiêu chí", m:6, b:[
      ["p", "Đưa ra được 3 ý tưởng là chưa đủ. Phần người phỏng vấn chú ý nhất là lúc bạn chọn một ý và giải thích vì sao bỏ các ý còn lại. Đây là kỹ năng PM dùng hằng ngày khi viết roadmap."],
      ["h", "Tiêu chí để so sánh"],
      ["ul", ["Tác động: giải quyết vấn đề đã chọn tốt đến đâu, ảnh hưởng bao nhiêu người dùng", "Công sức: cần bao nhiêu team, bao lâu, có phụ thuộc đối tác không", "Độ chắc chắn: có bằng chứng nào cho thấy người dùng cần, hay mới là cảm giác", "Rủi ro: pháp lý, gian lận, ảnh hưởng thương hiệu, làm xấu chỉ số khác", "Phù hợp chiến lược: có củng cố lợi thế của công ty không, hay chỉ là bắt chước đối thủ"]],
      ["p", "Bạn không cần chấm điểm RICE chi tiết trong buổi phỏng vấn. Chỉ cần một bảng nhỏ trong đầu với 2 đến 3 tiêu chí quan trọng nhất cho mục tiêu đã thống nhất, rồi nói ra cách bạn cân nhắc."],
      ["h", "Nói về đánh đổi cho thuyết phục"],
      ["ol", ["Nhắc lại mục tiêu và vấn đề, vì tiêu chí phụ thuộc vào đó.", "So sánh các ý theo cùng tiêu chí, không khen ý này bằng tiêu chí này rồi chê ý kia bằng tiêu chí khác.", "Chọn một ý và nói rõ mình chấp nhận mất gì.", "Nói điều kiện khiến bạn đổi lựa chọn, ví dụ nếu thử nghiệm cho thấy người dùng không quay lại."]],
      ["ex", "Đề: giảm tỉ lệ bỏ giỏ hàng trên một app thương mại điện tử.\nBa ý: (A) cho thanh toán COD với đơn trên mức giá cao hơn, (B) lưu giỏ hàng và nhắc qua thông báo, (C) gói trả sau đơn giản.\nBạn chọn B trước: công sức thấp, dễ thử A/B, ít rủi ro. C có thể tác động lớn hơn nhưng cần đối tác tài chính và kiểm soát nợ xấu, nên để giai đoạn sau. A tăng chuyển đổi nhưng có thể làm tăng tỉ lệ boom hàng, nên phải đo kèm tỉ lệ giao thất bại."],
      ["tip", "Câu \"Tôi chấp nhận đánh đổi X để đổi lấy Y\" cho thấy bạn trưởng thành hơn hẳn câu \"Ý này tốt nhất\"."],
      ["warn", ["Chọn giải pháp mình thích nhất mà không có tiêu chí", "Chỉ nói ưu điểm của ý được chọn, không nói nó kém ở đâu", "Dùng tiêu chí khác nhau cho từng ý", "Bỏ qua chi phí vận hành và rủi ro gian lận"]],
      ["q", ["Bạn có 3 ý tưởng nhưng team chỉ làm được một trong quý này. Bạn chọn thế nào?", "Kể về một lần bạn phải bỏ một tính năng bạn tin là tốt."]]
    ]},
    {id:"sense-5", t:"Câu hỏi \"Sản phẩm bạn yêu thích\" và cách phân tích sản phẩm", m:6, b:[
      ["p", "\"Sản phẩm bạn yêu thích là gì và vì sao?\" nghe dễ nhưng hay bị trả lời như một bài review. Người phỏng vấn muốn thấy bạn nhìn sản phẩm bằng mắt PM: nó phục vụ ai, giải quyết việc gì, vì sao nó thắng và có thể tốt hơn ở đâu."],
      ["h", "Chọn sản phẩm nào"],
      ["ul", ["Chọn sản phẩm bạn dùng thật và hiểu sâu, kể cả app nhỏ hoặc đồ vật ngoài đời", "Tránh sản phẩm của chính công ty đang phỏng vấn trừ khi bạn hiểu rất kỹ, vì họ biết nhiều hơn bạn", "Sản phẩm có lựa chọn thiết kế thú vị sẽ dễ nói hơn sản phẩm ai cũng khen"]],
      ["h", "Khung phân tích"],
      ["ol", ["Người dùng và việc cần làm: sản phẩm dành cho ai, giải quyết việc gì.", "Vì sao nó thắng: một đến hai quyết định thiết kế cụ thể, so với cách cũ hoặc đối thủ.", "Mô hình kinh doanh: kiếm tiền từ đâu, và điều đó ảnh hưởng thiết kế ra sao.", "Chỉ số: nếu bạn là PM, bạn theo dõi chỉ số nào.", "Cải tiến: một điểm yếu và một đề xuất có đánh đổi."]],
      ["ex", "Ví dụ: một app ngân hàng số.\nNgười dùng: người đi làm trẻ, chuyển tiền nhiều lần mỗi ngày. Việc cần làm: chuyển tiền nhanh, không sai người nhận.\nVì sao thắng: quét mã QR và hiện tên người nhận trước khi xác nhận, giảm nỗi lo chuyển nhầm. Cải tiến: nhóm phụ huynh lớn tuổi dễ bị lừa chuyển khoản, có thể thêm cảnh báo khi chuyển số tiền lớn cho người nhận lần đầu. Đánh đổi: thêm một bước ma sát cho mọi người, nên chỉ bật khi có tín hiệu rủi ro."],
      ["tip", "Chuẩn bị sẵn 2 sản phẩm: một app số và một sản phẩm ngoài đời. Người phỏng vấn đôi khi yêu cầu đổi."],
      ["warn", ["Chỉ nói \"giao diện đẹp, dễ dùng\" mà không chỉ ra quyết định thiết kế cụ thể", "Không nhắc người dùng mục tiêu", "Đề xuất cải tiến mà không có lý do hay đánh đổi", "Chọn sản phẩm quá phổ biến rồi nói những điều ai cũng biết"]],
      ["q", ["Sản phẩm bạn yêu thích là gì? Nếu làm PM của nó, bạn sẽ cải thiện gì?", "Kể một sản phẩm bạn thấy thiết kế tệ và vì sao."]]
    ]},
    {id:"sense-6", t:"Thiết kế cho người dùng Việt Nam: COD, Zalo, xe máy, thanh toán, đa thế hệ", m:7, b:[
      ["p", "Nhiều đề product sense ở Việt Nam được chấm cao khi bạn cho thấy hiểu bối cảnh địa phương. Một giải pháp chép nguyên từ sản phẩm nước ngoài thường hỏng ở những chi tiết rất đời thường."],
      ["h", "Những đặc điểm hay gặp"],
      ["ul", ["COD và niềm tin: nhiều người vẫn muốn nhận hàng rồi mới trả tiền, nhất là với shop lạ. Đổi lại là rủi ro boom hàng và chi phí thu hộ.", "Thanh toán QR: chuyển khoản qua mã QR đã rất quen, kể cả ở hàng quán nhỏ. Thiết kế nên tận dụng thói quen này thay vì bắt nhập thẻ.", "Zalo là kênh liên lạc: nhiều người, nhất là người lớn tuổi và chủ shop, quen nhắn tin qua Zalo hơn email hay thông báo trong app.", "Xe máy: người dùng đang chạy xe khó nhìn màn hình, hẻm nhỏ khó tìm, địa chỉ hay không chuẩn. Giao hàng và bản đồ cần ghi chú địa chỉ, gọi điện, ghim vị trí.", "Đa thế hệ: con cái thường đặt hộ, trả hộ cho bố mẹ; một thiết bị có thể do nhiều người dùng chung.", "Máy cấu hình thấp và mạng chập chờn ở một số vùng: app nặng sẽ mất người dùng."]],
      ["h", "Cách đưa vào câu trả lời"],
      ["ol", ["Ở bước làm rõ, hỏi về thành phố hay nông thôn, độ tuổi, kênh thanh toán.", "Ở bước người dùng, nghĩ đến người đặt hộ và người được phục vụ.", "Ở bước giải pháp, kiểm tra từng ý với bối cảnh: có cần COD không, có cần chia sẻ qua Zalo không, có dùng được khi đang chạy xe không.", "Ở bước đo lường, thêm chỉ số đặc thù như tỉ lệ giao thất bại hay tỉ lệ chuyển từ COD sang trả trước."]],
      ["ex", "Đề: thiết kế tính năng mua thuốc online cho người lớn tuổi.\nThay vì bắt người cao tuổi tự tạo tài khoản, cho con cháu tạo \"hồ sơ gia đình\" và đặt hộ. Người cao tuổi nhận tin nhắn xác nhận qua Zalo kèm số điện thoại nhà thuốc. Cho chọn trả COD hoặc người con quét QR trả trước. Shipper được ghi chú \"gọi trước khi đến, nhà trong hẻm\"."],
      ["warn", ["Mặc định ai cũng dùng thẻ tín dụng", "Thiết kế cho người dùng trẻ ở trung tâm thành phố rồi coi đó là toàn bộ thị trường", "Coi COD chỉ là chuyện thanh toán, quên chi phí vận hành và hoàn hàng", "Nói chung chung \"người Việt thích Zalo\" mà không gắn với vấn đề cụ thể"]],
      ["q", ["Thiết kế một sản phẩm giúp người bán nhỏ lẻ trên mạng xã hội quản lý đơn hàng.", "Làm sao giảm tỉ lệ đơn COD bị từ chối nhận hàng?", "Thiết kế tính năng giúp con cái chăm sóc bố mẹ ở quê từ xa."]]
    ]},
    {id:"sense-7", t:"UX căn bản cho PM: onboarding, ma sát và nguyên tắc thiết kế", m:6, b:[
      ["p", "PM không cần vẽ đẹp như designer, nhưng cần nói được vì sao một luồng dễ hay khó dùng. Trong phỏng vấn, vài nhận xét UX sắc sẽ làm giải pháp của bạn đáng tin hơn nhiều."],
      ["h", "Onboarding: đưa người dùng tới giá trị đầu tiên"],
      ["p", "Mục tiêu của onboarding không phải là giới thiệu hết tính năng, mà là giúp người mới chạm tới khoảnh khắc thấy giá trị nhanh nhất. Hãy hỏi: người dùng cần làm ít nhất những bước nào để nhận được lợi ích đầu tiên, và bước nào có thể để sau."],
      ["ul", ["Hoãn thứ chưa cần: không bắt điền hồ sơ đầy đủ trước khi dùng thử", "Mặc định thông minh: điền sẵn những gì đoán được, như vị trí hay ngôn ngữ", "Hỏi quyền đúng lúc: xin quyền vị trí khi người dùng tìm quán gần đây, không phải ngay màn hình đầu"]],
      ["h", "Ma sát tốt và ma sát xấu"],
      ["p", "Không phải ma sát nào cũng nên bỏ. Ma sát xấu làm người dùng mất công vô ích, như nhập lại địa chỉ hay OTP nhiều lần. Ma sát tốt bảo vệ người dùng, như bước xác nhận khi chuyển số tiền lớn hay xóa dữ liệu."],
      ["h", "Vài nguyên tắc dễ dùng khi phỏng vấn"],
      ["ul", ["Rõ trạng thái: người dùng luôn biết chuyện gì đang xảy ra, như đơn đang ở đâu, tiền đã trừ chưa", "Phòng lỗi hơn sửa lỗi: hiện tên người nhận trước khi chuyển tiền", "Dễ hoàn tác: cho hủy hoặc sửa trong vài phút", "Nhất quán: cùng một hành động thì cùng một cách hiển thị", "Ít lựa chọn ở bước quan trọng: quá nhiều lựa chọn làm người dùng chần chừ"]],
      ["ex", "Đề: cải thiện onboarding cho một ví điện tử.\nVấn đề giả định: nhiều người tải app nhưng bỏ ở bước xác minh danh tính (eKYC).\nGiải pháp: cho người dùng nhận tiền và xem số dư trước khi eKYC, chỉ yêu cầu xác minh khi họ muốn chuyển đi hoặc thanh toán. Thêm hướng dẫn chụp giấy tờ rõ ràng và báo lỗi cụ thể như \"ảnh bị lóa\". Đo tỉ lệ hoàn thành eKYC trong 7 ngày và tỉ lệ gian lận làm chỉ số đối trọng, vì cần tuân thủ quy định."],
      ["warn", ["Nghĩ onboarding là vài màn hình giới thiệu có thể vuốt qua", "Muốn bỏ mọi ma sát, kể cả bước bảo vệ người dùng", "Nhận xét UX theo sở thích cá nhân như \"màu này xấu\"", "Quên trạng thái lỗi, trạng thái trống và mạng yếu"]],
      ["q", ["Bạn sẽ thiết kế lại trải nghiệm lần đầu dùng một app giao đồ ăn thế nào?", "Khi nào bạn chủ động thêm ma sát vào sản phẩm?"]]
    ]},
    {id:"sense-8", t:"Thiết kế sản phẩm hai mặt và marketplace", m:6, b:[
      ["p", "Gọi xe, giao đồ ăn, sàn thương mại điện tử đều là sản phẩm hai mặt: phải phục vụ cả người mua và người bán (hoặc khách và tài xế). Đây là dạng đề rất hay gặp ở Việt Nam, và điểm khó là mỗi quyết định có lợi cho bên này có thể gây hại cho bên kia."],
      ["h", "Những khái niệm cần nắm"],
      ["ul", ["Hai bên và nhu cầu khác nhau: khách cần nhanh, rẻ, tin cậy; tài xế hay người bán cần thu nhập ổn định và ít rủi ro", "Cân bằng cung cầu: thiếu cung thì khách chờ lâu, thừa cung thì tài xế không có cuốc", "Hiệu ứng mạng: thêm người bán thu hút thêm người mua và ngược lại, nhưng thường chỉ trong một khu vực", "Vấn đề con gà quả trứng: lúc mới mở chưa có bên nào, thường phải chọn một bên để kéo trước", "Niềm tin: đánh giá, xác minh, bảo vệ người mua giúp hai người lạ giao dịch với nhau"]],
      ["h", "Cách trả lời đề marketplace"],
      ["ol", ["Hỏi bên nào đang là điểm nghẽn: thiếu cung hay thiếu cầu.", "Phân tích người dùng cho cả hai bên, rồi chọn bên tập trung có lý do.", "Với mỗi giải pháp, nói nó ảnh hưởng thế nào tới bên còn lại.", "Đo bằng chỉ số của cả hệ thống, như tỉ lệ khớp đơn, thời gian chờ, và một chỉ số sức khỏe cho mỗi bên."]],
      ["ex", "Đề: khách hay bị hủy chuyến vào giờ mưa ở một app gọi xe.\nNếu chỉ nhìn phía khách, bạn có thể phạt tài xế hủy chuyến. Nhưng tài xế hủy vì mưa, kẹt xe, cuốc xa không đáng. Hướng cân bằng hơn: tăng giá có giới hạn khi mưa và trả phần tăng thêm cho tài xế, hiện rõ điểm đến trước khi nhận cuốc, và cho khách thấy thời gian chờ ước tính trung thực. Chỉ số chính: tỉ lệ chuyến hoàn thành giờ mưa. Đối trọng: thu nhập mỗi giờ của tài xế và tỉ lệ khách bỏ đặt vì giá cao."],
      ["warn", ["Chỉ thiết kế cho một bên và quên bên còn lại", "Đề xuất phạt hay trợ giá mà không nói chi phí và tác động lâu dài", "Nghĩ hiệu ứng mạng là toàn quốc trong khi gọi xe và giao đồ ăn chủ yếu theo từng khu vực", "Không có chỉ số cho sức khỏe của cả hai bên"]],
      ["q", ["Bạn sẽ ra mắt dịch vụ giao đồ ăn ở một tỉnh mới thế nào?", "Người bán trên sàn phàn nàn phí tăng, người mua phàn nàn giá cao. Bạn ưu tiên ai?", "Thiết kế hệ thống đánh giá cho một marketplace dịch vụ sửa chữa tại nhà."]]
    ]},
    {id:"sense-9", t:"Product sense gắn với tăng trưởng: activation, thói quen và vòng lặp", m:6, b:[
      ["p", "Một tính năng hay mà người dùng không quay lại thì cũng không giúp được công ty. Câu trả lời product sense mạnh thường cho thấy giải pháp giúp người dùng tìm thấy giá trị, quay lại đều đặn và kéo thêm người khác."],
      ["h", "Activation: khoảnh khắc thấy giá trị"],
      ["p", "Activation là lúc người dùng mới trải nghiệm giá trị cốt lõi lần đầu, ví dụ đơn đồ ăn đầu tiên giao đúng giờ hay lần chuyển tiền đầu tiên thành công. Hãy định nghĩa nó bằng một hành động đo được, rồi thiết kế để người dùng đến đó nhanh hơn."],
      ["h", "Thói quen và retention"],
      ["ul", ["Tác nhân kích hoạt: điều gì nhắc người dùng quay lại, như giờ ăn trưa hay ngày nhận lương", "Hành động đơn giản: càng ít bước càng dễ thành thói quen, như đặt lại món quen", "Phần thưởng: giá trị nhận được phải rõ và đáng tin, không chỉ là voucher", "Đầu tư: dữ liệu, lịch sử, danh bạ người dùng tích lũy làm sản phẩm hữu ích hơn theo thời gian"]],
      ["h", "Vòng lặp tăng trưởng"],
      ["p", "Vòng lặp là khi hành động của người dùng tạo ra người dùng mới hoặc giá trị mới. Ví dụ: người dùng chia hóa đơn với bạn bè qua ví, bạn bè phải cài ví để nhận tiền, rồi chính họ lại chia hóa đơn với người khác. Vòng lặp bền thường gắn với giá trị cốt lõi, không chỉ dựa vào thưởng giới thiệu."],
      ["ex", "Đề: tăng retention cho một app học tiếng Anh.\nActivation giả định: hoàn thành 3 bài trong tuần đầu. Thói quen: nhắc học vào khung giờ người dùng tự chọn, bài ngắn 5 phút học được trên xe buýt. Vòng lặp: cho người học thách đấu bạn qua link chia sẻ trên Zalo, người được mời làm bài ngay không cần đăng ký. Đo: tỉ lệ người dùng còn học ở tuần thứ 4, và theo dõi tỉ lệ tắt thông báo làm chỉ số đối trọng."],
      ["warn", ["Dùng voucher và khuyến mãi làm giải pháp chính cho retention", "Không định nghĩa activation bằng hành động cụ thể", "Thông báo đẩy dày đặc làm người dùng tắt thông báo hoặc gỡ app", "Thiết kế vòng lặp giới thiệu tách khỏi giá trị cốt lõi nên dễ bị trục lợi"]],
      ["q", ["Người dùng tải app nhưng không quay lại sau ngày đầu. Bạn làm gì?", "Thiết kế một vòng lặp tăng trưởng cho một app ngân hàng số."]]
    ]},
    {id:"sense-10", t:"Trình bày câu trả lời product sense: cấu trúc, thời gian và phản hồi người phỏng vấn", m:6, b:[
      ["p", "Nhiều ứng viên có ý tưởng tốt nhưng vẫn trượt vì trình bày lan man, hết giờ trước khi tới giải pháp, hoặc bỏ qua gợi ý của người phỏng vấn. Cách bạn dẫn dắt 30 đến 40 phút cũng được chấm điểm như nội dung."],
      ["h", "Phân bổ thời gian"],
      ["p", "Với một đề khoảng 30 phút, có thể chia như sau. Đây là gợi ý, hãy linh hoạt theo người phỏng vấn."],
      ["ul", ["Làm rõ đề và mục tiêu: 3 đến 5 phút", "Người dùng và nỗi đau: 7 đến 10 phút", "Giải pháp và đánh đổi: 10 đến 12 phút", "Đo lường và tóm tắt: 3 đến 5 phút"]],
      ["h", "Dẫn dắt để người nghe theo kịp"],
      ["ol", ["Xin 1 đến 2 phút suy nghĩ và ghi khung ra giấy hoặc bảng.", "Nói trước lộ trình: \"Tôi sẽ đi qua người dùng, vấn đề, giải pháp rồi cách đo\".", "Cuối mỗi phần, chốt lại một câu và hỏi \"Anh chị có muốn tôi đi sâu thêm phần nào không?\".", "Đánh số các ý để người nghe dễ theo.", "Kết thúc bằng phần tóm tắt 3 đến 4 câu và nói rủi ro lớn nhất cần kiểm chứng."]],
      ["h", "Đọc phản hồi của người phỏng vấn"],
      ["p", "Gợi ý của người phỏng vấn là thông tin, không phải bẫy. Khi họ hỏi \"Còn nhóm người dùng khác thì sao?\" hay \"Nếu không có ngân sách marketing thì sao?\", họ thường muốn bạn đổi hướng. Hãy ghi nhận, điều chỉnh và nói rõ điều gì thay đổi trong lựa chọn của bạn. Nếu bị phản biện, giữ quan điểm khi bạn có lý do, nhưng đừng cố cãi."],
      ["ex", "Người phỏng vấn ngắt lời: \"Giả sử team chỉ có 2 kỹ sư.\"\nTrả lời yếu: tiếp tục trình bày giải pháp lớn như cũ.\nTrả lời tốt: \"Vậy tôi sẽ bỏ phần cá nhân hóa, giữ phần nhắc đặt lại món quen vì làm được trong vài tuần và vẫn nhắm đúng vấn đề đã chọn. Phần cá nhân hóa để sau khi có dữ liệu.\""],
      ["tip", "Luyện nói thành tiếng và bấm giờ. Đọc trong đầu thì thấy ổn, nói ra mới thấy mình mất bao nhiêu phút ở phần làm rõ."],
      ["warn", ["Dành quá nửa thời gian cho phần làm rõ và người dùng", "Im lặng suy nghĩ quá lâu mà không nói mình đang làm gì", "Bỏ qua hoặc tranh cãi với gợi ý của người phỏng vấn", "Không tóm tắt ở cuối, để người nghe tự xâu chuỗi"]],
      ["q", ["Thiết kế một sản phẩm giúp người đi làm ở thành phố lớn tiết kiệm thời gian đi lại. Bạn có 30 phút.", "Nếu chỉ còn 5 phút, bạn sẽ trình bày những gì?"]]
    ]}
  ],
  metrics: [
    {id:"metrics-1", t:"Chọn chỉ số đúng", m:6, b:[
      ["p","Chỉ số tốt phản ánh giá trị người dùng nhận được và gắn với mục tiêu kinh doanh. Khi trả lời, hãy đi từ mục tiêu xuống chỉ số, không phải ngược lại."],
      ["h","Ba lớp chỉ số"],
      ["ul",["North Star Metric: một chỉ số phản ánh giá trị cốt lõi và dẫn dắt tăng trưởng dài hạn, ví dụ số đơn giao thành công mỗi tuần","Chỉ số đầu vào: những thứ team tác động trực tiếp, như tỉ lệ chuyển đổi ở trang thanh toán, thời gian giao trung bình","Chỉ số đối trọng: canh để tối ưu chỗ này không làm hỏng chỗ khác, như tỉ lệ hủy đơn, lượng phàn nàn"]],
      ["h","Khung hỗ trợ"],
      ["ul",["AARRR: Acquisition, Activation, Retention, Referral, Revenue; hợp để tìm điểm rơi trong phễu","HEART: Happiness, Engagement, Adoption, Retention, Task success; hợp để đo trải nghiệm một tính năng, đi kèm Goals, Signals, Metrics"]],
      ["h","Một chỉ số tốt cần"],
      ["ul",["Định nghĩa chính xác (\"người dùng hoạt động\" là làm gì, trong bao lâu)","Đo được và thay đổi đủ nhanh để ra quyết định","Khó bị làm đẹp giả tạo"]],
      ["warn",["Chọn chỉ số phù phiếm như lượt tải app, lượt xem trang","Chỉ nêu một chỉ số mà không có chỉ số đối trọng","Không định nghĩa rõ chỉ số"]],
      ["q",["North Star Metric của một app nghe nhạc là gì?","Đo thành công của tính năng bình luận trên một app thương mại điện tử thế nào?"]]
    ]},
    {id:"metrics-2", t:"Chẩn đoán khi chỉ số thay đổi", m:6, b:[
      ["p","\"Chỉ số X giảm 15%, bạn làm gì?\" là dạng câu rất phổ biến. Người phỏng vấn muốn thấy bạn có hệ thống, không đoán mò."],
      ["ol",["Làm rõ: giảm so với khi nào, đo thế nào, giảm đột ngột hay từ từ.","Kiểm tra dữ liệu: lỗi tracking, đổi định nghĩa, bản phát hành mới làm hỏng log.","Yếu tố bên ngoài: mùa vụ, lễ Tết, thời tiết, đối thủ khuyến mãi, sự cố cổng thanh toán.","Khoanh vùng: theo nền tảng, phiên bản app, khu vực, người dùng mới hay cũ, bước nào trong phễu.","Đặt giả thuyết theo thứ tự khả năng và cách kiểm chứng từng cái.","Đề xuất hành động ngắn hạn và dài hạn."]],
      ["p","Phân rã chỉ số thành các thành phần cũng rất hữu ích: doanh thu = số người dùng × tỉ lệ mua × giá trị đơn trung bình. Thành phần nào thay đổi sẽ chỉ ra hướng điều tra."],
      ["ex","Đơn hàng app giao đồ ăn giảm 15%. Sau khi loại lỗi tracking, bạn thấy chỉ người dùng Android bản mới giảm, và rơi ở bước thanh toán. Giả thuyết mạnh nhất là lỗi trong bản cập nhật luồng thanh toán, nên đề xuất rollback hoặc hotfix, đồng thời đặt cảnh báo tự động cho tỉ lệ thanh toán thành công."],
      ["warn",["Đưa ra nguyên nhân ngay từ câu đầu","Không kiểm tra dữ liệu trước","Liệt kê nhiều giả thuyết nhưng không ưu tiên"]]
    ]},
    {id:"metrics-3", t:"A/B test căn bản cho PM", m:5, b:[
      ["p","A/B test chia người dùng ngẫu nhiên thành nhóm đối chứng và nhóm thử nghiệm để biết một thay đổi có thật sự tạo khác biệt hay không."],
      ["h","Thiết kế một test"],
      ["ol",["Giả thuyết: thay đổi X sẽ làm chỉ số Y tăng vì lý do Z.","Một chỉ số chính và vài chỉ số đối trọng.","Đơn vị chia nhóm: thường theo người dùng, không theo lượt xem.","Tính trước cỡ mẫu và thời gian chạy, thường ít nhất trọn một đến hai tuần để gồm cả ngày thường và cuối tuần.","Đặt tiêu chí quyết định trước khi xem kết quả."]],
      ["h","Bẫy hay gặp"],
      ["ul",["Nhìn trộm và dừng sớm: thấy kết quả đẹp là dừng làm tăng khả năng kết luận sai","Hiệu ứng mới lạ: người dùng tò mò lúc đầu rồi quay lại thói quen cũ","Theo dõi quá nhiều chỉ số: kiểu gì cũng có một chỉ số \"có ý nghĩa\" chỉ do ngẫu nhiên","Hiệu ứng lan tỏa: ở marketplace, thay đổi cho nhóm A có thể ảnh hưởng nhóm B"]],
      ["p","Không phải lúc nào cũng nên A/B test: khi lượng người dùng quá ít, khi thay đổi mang tính chiến lược dài hạn, hoặc khi đối xử khác nhau giữa các nhóm là không phù hợp về đạo đức."],
      ["q",["Test tăng chuyển đổi 3% nhưng sau hai tuần hiệu quả biến mất. Vì sao?","Khi nào bạn không chạy A/B test?"]]
    ]},
    {id:"metrics-4", t:"North Star Metric và cây chỉ số", m:6, b:[
      ["p", "North Star Metric (NSM) là chỉ số duy nhất mà cả công ty dùng để biết sản phẩm có đang mang lại giá trị cho người dùng hay không. Nhưng một con số thì không ai tác động trực tiếp được. Cây chỉ số (metric tree) giúp bẻ NSM thành các nhánh nhỏ mà từng đội có thể nhận về và cải thiện."],
      ["h", "Một NSM tốt trông như thế nào"],
      ["ul", ["Phản ánh giá trị người dùng nhận được, không chỉ doanh thu: ví dụ số giao dịch thanh toán thành công mỗi tuần thay vì tổng phí thu được", "Là chỉ số dẫn trước (leading) cho doanh thu dài hạn: nếu NSM tăng bền vững thì doanh thu thường đi theo", "Có khung thời gian rõ: theo tuần hoặc tháng, phù hợp với tần suất sử dụng tự nhiên của sản phẩm", "Dễ hiểu với mọi người trong công ty, từ kỹ sư đến kinh doanh", "Khó làm đẹp giả tạo: đếm \"đơn giao thành công\" tốt hơn \"đơn được tạo\""]],
      ["h", "Cách dựng cây chỉ số"],
      ["ol", ["Đặt NSM ở gốc và viết rõ định nghĩa.", "Phân rã thành các thành phần nhân hoặc cộng với nhau, ví dụ: người dùng hoạt động × số lần dùng mỗi người.", "Tiếp tục tách mỗi thành phần đến khi chạm tới chỉ số mà một đội có thể tác động trong một quý: tỉ lệ kích hoạt, tỉ lệ quay lại, tỉ lệ chuyển đổi ở một bước.", "Gắn mỗi nhánh với một đội sở hữu và vài chỉ số đối trọng.", "Kiểm tra lại: nếu mọi nhánh lá đều tăng thì NSM có tăng không? Nếu không, cây đang thiếu hoặc sai."]],
      ["ex", "Ví điện tử, NSM giả định: số người dùng có ít nhất một giao dịch thanh toán thành công trong tuần.\nNSM = người dùng mới kích hoạt + người dùng cũ còn giữ chân + người dùng quay lại.\nNhánh người dùng mới: lượt tải × tỉ lệ hoàn tất eKYC × tỉ lệ liên kết ngân hàng × tỉ lệ có giao dịch đầu tiên trong 7 ngày.\nNhánh giữ chân: phụ thuộc vào số trường hợp dùng (nạp điện thoại, trả hóa đơn, quét QR tại cửa hàng).\nĐội onboarding nhận tỉ lệ hoàn tất eKYC; đội thanh toán tại cửa hàng nhận số giao dịch QR mỗi người dùng. Chỉ số đối trọng: tỉ lệ gian lận và tỉ lệ giao dịch lỗi."],
      ["tip", "Trong phỏng vấn, chỉ cần vẽ 2 đến 3 tầng của cây là đủ. Điều quan trọng là cho thấy bạn biết đi từ chỉ số tổng xuống chỉ số mà một đội thật sự hành động được."],
      ["warn", ["Chọn doanh thu hoặc GMV làm NSM mà không giải thích giá trị cho người dùng", "Chọn chỉ số tích lũy như tổng số người đăng ký, vốn chỉ có thể tăng", "Phân rã cây nhưng các nhánh không cộng hoặc nhân lại thành gốc", "Giao cùng một nhánh lá cho nhiều đội mà không rõ ai chịu trách nhiệm"]],
      ["q", ["NSM của một app gọi xe công nghệ là gì? Hãy phân rã nó thành cây chỉ số.", "Khi nào một công ty nên đổi North Star Metric?", "NSM của bạn tăng nhưng doanh thu giảm. Bạn giải thích thế nào?"]]
    ]},
    {id:"metrics-5", t:"Phân tích funnel và tỉ lệ chuyển đổi", m:6, b:[
      ["p", "Funnel (phễu) mô tả chuỗi bước người dùng đi qua để đạt một mục tiêu, như từ mở app đến đặt hàng thành công. Phân tích funnel giúp bạn biết người dùng rơi ở đâu, rơi bao nhiêu, và nên ưu tiên sửa bước nào trước."],
      ["h", "Dựng funnel cho đúng"],
      ["ol", ["Xác định điểm kết thúc là giá trị thật: đơn thanh toán thành công, không phải bấm nút \"Đặt hàng\".", "Liệt kê các bước theo hành trình thực tế, thường 4 đến 6 bước. Quá nhiều bước làm mất trọng tâm.", "Chọn đơn vị đếm: theo người dùng hay theo phiên. Theo người dùng phản ánh hành vi tốt hơn; theo phiên hợp với việc tối ưu từng lượt mua.", "Chọn cửa sổ thời gian: người dùng phải đi hết funnel trong bao lâu thì mới tính, ví dụ trong cùng ngày hoặc trong 7 ngày.", "Tính tỉ lệ chuyển đổi từng bước và tỉ lệ tổng từ đầu đến cuối."]],
      ["h", "Đọc funnel để ra quyết định"],
      ["ul", ["Bước có tỉ lệ rơi lớn nhất chưa chắc là bước nên sửa trước: hãy nhân với số người đi qua và độ khó khi sửa", "So sánh theo phân khúc: người dùng mới với cũ, Android với iOS, thành phố lớn với tỉnh, nguồn quảng cáo khác nhau", "Ghép với dữ liệu định tính: xem ghi hình phiên, đọc phản hồi, phỏng vấn người dùng để hiểu vì sao họ rời", "Nhớ rằng tối ưu một bước có thể chỉ đẩy người dùng chất lượng thấp xuống bước sau, nên luôn nhìn tỉ lệ tổng"]],
      ["ex", "Funnel giả định của một sàn thương mại điện tử, đếm theo người dùng trong 1 ngày:\nXem sản phẩm 100% → thêm vào giỏ 30% → vào trang thanh toán 18% → chọn phương thức thanh toán 15% → thanh toán thành công 10%.\nBước thêm vào giỏ rơi nhiều nhất, nhưng đó là hành vi bình thường khi người dùng đang tham khảo. Bước đáng chú ý là từ chọn phương thức đến thành công: một phần ba người dùng đã quyết mua nhưng thất bại. Khi tách theo phương thức, bạn thấy thẻ nội địa có tỉ lệ lỗi OTP cao. Đây là chỗ sửa nhanh và tác động lớn."],
      ["warn", ["Đếm lẫn người dùng và phiên trong cùng một funnel", "Bỏ qua người dùng đi tắt hoặc quay lại bước trước, làm funnel sai lệch", "Chỉ nhìn tỉ lệ trung bình mà không tách theo phân khúc", "Kết luận nguyên nhân chỉ từ số liệu, không kiểm chứng bằng nghiên cứu người dùng"]],
      ["q", ["Tỉ lệ chuyển đổi ở trang thanh toán của app giao đồ ăn thấp. Bạn phân tích thế nào?", "Bạn sẽ dựng funnel onboarding cho một app ngân hàng số như thế nào?", "Tỉ lệ chuyển đổi tổng tăng nhưng doanh thu không đổi. Có thể vì sao?"]]
    ]},
    {id:"metrics-6", t:"Retention và phân tích cohort", m:7, b:[
      ["p", "Retention (giữ chân) cho biết người dùng có quay lại sau lần đầu hay không. Nó thường là tín hiệu rõ nhất về product-market fit: thu hút người dùng mới thì có thể mua bằng quảng cáo, còn giữ họ ở lại thì chỉ sản phẩm tốt mới làm được."],
      ["h", "Đo retention bằng cohort"],
      ["ul", ["Cohort là nhóm người dùng có chung thời điểm bắt đầu, ví dụ cùng đăng ký trong một tuần", "Retention ngày N: phần trăm người trong cohort quay lại đúng vào ngày hoặc tuần thứ N", "Retention dạng không giới hạn (unbounded): phần trăm quay lại vào ngày N hoặc bất kỳ lúc nào sau đó, hợp với sản phẩm dùng không đều", "Bảng cohort: mỗi hàng là một cohort, mỗi cột là một mốc thời gian; đọc theo hàng để thấy một nhóm suy giảm thế nào, đọc theo cột để thấy các nhóm mới có tốt hơn nhóm cũ không", "Định nghĩa \"quay lại\" phải là hành động có giá trị, như đặt một đơn, không chỉ mở app"]],
      ["h", "Đọc đường cong retention"],
      ["ul", ["Đường cong đi ngang ở một mức (flatten) nghĩa là có một nhóm người dùng tìm thấy giá trị lâu dài; đó là dấu hiệu tốt", "Đường cong tiếp tục giảm về gần 0 nghĩa là sản phẩm chưa giữ được ai, tăng quảng cáo lúc này chỉ đốt tiền", "Đường cong của các cohort mới nằm cao hơn cohort cũ cho thấy các cải tiến đang có tác dụng", "Chọn mốc đo theo tần suất tự nhiên: app giao đồ ăn có thể đo theo tuần, app đặt vé máy bay nên đo theo quý hoặc năm"]],
      ["ex", "App giao đồ ăn, bảng cohort giả định theo tuần đăng ký, retention theo tuần có đặt ít nhất một đơn:\nCohort tháng 1: tuần 1 là 40%, tuần 4 là 18%, tuần 8 là 12%, tuần 12 là 11%.\nCohort tháng 3: tuần 1 là 42%, tuần 4 là 24%, tuần 8 là 17%, tuần 12 là 16%.\nCả hai đường đều đi ngang từ khoảng tuần 8, nghĩa là có nhóm khách quen ổn định. Cohort tháng 3 tốt hơn rõ ở tuần 4. Bạn kiểm tra và thấy tháng 3 có ra mắt voucher cho đơn thứ hai. Câu hỏi tiếp theo: nhóm này giữ được khi hết voucher không, hay chỉ là retention mua bằng tiền?"],
      ["tip", "Khi được hỏi \"retention giảm\", hãy hỏi ngay: giảm ở cohort nào, ở mốc thời gian nào. Giảm ở tuần đầu thường là vấn đề onboarding hoặc chất lượng nguồn người dùng; giảm ở các tuần sau thường là vấn đề giá trị cốt lõi hoặc đối thủ."],
      ["warn", ["Dùng DAU hoặc MAU tổng thay cho retention: người dùng mới đổ vào có thể che lấp việc người cũ bỏ đi", "Định nghĩa quay lại quá lỏng, như mở app vì nhận thông báo", "So sánh các cohort có nguồn người dùng khác nhau mà không tách ra", "Chọn mốc đo không hợp tần suất tự nhiên của sản phẩm"]],
      ["q", ["Retention tuần 1 của app giảm từ 40% xuống 32%. Bạn điều tra thế nào?", "Làm sao biết một sản phẩm đã có product-market fit từ dữ liệu retention?", "Bạn sẽ đo retention cho một app đặt khách sạn như thế nào?"]]
    ]},
    {id:"metrics-7", t:"A/B test nâng cao: cỡ mẫu, ý nghĩa thống kê và các bẫy", m:7, b:[
      ["p", "Khi đã nắm A/B test căn bản, câu hỏi phỏng vấn ở mức cao hơn thường xoáy vào ba chuyện: cần bao nhiêu người dùng, đọc kết quả thống kê thế nào cho đúng, và nhận ra khi nào kết quả không đáng tin. PM không cần tự tính công thức, nhưng phải hiểu các khái niệm đủ để đặt câu hỏi đúng với đội dữ liệu."],
      ["h", "Cỡ mẫu phụ thuộc vào gì"],
      ["ul", ["MDE (minimum detectable effect): mức thay đổi nhỏ nhất bạn muốn phát hiện. Muốn phát hiện thay đổi càng nhỏ thì cần càng nhiều người dùng, gần như theo bình phương: giảm MDE đi một nửa thì cần khoảng gấp bốn lần mẫu", "Tỉ lệ nền (baseline): chỉ số hiện tại. Chỉ số có tỉ lệ rất thấp, như tỉ lệ mua bảo hiểm trong app, thường cần mẫu lớn", "Độ dao động của chỉ số: chỉ số như giá trị đơn hàng dao động mạnh nên cần nhiều mẫu hơn chỉ số dạng có hoặc không", "Mức ý nghĩa và power: thường chọn mức ý nghĩa 5% và power 80%, nghĩa là chấp nhận 5% khả năng báo động giả và 20% khả năng bỏ sót một tác động có thật"]],
      ["h", "Đọc kết quả cho đúng"],
      ["ul", ["p-value nhỏ hơn 0,05 không có nghĩa là \"95% chắc chắn giả thuyết đúng\". Nó có nghĩa: nếu thật sự không có khác biệt, khả năng thấy kết quả chênh lệch cỡ này hoặc hơn là dưới 5%", "Không có ý nghĩa thống kê không có nghĩa là không có tác động; có thể test thiếu mẫu để phát hiện", "Hãy nhìn khoảng tin cậy, không chỉ p-value: tăng 2%, khoảng từ 0,1% đến 3,9% khác rất nhiều so với tăng 2%, khoảng từ 1,8% đến 2,2%", "Có ý nghĩa thống kê chưa chắc có ý nghĩa kinh doanh: tăng 0,1% có thể không đáng chi phí bảo trì tính năng"]],
      ["h", "Các bẫy nâng cao"],
      ["ul", ["Sample ratio mismatch (SRM): chia 50/50 nhưng thực tế ra 52/48. Thường do lỗi gán nhóm hoặc lỗi log, và khi đó kết quả không đáng tin", "Đơn vị chia khác đơn vị phân tích: chia theo người dùng nhưng tính tỉ lệ theo phiên làm sai độ dao động", "Nghịch lý Simpson: tổng thể nhóm B tốt hơn nhưng trong từng phân khúc lại kém hơn, do tỉ lệ phân khúc giữa hai nhóm khác nhau", "Cắt phân khúc sau khi xem kết quả để tìm \"nhóm thắng\": cũng là một dạng so sánh nhiều lần, dễ ra kết luận ngẫu nhiên"]],
      ["ex", "Ngân hàng số test màn hình mở tài khoản mới. Tỉ lệ nền hoàn tất là 20% (giả định), đội muốn phát hiện mức tăng tương đối 5%, tức lên 21%. Đội dữ liệu ước tính cần khoảng vài chục nghìn người dùng mỗi nhóm, mà lượng người dùng mới chỉ đủ chạy trong 5 tuần.\nPM có ba lựa chọn: chấp nhận chạy 5 tuần; tăng MDE lên 10% nếu thật sự chỉ quan tâm thay đổi lớn; hoặc đổi chỉ số chính sang một bước sớm hơn trong luồng, có tỉ lệ cao hơn và cần ít mẫu hơn, kèm chỉ số hoàn tất làm chỉ số theo dõi."],
      ["warn", ["Diễn giải p-value như xác suất giả thuyết đúng", "Kết luận \"không có tác dụng\" từ một test thiếu mẫu", "Bỏ qua kiểm tra SRM trước khi đọc kết quả", "Chạy test xong rồi mới đặt MDE hoặc chọn chỉ số chính"]],
      ["q", ["Test cho kết quả p-value 0,04 với mức tăng 0,2%. Bạn có ra mắt không?", "Lượng người dùng quá ít để chạy A/B test trong thời gian hợp lý. Bạn làm gì?", "Nhóm thử nghiệm có 52% người dùng thay vì 50%. Điều đó nói lên gì?"]]
    ]},
    {id:"metrics-8", t:"Đặt mục tiêu và OKR cho đội sản phẩm", m:6, b:[
      ["p", "Chỉ số chỉ có ý nghĩa khi gắn với mục tiêu. OKR (Objectives and Key Results) là cách nhiều công ty công nghệ ở Việt Nam dùng để thống nhất đội sản phẩm nên tập trung vào đâu trong một quý. Người phỏng vấn hay hỏi bạn đặt OKR cho một tình huống cụ thể, để xem bạn có phân biệt được kết quả với đầu việc không."],
      ["h", "Cấu trúc một OKR tốt"],
      ["ul", ["Objective: câu định tính, truyền cảm hứng, nói rõ điều muốn đạt và vì sao, ví dụ \"Giúp người dùng mới tin tưởng thanh toán lần đầu\"", "Key Results: 2 đến 4 kết quả đo được, có mốc bắt đầu và mục tiêu, ví dụ \"Tăng tỉ lệ người dùng mới có giao dịch đầu tiên trong 7 ngày từ X% lên Y%\"", "Key Result là kết quả (outcome), không phải đầu ra (output): \"ra mắt tính năng hoàn tiền\" là đầu việc; \"giảm tỉ lệ khiếu nại giao dịch lỗi\" là kết quả", "Nên có ít nhất một Key Result đối trọng để tránh đạt mục tiêu bằng cách làm hỏng thứ khác", "Mức tham vọng: OKR thử thách thường được coi là tốt khi đạt khoảng 70%; nếu luôn đạt 100%, có thể mục tiêu đang quá an toàn"]],
      ["h", "Đặt mục tiêu con số thế nào"],
      ["ol", ["Lấy mốc hiện tại và xu hướng tự nhiên: nếu không làm gì, chỉ số sẽ đi đến đâu cuối quý.", "Ước lượng tác động của các sáng kiến dự kiến, dựa vào test cũ hoặc sản phẩm tương tự.", "So với mục tiêu cấp trên trong cây chỉ số: nhánh của bạn cần đóng góp bao nhiêu.", "Chọn mức vừa đủ thách thức, ghi rõ giả định để cuối quý có thể rút kinh nghiệm."]],
      ["ex", "Đội sản phẩm của app giao đồ ăn, quý tới.\nObjective: Biến khách đặt lần đầu thành khách quen.\nKR1: Tăng tỉ lệ khách mới đặt đơn thứ hai trong 14 ngày từ 25% lên 32% (số liệu giả định).\nKR2: Giảm tỉ lệ đơn đầu tiên bị giao trễ quá 15 phút từ 12% xuống 8%.\nKR3 (đối trọng): Chi phí voucher trên mỗi khách mới giữ lại không tăng quá 10%.\nCác đầu việc như \"làm voucher đơn thứ hai\" hay \"ưu tiên tài xế cho đơn đầu tiên\" nằm trong kế hoạch, không phải trong Key Results."],
      ["warn", ["Viết Key Result là danh sách tính năng sẽ ra mắt", "Quá nhiều OKR khiến đội không biết ưu tiên gì", "Đặt con số mục tiêu không có mốc ban đầu hoặc không có giả định", "Gắn OKR trực tiếp với thưởng, khiến mọi người đặt mục tiêu an toàn"]],
      ["q", ["Hãy đặt OKR cho đội phụ trách tính năng tìm kiếm trên một sàn thương mại điện tử.", "Cuối quý đội bạn chỉ đạt 40% Key Result. Bạn xử lý thế nào?", "Phân biệt output và outcome, cho ví dụ."]]
    ]},
    {id:"metrics-9", t:"Unit economics cho PM: CAC, LTV và biên lợi nhuận", m:7, b:[
      ["p", "Unit economics trả lời câu hỏi: mỗi khách hàng hoặc mỗi đơn hàng mang lại lãi hay lỗ? Nhiều sản phẩm ở Việt Nam từng tăng trưởng nhanh nhờ khuyến mãi rồi phải thu hẹp khi tiền đốt không thu lại được. PM hiểu unit economics sẽ đưa ra quyết định sản phẩm có trách nhiệm hơn và trả lời tốt các câu hỏi về chiến lược."],
      ["h", "Các khái niệm cốt lõi"],
      ["ul", ["CAC (chi phí có được một khách hàng): tổng chi phí marketing và bán hàng chia cho số khách hàng mới trong kỳ. Nên tính cả voucher và hoa hồng giới thiệu cho khách mới", "Biên đóng góp mỗi đơn (contribution margin): doanh thu mỗi đơn trừ các chi phí biến đổi gắn với đơn đó, như phí tài xế, phí cổng thanh toán, khuyến mãi, chi phí hỗ trợ", "LTV (giá trị vòng đời khách hàng): tổng biên đóng góp một khách mang lại trong suốt thời gian họ dùng sản phẩm. Cách ước lượng đơn giản: biên đóng góp mỗi tháng × số tháng trung bình khách ở lại", "Tỉ lệ LTV/CAC: thường được nhắc mốc khoảng 3 lần là lành mạnh, nhưng tùy ngành và giai đoạn", "Thời gian hoàn vốn (payback period): bao nhiêu tháng thì biên đóng góp từ một khách bù lại CAC; càng ngắn càng ít rủi ro"]],
      ["h", "PM dùng unit economics ở đâu"],
      ["ul", ["Thiết kế khuyến mãi: voucher làm tăng đơn, nhưng có làm âm biên mỗi đơn không, và khách có ở lại khi hết voucher không", "Ưu tiên tính năng: tính năng tăng tần suất đặt hàng làm tăng LTV; tính năng giảm chi phí vận hành làm tăng biên", "Chọn phân khúc: khách ở một số khu vực hoặc kênh có thể có CAC thấp và LTV cao hơn hẳn", "Định giá: thay đổi phí dịch vụ ảnh hưởng cả biên lẫn retention, cần đo cả hai"]],
      ["ex", "App giao đồ ăn, số liệu giả định cho một thành phố.\nCAC: 150.000 đồng mỗi khách mới, gồm quảng cáo và voucher đơn đầu.\nBiên đóng góp mỗi đơn: 8.000 đồng sau khi trừ chi phí tài xế, thanh toán và khuyến mãi.\nKhách trung bình đặt 3 đơn mỗi tháng và ở lại 8 tháng: LTV khoảng 8.000 × 3 × 8 = 192.000 đồng.\nLTV/CAC chỉ khoảng 1,3 lần, thời gian hoàn vốn khoảng 6 tháng. Hướng cải thiện: giảm CAC bằng kênh giới thiệu bạn bè, tăng tần suất bằng gói thành viên, hoặc tăng biên bằng cách ghép đơn. PM nên chọn đòn bẩy nào dựa trên dữ liệu và thử nghiệm."],
      ["warn", ["Tính LTV bằng doanh thu thay vì biên lợi nhuận", "Tính CAC chỉ từ quảng cáo, bỏ qua voucher và chi phí giới thiệu", "Dùng LTV trung bình cho mọi kênh mà không tách theo nguồn khách", "Giả định retention quá lạc quan khi chưa có đủ dữ liệu cohort"]],

    {id:"metrics-10", t:"Tự phân tích dữ liệu: SQL và câu hỏi dữ liệu cơ bản cho PM", m:7, b:[
      ["p", "Nhiều công ty công nghệ ở Việt Nam kỳ vọng PM tự lấy được số liệu cơ bản mà không phải chờ đội dữ liệu. Một số vòng phỏng vấn còn có bài viết SQL ngắn hoặc yêu cầu bạn mô tả cách lấy dữ liệu để trả lời một câu hỏi. Bạn không cần là chuyên gia, nhưng cần đủ chắc để tự kiểm chứng giả thuyết và biết khi nào số liệu có vấn đề."],

      ["ul", ["SELECT, FROM, WHERE: lấy cột cần thiết, lọc theo thời gian, nền tảng, khu vực", "GROUP BY với COUNT, COUNT(DISTINCT), SUM, AVG: đếm người dùng, tính doanh thu theo nhóm", "JOIN: nối bảng người dùng với bảng đơn hàng; hiểu khác biệt giữa INNER JOIN và LEFT JOIN để không vô tình làm mất người dùng chưa có đơn", "CASE WHEN: tạo cột phân loại, ví dụ người dùng mới hay cũ", "Hàm ngày tháng: cắt theo ngày, tuần, tháng để làm xu hướng và cohort", "Subquery hoặc CTE (WITH): chia câu truy vấn dài thành các bước dễ đọc"]],
      ["h", "Quy trình trả lời một câu hỏi dữ liệu"],
      ["ol", ["Viết câu hỏi thành một câu rõ ràng, kèm quyết định mà câu trả lời sẽ ảnh hưởng.", "Định nghĩa chính xác chỉ số: ai được tính, hành động nào, khung thời gian nào.", "Xác định bảng và cột cần dùng, hỏi đội dữ liệu nếu không chắc bảng nào là nguồn chuẩn.", "Viết truy vấn từ nhỏ đến lớn, kiểm tra kết quả từng bước với vài dòng mẫu.", "Đối chiếu với một con số đã biết, như số đơn trên dashboard chính thức, để phát hiện sai lệch.", "Trình bày kết quả kèm giả định và giới hạn của dữ liệu."]],
      ["ex", "Câu hỏi: trong tháng trước, bao nhiêu phần trăm người dùng mới của sàn thương mại điện tử đặt đơn đầu tiên trong vòng 7 ngày?\nCách làm: lấy người dùng có ngày đăng ký trong tháng từ bảng users; LEFT JOIN với bảng orders, chỉ lấy đơn thành công; dùng CASE WHEN để đánh dấu người có đơn trong 7 ngày từ ngày đăng ký; tỉ lệ = COUNT(DISTINCT người được đánh dấu) chia cho COUNT(DISTINCT tất cả người dùng mới).\nNếu dùng INNER JOIN, người chưa có đơn bị loại khỏi mẫu số và tỉ lệ sẽ bị đẩy lên gần 100%. Đây là lỗi rất hay gặp."],

    ]}

      ["ex", "Ngân hàng số muốn ra mắt tính năng chia hóa đơn nhóm. Ước lượng đầy đủ là 3 sprint, nhưng mục tiêu là kịp dịp cuối năm.\nPM và tech lead thống nhất bản đầu: chia đều, chỉ cho người nhận cùng ngân hàng, nhắc nợ thủ công bằng một nút gửi thông báo. Chia theo tỷ lệ, người nhận khác ngân hàng và nhắc tự động để bản sau. Phạm vi còn khoảng một nửa, vẫn giải quyết được nhu cầu chính."],
