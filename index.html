  rounds: {
    hr:{name:"HR screen", title:"Recruiter", brief:"Initial screen: self-introduction, why this role, relevant product experience, ways of working. May ask why they're changing jobs."},
    sense:{name:"Product sense", title:"Head of Product", brief:"Test product thinking through a product design or improvement exercise. Probe target users, prioritization reasoning, trade-offs and measurement."},
    metrics:{name:"Analytics & metrics", title:"Data Lead", brief:"Test analytical thinking: choosing metrics, diagnosing metric changes, designing A/B tests. Provide hypothetical numbers when the candidate asks, or to challenge them."},
    execution:{name:"Prioritization & execution", title:"Engineering Manager", brief:"Test prioritization, handling delays and scope, working with engineering. Play an engineering manager with opinions who sometimes pushes back."},
    strategy:{name:"Strategy", title:"Director of Product", brief:"Test strategic thinking: product expansion, competition, markets, estimation."},
    ai:{name:"AI product", title:"ML Lead", brief:"Test understanding of building AI products: whether to use AI, evals, handling AI errors, cost and latency, safety. Play a pragmatic ML lead who raises technical constraints (little data, accuracy not yet high) to see how the candidate negotiates scope."},
    behavioral:{name:"Behavioral & culture", title:"VP Product", brief:"Behavioral questions in STAR format: conflict, failure, influence, decision-making. Probe for specifics about the candidate's own actions and results."},

  companies: {product:"a tech product company (e.g. e-wallet, e-commerce)", startup:"an early-stage tech startup", fintech:"a digital bank or fintech", global:"a multinational tech company"},
  companyShort: {product:"Product company", startup:"Startup", fintech:"Digital bank / fintech", global:"Multinational company"},
  styles: {friendly:"friendly and encouraging, but still thorough", neutral:"professional and neutral", tough:"tough, rapid-fire, often challenging assumptions"},
  styleShort: {friendly:"Friendly", neutral:"Neutral", tough:"Tough"},
  quizCats: {llm:"LLM fundamentals", eval:"Quality evaluation", design:"AI product design", cost:"Cost & operations", safety:"Safety & data", use:"Using AI at work"},
  askChips: ["Give me another example with a well-known product","How would an interviewer probe this part?","Explain it again more briefly","How does this apply to the JD I'm targeting?"],
  quizBank: [
    {c:"llm", q:"What does it mean when an LLM \"hallucinates\"?", o:["It produces plausible-sounding information that is wrong or unsupported","It responds unusually slowly because of infrastructure load","It refuses to answer questions considered sensitive","It repeats passages from its training data word for word"], a:0, x:"Hallucination is when the model confidently produces false or made-up content. PMs need to design to detect and reduce it, for example with citations or by allowing \"I don't know\"."},
    {c:"llm", q:"What is a model's \"context window\"?", o:["The maximum amount of text (in tokens) the model reads and writes in one call","The maximum time in seconds a single request is allowed to run","The number of users the model can serve at the same time","The date after which the model's training knowledge stops"], a:0, x:"The context window limits how much instruction, documents, history and answer fit in one call. It shapes design (summarize, truncate or use RAG) and cost."},
    {c:"llm", q:"A chatbot must answer based on internal policies that change weekly. What is the most sensible first approach?", o:["RAG: retrieve the relevant document passages and put them in the prompt","Fine-tune the model again every week on the new policies","Train a dedicated model from scratch on company documents","Raise the temperature so the model adapts more flexibly"], a:0, x:"Frequently changing knowledge suits RAG: updating the documents is enough, and answers can cite sources. Fine-tuning is costly and a poor way to inject changing knowledge."},
    {c:"llm", q:"Raising the temperature parameter usually changes the output how?", o:["More varied and random","More accurate","Shorter","Cheaper"], a:0, x:"High temperature gives more varied output, good for creative tasks. Tasks needing consistency (extraction, classification) usually use low temperature."},
    {c:"llm", q:"How does an \"AI agent\" mainly differ from a regular Q&A chatbot?", o:["It plans and calls tools over multiple steps to achieve a goal","It talks by voice instead of only reading and writing text","It always runs on a larger model, so it answers more accurately","It is custom-trained, so it needs no prompt or instructions"], a:0, x:"Agents take actions: calling APIs, reading data, doing multiple steps. That raises risk and requires designing permissions, confirmations and undo."},
    {c:"eval", q:"Before launching an AI document-summary feature, what is the most important thing a PM needs?", o:["A representative test set with clear scoring criteria","A table comparing the price and speed of available models","An impressive demo to convince leadership to approve budget","A very long prompt that lists every possible situation"], a:0, x:"Without an eval you don't know how good the feature is, or whether later changes make it better or worse."},
    {c:"eval", q:"Fraud detection: missing fraud is very costly, while a false alarm only needs a staff member to re-check. Which metric should you prioritize?", o:["High recall","High precision","Low latency","Overall accuracy"], a:0, x:"High recall means catching more real fraud, accepting a few more false alarms. Choose metrics based on the cost of each kind of error."},
    {c:"eval", q:"You use another LLM to grade outputs (LLM-as-judge). What is the main risk?", o:["The judge also has biases and can be wrong, so compare it with human graders regularly","It cannot grade outputs written in Vietnamese or other languages","It is always more expensive than paying human graders","It cannot be used for long documents or long answers"], a:0, x:"LLM-as-judge makes grading at scale fast, but you must check agreement with human graders and calibrate the criteria."},
    {c:"eval", q:"A model scores 95% on the test set but users complain a lot. What is the most likely cause?", o:["The test set doesn't represent real data and usage","The model is hitting random errors in production","Users are not yet used to the new feature","A larger model is needed"], a:0, x:"Look at real logs and feedback, and add real cases to the test set. Sometimes results are correct but the experience is still poor (slow, hard to trust, wrong place in the flow)."},
    {c:"eval", q:"You just changed the prompt to fix a bug users reported. What should you do next?", o:["Rerun the full eval set to make sure no other cases broke","Ship right away since the reported bug is now fixed","Ask the model itself whether the new prompt is better","Increase the output token limit to give more room"], a:0, x:"Fixing one place can break another (regression). An eval set is like automated tests for an AI feature."},
    {c:"design", q:"Which problem is LEAST suited to an LLM?", o:["Calculating transaction fees from a fixed fee schedule","Summarizing customer feedback","Classifying support tickets","Drafting email replies to customers"], a:0, x:"Rule-based calculations need perfect accuracy and already have simple solutions. An LLM adds cost and risk of errors."},
    {c:"design", q:"An AI assistant advising on insurance products can be wrong. Which design best reduces risk?", o:["Cite sources, limit the scope, and hand complex questions to a human","Don't tell users it's AI, so they trust the answers more","Always answer at great length, listing every clause so nothing is missed","Turn off user feedback so wrong answers don't get exposed"], a:0, x:"Transparency, a limited scope and an exit path to a human are baseline measures in high-risk domains."},
    {c:"design", q:"Why collect likes/dislikes or user edits on AI output?", o:["To get quality signals and data to improve the system","To make the interface look more modern","Because the law requires it","To cut token costs immediately"], a:0, x:"User feedback is an online eval source and improvement data, the basis of a data flywheel."},
    {c:"design", q:"An AI feature takes about 20 seconds to return a result. Which UX improvement makes most sense?", o:["Stream results progressively and show a progress status","Hide the button until the result is ready","Remove the feature","Ask users to reload the page"], a:0, x:"Streaming and progress indicators make the wait more bearable. In parallel, consider a faster model for simple steps."},
    {c:"design", q:"Where does the most durable competitive advantage of an AI product usually come from?", o:["Proprietary data, workflows and being embedded in customers' daily work","Always switching to the most powerful model just released on the market","A carefully crafted set of prompts kept strictly secret","A nicer, smoother interface with more effects than competitors"], a:0, x:"Models and prompts are easy to copy or surpass. Proprietary data and a place in the customer's workflow are much harder to copy."},
    {c:"cost", q:"What mainly drives the cost of an LLM API call?", o:["Input and output tokens and the model's price","The number of characters on the interface","How many times users log in","The size of users' profile pictures"], a:0, x:"Most providers charge per token, with output usually pricier than input. PMs should estimate tokens per task when working out unit economics."},
    {c:"cost", q:"Which approach usually does NOT reduce the cost of an LLM feature?", o:["Sending the full conversation history with every call","Using a smaller model for simple tasks","Caching repeated answers","Trimming the context you send"], a:0, x:"Sending the full history makes input tokens grow continuously. It's usually better to summarize or keep only what's relevant."},
    {c:"cost", q:"1 million calls per month, about 2,000 tokens per call, assumed price 1 USD per 1 million tokens. Estimated cost?", o:["About 2,000 USD","About 200 USD","About 20,000 USD","About 2 USD"], a:0, x:"1,000,000 × 2,000 = 2 billion tokens, i.e. 2,000 × 1 million tokens, times 1 USD ≈ 2,000 USD."},
    {c:"safety", q:"What is \"prompt injection\"?", o:["Input content (web pages, emails, documents) containing instructions that make the model do unintended things","A technique for speeding up model inference","A syntax error inside a prompt","A way to fine-tune a model"], a:0, x:"This risk is especially serious for agents that can take actions. Treat external data as data, not commands, and limit permissions."},
    {c:"safety", q:"An employee wants to paste customer data into a public AI tool for analysis. What should the PM do?", o:["Check data policies, anonymize, or use a company-approved tool","Allow it, since faster analysis outweighs the risk","Ban every employee from using any AI tool to be safe","Just delete the customer name column before pasting; that's safe enough"], a:0, x:"Personal data must follow regulations and internal policy. Removing names alone is often not enough, since other fields can still identify people."},
    {c:"safety", q:"An AI credit-scoring model shows clear differences in outcomes between regions. What should you do first?", o:["Analyze bias, check the data and fairness criteria before scaling","Keep it as is, since the model just objectively reflects historical data","Raise the approval threshold for all customers to reduce overall risk","Switch to a larger model so the results become more accurate and fair"], a:0, x:"Models learn from historical data and can reproduce its biases. For decisions affecting people, assess fairness before rolling out widely."},
    {c:"use", q:"Which prompt is most likely to produce the best PRD draft?", o:["Give product context, users, goals, constraints, the desired format and an example","\"You are the best PM in the world. Write a PRD for the new feature.\"","\"Write a really good, professional PRD with every section needed.\"","Paste all 50 pages of project documents and let the AI figure out what's needed"], a:0, x:"A good prompt is like a good brief for a colleague: enough context, clear goals and a specific output format."},
    {c:"use", q:"You used AI to group 200 pieces of user feedback into themes. What's the most important step before using the result?", o:["Spot-check by comparing against the original feedback","Put the largest themes straight into next quarter's roadmap","Ask the AI to rate its own confidence in the grouping","Run it two more times and keep the most frequent result"], a:0, x:"AI can mis-group, miss small but important themes, or exaggerate. The PM remains responsible for the conclusions."},
    {c:"use", q:"What is the most sensible way to use AI when preparing user interviews?", o:["Have AI suggest and review questions to avoid leading ones, but still interview real users","Have AI role-play users and treat its answers as insights","Skip interviews since AI already knows enough about users","Use AI to generate extra simulated answers so the report has a bigger sample"], a:0, x:"AI speeds up preparation but cannot replace insights from real users. Using fabricated data as insight is a serious distortion."}
  ],
  lessons: {
    sense: [
      {id:"sense-1", t:"A framework for product design questions", m:6, b:[
        ["p","Product sense questions (designing a new product or improving an existing one) test how you think and have no single right answer. Interviewers want to see you move from problem to solution with reasons, not list features."],
        ["h","A suggested sequence"],
        ["ol",["Clarify: what is the goal (users, retention or revenue), scope, platform, constraints. State assumptions out loud.","Users: list a few groups, pick one to focus on and explain why.","Needs and pain points: describe that group's journey and identify the 2 to 3 biggest problems.","Prioritize a problem: choose one based on severity, frequency and the agreed goal.","Solutions: propose 2 to 3 different directions, including at least one bold idea.","Trade-offs: compare impact, effort and risk, then choose one.","Measurement: a primary metric and a counter metric.","Summary: recap the user, problem, solution and measurement in 3 to 4 sentences."]],
        ["p","This is the CIRCLES framework in an easy-to-remember form. Use it as a mental checklist; good interviewers dislike candidates who recite each step by name."],
        ["ex","Prompt: design an appointment-booking app for elderly people.\nYou ask: public or private hospital, is the goal to cut waiting time or to increase online bookings? Then you notice two groups: elderly people booking for themselves, and their children booking for them. You choose the children because they're comfortable with smartphones and usually handle this, while the elderly still get reminders by phone call or chat."],
        ["warn",["Jumping into features before asking about the goal","Trying to serve every user at once","Offering only one solution with no trade-offs","Forgetting to say how you'd measure success"]],
        ["q",["Design a product for first-time pet owners.","How would you improve a maps app for motorbike riders in Vietnam?"]]
      ]},
      {id:"sense-2", t:"Understanding users: segments, JTBD and pain points", m:5, b:[
        ["p","Much of the score on a product sense question depends on how deeply you understand users. Good solutions usually come from a sharp insight about users."],
        ["h","Segment by behavior"],
        ["p","Instead of \"students, office workers\", segment by how people use the product: frequency, purpose, context. For a food delivery app: people ordering office lunch every day, families ordering on weekends, late-night snackers."],
        ["h","Jobs To Be Done"],
        ["p","Ask \"what job does the user hire this product to do?\". Someone ordering office lunch doesn't just need food; they need a quick, decent lunch without having to think. So \"one-tap reorder of a usual meal\" fits better than \"add 100 new restaurants\"."],
        ["h","Choosing a group to focus on"],
        ["ul",["Size: is the group big enough","Severity: is the problem genuinely painful and frequent","Strategic fit: does serving this group help the company's goals","Gap: have competitors already served this group well"]],
        ["warn",["Segmenting only by age and gender","Describing pain vaguely, like \"inconvenient\" or \"time-consuming\", without saying when and why"]],
        ["q",["Who is the most important user of an e-wallet? Why?"]]
      ]},
      {id:"sense-3", t:"Improving products and MVP thinking", m:5, b:[
        ["p","With \"improve product X\", interviewers want to see that you understand who the product serves, where it's winning, and where the biggest opportunity lies."],
        ["ol",["Say who the product is for and what its core value is.","Infer the company's current goal (growth, retention, monetization).","Pick one user group and one problem backed by evidence (experience, store reviews, observation).","Propose solutions, pick one, and describe a small test.","Success metrics."]],
        ["h","MVP for learning fast"],
        ["p","An MVP is the smallest version that validates the riskiest assumption. Before building, state what that assumption is: do users want it, will they pay, is it technically feasible. Sometimes an MVP is just a sign-up page, a fake door button, or manual work behind the scenes (concierge)."],
        ["ex","Want to add haircut booking to a ride-hailing app? Before building a booking system, put a banner leading to a sign-up form in one district, and have staff confirm bookings manually by phone for two weeks to see real demand."],
        ["warn",["Proposing what you like instead of what users need","An MVP so big it takes months before you learn anything"]]
      ]},
      {id:"sense-4", t:"Evaluating and choosing solutions: trade-offs and criteria", m:6, b:[
        ["p", "Coming up with 3 ideas isn't enough. What interviewers watch most closely is the moment you pick one and explain why you dropped the others. This is a skill PMs use every day when building a roadmap."],
        ["h", "Criteria for comparison"],
        ["ul", ["Impact: how well it solves the chosen problem and how many users it affects", "Effort: how many teams, how long, whether it depends on partners", "Confidence: is there evidence users need it, or is it just a hunch", "Risk: legal, fraud, brand damage, hurting other metrics", "Strategic fit: does it strengthen the company's advantage, or just copy a competitor"]],
        ["p", "You don't need a detailed RICE score in an interview. Just keep a small mental table with the 2 to 3 criteria that matter most for the agreed goal, and say out loud how you weigh them."],
        ["h", "Talking about trade-offs convincingly"],
        ["ol", ["Restate the goal and the problem, because the criteria depend on them.", "Compare ideas on the same criteria; don't praise one on one criterion and criticize another on a different one.", "Pick one and say clearly what you're willing to give up.", "Say what would make you change your choice, for example if a test shows users don't come back."]],
        ["ex", "Prompt: reduce cart abandonment on an e-commerce app.\nThree ideas: (A) allow COD on higher-value orders, (B) save the cart and send a reminder notification, (C) a simple buy-now-pay-later option.\nYou pick B first: low effort, easy to A/B test, low risk. C may have bigger impact but needs a financial partner and bad-debt controls, so it belongs in a later phase. A raises conversion but may increase refused deliveries, so you'd track the failed-delivery rate alongside it."],
        ["tip", "Saying \"I accept trade-off X in exchange for Y\" sounds far more mature than \"This idea is the best\"."],
        ["warn", ["Choosing the idea you like most with no criteria", "Only listing the strengths of the chosen idea, never where it falls short", "Using different criteria for each idea", "Ignoring operating costs and fraud risk"]],
        ["q", ["You have 3 ideas but the team can only build one this quarter. How do you choose?", "Tell me about a time you had to drop a feature you believed in."]]
      ]},
      {id:"sense-5", t:"The \"favorite product\" question and how to analyze a product", m:6, b:[
        ["p", "\"What's your favorite product and why?\" sounds easy but often gets answered like a product review. Interviewers want to see you look at a product through a PM's eyes: who it serves, what job it does, why it wins and where it could be better."],
        ["h", "Which product to pick"],
        ["ul", ["Pick a product you actually use and understand deeply, even a small app or a physical object", "Avoid the interviewing company's own product unless you know it very well, since they know more than you", "A product with interesting design choices is easier to talk about than one everyone praises"]],
        ["h", "An analysis framework"],
        ["ol", ["Users and job: who the product is for and what job it does.", "Why it wins: one or two specific design decisions, compared with the old way or competitors.", "Business model: how it makes money and how that shapes the design.", "Metrics: if you were its PM, which metrics would you track.", "Improvement: one weakness and one proposal with a trade-off."]],
        ["ex", "Example: a digital banking app.\nUsers: young professionals who transfer money several times a day. Job: send money quickly without sending it to the wrong person.\nWhy it wins: scanning a QR code and showing the recipient's name before confirming removes the fear of a wrong transfer. Improvement: older parents are vulnerable to transfer scams, so add a warning when sending a large amount to a first-time recipient. Trade-off: it adds friction for everyone, so only trigger it on risk signals."],
        ["tip", "Prepare 2 products: a digital app and a physical product. Interviewers sometimes ask you to switch."],
        ["warn", ["Only saying \"nice interface, easy to use\" without pointing to a specific design decision", "Not mentioning the target user", "Proposing improvements with no reasoning or trade-off", "Picking a very popular product and saying what everyone already knows"]],
        ["q", ["What's your favorite product? If you were its PM, what would you improve?", "Tell me about a product you think is badly designed and why."]]
      ]},
      {id:"sense-6", t:"Designing for Vietnamese users: COD, Zalo, motorbikes, payments, multiple generations", m:7, b:[
        ["p", "Many product sense prompts in Vietnam score well when you show you understand the local context. A solution copied straight from a foreign product often breaks on very everyday details."],
        ["h", "Common characteristics"],
        ["ul", ["COD and trust: many people still prefer to receive goods before paying, especially from unfamiliar shops. The cost is refused deliveries and collection fees.", "QR payments: bank transfers via QR code are very familiar, even at small street stalls. Designs should build on this habit rather than force card entry.", "Zalo as the contact channel: many people, especially older users and shop owners, are more used to messaging on Zalo than to email or in-app notifications.", "Motorbikes: riders can hardly look at a screen, small alleys are hard to find, addresses are often non-standard. Delivery and maps need address notes, phone calls and pinned locations.", "Multiple generations: children often order and pay for their parents; one device may be shared by several people.", "Low-end phones and patchy networks in some areas: heavy apps lose users."]],
        ["h", "How to bring this into your answer"],
        ["ol", ["When clarifying, ask about city vs. countryside, age range and payment channels.", "When defining users, think about both the person ordering on someone's behalf and the person being served.", "When proposing solutions, check each idea against the context: is COD needed, should it be shareable via Zalo, can it be used while riding.", "When measuring, add context-specific metrics such as failed-delivery rate or the share of COD users switching to prepaid."]],
        ["ex", "Prompt: design an online medicine-ordering feature for elderly people.\nInstead of making elderly users create their own accounts, let their children create a \"family profile\" and order for them. The elderly person gets a confirmation message on Zalo with the pharmacy's phone number. Offer COD or let the child prepay by QR. The courier gets a note: \"call before arriving, house is in an alley\"."],
        ["warn", ["Assuming everyone uses credit cards", "Designing for young users in city centers and treating that as the whole market", "Treating COD as just a payment method and forgetting operating and return costs", "Saying vaguely \"Vietnamese people like Zalo\" without tying it to a specific problem"]],
        ["q", ["Design a product that helps small sellers on social media manage their orders.", "How would you reduce the rate of refused COD deliveries?", "Design a feature that helps adult children care for parents living far away in their hometown."]]
      ]},
      {id:"sense-7", t:"UX basics for PMs: onboarding, friction and design principles", m:6, b:[
        ["p", "PMs don't need to draw like designers, but they do need to explain why a flow is easy or hard to use. In interviews, a few sharp UX observations make your solution much more credible."],
        ["h", "Onboarding: getting users to their first value"],
        ["p", "The goal of onboarding isn't to introduce every feature; it's to help new users reach the moment they see value as fast as possible. Ask: what is the minimum set of steps a user must take to get the first benefit, and which steps can wait."],
        ["ul", ["Defer what isn't needed yet: don't require a full profile before trying the product", "Smart defaults: prefill what you can guess, such as location or language", "Ask for permissions at the right moment: request location when the user searches for nearby restaurants, not on the first screen"]],
        ["h", "Good friction and bad friction"],
        ["p", "Not all friction should be removed. Bad friction wastes users' effort, like re-entering an address or OTP several times. Good friction protects users, like a confirmation step before a large transfer or deleting data."],
        ["h", "A few principles that work well in interviews"],
        ["ul", ["Visible status: users always know what's happening, such as where the order is or whether money has been deducted", "Prevent errors rather than fix them: show the recipient's name before a transfer", "Easy undo: allow canceling or editing within a few minutes", "Consistency: the same action looks the same everywhere", "Few choices at critical steps: too many options make users hesitate"]],
        ["ex", "Prompt: improve onboarding for an e-wallet.\nAssumed problem: many people install the app but drop off at identity verification (eKYC).\nSolution: let users receive money and see their balance before eKYC, and only require verification when they want to send money or pay. Add clear photo guidance for ID documents and specific error messages like \"photo has glare\". Measure the 7-day eKYC completion rate, with the fraud rate as a counter metric because regulatory compliance matters."],
        ["warn", ["Thinking onboarding is a few intro screens users swipe through", "Wanting to remove all friction, including steps that protect users", "Giving UX feedback based on personal taste like \"this color is ugly\"", "Forgetting error states, empty states and weak connections"]],
        ["q", ["How would you redesign the first-time experience of a food delivery app?", "When would you deliberately add friction to a product?"]]
      ]},
      {id:"sense-8", t:"Designing two-sided products and marketplaces", m:6, b:[
        ["p", "Ride-hailing, food delivery and e-commerce marketplaces are all two-sided products: they must serve both buyers and sellers (or riders and drivers). This is a very common prompt type in Vietnam, and the hard part is that every decision that helps one side can hurt the other."],
        ["h", "Key concepts"],
        ["ul", ["Two sides with different needs: customers want speed, low prices and reliability; drivers or sellers want stable income and low risk", "Supply-demand balance: too little supply means long waits, too much means drivers without rides", "Network effects: more sellers attract more buyers and vice versa, but usually only within one area", "Chicken-and-egg problem: at launch neither side exists, so you usually have to pull one side first", "Trust: ratings, verification and buyer protection let two strangers transact"]],
        ["h", "How to answer marketplace prompts"],
        ["ol", ["Ask which side is the bottleneck: not enough supply or not enough demand.", "Analyze users on both sides, then pick a side to focus on with a reason.", "For each solution, say how it affects the other side.", "Measure with system-level metrics such as match rate and wait time, plus one health metric for each side."]],
        ["ex", "Prompt: customers on a ride-hailing app often get their rides canceled when it rains.\nLooking only at the customer side, you might penalize drivers who cancel. But drivers cancel because of rain, traffic jams and long trips that aren't worth it. A more balanced approach: a capped price increase in rain with the extra going to drivers, showing the destination clearly before a driver accepts, and giving customers an honest estimated wait time. Primary metric: completed-ride rate in rain. Counter metrics: drivers' hourly earnings and the share of customers abandoning bookings due to high prices."],
        ["warn", ["Designing for only one side and forgetting the other", "Proposing penalties or subsidies without discussing cost and long-term effects", "Treating network effects as nationwide when ride-hailing and food delivery work mostly area by area", "Having no metric for the health of both sides"]],
        ["q", ["How would you launch a food delivery service in a new province?", "Sellers on the marketplace complain about rising fees while buyers complain about high prices. Who do you prioritize?", "Design a rating system for a home-repair services marketplace."]]
      ]},
      {id:"sense-9", t:"Product sense for growth: activation, habits and loops", m:6, b:[
        ["p", "A great feature that users never come back to doesn't help the company. Strong product sense answers usually show how the solution helps users find value, return regularly and bring in others."],
        ["h", "Activation: the moment of value"],
        ["p", "Activation is when a new user first experiences the core value, for example their first food order arriving on time or their first successful transfer. Define it as a measurable action, then design to get users there faster."],
        ["h", "Habits and retention"],
        ["ul", ["Trigger: what reminds users to come back, like lunchtime or payday", "Simple action: the fewer steps, the easier it becomes a habit, like reordering a usual dish", "Reward: the value received must be clear and reliable, not just a voucher", "Investment: data, history and contacts users accumulate make the product more useful over time"]],
        ["h", "Growth loops"],
        ["p", "A loop is when a user's action creates new users or new value. For example: a user splits a bill with friends through a wallet, the friends must install the wallet to receive money, and then they split bills with others. Durable loops are usually tied to core value rather than relying only on referral rewards."],
        ["ex", "Prompt: improve retention for an English-learning app.\nAssumed activation: completing 3 lessons in the first week. Habit: reminders at a time slot the user chooses, and short 5-minute lessons that work on the bus. Loop: learners challenge friends through a link shared on Zalo, and invitees can take the quiz right away without signing up. Measure: the share of users still learning in week 4, with the notification opt-out rate as a counter metric."],
        ["warn", ["Using vouchers and promotions as the main retention solution", "Not defining activation as a specific action", "Sending so many push notifications that users disable them or uninstall", "Designing referral loops disconnected from core value, which invites abuse"]],
        ["q", ["Users install the app but don't come back after day one. What do you do?", "Design a growth loop for a digital banking app."]]
      ]},
      {id:"sense-10", t:"Delivering a product sense answer: structure, timing and interviewer feedback", m:6, b:[
        ["p", "Many candidates have good ideas but still fail because they ramble, run out of time before reaching a solution, or ignore the interviewer's hints. How you lead the 30 to 40 minutes is scored just like the content."],
        ["h", "Allocating time"],
        ["p", "For a prompt of about 30 minutes, you could split it as follows. This is a guideline; adapt to the interviewer."],
        ["ul", ["Clarify the prompt and goal: 3 to 5 minutes", "Users and pain points: 7 to 10 minutes", "Solutions and trade-offs: 10 to 12 minutes", "Measurement and summary: 3 to 5 minutes"]],
        ["h", "Leading so the listener can follow"],
        ["ol", ["Ask for 1 to 2 minutes to think and jot your structure on paper or a whiteboard.", "State the roadmap up front: \"I'll go through users, the problem, solutions, then measurement\".", "At the end of each part, wrap up in one sentence and ask \"Would you like me to go deeper anywhere?\".", "Number your points so they're easy to follow.", "Close with a 3 to 4 sentence summary and name the biggest risk to validate."]],
        ["h", "Reading interviewer feedback"],
        ["p", "Interviewer hints are information, not traps. When they ask \"What about other user groups?\" or \"What if there's no marketing budget?\", they usually want you to change direction. Acknowledge it, adjust, and say clearly what changes in your choice. If challenged, hold your position when you have reasons, but don't argue for the sake of it."],
        ["ex", "The interviewer cuts in: \"Suppose the team has only 2 engineers.\"\nWeak answer: keep presenting the same big solution.\nStrong answer: \"Then I'd drop the personalization part and keep the reorder-your-usual reminder, since it can be built in a few weeks and still targets the problem we chose. Personalization can come later once we have data.\""],
        ["tip", "Practice out loud with a timer. It feels fine in your head; only when you speak do you see how many minutes you spend on clarifying."],
        ["warn", ["Spending more than half the time on clarifying and users", "Thinking silently for too long without saying what you're doing", "Ignoring or arguing with the interviewer's hints", "Not summarizing at the end and leaving the listener to connect the dots"]],
        ["q", ["Design a product that helps commuters in big cities save travel time. You have 30 minutes.", "If you only had 5 minutes left, what would you present?"]]
      ]}
    ],
    metrics: [
      {id:"metrics-1", t:"Choosing the right metrics", m:6, b:[
        ["p","A good metric reflects the value users get and ties to business goals. When answering, go from the goal down to the metric, not the other way round."],
        ["h","Three layers of metrics"],
        ["ul",["North Star Metric: one metric reflecting core value and driving long-term growth, e.g. successful deliveries per week","Input metrics: things the team directly influences, like checkout conversion or average delivery time","Counter metrics: watched so optimizing one thing doesn't break another, like cancellation rate or complaints"]],
        ["h","Supporting frameworks"],
        ["ul",["AARRR: Acquisition, Activation, Retention, Referral, Revenue; good for finding funnel drop-offs","HEART: Happiness, Engagement, Adoption, Retention, Task success; good for a feature's experience, paired with Goals, Signals, Metrics"]],
        ["h","A good metric is"],
        ["ul",["Precisely defined (what \"active user\" means, over what period)","Measurable and fast-moving enough to make decisions","Hard to game"]],
        ["warn",["Choosing vanity metrics like downloads or page views","Naming one metric with no counter metric","Not defining the metric clearly"]],
        ["q",["What is the North Star Metric of a music streaming app?","How would you measure success for the comments feature on an e-commerce app?"]]
      ]},
      {id:"metrics-2", t:"Diagnosing a metric change", m:6, b:[
        ["p","\"Metric X dropped 15%, what do you do?\" is a very common question. Interviewers want to see a systematic approach, not guessing."],
        ["ol",["Clarify: compared to when, how it's measured, sudden or gradual.","Check the data: tracking bugs, changed definitions, a new release breaking logs.","External factors: seasonality, holidays, weather, competitor promotions, payment outages.","Segment: platform, app version, region, new vs. returning users, which funnel step.","Form hypotheses ranked by likelihood, and how to test each.","Propose short-term and long-term actions."]],
        ["p","Decomposing the metric helps a lot: revenue = users × purchase rate × average order value. Whichever component changed points the investigation."],
        ["ex","Orders on a food delivery app dropped 15%. After ruling out tracking issues, you find only Android users on the new version dropped, at the payment step. The strongest hypothesis is a bug in the payment-flow update, so you propose a rollback or hotfix, plus an automatic alert on payment success rate."],
        ["warn",["Naming a cause in your first sentence","Not checking the data first","Listing many hypotheses without prioritizing"]]
      ]},
      {id:"metrics-3", t:"A/B testing basics for PMs", m:5, b:[
        ["p","An A/B test randomly splits users into control and treatment groups to learn whether a change truly makes a difference."],
        ["h","Designing a test"],
        ["ol",["Hypothesis: change X will raise metric Y because of reason Z.","One primary metric and a few counter metrics.","Unit of randomization: usually users, not page views.","Calculate sample size and duration up front, usually at least one or two full weeks to include weekdays and weekends.","Set decision criteria before looking at results."]],
        ["h","Common traps"],
        ["ul",["Peeking and stopping early: stopping when results look good increases false conclusions","Novelty effect: users are curious at first, then return to old habits","Tracking too many metrics: one will look \"significant\" by chance","Spillover: in marketplaces, changes for group A can affect group B"]],
        ["p","A/B tests aren't always appropriate: when traffic is too low, when the change is long-term strategic, or when treating groups differently is ethically inappropriate."],
        ["q",["A test lifted conversion 3% but the effect vanished after two weeks. Why?","When would you not run an A/B test?"]]
      ]},
      {id:"metrics-4", t:"North Star Metric and metric trees", m:6, b:[
        ["p", "A North Star Metric (NSM) is the single metric the whole company uses to tell whether the product is delivering value to users. But no one can move one number directly. A metric tree breaks the NSM down into smaller branches that individual teams can own and improve."],
        ["h", "What a good NSM looks like"],
        ["ul", ["Reflects the value users get, not just revenue: for example, successful payment transactions per week rather than total fees collected", "Is a leading indicator of long-term revenue: if the NSM grows sustainably, revenue usually follows", "Has a clear time window: weekly or monthly, matching the product's natural usage frequency", "Is easy for everyone in the company to understand, from engineers to sales", "Is hard to inflate artificially: counting \"successfully delivered orders\" is better than \"orders created\""]],
        ["h", "How to build a metric tree"],
        ["ol", ["Put the NSM at the root and write down its exact definition.", "Break it into components that multiply or add up, for example: active users × uses per user.", "Keep splitting each component until you reach metrics one team can move within a quarter: activation rate, return rate, conversion at a specific step.", "Assign each branch to an owning team, with a few counter metrics.", "Sanity check: if every leaf goes up, does the NSM go up? If not, the tree is missing something or is wrong."]],
        ["ex", "E-wallet, assumed NSM: number of users with at least one successful payment in the week.\nNSM = newly activated users + retained existing users + resurrected users.\nNew user branch: downloads × eKYC completion rate × bank linking rate × rate of first transaction within 7 days.\nRetention branch: depends on the number of use cases (phone top-up, bill payment, QR payment at shops).\nThe onboarding team owns eKYC completion; the in-store payments team owns QR transactions per user. Counter metrics: fraud rate and failed transaction rate."],
        ["tip", "In an interview, drawing 2 to 3 levels of the tree is enough. What matters is showing you can go from a top-line metric down to metrics a team can actually act on."],
        ["warn", ["Picking revenue or GMV as the NSM without explaining the user value", "Picking a cumulative metric like total sign-ups, which can only go up", "Decomposing the tree but the branches don't add or multiply back to the root", "Giving the same leaf to several teams with no clear owner"]],
        ["q", ["What is the NSM for a ride-hailing app? Break it down into a metric tree.", "When should a company change its North Star Metric?", "Your NSM is going up but revenue is going down. How do you explain it?"]]
      ]},
      {id:"metrics-5", t:"Funnel analysis and conversion rates", m:6, b:[
        ["p", "A funnel describes the sequence of steps users go through to reach a goal, such as from opening the app to placing a successful order. Funnel analysis tells you where users drop off, how many drop off, and which step to fix first."],
        ["h", "Building the funnel correctly"],
        ["ol", ["Define the end point as real value: a successfully paid order, not a tap on the \"Place order\" button.", "List the steps along the actual journey, usually 4 to 6. Too many steps loses focus.", "Choose the counting unit: users or sessions. Users reflect behavior better; sessions suit optimizing individual purchases.", "Choose a time window: how long a user has to complete the funnel to count, for example the same day or within 7 days.", "Calculate step-by-step conversion and the overall conversion from start to end."]],
        ["h", "Reading the funnel to make decisions"],
        ["ul", ["The step with the biggest drop is not necessarily the one to fix first: weigh it by how many people pass through and how hard it is to fix", "Compare by segment: new vs. returning users, Android vs. iOS, big cities vs. provinces, different ad sources", "Combine with qualitative data: watch session recordings, read feedback, interview users to understand why they leave", "Remember that optimizing one step may just push low-quality users to the next step, so always watch the overall rate"]],
        ["ex", "Assumed funnel of an e-commerce marketplace, counted by users within 1 day:\nView product 100% → add to cart 30% → reach checkout 18% → choose payment method 15% → successful payment 10%.\nAdd to cart drops the most, but that is normal while users are browsing. The step worth attention is from choosing a payment method to success: a third of users who decided to buy still failed. Splitting by method, you see domestic cards have a high OTP failure rate. That is a quick fix with big impact."],
        ["warn", ["Mixing users and sessions in the same funnel", "Ignoring users who skip steps or go back, which distorts the funnel", "Looking only at averages without splitting by segment", "Concluding causes from numbers alone without validating through user research"]],
        ["q", ["Checkout conversion on a food delivery app is low. How would you analyze it?", "How would you build the onboarding funnel for a digital bank app?", "Overall conversion went up but revenue stayed flat. Why might that be?"]]
      ]},
      {id:"metrics-6", t:"Retention and cohort analysis", m:7, b:[
        ["p", "Retention tells you whether users come back after their first time. It is often the clearest signal of product-market fit: you can buy new users with ads, but only a good product keeps them."],
        ["h", "Measuring retention with cohorts"],
        ["ul", ["A cohort is a group of users who started at the same time, for example everyone who signed up in the same week", "Day N retention: the percentage of the cohort that comes back exactly on day or week N", "Unbounded retention: the percentage that comes back on day N or any time after, suited to products with irregular usage", "Cohort table: each row is a cohort, each column a time point; read across a row to see how one group decays, read down a column to see whether newer groups do better than older ones", "\"Coming back\" must be a valuable action, like placing an order, not just opening the app"]],
        ["h", "Reading the retention curve"],
        ["ul", ["A curve that flattens at some level means a group of users found lasting value; that is a good sign", "A curve that keeps falling toward zero means the product isn't keeping anyone, and spending more on ads just burns money", "Newer cohorts' curves sitting above older ones show your improvements are working", "Pick time points by natural frequency: a food delivery app can measure weekly, a flight booking app should measure quarterly or yearly"]],
        ["ex", "Food delivery app, assumed cohort table by sign-up week, weekly retention defined as placing at least one order:\nJanuary cohort: week 1 is 40%, week 4 is 18%, week 8 is 12%, week 12 is 11%.\nMarch cohort: week 1 is 42%, week 4 is 24%, week 8 is 17%, week 12 is 16%.\nBoth curves flatten from around week 8, meaning there is a stable group of regulars. The March cohort is clearly better at week 4. You check and find March launched a voucher for the second order. Next question: does this group stay once the voucher ends, or is it retention bought with money?"],
        ["tip", "When asked \"retention dropped\", immediately ask: in which cohort, at which time point. A drop in the first week is usually an onboarding or acquisition quality problem; a drop in later weeks is usually a core value or competitor problem."],
        ["warn", ["Using total DAU or MAU instead of retention: new users flowing in can hide existing users leaving", "Defining \"return\" too loosely, like opening the app because of a notification", "Comparing cohorts from different acquisition sources without separating them", "Picking time points that don't match the product's natural usage frequency"]],
        ["q", ["Week 1 retention dropped from 40% to 32%. How would you investigate?", "How can you tell from retention data that a product has product-market fit?", "How would you measure retention for a hotel booking app?"]]
      ]},
      {id:"metrics-7", t:"Advanced A/B testing: sample size, significance and pitfalls", m:7, b:[
        ["p", "Once you know A/B testing basics, more senior interview questions usually focus on three things: how many users you need, how to read statistical results correctly, and how to spot when results can't be trusted. PMs don't need to compute the formulas themselves, but they must understand the concepts well enough to ask the data team the right questions."],
        ["h", "What sample size depends on"],
        ["ul", ["MDE (minimum detectable effect): the smallest change you want to detect. The smaller the change, the more users you need, roughly by the square: halving the MDE needs about four times the sample", "Baseline: the current value of the metric. Metrics with very low rates, like in-app insurance purchase rate, usually need large samples", "Metric variance: metrics like order value fluctuate a lot and need more samples than yes-or-no metrics", "Significance level and power: typically 5% significance and 80% power, meaning you accept a 5% chance of a false alarm and a 20% chance of missing a real effect"]],
        ["h", "Reading results correctly"],
        ["ul", ["A p-value below 0.05 does not mean \"95% sure the hypothesis is true\". It means: if there were truly no difference, the chance of seeing a gap this large or larger is under 5%", "Not statistically significant does not mean no effect; the test may simply be underpowered", "Look at the confidence interval, not just the p-value: up 2% with a range of 0.1% to 3.9% is very different from up 2% with a range of 1.8% to 2.2%", "Statistically significant is not necessarily business significant: a 0.1% lift may not be worth the cost of maintaining the feature"]],
        ["h", "Advanced pitfalls"],
        ["ul", ["Sample ratio mismatch (SRM): you split 50/50 but actually get 52/48. Usually caused by assignment or logging bugs, and the results then can't be trusted", "Randomization unit differs from analysis unit: splitting by user but computing rates per session gets the variance wrong", "Simpson's paradox: group B looks better overall but worse in every segment, because the segment mix differs between groups", "Slicing segments after seeing results to find a \"winning group\": also a form of multiple comparisons, easily producing chance findings"]],
        ["ex", "A digital bank tests a new account opening screen. The baseline completion rate is 20% (assumed), and the team wants to detect a 5% relative lift, to 21%. The data team estimates tens of thousands of users per group, and new user volume only allows that in 5 weeks.\nThe PM has three options: accept running 5 weeks; raise the MDE to 10% if they truly only care about big changes; or switch the primary metric to an earlier step in the flow, which has a higher rate and needs a smaller sample, keeping completion as a monitored metric."],
        ["warn", ["Interpreting the p-value as the probability the hypothesis is true", "Concluding \"it doesn't work\" from an underpowered test", "Skipping the SRM check before reading results", "Setting the MDE or choosing the primary metric after the test has run"]],
        ["q", ["A test shows p-value 0.04 with a 0.2% lift. Do you launch?", "There are too few users to run an A/B test in a reasonable time. What do you do?", "The treatment group has 52% of users instead of 50%. What does that tell you?"]]
      ]},
      {id:"metrics-8", t:"Goal setting and OKRs for product teams", m:6, b:[
        ["p", "Metrics only matter when tied to goals. OKRs (Objectives and Key Results) are how many tech companies in Vietnam align product teams on where to focus for a quarter. Interviewers often ask you to set OKRs for a specific situation to see whether you can tell outcomes apart from tasks."],
        ["h", "Structure of a good OKR"],
        ["ul", ["Objective: a qualitative, inspiring statement of what you want to achieve and why, for example \"Help new users trust their first payment\"", "Key Results: 2 to 4 measurable results with a baseline and a target, for example \"Increase the share of new users with a first transaction within 7 days from X% to Y%\"", "A Key Result is an outcome, not an output: \"launch a refund feature\" is a task; \"reduce complaints about failed transactions\" is an outcome", "Include at least one counter Key Result so the goal isn't hit by breaking something else", "Ambition level: a stretch OKR is often considered good at around 70% achieved; if you always hit 100%, your goals may be too safe"]],
        ["h", "How to set the target number"],
        ["ol", ["Start from the current baseline and natural trend: if you did nothing, where would the metric be at quarter end.", "Estimate the impact of planned initiatives, based on past tests or similar products.", "Compare with the parent goal in the metric tree: how much does your branch need to contribute.", "Pick a level that is challenging enough, and write down your assumptions so you can learn from them at quarter end."]],
        ["ex", "Product team of a food delivery app, next quarter.\nObjective: Turn first-time customers into regulars.\nKR1: Increase the share of new customers placing a second order within 14 days from 25% to 32% (assumed figures).\nKR2: Reduce the share of first orders delivered more than 15 minutes late from 12% to 8%.\nKR3 (counter): Voucher cost per retained new customer rises no more than 10%.\nTasks like \"build a second-order voucher\" or \"prioritize drivers for first orders\" belong in the plan, not in the Key Results."],
        ["warn", ["Writing Key Results as a list of features to ship", "Too many OKRs, so the team doesn't know what to prioritize", "Setting target numbers without a baseline or assumptions", "Tying OKRs directly to bonuses, which pushes people to set safe goals"]],
        ["q", ["Set OKRs for the team that owns search on an e-commerce marketplace.", "At quarter end your team only hit 40% of a Key Result. How do you handle it?", "Explain the difference between output and outcome, with an example."]]
      ]},
      {id:"metrics-9", t:"Unit economics for PMs: CAC, LTV and margins", m:7, b:[
        ["p", "Unit economics answers the question: does each customer or each order make or lose money? Many products in Vietnam have grown fast on promotions and then had to scale back when the money spent never came back. A PM who understands unit economics makes more responsible product decisions and handles strategy questions well."],
        ["h", "Core concepts"],
        ["ul", ["CAC (customer acquisition cost): total marketing and sales spend divided by the number of new customers in the period. Include vouchers and referral rewards for new customers", "Contribution margin per order: revenue per order minus the variable costs tied to it, such as driver fees, payment gateway fees, promotions and support costs", "LTV (customer lifetime value): the total contribution margin a customer brings over their whole time with the product. A simple estimate: monthly contribution margin × average number of months the customer stays", "LTV/CAC ratio: around 3x is often cited as healthy, but it depends on industry and stage", "Payback period: how many months until a customer's contribution margin covers the CAC; shorter means less risk"]],
        ["h", "Where PMs use unit economics"],
        ["ul", ["Designing promotions: vouchers increase orders, but do they make the per-order margin negative, and do customers stay when vouchers end", "Prioritizing features: features that raise order frequency increase LTV; features that cut operating costs increase margin", "Choosing segments: customers in some areas or channels may have much lower CAC and higher LTV", "Pricing: changing service fees affects both margin and retention, so measure both"]],
        ["ex", "Food delivery app, assumed figures for one city.\nCAC: 150,000 VND per new customer, including ads and the first-order voucher.\nContribution margin per order: 8,000 VND after driver, payment and promotion costs.\nThe average customer orders 3 times a month and stays 8 months: LTV is about 8,000 × 3 × 8 = 192,000 VND.\nLTV/CAC is only about 1.3x, with a payback period of about 6 months. Ways to improve: lower CAC via friend referrals, raise frequency with a membership plan, or raise margin by batching orders. The PM should choose the lever based on data and experiments."],
        ["warn", ["Calculating LTV from revenue instead of margin", "Calculating CAC from ads only, ignoring vouchers and referral costs", "Using one average LTV for every channel without splitting by acquisition source", "Assuming overly optimistic retention before there is enough cohort data"]],
        ["q", ["An e-wallet is spending heavily on cashback to attract users. How would you evaluate this strategy?", "How do you know whether a promotion is worth the money?", "Your product's LTV/CAC is below 1. What do you prioritize?"]]
      ]},
      {id:"metrics-10", t:"Self-serve analysis: SQL and basic data questions for PMs", m:7, b:[
        ["p", "Many tech companies in Vietnam expect PMs to pull basic numbers themselves without waiting for the data team. Some interview rounds include a short SQL exercise or ask you to describe how you would get data to answer a question. You don't need to be an expert, but you need to be confident enough to test hypotheses yourself and know when the numbers look wrong."],
        ["h", "The minimum SQL a PM should know"],
        ["ul", ["SELECT, FROM, WHERE: pick the columns you need, filter by time, platform, region", "GROUP BY with COUNT, COUNT(DISTINCT), SUM, AVG: count users, compute revenue by group", "JOIN: connect the users table with the orders table; understand INNER JOIN vs. LEFT JOIN so you don't accidentally drop users with no orders", "CASE WHEN: create classification columns, for example new vs. returning users", "Date functions: bucket by day, week, month for trends and cohorts", "Subqueries or CTEs (WITH): split a long query into readable steps"]],
        ["h", "Process for answering a data question"],
        ["ol", ["Write the question as one clear sentence, plus the decision the answer will affect.", "Define the metric precisely: who counts, which action, which time window.", "Identify the tables and columns, and ask the data team if you're unsure which table is the source of truth.", "Build the query from small to large, checking each step against a few sample rows.", "Cross-check against a known number, such as the order count on the official dashboard, to catch discrepancies.", "Present the result with assumptions and data limitations."]],
        ["ex", "Question: last month, what percentage of an e-commerce marketplace's new users placed their first order within 7 days?\nApproach: take users who signed up in that month from the users table; LEFT JOIN with the orders table, keeping only successful orders; use CASE WHEN to flag users with an order within 7 days of sign-up; rate = COUNT(DISTINCT flagged users) divided by COUNT(DISTINCT all new users).\nIf you use INNER JOIN, users without orders drop out of the denominator and the rate is pushed close to 100%. This is a very common mistake."],
        ["tip", "When an interview asks you to write SQL, state your assumptions about tables and columns out loud before writing. Interviewers usually grade how you define the metric and handle edge cases more than syntax."],
        ["warn", ["Using COUNT instead of COUNT(DISTINCT) when counting users, so one person is counted many times", "Using INNER JOIN and losing unmatched rows, which breaks the denominator", "Not filtering out test data, internal accounts or cancelled orders", "Trusting the first number without cross-checking against an official source"]],
        ["q", ["Write a query for weekly active users over the last 8 weeks.", "How do you check when the numbers you pulled differ from the data team's dashboard?", "When should a PM pull data themselves, and when should they ask the data team?"]]
      ]}
    ],
    execution: [
      {id:"execution-1", t:"Prioritization frameworks", m:5, b:[
        ["p","Prioritization is a PM's daily work. Interviewers care less about which framework you use than whether you anchor on goals and explain trade-offs clearly."],
        ["ul",["RICE: Reach × Impact × Confidence ÷ Effort. Useful for comparing many items, but the score is only as good as its assumptions","Impact vs. Effort: a quick 2×2, good when discussing with stakeholders","MoSCoW: Must, Should, Could, Won't; good for agreeing on a release's scope","Kano: basic, performance and delight features; helps you not forget must-haves"]],
        ["h","How to answer a prioritization question"],
        ["ol",["Restate the team's or company's goal at this stage.","Group requests by underlying problem; many requests are really the same problem.","Assess by impact on the goal, effort, risk and dependencies.","Choose, and state clearly what you won't do and why.","How you'll communicate with those turned down, and when you'll revisit."]],
        ["warn",["Applying frameworks mechanically, treating scores as truth","Prioritizing by whoever is loudest, usually the boss"]]
      ]},
      {id:"execution-2", t:"From idea to backlog", m:6, b:[
        ["p","POs and PMs turn problems into work the team can deliver. The basic tools:"],
        ["ul",["PRD: problem, goals, users, scope (in and out), requirements, metrics, risks, open questions","User story: \"As a [who], I want [what], so that [value]\"","Acceptance criteria: conditions for done, often written as Given, When, Then","INVEST: stories should be Independent, Negotiable, Valuable, Estimable, Small, Testable"]],
        ["ex","As a user who forgot my password, I want to reset it via email so I can log in again without calling support.\nGiven I enter a registered email, When I tap send, Then I receive an email with a reset link valid for 30 minutes.\nGiven I enter an unregistered email, When I tap send, Then the screen shows the same message as above, so it doesn't reveal which emails have accounts."],
        ["h","Scrum in one paragraph"],
        ["p","Teams work in 1 to 2 week sprints. Sprint planning picks work from the backlog, the daily stand-up syncs progress, the sprint review demos results, and the retrospective improves how the team works. The PO is responsible for a backlog that is prioritized and clear."],
        ["warn",["Stories too big to finish in one sprint","Acceptance criteria missing error and edge cases"]]
      ]},
      {id:"execution-3", t:"Working with stakeholders and handling problems", m:5, b:[
        ["p","Execution questions are often scenarios: a delay, the CEO asking for more, an engineer disagreeing. Good answers share traits: understand the root problem, offer options with trade-offs, communicate early and transparently."],
        ["h","When a project slips"],
        ["ol",["Understand the cause and how reliable the new estimate is.","List options: cut scope, phased launch, add people (rarely faster right away), move the date.","Pick the option based on what matters most to the customer.","Tell stakeholders early, with a recommendation, not just bad news.","Learn lessons for the next estimate."]],
        ["h","When asked for urgent extra work"],
        ["p","Ask the real purpose (\"what does the investor demo need to show?\"), find the smallest way to achieve it (mockup, prototype, a feature enabled for a small group), and make the cost to the current plan explicit so the right person can decide."],
        ["warn",["Accepting every request to please leadership","Refusing outright without understanding the purpose"]]
      ]},
      {id:"execution-4", t:"Roadmaps and quarterly planning", m:6, b:[
        ["p", "A roadmap is not a list of features with launch dates. A good roadmap shows which problems the team will solve, in what order and why, so everyone moves toward the same goal. In interviews, people want to see that you can connect company strategy to what the team does each quarter."],
        ["h", "Common types of roadmap"],
        ["ul", ["Feature and date roadmap: easy for sales to understand, but it easily becomes a hard promise and is hard to change when new information arrives", "Outcome roadmap: each item is a problem or metric to improve, for example reducing cart abandonment; the team is free to choose the solution", "Now, Next, Later: what's in progress, what's next, what's later; no specific dates for distant items, good for fast-changing products"]],
        ["h", "Planning a quarter"],
        ["ol", ["Start from company goals and your group's OKRs: what matters most this quarter.", "Review data and feedback: the funnel, support tickets, user research, commitments to partners.", "List opportunities and roughly estimate impact and effort with the tech lead and designer.", "Keep capacity in reserve: usually a share (for example an assumed 20 to 30%) for tech debt, bugs and unplanned work.", "Align with stakeholders: say clearly what you will and won't do this quarter and why.", "Review mid-quarter; a roadmap is a living plan, not a contract."]],
        ["ex", "The payments team of an e-wallet has a quarterly goal: increase bill payment transactions.\nInstead of writing \"Build bill reminders, build auto-pay, build a new UI\", the roadmap says: \"Now: reduce failures when linking electricity and water providers. Next: help users remember due dates. Later: automatic payments.\" When data shows linking errors are the main cause, the team fixes them before building new features."],
        ["warn", ["Filling 100% of capacity with no room for bugs and urgent work", "Promising specific dates for vague items six months out", "A roadmap that is just a list of department requests, not tied to goals", "Building the roadmap alone and only then showing it to engineering"]],
        ["tip", "Every roadmap item should answer the question: if we finish this, which metric changes?"],
        ["q", ["How do you build next quarter's roadmap for your product?", "Sales wants a roadmap with specific dates to promise customers. How do you handle it?", "Mid-quarter, a new priority arrives from the CEO. How do you adjust the roadmap?"]]
      ]},
      {id:"execution-5", t:"Writing a good PRD", m:6, b:[
        ["p", "A PRD (Product Requirements Document) helps the whole team understand the same problem and the same definition of success. A good PRD doesn't need to be long; it needs to be clear on \"why\" and \"what done looks like\", while \"how\" is decided together with the team."],
        ["h", "What separates a good PRD from an ordinary one"],
        ["ul", ["A problem backed by evidence: data, user quotes, support tickets, not just \"the boss wants it\"", "Measurable goals: a primary metric, a counter metric, and an expected level (marked as an assumption if there's no data yet)", "Scope with an \"out of scope\" section: prevents scope creep later", "User flows and edge cases: lost connection, expired session, empty data, users cancelling midway", "Open questions and risks: stated plainly, each with an owner to answer it", "Change history: who changed what and when, so no one works from an old version"]],
        ["h", "The writing process"],
        ["ol", ["Write a one-page draft: problem, users, goals, solution ideas.", "Talk early with the tech lead and designer before writing details.", "Add requirements, edge cases and the tracking needed to measure.", "Review with relevant stakeholders: legal, customer support, operations if needed.", "Keep the PRD updated throughout the work; don't write it and leave it."]],
        ["ex", "Feature: let customers change the delivery time on a food delivery app after ordering.\nProblem: an assumed 5% of orders are cancelled because customers want a different delivery time but have no way to change it except calling support.\nGoal: reduce cancellations for this reason; the counter metric is driver waiting time.\nOut of scope: changing the delivery address, changing dishes after the restaurant has confirmed.\nEdge cases: the restaurant has started cooking, a driver has accepted the order, the new time is outside opening hours."],
        ["warn", ["Writing the PRD like a technical design, making decisions for engineers", "No out-of-scope section, so everyone understands scope differently", "Skipping tracking, then discovering at launch that you can't measure", "Writing so much that nobody reads to the end"]],
        ["q", ["Tell me about a PRD you wrote. What sections did you include and why?", "An engineer says your PRD is unclear. What do you do?"]]
      ]},
      {id:"execution-6", t:"Working with engineering: estimates, cutting scope, tech debt", m:7, b:[
        ["p", "The relationship with engineering determines most of a team's speed. A PM doesn't need to code, but needs to understand why estimating is hard, how to cut scope while keeping value, and why tech debt is a product matter, not just a technical one."],
        ["h", "Estimation"],
        ["ul", ["An estimate is a prediction, not a commitment; the newer the work, the greater the uncertainty", "Story points measure relative complexity and don't convert directly into hours", "Breaking work down makes estimates more accurate; items estimated as very large usually need splitting or a spike (short investigation) first", "Ask \"what could make this number wrong?\" instead of pushing for a smaller number"]],
        ["h", "Cutting scope while keeping value"],
        ["ol", ["Go back to the core problem: which part do users truly need to solve it.", "Separate the main flow from rare cases; rare cases can be handled manually at first.", "Start with one user group, one platform or one city.", "Use controlled temporary solutions, but record them to address later."]],
        ["ex", "A digital bank wants to launch group bill splitting. The full estimate is 3 sprints, but the goal is to make it in time for year end.\nThe PM and tech lead agree on a first version: equal splits only, recipients at the same bank only, manual reminders through a button that sends a notification. Custom ratios, recipients at other banks and automatic reminders go to a later version. Scope drops by about half and still covers the main need."],
        ["h", "Tech debt"],
        ["p", "Tech debt is shortcuts in code or architecture that make later changes slower and riskier. Ask engineers which debt is slowing the team or causing incidents, translate it into understandable impact (time to ship features, number of incidents, user experience), and reserve a fixed share of capacity each sprint to pay it down instead of waiting for \"when we have time\"."],
        ["warn", ["Pushing engineers to lower estimates to match a promised date", "Cutting scope by dropping testing, security or tracking", "Treating tech debt as engineering's problem alone and never putting it on the roadmap", "Handing out tasks without explaining the business context"]],
        ["q", ["Engineering estimates twice the time you expected. What do you do?", "How do you balance new features against paying down tech debt?", "Tell me about a time you cut scope to make a launch."]]
      ]},
      {id:"execution-7", t:"Agile and Scrum in practice", m:6, b:[
        ["p", "Most tech companies in Vietnam say they do Agile, but each does it differently. Interviewers rarely ask for definitions; they ask how you ran it, what problems you hit and how you adjusted."],
        ["h", "Roles and ceremonies, from the PM's side"],
        ["ul", ["Backlog refinement: the most important session for a PM; clarify and split stories before sprint planning so planning doesn't turn into a requirements discussion", "Sprint goal: one sentence describing what this sprint achieves, helping the team decide when unplanned work appears", "Definition of Done: a shared standard for every story, for example tested, code reviewed, tracking in place", "Sprint review: demo to stakeholders and get real feedback, not just a status report", "Retrospective: the PM should join and listen, because many problems start from unclear requirements"]],
        ["h", "Scrum or Kanban"],
        ["p", "Scrum suits teams building new features at a steady rhythm that need sprint commitments. Kanban suits operations or support teams, or teams with a constant flow of small items, focusing on limiting work in progress (WIP) and cycle time. Many teams combine both."],
        ["ex", "An e-commerce team keeps getting urgent requests from the business side before big sales, and never finishes a sprint.\nThe PM proposes: keep a fixed share of capacity for urgent work, and every interrupting request must go through the PM and swap out another item of the same size from the sprint. After a few sprints, the team sees its sprint goal completion rate rise, and stakeholders get used to planning earlier."],
        ["warn", ["Running every ceremony but having no sprint goal, so a sprint is just a to-do list", "Using velocity to compare teams or evaluate individuals", "Changing sprint scope constantly with no rules", "Treating Agile as a reason not to need long-term planning"]],
        ["q", ["Your team often fails to complete its sprints. How would you investigate and fix it?", "What do you think the PM's role is in Scrum ceremonies?"]]
      ]},
      {id:"execution-8", t:"Launching: rollout, feature flags, risk planning", m:6, b:[
        ["p", "Launching is not pressing a deploy button. A good launch is prepared to detect problems early, affect as few people as possible and roll back quickly when needed. For products that handle money, like e-wallets or digital banks, this matters even more."],
        ["h", "Tools for a safe launch"],
        ["ul", ["Feature flag: turn a feature on or off without releasing a new version; separates deploying code from exposing it to users", "Percentage rollout: open to employees, then 1%, 5%, 20%, 50%, 100%; each step has criteria to proceed", "Beta or regional testing: open first in one city or to a group of users who signed up", "Kill switch: a way to switch off quickly during an incident, tested before launch"]],
        ["h", "Launch checklist"],
        ["ol", ["Success criteria and stop criteria: which metric getting how much worse pauses the rollout.", "Dashboards and alerts ready before launch day.", "Rollback plan: who decides, who executes, how long it takes.", "Customer support, operations and marketing informed in advance, with scripts for answering questions.", "Check legal and security requirements if the feature touches data or money.", "A communication channel for launch day and people on call."]],
        ["ex", "A ride-hailing app launches booking rides for family members.\nWeek 1: employees. Week 2: 5% of users in one city. Stop criteria: the cancellation rate rises beyond a preset assumed level, or complaints about drivers unable to reach the passenger clearly increase. At 5%, the team sees drivers often call the person who booked instead of the passenger, so they pause, fix how the phone number is shown, then continue."],
        ["warn", ["Opening a risky feature to 100% from the start", "Not defining in advance when to stop, then arguing about it during an incident", "Forgetting to tell customer support, so users ask and nobody knows the answer", "Leaving old feature flags around forever, making code messy and hard to control"]],
        ["q", ["Describe a launch plan for a new payment feature.", "After rolling out to 10%, the main metric rises but complaints rise too. What do you do?"]]
      ]},
      {id:"execution-9", t:"Making decisions with incomplete data", m:6, b:[
        ["p", "PMs rarely have enough data. New products have no history, A/B tests need time and enough users, and the market doesn't wait. The key skill is deciding well enough, fast enough, and knowing when you need more information."],
        ["h", "Classify the decision first"],
        ["ul", ["Reversible decisions (two-way doors): changing button text, trying a small promotion; decide quickly, test and learn", "Hard-to-reverse decisions (one-way doors): changing the fee model, removing a widely used feature, committing to a partner; need more caution and more perspectives", "Also ask: what is the cost of waiting compared with the cost of deciding wrong?"]],
        ["h", "Ways to compensate for missing data"],
        ["ol", ["Write down the most important assumption and what would prove it wrong.", "Find quick signals: interview 5 to 10 users, support data, behavior on similar features.", "Estimate quickly with logic (Fermi) to know the order of magnitude.", "Run a small experiment: a fake door, a manual version, opening to a small group.", "Decide, record the reasoning, and set a date to review."]],
        ["ex", "An e-commerce app is considering a \"2-hour delivery\" option in the inner city but doesn't know whether users will pay extra.\nInstead of building a fast delivery system right away, the PM adds an option on the checkout page for a small group of users. When customers choose it, they see a message that the service is coming soon, and the order is delivered normally with an apology discount code. The selection rate shows real demand, the cost is low, and it can be stopped at any time."],
        ["warn", ["Waiting for perfect data while the opportunity passes", "Deciding on gut feeling but presenting it as data-driven", "Not recording assumptions, so later you can't tell where you went wrong", "Applying the same level of caution to every decision"]],
        ["tip", "In interviews, \"I assume X because of Y, and I'd verify it with Z\" usually scores better than trying to give a precise number."],
        ["q", ["Tell me about a time you had to decide without enough data.", "How would you decide whether to launch a feature when the A/B test result isn't statistically significant?"]]
      ]},
      {id:"execution-10", t:"After launch: measure, iterate or kill a feature", m:6, b:[
        ["p", "Launch is when learning starts, not when it ends. Many teams launch and move on, leaving features nobody uses that still cost maintenance. Good PMs set review points in advance and dare to decide: invest more, fix, or stop."],
        ["h", "Post-launch review"],
        ["ol", ["Compare against the goals set in the PRD: how the primary and counter metrics changed.", "Look at the funnel: how many people saw the feature, tried it, used it again.", "Split by user group: a feature can work for one group and fail for another.", "Read qualitative feedback: store reviews, support tickets, user interviews.", "Distinguish novelty effects from lasting change; look at retention after several weeks, not just the first week."]],
        ["h", "Iterate or stop"],
        ["ul", ["Invest more: users find it and keep coming back, the primary metric clearly improves", "Fix and retry: high repeat usage but few people know about it, or users get stuck at a specific funnel step", "Stop: after several fixes few people still return, and maintenance cost and complexity exceed the value", "When stopping: notify current users in advance, show alternatives, remove the code and feature flags"]],
        ["ex", "An e-wallet launches \"goal-based savings jars\".\nAfter 6 weeks: many people create a jar in the first week, but the rate of a second deposit is low. Interviews show users forget about the jar. The team adds recurring deposit reminders and automatic transfers on payday. If after two iterations the repeat deposit rate still hasn't improved against the target, the team will scale the feature down instead of investing further."],
        ["warn", ["No goal set in advance, so any metric going up is called success", "Concluding after only a few days, while the novelty effect is still strong", "Reluctance to stop a feature because of the effort already spent (sunk cost)", "Removing a feature abruptly without telling current users"]],
        ["q", ["A feature you launched 2 months ago has fewer users than expected. What do you do?", "How do you decide to kill a feature?", "How do you measure a new feature's success after launch?"]]
      ]}
    ],
