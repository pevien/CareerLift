<script>
"use strict";
/* ================= STATE & STORAGE ================= */
const LS_KEY = "pmprep:v1", LS_SESS = "pmprep:sessions:v1";
const DAY = 86400000;
function defaultState(){
  return {v:1, profile:{role:"pm", level:"mid", company:"product", jd:"", lang:"vi", style:"neutral", followups:3, activeJd:"", uiLang:"vi", market:"vn"}, cards:{}, scores:[], custom:{}, practice:{}, lessons:{}, jds:[], customLessons:{}, settings:{apiKey:"", model:"", keyMod:0}, me:{raw:"", sum:null, at:0}, stories:[], storiesDel:{}, customCards:{}, ivAdded:{}};
}
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function normalize(raw){
  const d = defaultState();
  if(!raw || typeof raw !== "object") return d;
  const s = Object.assign(d, clone(raw));
  s.profile = Object.assign(defaultState().profile, s.profile || {});
  s.settings = Object.assign(defaultState().settings, s.settings || {});
  if(!ROLES[s.profile.role]) s.profile.role = "pm";
  if(!MARKETS[s.profile.market]) s.profile.market = "vn";
  s.cards = s.cards || {}; s.scores = Array.isArray(s.scores) ? s.scores : []; s.custom = s.custom || {}; s.practice = s.practice || {}; s.lessons = s.lessons || {}; s.customLessons = s.customLessons || {};
  s.jds = Array.isArray(s.jds) ? s.jds : [];
  s.me = normMe(s.me);
  s.stories = Array.isArray(s.stories) ? s.stories.filter(x => x && x.id) : []; s.storiesDel = s.storiesDel && typeof s.storiesDel === "object" ? s.storiesDel : {};
  s.customCards = s.customCards && typeof s.customCards === "object" ? s.customCards : {}; s.ivAdded = s.ivAdded && typeof s.ivAdded === "object" ? s.ivAdded : {};
  if(s.profile.jd && s.profile.jd.trim() && !s.jds.length){ const id = "jd" + Date.now().toString(36); s.jds.push({id, name:"JD đã lưu", role:s.profile.role, level:s.profile.level, company:s.profile.company, text:s.profile.jd, createdAt:Date.now(), analysis:null}); s.profile.activeJd = id; }
  s.profile.jd = "";
  if(!s.jds.some(j => j.id === s.profile.activeJd)) s.profile.activeJd = "";
  return s;
}
// Hồ sơ LinkedIn: raw là nội dung người dùng dán, sum là bản tóm tắt AI, at là lần sửa sau cùng (dùng khi gộp đồng bộ)
function normMe(m){
  m = m && typeof m === "object" ? m : {};
  const sum = m.sum && typeof m.sum === "object" ? m.sum : null;
  return {raw: typeof m.raw === "string" ? m.raw : "", sum, at: Number(m.at) || 0};
}
let S = normalize(lsGet(LS_KEY));
const Store = {db:null, uid:null, ready:false, sessions: lsGet(LS_SESS) || [], timer:null, note:""};
function stateRef(){ return Store.db.doc("data/users/" + Store.uid + "/state"); }
function sessCol(){ return stateRef().collection("sessions"); }

async function initStore(){
  if(!window.claude || typeof claude.use !== "function"){ Store.ready = true; Store.note = "local"; render(); return; }
  try{
    const [user, db] = await Promise.all([claude.use("user"), claude.use("db")]);
    const uid = user ? await user.id() : null;
    if(db && uid){
      Store.db = db; Store.uid = uid;
      const snap = await stateRef().get();
      if(snap.exists){ S = normalize(snap.data()); lsSet(LS_KEY, S); }
      else { await stateRef().set(clone(S)); }
      try{
        const qs = await sessCol().orderBy("createdAt","desc").limit(40).get();
        const remote = qs.docs.map(d => clone(d.data()));
        if(remote.length || !Store.sessions.length) Store.sessions = remote;
        else for(const s of Store.sessions) sessCol().doc(s.id).set(clone(s)).catch(()=>{});
      }catch(e){ console.warn("sessions", e); }
    } else Store.note = "local";
  }catch(e){ console.warn("store", e); Store.db = null; Store.note = "local"; }
  Store.ready = true;
  render();
}
function save(){
  if(S.scores.length > 400) S.scores = S.scores.slice(-400);
  S._t = Date.now();
  lsSet(LS_KEY, S);
  gdSchedule();
  if(!Store.db) return;
  clearTimeout(Store.timer);
  Store.timer = setTimeout(() => { stateRef().set(clone(S)).catch(e => console.warn("save", e)); }, 700);
}
function saveSession(sess){
  const i = Store.sessions.findIndex(x => x.id === sess.id);
  if(i >= 0) Store.sessions[i] = clone(sess); else Store.sessions.unshift(clone(sess));
  Store.sessions = Store.sessions.slice(0, 40);
  lsSet(LS_SESS, Store.sessions);
  gdSchedule();
  if(Store.db) sessCol().doc(sess.id).set(clone(sess)).catch(e => console.warn("session", e));
}

/* ================= SYNC MERGE (pure) ================= */
// Gộp hai bản tiến độ (máy này và Google Drive). Bản ghi sau lần "Xóa toàn bộ tiến độ" mới nhất mới được giữ.
function mergeState(a, b){
  a = normalize(a); b = normalize(b);
  const [nw, od] = (b._t || 0) > (a._t || 0) ? [b, a] : [a, b];
  const reset = Math.max(a._resetAt || 0, b._resetAt || 0);
  const out = clone(nw); out._resetAt = reset || undefined; if(!reset) delete out._resetAt;
  const byId = new Map(); for(const j of od.jds.concat(nw.jds)) if(j && j.id) byId.set(j.id, j);
  out.jds = [...byId.values()];
  // Gemini key và model đi cùng nhau, lấy theo lần sửa key sau cùng (keyMod), không theo _t
  const ks = (od.settings.keyMod || 0) > (nw.settings.keyMod || 0) ? od.settings : nw.settings;
  out.settings = {apiKey: ks.apiKey, model: ks.model, keyMod: ks.keyMod || 0};
  if(!out.settings.apiKey && !nw.settings.keyMod && !od.settings.keyMod && od.settings.apiKey) Object.assign(out.settings, {apiKey: od.settings.apiKey, model: od.settings.model});
  // Hồ sơ LinkedIn và kho câu chuyện là nội dung người dùng tự nhập (như JD), không bị "Xóa toàn bộ tiến độ" xóa
  if((od.me.at || 0) > (out.me.at || 0)) out.me = clone(od.me);
  for(const [id, ts] of Object.entries(od.storiesDel)) out.storiesDel[id] = Math.max(out.storiesDel[id] || 0, ts || 0);
  const sm = new Map(); for(const x of od.stories.concat(out.stories)){ const c = sm.get(x.id); if(!c || (x.mod || 0) >= (c.mod || 0)) sm.set(x.id, x); }
  out.stories = [...sm.values()].filter(x => !(out.storiesDel[x.id] >= (x.mod || 0))).sort((a, b) => (a.created || 0) - (b.created || 0));
  if((od._t || 0) < reset) return out;
  for(const [id, r] of Object.entries(od.cards)){ const c = out.cards[id]; if(!c || (r.n || 0) > (c.n || 0) || ((r.n || 0) === (c.n || 0) && (r.due || 0) > (c.due || 0))) out.cards[id] = r; }
  const sk = x => x.t + "|" + x.d + "|" + (x.src || ""), seen = new Set(out.scores.map(sk));
  for(const x of od.scores) if(!seen.has(sk(x))){ seen.add(sk(x)); out.scores.push(x); }
  out.scores = out.scores.filter(x => x.d > reset).sort((x, y) => x.d - y.d).slice(-400);
  for(const [id, r] of Object.entries(od.practice)){
    const c = out.practice[id];
    if(!c){ out.practice[id] = r; continue; }
    const m = {best: Math.max(c.best || 0, r.best || 0), last: Math.max(c.last || 0, r.last || 0)};
    const hist = mergeHist(c.hist, r.hist); if(hist.length) m.hist = hist;
    out.practice[id] = m;
  }
  for(const [id, ts] of Object.entries(od.lessons)) out.lessons[id] = Math.max(out.lessons[id] || 0, ts || 0);
  for(const [k, v] of Object.entries(od.ivAdded)) if(!out.ivAdded[k]) out.ivAdded[k] = v;
  for(const k of ["custom", "customLessons", "customCards"]) for(const [t, xs] of Object.entries(od[k])){ const have = out[k][t] || [], ids = new Set(have.map(x => x.id)); out[k][t] = have.concat((xs || []).filter(x => !ids.has(x.id))); }
  return out;
}
// Lịch sử các lần trả lời một câu (để so sánh): gộp theo thời điểm, giữ 5 lần gần nhất
function mergeHist(a, b){
  const m = new Map(); for(const h of (a || []).concat(b || [])) if(h && h.d) m.set(h.d, h);
  return [...m.values()].sort((x, y) => x.d - y.d).slice(-HIST_MAX);
}
const HIST_MAX = 5;
function mergeSessions(a, b, resetAt){
  const m = new Map();
  for(const s of (a || []).concat(b || [])){ if(!s || !s.id) continue; const c = m.get(s.id); if(!c || (s.results || []).length > (c.results || []).length) m.set(s.id, s); }
  return [...m.values()].filter(s => (s.createdAt || 0) > (resetAt || 0)).sort((x, y) => y.createdAt - x.createdAt).slice(0, 40);
}

/* ================= GOOGLE DRIVE SYNC ================= */
// Lưu một file JSON trong thư mục ẩn appDataFolder của Google Drive (người dùng không thấy, app khác không đọc được).
const GD_CID_LS = "pmprep:gdrive:cid", GD_ON_LS = "pmprep:gdrive:on", GD_FILE = "careerlift-sync.json";
const GD_API = "https://www.googleapis.com/drive/v3/files", GD_UP = "https://www.googleapis.com/upload/drive/v3/files";
const GD = {token:null, exp:0, fileId:null, busy:false, again:false, err:"", last:0, timer:null, gis:null};
function gdCid(){ return lsStr(GD_CID_LS).trim(); }
function gdOn(){ return lsStr(GD_ON_LS) === "1" && !!gdCid(); }
function gdHasToken(){ return !!GD.token && Date.now() < GD.exp - 60000; }
function gdLoadGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(!GD.gis) GD.gis = new Promise((ok, bad) => { const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true; s.onload = ok; s.onerror = () => { GD.gis = null; bad(new Error("Không tải được Google Identity Services")); }; document.head.appendChild(s); });
  return GD.gis;
}
async function gdToken(){
  if(gdHasToken()) return GD.token;
  await gdLoadGis();
  return new Promise((ok, bad) => {
    const client = google.accounts.oauth2.initTokenClient({client_id: gdCid(), scope: "https://www.googleapis.com/auth/drive.appdata",
      callback: r => { if(r.error){ bad(new Error(r.error_description || r.error)); return; } GD.token = r.access_token; GD.exp = Date.now() + (Number(r.expires_in) || 3600) * 1000; ok(GD.token); },
      error_callback: e => bad(new Error(e && e.type === "popup_failed_to_open" ? "Trình duyệt chặn cửa sổ đăng nhập Google" : (e && e.message) || "Chưa đăng nhập Google"))});
    client.requestAccessToken({prompt: lsStr(GD_ON_LS) === "1" ? "" : "consent"});
  });
}
async function gdFetch(url, opts){
  opts = opts || {};
  const res = await fetch(url, Object.assign({}, opts, {headers: Object.assign({authorization: "Bearer " + GD.token}, opts.headers || {})}));
  if(res.status === 401){ GD.token = null; throw new Error("Phiên Google đã hết hạn, bấm Đồng bộ ngay để đăng nhập lại"); }
  if(res.status === 404 && GD.fileId && url.includes(GD.fileId)){ GD.fileId = null; throw new Error("retry"); }
  if(!res.ok) throw new Error("Google Drive lỗi " + res.status);
  return res.status === 204 ? null : res.json();
}
function gdApply(remote){
  if(!remote || typeof remote !== "object") return false;
  const before = JSON.stringify([S, Store.sessions]);
  if(remote.state) S = mergeState(S, remote.state);
  Store.sessions = mergeSessions(Store.sessions, remote.sessions, S._resetAt);
  if(JSON.stringify([S, Store.sessions]) === before) return false;
  lsSet(LS_KEY, S); lsSet(LS_SESS, Store.sessions);
  if(Store.db){ stateRef().set(clone(S)).catch(()=>{}); Store.sessions.forEach(s => sessCol().doc(s.id).set(clone(s)).catch(()=>{})); }
  return true;
}
async function gdSync(){
  if(!gdCid()) return;
  if(GD.busy){ GD.again = true; return; }
  GD.busy = true; GD.err = ""; gdPaint();
  let changed = false;
  try{
    await gdToken();
    for(let attempt = 0; attempt < 2; attempt++){
      try{
        if(!GD.fileId){ const r = await gdFetch(GD_API + "?spaces=appDataFolder&fields=files(id)&q=" + encodeURIComponent("name='" + GD_FILE + "'")); GD.fileId = (r && r.files && r.files[0] && r.files[0].id) || null; }
        if(GD.fileId) changed = gdApply(await gdFetch(GD_API + "/" + GD.fileId + "?alt=media")) || changed;
        const body = JSON.stringify({app:"careerlift", v:1, at:Date.now(), state:S, sessions:Store.sessions});
        if(GD.fileId) await gdFetch(GD_UP + "/" + GD.fileId + "?uploadType=media", {method:"PATCH", headers:{"content-type":"application/json"}, body});
        else {
          const fd = new FormData();
          fd.append("metadata", new Blob([JSON.stringify({name: GD_FILE, parents: ["appDataFolder"]})], {type:"application/json"}));
          fd.append("file", new Blob([body], {type:"application/json"}));
          GD.fileId = (await gdFetch(GD_UP + "?uploadType=multipart&fields=id", {method:"POST", body: fd})).id;
        }
        break;
      }catch(e){ if(e.message !== "retry" || attempt) throw e; }
    }
    try{ localStorage.setItem(GD_ON_LS, "1"); }catch(e){}
    GD.last = Date.now();
  }catch(e){ GD.err = e.message || String(e); console.warn("gdrive", e); }
  GD.busy = false;
  if(changed && !(view.name === "interview" && IV)) render(); else gdPaint();
  if(GD.again){ GD.again = false; gdSchedule(); }
}
function gdSchedule(){
  if(!gdOn() || !gdHasToken()) return;
  clearTimeout(GD.timer);
  GD.timer = setTimeout(gdSync, 3000);
}
function gdStatus(){
  if(GD.busy) return "Đang đồng bộ…";
  if(GD.err) return GD.err;
  if(GD.last) return "Đã đồng bộ lúc " + fmtDate(GD.last);
  return gdOn() ? "Bấm Đồng bộ ngay để đăng nhập Google và tải tiến độ mới nhất." : "Chưa bật.";
}
function gdPanel(){
  if(IN_CLAUDE) return "";
  const cid = gdCid();
  return `<section class="panel stack" style="--gap:12px" id="gd-panel">
    <h2>Đồng bộ Google Drive</h2>
    <p class="small muted">Lưu tiến độ học, lịch sử phỏng vấn và Gemini API key vào Google Drive của bạn để dùng trên nhiều máy, nhiều trình duyệt. Dữ liệu nằm trong thư mục ẩn của app, không hiện trong Drive.</p>
    ${cid ? `<p class="small ${GD.err ? "note err" : ""}" role="status">${esc(gdStatus())}</p>
      <div class="row"><button class="btn primary" data-act="gd-sync" ${GD.busy ? "disabled" : ""}>Đồng bộ ngay</button><button class="btn ghost danger" data-act="gd-off">Tắt đồng bộ</button></div>`
    : `${location.protocol === "file:" ? `<p class="small note err">${isEn() ? "Drive sync doesn't work when the app is opened as a file (file://). Open it via http://localhost (serve.sh) or a website." : "Đồng bộ Drive không chạy khi mở app dạng file (file://). Hãy mở qua http://localhost (serve.sh) hoặc một trang web."}</p>` : ""}
      ${gdGuide()}
      <label><span class="label">Google OAuth Client ID</span><input type="text" id="gd-cid" autocomplete="off" placeholder="1234-abc.apps.googleusercontent.com"></label>
      <div><button class="btn primary" data-act="gd-connect">Kết nối Google Drive</button></div>`}
  </section>`;
}
// Hướng dẫn từng bước, viết sẵn hai ngôn ngữ (translateDom không dịch được HTML nhiều đoạn).
function guideBox(title, body){ return `<details class="guide"><summary>ℹ️ ${title}</summary><div>${body}</div></details>`; }
function keyGuide(){

function localSampler(key){
  const call = async (input, opts, asJson) => {
    opts = opts || {};
    const turns = typeof input === "string" ? [{role:"user", content: input}] : input;
    const contents = [];
    for(const m of turns){
      const role = m.role === "assistant" ? "model" : "user";
      const last = contents[contents.length - 1];
      if(last && last.role === role) last.parts[0].text += "\n\n" + m.content;
      else contents.push({role, parts:[{text: m.content}]});
    }
    const custom = getModel();
    const model = custom || (opts.modelTier === "quick" ? QUICK_MODEL : DEFAULT_MODEL);
    const generationConfig = {maxOutputTokens: 8192};
    if(asJson) generationConfig.responseMimeType = "application/json";
    let res;
    try{
      res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent", {
        method:"POST", signal: opts.signal,
        headers:{"content-type":"application/json", "x-goog-api-key": key},
        body: JSON.stringify({contents, generationConfig})
      });
    }catch(e){ throw {code: e && e.name === "AbortError" ? "cancelled" : "upstream_error"}; }
    let data = null; try{ data = await res.json(); }catch(e){}
    if(!res.ok){
      const msg = JSON.stringify(data || {});
      if(res.status === 403 || /API_KEY_INVALID|API key not valid/i.test(msg)) throw {code:"bad_key"};
      if(res.status === 429) throw {code:"rate_limited"};
      if(res.status === 404) throw {code:"bad_model"};
      throw {code:"upstream_error"};
    }
    if(data && data.promptFeedback && data.promptFeedback.blockReason) throw {code:"refused"};
    const cand = data && data.candidates && data.candidates[0];
    const text = ((cand && cand.content && cand.content.parts) || []).filter(p => p.text && !p.thought).map(p => p.text).join("");
    if(!text.trim()) throw {code: cand && cand.finishReason === "SAFETY" ? "refused" : "empty_completion"};
    if(opts.onText) opts.onText({text, delta: text});
    return {text, truncated: !!(cand && cand.finishReason === "MAX_TOKENS")};
  };
  const f = (input, opts) => call(input, opts, false);
  f.json = async (input, opts) => {
    const {text} = await call(input, opts, true);
    const tryParse = s => { try{ return JSON.parse(s); }catch(e){ return undefined; } };
    let v = tryParse(text.trim());
    if(v === undefined){ const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); if(m) v = tryParse(m[1]); }
    if(v === undefined){ const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf("}"), text.lastIndexOf("]")); if(a >= 0 && b > a) v = tryParse(text.slice(a, b + 1)); }
    if(v === undefined) throw {code:"invalid_json", text};
    return v;
  };
  return f;
}

}

function normEval(o){

}

// Trang hiện tại nằm trên URL (#/...) để tải lại trang và nút Back của trình duyệt giữ đúng chỗ
function routeOf(v){
  const e = encodeURIComponent;
  switch(v.name){
    case "topic": return "#/topic/" + e(v.topic) + "/" + e(v.tab || "lessons");
    case "lesson": return "#/lesson/" + e(v.id);
    case "newlesson": return "#/new-lesson" + (v.topic ? "/" + e(v.topic) : "");
    case "practice": return "#/practice/" + e(v.topic) + "/" + e(v.qid);
    case "quiz": return "#/quiz/" + e(v.topic);
    case "report": return "#/report/" + e(v.id);
    case "review": case "interview": case "settings": case "stories": return "#/" + v.name;
    default: return "#/";
  }
}
function parseRoute(h){
  let parts = []; try{ parts = (h || "").replace(/^#\/?/, "").split("/").map(decodeURIComponent); }catch(e){}
  const [name, a, b] = parts;
  if(name === "topic" && TOPIC[a]) return {name, topic: a, tab: ["lessons","cards","practice","quiz"].includes(b) ? b : "lessons"};
  if(name === "lesson" && a) return {name, id: a};
  if(name === "new-lesson") return {name: "newlesson", topic: TOPIC[a] ? a : ""};
  if(name === "practice" && TOPIC[a] && b) return {name, topic: a, qid: b};
  if(name === "quiz" && TOPIC[a]) return {name, topic: a};
  if(name === "report" && a) return {name, id: a};
  if(["review","interview","settings","stories"].includes(name)) return {name};
  return {name: "learn"};
}

    PR = {topic: v.topic, qid: v.qid, answer:"", status:"idle", result:null, err:"", showKeys:false, start:Date.now()};

  if(v.name === "review" && !RV) return {name: "learn"};

}

// Người dùng dán nội dung hồ sơ LinkedIn (LinkedIn không cho trình duyệt đọc trực tiếp từ link).
// AI tóm tắt thành các vị trí đã làm; bản tóm tắt cùng kho câu chuyện được gửi kèm prompt của câu hỏi về kinh nghiệm.
let ME = {editing:false, status:"idle", err:""};
const LI_URL_RE = /^\s*(https?:\/\/)?([\w-]+\.)?linkedin\.com\/\S*\s*$/i;
function hasMe(){ return !!S.me.raw.trim(); }
function normMeSum(o){
  o = o && typeof o === "object" ? o : {};
  const arr = (x, n) => Array.isArray(x) ? x.map(v => clean(v)).filter(Boolean).slice(0, n) : [];
  const roles = (Array.isArray(o.roles) ? o.roles : []).filter(r => r && typeof r === "object")
    .map(r => ({title: clean(r.title), company: clean(r.company), period: clean(r.period), points: arr(r.points, 5)}))
    .filter(r => r.title || r.company).slice(0, 10);
  return {headline: clean(o.headline), years: clean(o.years), roles, skills: arr(o.skills, 15), education: arr(o.education, 4)};
}
function meSumText(sm){
  const L = [];
  if(sm.headline) L.push(sm.headline);
  if(sm.years) L.push("Số năm kinh nghiệm: " + sm.years);
  for(const r of sm.roles) L.push("- " + [r.title, r.company, r.period].filter(Boolean).join(", ") + (r.points.length ? ": " + r.points.join("; ") : ""));
  if(sm.skills.length) L.push("Kỹ năng: " + sm.skills.join(", "));
  if(sm.education.length) L.push("Học vấn: " + sm.education.join("; "));
  return L.join("\n");
}
function meText(){ return S.me.sum ? meSumText(normMeSum(S.me.sum)) : S.me.raw.trim().slice(0, 6000); }
const EXP_RE = /kể về|kể cho|một lần|kinh nghiệm|bản thân|sự nghiệp|vì sao bạn|giới thiệu về|thất bại|xung đột|bất đồng|tell me|a time|walk me through|your experience|yourself|your career|why do you want|why (are|did) you|failure|conflict|disagree/i;
// Câu hỏi về kinh nghiệm: mọi câu của chủ đề Hành vi, hoặc câu có dấu hiệu hỏi về trải nghiệm của bản thân
function isExpQ(topic, text){ return topic === "behavioral" || EXP_RE.test(text || ""); }
function storyReady(x){ return !!(x && x.title && (x.s || x.a || x.r)); }
function hasPersonal(){ return hasMe() || S.stories.some(storyReady); }
function storyText(x){ return `"${x.title}"${x.tags.length ? " (" + x.tags.map(t => STORY_TAGS[t] || t).join(", ") + ")" : ""}. Bối cảnh: ${x.s} Nhiệm vụ: ${x.t} Hành động: ${x.a} Kết quả: ${x.r}`; }
function personalCtx(){
  const parts = [];
  if(hasMe()) parts.push("Hồ sơ kinh nghiệm thật của ứng viên (từ LinkedIn, CV):\n\"\"\"\n" + meText() + "\n\"\"\"");
  const st = S.stories.filter(storyReady);
  if(st.length) parts.push("Kho câu chuyện STAR ứng viên đã chuẩn bị:\n" + st.slice(0, 12).map(x => "- " + storyText(x).slice(0, 900)).join("\n"));
  return parts.join("\n");
}
const NO_INVENT = "Chỉ dùng chi tiết có trong hồ sơ và kho câu chuyện của ứng viên; không bịa công ty, dự án, chức danh hay số liệu. Chỗ còn thiếu thì ghi trong ngoặc vuông, ví dụ [điền số liệu thật].";

"""
${S.me.raw.trim().slice(0, 15000)}
"""
Tóm tắt kinh nghiệm làm việc của người này để dùng khi luyện phỏng vấn. Chỉ ghi điều có trong hồ sơ, không suy diễn, không bịa. Giữ nguyên tên công ty, chức danh và số liệu. Viết bằng tiếng Việt (tên riêng và chức danh giữ nguyên).
roles xếp từ gần nhất, tối đa 8 vị trí, mỗi vị trí tối đa 4 points là việc đã làm hoặc thành tích cụ thể. Nếu nội dung không phải hồ sơ nghề nghiệp thì để roles rỗng.
Chỉ trả về JSON: {"headline":"1 câu: vai trò hiện tại và thế mạnh chính","years":"tổng số năm đi làm, ví dụ 5 năm; để trống nếu không rõ","roles":[{"title":"chức danh","company":"công ty","period":"thời gian","points":["việc cụ thể, giữ số liệu"]}],"skills":["kỹ năng"],"education":["trường, ngành"]}`;
    const sum = normMeSum(await sample.json(prompt, {cache:false}));
    if(S.me.at === at){
      if(!sum.roles.length && !sum.headline) throw {code:"not_profile"};

  ME.status = "idle";
  if(view.name === "settings" || view.name === "stories") render();
}
function meSave(){
  const raw = ((document.getElementById("me-raw") || {}).value || "").trim();

  if(!raw) return fail("Dán hồ sơ LinkedIn hoặc tải CV lên trước khi lưu.");
  if(LI_URL_RE.test(raw)) return fail("LinkedIn không cho app đọc hồ sơ từ đường link. Mở trang hồ sơ, chép nội dung theo hướng dẫn rồi dán vào đây.");
  if(raw.length < 80) return fail("Nội dung quá ngắn. Hãy dán ít nhất phần Kinh nghiệm trong hồ sơ.");
  ME.editing = false; ME.err = "";
  if(raw === S.me.raw.trim() && S.me.sum){ render(); return; }

// Đọc CV ngay trên trình duyệt: PDF bằng pdf.js, DOCX bằng mammoth (tải từ CDN khi cần), TXT đọc thẳng
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/", MAMMOTH = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js";
const CV_MAX = 10 * 1024 * 1024;
function loadScript(src){ return new Promise((ok, no) => { const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => no({code:"cv_lib"}); document.head.appendChild(el); }); }
async function pdfText(buf){
  if(!window.pdfjsLib) await loadScript(PDFJS + "pdf.min.js");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
  const doc = await window.pdfjsLib.getDocument({data: buf}).promise, out = [];
  for(let i = 1; i <= Math.min(doc.numPages, 20); i++){
    const tc = await (await doc.getPage(i)).getTextContent();
    out.push(tc.items.map(it => (it.str || "") + (it.hasEOL ? "\n" : "")).join(""));
  }
  return out.join("\n\n");
}
async function docxText(buf){
  if(!window.mammoth) await loadScript(MAMMOTH);
  return (await window.mammoth.extractRawText({arrayBuffer: buf})).value || "";
}
async function cvText(file){
  if(file.size > CV_MAX) throw {code:"cv_big"};
  const name = (file.name || "").toLowerCase();
  if(/\.(txt|md)$/.test(name) || file.type === "text/plain") return await file.text();
  if(/\.pdf$/.test(name) || file.type === "application/pdf") return await pdfText(await file.arrayBuffer());
  if(/\.docx$/.test(name)) return await docxText(await file.arrayBuffer());
  throw {code:"cv_type"};
}
function cvErrText(e){
  const c = e && e.code;
  if(c === "cv_big") return "File lớn hơn 10 MB. Hãy chọn file nhỏ hơn.";
  if(c === "cv_type") return "Chỉ đọc được file PDF, DOCX hoặc TXT. File .doc cũ hãy lưu lại thành .docx hoặc PDF.";
  if(c === "cv_empty") return "Không đọc được chữ trong file. CV dạng ảnh scan thì hãy chép nội dung và dán vào ô bên dưới.";
  if(c === "cv_lib") return "Không tải được công cụ đọc file (cần mạng). Hãy chép nội dung CV và dán vào ô bên dưới.";
  return "Không đọc được file này. Hãy chép nội dung CV và dán vào ô bên dưới.";
}
async function meUpload(input){
  const file = input.files && input.files[0]; input.value = "";
  if(!file) return;
  const st = document.getElementById("me-file-st"), setSt = (msg, err) => { if(st){ st.textContent = tr(msg); st.className = err ? "note err" : "small muted"; st.style.display = "block"; } };

  }catch(e){ console.warn("cv", e); setSt(cvErrText(e), true); }
}

function sessionById(id){ return IV && IV.id === id ? sessionFromIV() : Store.sessions.find(x => x.id === id); }
async function ivAdd(sessId, i){

let RV = null;
function startReview(ids, from, topic){
  ids = ids.slice().sort(() => Math.random() - .5);
  RV = {queue: ids, idx: 0, flipped: false, ai: null, from, topic, done: 0};

}
function nextIntervals(id){
  const i = (S.cards[id] && S.cards[id].i) || 0;
  return {again: 0, hard: Math.max(1, i * 1.2), good: i < 1 ? 1 : i * 2.5, easy: i < 1 ? 4 : i * 3.5};
}
function vReview(){
  const backBtn = RV && RV.from === "topic" ? `<button class="btn ghost back" data-act="open-topic" data-topic="${RV.topic}">← ${esc(TOPIC[RV.topic].name)}</button>` : `<button class="btn ghost back" data-go="learn">← Kiến thức</button>`;

    return `<div class="stack">${backBtn}<div class="deck"><div class="postit" style="cursor:default"><p class="front">Xong ${RV ? RV.done : 0} thẻ.</p><p>Thẻ bạn chưa nhớ sẽ quay lại sau 10 phút, còn lại sẽ hẹn ôn vào những ngày tới.</p></div>

  }
  const id = RV.queue[RV.idx], c = cardById(id), nx = nextIntervals(id);
  const ai = RV.ai;
  return `<div class="stack">${backBtn}
  <div class="deck">
    <p class="small muted">Thẻ ${RV.idx + 1}/${RV.queue.length}, chủ đề ${esc(TOPIC[c.topic].name)}</p>
    <button class="postit" id="card" data-act="flip" aria-label="${RV.flipped ? "Đáp án đang hiện" : "Chạm để xem đáp án"}">
      <span class="front">${esc(c.front)}</span>
      ${RV.flipped ? `<span class="back">${esc(c.back)}</span>` : `<span class="hint">Tự trả lời trong đầu, rồi chạm để xem đáp án</span>`}
    </button>
    ${RV.flipped ? `<div class="rate">
      <button class="btn again" data-act="rate" data-r="again">Chưa nhớ<small>${fmtInterval(nx.again)}</small></button>
      <button class="btn" data-act="rate" data-r="hard">Hơi nhớ<small>${fmtInterval(nx.hard)}</small></button>
      <button class="btn good" data-act="rate" data-r="good">Nhớ rồi<small>${fmtInterval(nx.good)}</small></button>
      <button class="btn" data-act="rate" data-r="easy">Quá dễ<small>${fmtInterval(nx.easy)}</small></button>
    </div>
    ${ai ? `<div class="ai-box"><p class="small muted" style="margin-bottom:6px">AI giải thích thêm</p><p class="prewrap ${ai.status === "loading" && !ai.text ? "thinking" : ""}" id="ai-explain">${esc(ai.text || (ai.status === "loading" ? "Đang suy nghĩ…" : ""))}</p>${ai.err ? `<p class="note err">${esc(ai.err)}</p>` : ""}</div>`
      : `<button class="btn ghost" data-act="explain">Hỏi AI: ví dụ thực tế và câu hỏi phỏng vấn liên quan</button>`}` : ""}
  </div></div>`;
}
function rate(r){
  const id = RV.queue[RV.idx], nx = nextIntervals(id), now = Date.now();
  const rec = S.cards[id] || {i:0, n:0};

  rec.due = r === "again" ? now + 10 * 60000 : now + rec.i * DAY;
  S.cards[id] = rec;
  save();
  RV.idx++; RV.done++; RV.flipped = false; RV.ai = null;
  render();
}

function compareHtml(prev, res, answer, progress){
  const dl = res.overall - prev.s, pm = new Map((prev.c || []).map(([n, v]) => [n, v]));
  const delta = d => `<span class="delta ${d > 0 ? "up" : d < 0 ? "down" : ""}">${d > 0 ? "+" : ""}${d}</span>`;
  const rows = res.scores.filter(x => pm.has(x.criterion)).map(x => `<div class="cmp-row"><span>${esc(x.criterion)}</span><span class="muted">${pm.get(x.criterion)}</span><span>→</span><b>${x.score}</b>${delta(x.score - pm.get(x.criterion))}</div>`).join("");
  return `<section class="panel stack cmp" style="--gap:12px"><h3>So với lần trước</h3>
    <div class="cmp-head"><span class="muted">Lần trước <b>${prev.s}</b></span><span>→</span><span>Lần này <b>${res.overall}</b></span>${delta(dl)}</div>
    ${progress ? `<p>${esc(progress)}</p>` : ""}
    ${rows ? `<div class="cmp-rows">${rows}</div>` : ""}
    <details><summary style="cursor:pointer">Xem hai câu trả lời cạnh nhau</summary><div class="grid2 cmp-ans"><div><p class="small muted">Lần trước, ${fmtDate(prev.d)}</p><div class="prewrap">${esc(prev.a)}</div></div><div><p class="small muted">Lần này</p><div class="prewrap">${esc(answer)}</div></div></div></details>
  </section>`;
}

function fbPanel(title, items, tone){
  return items.length ? `<section class="panel fb fb-${tone}"><h3>${title}</h3><ul class="list">${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>` : "";

// Dàn ý AI trả về dạng "- Ý: giải thích" mỗi dòng: hiện thành danh sách, phần trước dấu hai chấm in đậm
function outlineHtml(text){
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const bullet = l => /^[-•*]\s*/.test(l);
  if(lines.filter(bullet).length < Math.max(2, lines.length / 2)) return `<div class="prewrap">${esc(text)}</div>`;
  return `<ul class="list">${lines.map(l => {
    const t = l.replace(/^[-•*]\s*/, ""), i = t.indexOf(":");
    return `<li>${i > 0 && i < 48 ? `<b>${esc(t.slice(0, i + 1))}</b>${esc(t.slice(i + 1))}` : esc(t)}</li>`;
  }).join("")}</ul>`;
}
function renderEval(r, opts){
  opts = opts || {};
  const vc = scoreColor(r.overall);
  return `<div class="stack eval" style="--gap:16px">
  <div class="verdict" style="--vbg:${scoreSoft(r.overall)};--vc:${vc}"><span class="num">${r.overall}<small>/100</small></span><span class="vbody"><span class="vt">${VERDICT_TEXT[r.verdict]}</span>${r.summary ? `<span class="vsum">${esc(r.summary)}</span>` : ""}</span></div>
  ${r.scores.length ? `<section class="panel"><h3>Điểm theo tiêu chí</h3>${r.scores.map(s => `<div class="crit"><span class="c-name">${esc(s.criterion)}</span>${bar(s.score * 20)}<b>${s.n ? s.right + "/" + s.n : `${s.score}<span class="muted">/5</span>`}</b>${s.comment ? `<span class="c-comment">${esc(s.comment)}</span>` : ""}</div>`).join("")}</section>` : ""}
  ${r.strengths.length || r.improvements.length ? `<div class="grid2 fb-grid">${fbPanel("Làm tốt", r.strengths, "good")}${fbPanel("Cần cải thiện", r.improvements, "improve")}</div>` : ""}
  ${fbPanel("Ý còn thiếu", r.missing, "missing")}
  ${r.betterAnswer ? `<section class="panel fb fb-outline"><h3>Dàn ý tham khảo</h3>${outlineHtml(r.betterAnswer)}<p class="small muted">Đây là một cách tiếp cận, không phải đáp án duy nhất.</p></section>` : ""}
  ${!opts.practice && !opts.noTopics && r.weakTopics.length ? `<section class="stack" style="--gap:10px"><h3>Nên ôn tiếp</h3><div class="chips">${r.weakTopics.map(t => `<button class="chip" data-act="open-topic" data-topic="${t}">${esc(TOPIC[t].name)}</button>`).join("")}</div></section>` : ""}
  </div>`;
}

function termLi(s){

  return i > 0 && i < 48 ? `<b>${esc(s.slice(0, i))}</b>: ${esc(s.slice(i + 2))}` : esc(s);
}
function lessonHtml(l){
  return l.b.map(([k, v]) => {
    if(k === "p") return `<p>${esc(v)}</p>`;
    if(k === "h") return `<h2>${esc(v)}</h2>`;
    if(k === "ul") return `<ul class="list">${v.map(x => `<li>${termLi(x)}</li>`).join("")}</ul>`;
    if(k === "ol") return `<ol class="list">${v.map(x => `<li>${termLi(x)}</li>`).join("")}</ol>`;
    if(k === "ex") return `<div class="lex"><p class="small muted">Ví dụ</p><p class="prewrap">${esc(v)}</p></div>`;
    if(k === "warn") return `<div class="lwarn"><h3>Lỗi hay gặp</h3><ul class="list">${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    if(k === "q") return `<div class="lq"><h3>Có thể gặp trong phỏng vấn</h3><ul class="list">${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    if(k === "tip") return `<p class="note">${esc(v)}</p>`;
    return "";
  }).join("");
}
function lessonPlain(l){

}

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function prepQuestions(list){
  return list.map(item => {
    const order = shuffle(item.o.map((_, i) => i));
    return {c: item.c, q: item.q, o: order.map(i => item.o[i]), a: order.indexOf(item.a), x: item.x};
  });
}
function bankQuiz(){ return prepQuestions(shuffle(QUIZ_BANK).slice(0, QUIZ_SIZE)); }
function newQuiz(questions, ctx, topic, source){
  return {questions, answers: {}, idx: 0, start: Date.now(), duration: QUIZ_MIN * 60000, submitted: false, ctx, topic, source, result: null};
}
function startLearnQuiz(topic, questions, source){
  QZ = newQuiz(questions, "learn", topic, source);
  go("quiz", {topic});
}
let qgenState = {topic:null, status:"idle", err:""};
async function genQuiz(topic){

    const prompt = `Soạn một bài test trắc nghiệm ${QUIZ_SIZE} câu, giống bài test trực tuyến các công ty công nghệ dùng để sàng lọc ứng viên product, chủ đề "${t.name}" (${t.desc}).
${profileText()}
Yêu cầu:

- Mỗi câu có đúng 4 lựa chọn, chỉ 1 đáp án đúng, các đáp án sai phải hợp lý chứ không ngớ ngẩn, độ dài các lựa chọn tương đương nhau.
- Không hỏi về tên model, giá cụ thể hay sự kiện có thể đã lỗi thời; nếu cần số liệu thì cho số liệu giả định ngay trong đề.

- Viết bằng tiếng Việt, thuật ngữ chuyên ngành giữ tiếng Anh khi phổ biến.
- Trường c chọn một trong: ${cats}.
Chỉ trả về JSON: {"questions":[{"c":"eval","q":"câu hỏi","o":["A","B","C","D"],"a":0,"x":"giải thích"}]}`;
    const res = await sample.json(prompt, {cache:false});
    const qs = (res && Array.isArray(res.questions) ? res.questions : []).filter(q => q && q.q && Array.isArray(q.o) && q.o.length === 4 && Number.isInteger(Number(q.a)) && q.a >= 0 && q.a < 4)

function quizRemaining(){ return Math.max(0, QZ.duration - (Date.now() - QZ.start)); }
function fmtClock(ms){ const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2,"0") + ":" + String(s % 60).padStart(2,"0"); }
function catName(c, topic){ return QUIZ_CATS[c] || (TOPIC[topic] ? TOPIC[topic].name : "Chung"); }
function quizEval(qz){
  const n = qz.questions.length;
  let right = 0; const byCat = {};
  qz.questions.forEach((q, i) => { const ok = qz.answers[i] === q.a; if(ok) right++; const k = q.c || "general"; byCat[k] = byCat[k] || {r:0, n:0}; byCat[k].n++; if(ok) byCat[k].r++; });
  const overall = Math.round(right / n * 100);
  const cats = Object.entries(byCat);
  const used = Math.min(qz.duration, (qz.endedAt || Date.now()) - qz.start);
  return {
    scores: cats.map(([c, v]) => ({criterion: catName(c, qz.topic), score: Math.round(v.r / v.n * 5), right: v.r, n: v.n, comment: ""})),
    overall, verdict: verdictOf(overall),
    summary: `${right}/${n} câu đúng, làm trong ${fmtClock(used)}${Object.keys(qz.answers).length < n ? `, bỏ trống ${n - Object.keys(qz.answers).length} câu` : ""}.`,
    strengths: cats.filter(([, v]) => v.r === v.n).map(([c]) => "Nắm chắc: " + catName(c, qz.topic)),
    improvements: cats.filter(([, v]) => v.r / v.n < .6).map(([c]) => "Ôn lại: " + catName(c, qz.topic)),
    missing: [], betterAnswer: "", weakTopics: overall < 70 ? [qz.topic] : []
  };
}

// Đọc chính tả bằng Web Speech API: chữ được điền thẳng vào ô trả lời để sửa trước khi gửi
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let MIC = null, micErr = "";
const MIC_SVG = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const STOP_SVG = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>';
function micBtn(target){
  if(!SpeechRec) return "";
  const on = !!(MIC && MIC.target === target);
  return `<button class="btn mic${on ? " on" : ""}" data-act="mic" data-target="${target}" aria-pressed="${on}" title="${on ? "Dừng ghi âm" : "Trả lời bằng giọng nói"}">${on ? STOP_SVG : MIC_SVG}${on ? "Dừng" : "Trả lời"}</button>`;
}
function micNote(target){ return micErr && (!MIC || MIC.target === target) ? `<p class="note err">${esc(micErr)}</p>` : ""; }
function stopMic(){ if(MIC){ const r = MIC.rec; MIC = null; try{ r.stop(); }catch(e){} } }
function toggleMic(target){
  const same = MIC && MIC.target === target;
  stopMic(); micErr = "";
  if(same){ render(); return; }
  const ta = document.getElementById(target); if(!ta) return;
  const lang = target === "iv-answer" && IV ? IV.lang : S.profile.lang;
  const rec = new SpeechRec();
  rec.lang = lang === "en" ? "en-US" : "vi-VN"; rec.continuous = true; rec.interimResults = true;
  const base = ta.value.trim() ? ta.value.replace(/\s*$/, " ") : "";
  let done = "";
  rec.onresult = e => {
    let interim = "";
    for(let i = e.resultIndex; i < e.results.length; i++){ const r = e.results[i]; if(r.isFinal) done += r[0].transcript; else interim += r[0].transcript; }
    const el = document.getElementById(target);
    if(el){ el.value = base + done + interim; el.dispatchEvent(new Event("input", {bubbles: true})); }
  };
  rec.onerror = e => {
    if(e.error === "no-speech" || e.error === "aborted") return;
    micErr = e.error === "not-allowed" || e.error === "service-not-allowed" ? "Trình duyệt chưa cho phép dùng micro. Bấm biểu tượng ổ khóa cạnh thanh địa chỉ để cho phép, rồi thử lại." : "Không ghi âm được. Hãy thử lại hoặc gõ câu trả lời.";
  };
  rec.onend = () => { if(MIC && MIC.rec === rec) MIC = null; render(); };
  MIC = {target, rec};
  try{ rec.start(); }catch(e){ MIC = null; micErr = "Không ghi âm được. Hãy thử lại hoặc gõ câu trả lời."; }
  render();
  const el = document.getElementById(target); if(el) el.focus();
}

  const head = `<div class="page-head"><div class="stack" style="--gap:6px"><h1>${single && report ? "Kết quả vòng " + esc(ROUNDS[s.rounds[0]].name) : "Tổng kết buổi phỏng vấn"}</h1>
  <p class="muted small">${s.jdName ? "JD " + esc(s.jdName) + ". " : ""}${esc(ROLES[s.role] ? ROLES[s.role].name : "")}, ${esc(LEVELS[s.level] || "")}, ${esc(COMPANY_SHORT[s.company] || "")}${s.market ? ", " + esc(marketName(s.market)) : ""}. ${fmtDate(s.createdAt)}</p></div>${actions ? `<div class="row page-actions">${actions}</div>` : ""}</div>`;
  if(single && report) return head;
  return `${head}
  <div class="verdict" style="--vbg:${fv.bg};--vc:${fv.c}"><span class="num">${ov}<small>/100</small></span><span class="vbody"><span class="vt">${fv.t}</span><span class="vsum">${fv.d}</span></span></div>
  ${single ? "" : `<section class="panel"><h3 style="margin-bottom:6px">Các vòng</h3>${s.rounds.map(rid => { const res = s.results.find(x => x.roundId === rid); return `<div class="crit"><span class="c-name">${esc(ROUNDS[rid].name)}</span>${res ? bar(res.eval.overall) : `<span class="small muted">Chưa thi</span>`}<b>${res ? res.eval.overall : ""}</b></div>`; }).join("")}</section>`}
  ${weak.length ? `<section class="stack" style="--gap:10px"><h3>Nên ôn tiếp</h3><div class="chips">${weak.map(t => `<button class="chip" data-act="open-topic" data-topic="${t}">${esc(TOPIC[t].name)}</button>`).join("")}</div></section>` : ""}`;
}

function arm(btn, msg){
  if(btn.dataset.armed === "1") return true;
  btn.dataset.armed = "1"; const old = btn.textContent; btn.textContent = tr(msg);
  setTimeout(() => { if(btn.isConnected){ btn.dataset.armed = ""; btn.textContent = old; } }, 4000);
  return false;
}

      ["The AARRR funnel","Acquisition, Activation, Retention, Referral, Revenue. Used to find where users drop off the most."],
      ["Google's HEART framework","Happiness, Engagement, Adoption, Retention, Task success. Paired with Goals → Signals → Metrics to choose experience metrics."],
      ["Counter metric","A metric you watch so that optimizing one number doesn't break something else. If you push more notifications to raise DAU, watch notification opt-outs and uninstalls."],
      ["A metric drops suddenly: first step?","Check whether the data is real: tracking bugs, changed definitions, seasonality, holidays. Then segment by time, platform, app version, region and user segment."],
      ["Statistical significance in an A/B test","The chance of seeing the difference purely by randomness is low (commonly p < 0.05). You need a large enough sample and shouldn't stop early just because results look good."],
      ["Cohort retention","Group users by start date and track how many come back over time. A curve that flattens means the product retains that group."],
      ["Leading vs lagging indicators","Leading indicators are early and predictive (onboarding completion). Lagging indicators confirm results but arrive late (revenue, 90-day retention)."],
      ["What is a metric tree for?","It breaks the North Star Metric into branches that add or multiply together, down to metrics one team can move within a quarter. Each leaf should have an owning team and a few counter metrics."],
      ["Why not pick total sign-ups as the NSM?","It is a cumulative metric that can only go up, so it says nothing about whether users still get value. Pick a metric with a clear time frame, such as users with a successful transaction each week."],
      ["Should a funnel count users or sessions?","Users reflect behavior better; sessions suit optimizing individual purchases. What matters is never mixing the two units in one funnel and choosing a clear time window."],
      ["Is the step with the biggest drop-off the one to fix first?","Not necessarily. Weigh how many people pass through it, how hard it is to fix, and whether the drop is normal behavior (like browsing without adding to cart). Always watch the overall rate, since optimizing one step may just push low-quality users to the next."],
      ["How does day-N retention differ from unbounded retention?","Day N: the share of users who return exactly on day or week N. Unbounded: the share who return on day N or any time after, which suits irregular-use products like hotel booking."],
      ["What do you learn reading a cohort table by row versus by column?","Reading a row shows how one cohort decays over time. Reading a column compares newer cohorts with older ones at the same point, showing whether product improvements are working."],
      ["What is MDE and how does it affect sample size?","Minimum detectable effect is the smallest change you want to detect. Halving the MDE requires roughly four times the sample."],
      ["What is sample ratio mismatch (SRM)?","The actual group split deviates from the design, for example a planned 50/50 that comes out 52/48. It usually comes from assignment or logging bugs, so check for SRM before reading results; if it exists, the results cannot be trusted."],
      ["How is a Key Result different from an output?","A Key Result is a measurable outcome with a baseline and target, such as reducing complaints about failed transactions. \"Launch the refund feature\" is an output that belongs in the plan, not in the Key Results."],
      ["What OKR completion rate is considered good?","For ambitious OKRs, reaching about 70% is usually considered good. If you hit 100% every quarter, your goals may be too safe."],
      ["Should LTV be based on revenue or contribution margin?","On contribution margin: revenue per order minus variable costs like driver fees, payment gateway fees, promotions and support. A simple estimate is monthly contribution margin × average months a customer stays."],
      ["What is the payback period?","The number of months it takes for a customer's contribution margin to cover their CAC. Shorter means less risk, and it should be read alongside the LTV/CAC ratio."],
      ["Why does INNER JOIN often break conversion rate calculations?","INNER JOIN drops users with no orders from the denominator, pushing the rate toward 100%. To keep every user, LEFT JOIN from the users table to the orders table."],
      ["What should you check before trusting numbers you pulled yourself?","Count users with COUNT(DISTINCT), filter out test accounts, internal accounts and canceled orders, then reconcile against a known figure such as the official dashboard."]
    ],
    execution: [
      ["The RICE formula","Reach × Impact × Confidence ÷ Effort. Useful for comparing, but the numbers are estimates. Explaining the assumptions matters more than the score."],
      ["MoSCoW","Must, Should, Could, Won't (this time). Good for agreeing on the scope of a release with stakeholders."],
      ["The Kano model","Basic features (annoying if missing), performance features (more is better), delighters (unexpected). Over time, delighters become basics."],
      ["A good user story (INVEST)","\"As a [who], I want [what], so that [value]\" plus acceptance criteria. INVEST: Independent, Negotiable, Valuable, Estimable, Small, Testable."],
      ["Gherkin-style acceptance criteria","Given (context), When (action), Then (expected result). Helps PM, dev and QA share the same definition of \"done\"."],
      ["Outcome-based roadmap","Organized around problems to solve and desired outcomes (Now / Next / Later) instead of a feature list with fixed dates."],
      ["A stakeholder asks for extra work mid-sprint","Ask about the underlying problem and urgency, show the trade-off (what gets dropped to add this), decide based on shared goals. Don't accept immediately, and don't refuse immediately."],
      ["Why leave buffer capacity in quarterly planning?","Because bugs, tech debt and urgent work always come up. Teams usually reserve a share (for example an assumed 20 to 30%) so the plan doesn't break at the first incident."],
      ["The test question for every roadmap item","If we finish this, which metric changes? An item that can't answer this is usually just one department's request, not tied to a goal."],
      ["What must a good PRD make clearest?","Why we're doing it (a problem backed by evidence) and what done looks like (measurable goals with a counter metric). How to build it is decided together with the team."],
      ["Why does a PRD need a \"not doing\" section?","So everyone shares the same understanding of scope and to prevent scope creep later. Example: allow changing the delivery time, but not the address or the dishes."],
      ["What do story points measure?","The relative complexity of work, not a direct conversion to hours. Estimates are predictions, and the newer the work, the higher the uncertainty."],
      ["Cutting scope while keeping the value","Keep the main flow that solves the core problem, handle rare cases manually at first, start with one user group or one city. Never cut testing, security or tracking."],
      ["Why is backlog refinement so important for a PM?","It's where stories get clarified and split before sprint planning. Done well, planning focuses on commitment instead of turning into a requirements discussion."],
      ["Scrum or Kanban?","Scrum suits teams building new features at a steady sprint cadence. Kanban suits operations, support or teams with a continuous flow of small tasks, focusing on WIP limits and cycle time."],
      ["How do feature flags help a launch?","They separate deploying code from releasing to users: turn on, off or roll out by percentage without shipping a new build. Remove old flags so the code doesn't get messy."],
      ["What are rollout stop criteria?","Pre-agreed thresholds for metrics getting worse (error rate, cancellations, complaints) that pause the rollout when reached. Agree on them before launch day, not in the middle of an incident."],
      ["One-way doors and two-way doors","Reversible decisions (changing button copy) should be made fast: try and learn. Hard-to-reverse decisions (changing the fee model, partner commitments) need more care and more perspectives."],
      ["What is a fake door test?","Showing an option or button for a feature that isn't built yet to measure how many people actually choose it. Cheap and can be stopped anytime, but treat the people who clicked fairly."],
      ["Novelty effect","Users try a new feature a lot in the first days, then usage drops off. So look at retention after a few weeks before calling a feature a success."],
      ["When should you sunset a feature?","When, after several iterations, few people come back to it and maintenance cost outweighs the value. Don't keep it because of sunk cost; notify current users and remove the code and flags."]
    ],
    strategy: [
      ["Signs of product-market fit","Retention curves flatten, organic growth through referrals, and in a Sean Ellis survey at least 40% of users say they'd be \"very disappointed\" to lose the product."],
      ["Network effect","The product becomes more valuable as more people use it. Direct (social networks, messaging) or indirect (two-sided marketplaces)."],
      ["What is a moat?","A hard-to-copy advantage: network effects, switching costs, proprietary data, brand, economies of scale. For AI products the model itself is rarely the moat; data and workflow are."],
      ["TAM, SAM, SOM","Total market, the part you can serve, the part you can realistically capture. Bottom-up estimates are usually more credible than top-down."],
      ["Build, buy or partner?","Weigh how core it is to strategy, speed to market, long-term cost, control, and the risk of depending on a third party."],
      ["Marketplaces: the chicken-and-egg problem","Start narrow (one area or vertical), subsidize the harder side, play the supply side yourself at first, and create value for one side even when the other is small."],
      ["How to approach estimation questions","Break it into factors that multiply, state assumptions with round numbers, calculate step by step out loud, and sanity-check the final number."],
      ["Who are a product's competitors?","Not just direct competitors, but indirect ones (same need, different approach), old habits like cash, Excel or phone calls, and the option of doing nothing. In Vietnam, old habits are often the biggest competitor."],
      ["How do you write a positioning statement?","For [customer segment] who has [need], [product] is a [product category] that [key benefit], unlike [alternative], it [differentiator]. Positioning for everyone means standing out to no one."],
      ["Common ways digital products make money","Transaction fees (take rate), subscriptions, advertising, freemium, and many products combine several. In interviews, be clear about the primary and secondary revenue streams."],
      ["What is contribution margin per order?","What's left per unit (one order, one paying user) after direct costs like driver pay, promotions and payment fees. It shows immediately how a decision such as bigger discounts affects profit."],
      ["What is a beachhead in go-to-market?","A narrow customer group with the strongest need, chosen as the starting point instead of the whole market. Winning there first concentrates budget and gives you a success story to expand from."],
      ["Product-led or sales-led?","Product-led: users find, try and upgrade on their own, suited to simple, low-priced products. Sales-led: a sales team approaches each customer, suited to high-value B2B products with complex buying processes."],
      ["What is marketplace liquidity?","The share of requests that get fulfilled, for example the percentage of ride requests that find a driver. It's a more important health metric than GMV and should be tracked with match time and supply-demand balance."],
      ["When are network effects weaker than you think?","When they are local, when multi-homing is easy, when they saturate (more supply no longer makes customers happier), or when both sides get to know each other and transact directly, bypassing the platform."],
      ["Four directions for growth","Go deeper in the current market, new products for existing customers, existing products for new markets, and new products for new markets. The further from your current strengths, the higher the risk."],
      ["When should you acquire rather than build or partner?","When you need speed, or a team, technology or license that's hard to get yourself. The trade-off is high cost and the risk of integrating culture and systems."],
      ["Three approaches to pricing","Cost-based, competitor-based, and value-based. In practice, cost is the floor, customer value is the ceiling, and competitors show what customers are comparing you with."],
      ["What is a value metric?","The unit you charge by, which grows with the value the customer gets, such as number of orders, staff users or transactions. The right value metric means customers pay more when they benefit more."],
      ["Key traits of Vietnamese users to remember","Mobile-first, Zalo and Facebook as main channels for communication and selling, QR payments common but cash and COD still present, price sensitivity, and trust as a big barrier for finance and health products."],
      ["Why isn't Southeast Asia one market?","Each country differs in language, payment methods, popular messaging apps, regulation and logistics, and often has strong local players. Success in Vietnam still requires deep localization elsewhere."]
    ],
    ai: [
      ["When should you NOT use AI?","When simple rules work well, when a single error has serious consequences and no one checks it, when there's no way to evaluate quality, or when cost exceeds the value."],
      ["Hallucination and how to reduce it","The model produces plausible-sounding but wrong information. Reduce it with RAG and citations, a limited scope, allowing \"I don't know\", and regular evaluation."],
      ["Prompting, RAG or fine-tuning?","Prompting: fast, cheap, always try first. RAG: when you need private or frequently updated knowledge. Fine-tuning: when you need very consistent style or format at scale; it requires data preparation."],
      ["What does an eval for an AI feature include?","A representative test set including hard cases, clear scoring criteria, grading by humans and/or LLM-as-judge, rerun every time the prompt or model changes."],
      ["Precision vs recall","Precision: of what the system flags as positive, how much is actually correct. Recall: of everything actually positive, how much the system catches. Prioritize based on the cost of each type of error."],
      ["Human-in-the-loop","People review or correct AI output at high-risk steps. It reduces risk and creates feedback data to improve the system."],
      ["What drives the cost of an LLM feature?","Input and output tokens, number of calls per user, and the chosen model. Reduce it with smaller models for simple tasks, caching, shorter context, and calling AI only when needed."],
      ["Good offline eval but poor online metrics?","The test set doesn't represent real data, or the results are correct but the experience is poor (slow, hard to trust, wrong place in the flow). Look at real logs and talk to users."],
      ["In what order should you choose a model?","Set the quality bar, latency limit and budget first. Try a strong model to find the quality ceiling, then try smaller models on the same eval and stop at the cheapest one that still meets the bar."],
      ["Why does architecture often save more than switching to a cheaper model?","Deciding when to call the model (precompute, store results, rerun only when something changes) can turn a cost that grows with page views into a nearly fixed cost. Users also get results instantly because they don't wait for the model."],
      ["Where do RAG failures usually come from?","Mostly from the data and the retrieval step, not the model: outdated documents left in the store, misread tables, poor chunking, or failing to find the right passage. That's why retrieval should be measured on its own."],
      ["How do hybrid search and reranking help?","Semantic search catches different phrasings, keyword search catches product codes or clause numbers; combining both usually works better. Reranking takes many results and picks the few closest passages before sending them to the model."],
      ["Workflow or agent?","A fixed workflow is the default: easy to control and measure. Use an agent only when the path varies case by case and there are too many combinations to script; a sensible first step is often AI suggests, a human confirms."],
      ["Why must an agent's safety limits live in the system?","Prompts can be subverted through prompt injection. Limits such as a maximum refund or maximum number of steps enforced in the API hold even if the model is manipulated."],
      ["Which stages of data flow should a PM track for an AI feature?","Collection (what is used, did users consent), sending out (does it leave your infrastructure or the country), storage (where, how long, who can read it) and reuse (is it used for training or evals)."],
      ["What do data minimization and masking mean?","Send the model only the data needed for the task, and mask or replace phone numbers, ID numbers and card numbers before sending and before logging. For example, summarizing a complaint doesn't need the full account number."],
      ["What are the four layers of post-launch metrics for an AI feature?","Usage (trial and repeat use), real-world quality (acceptance, edits, re-asks, handoffs to humans), business outcomes (conversion, handling time, retention) and guardrails (cost, latency, complaints, incidents)."],
      ["Why shouldn't you compare AI feature users with non-users?","People who choose to use AI are often more engaged to begin with, so the gap isn't caused by the feature. Use an A/B test or holdout, and run long enough to get past the novelty effect."],
      ["What's a framework for AI feature design questions?","Clarify goals and users, ask whether AI is really needed, split work between AI and people, design for when AI is wrong, define measurement (eval, post-launch metrics, guardrails), cover data and cost risks, then plan a gradual rollout."],
      ["Common mistakes in AI PM interviews?","Answering every problem with \"build a chatbot\", using lots of jargon without explaining how to measure quality, ignoring what happens when AI is wrong, or promising 100% accuracy."]
    ],
    behavioral: [
      ["The STAR structure","Situation, Task, Action, Result. Spend most of your time on Action (what you did) and Result (with numbers if possible)."],
      ["Say \"I\" or \"we\"?","Use \"I\" for your own actions; the interviewer is evaluating you. Credit the team in the result."],
      ["A good failure story","A real failure, with your share of responsibility, a specific lesson learned, and evidence that you applied the lesson later."],
      ["Disagreeing with an engineer or designer","Understand their reasoning first, ground the discussion in data and user goals, agree on how to decide, and be willing to \"disagree and commit\"."],
      ["Influence without authority","Understand each party's motivations, use data and user stories, build allies early, and let others co-own the solution."],
      ["\"Why do you want to work here?\"","Connect the company's product or mission to your specific experience. Mention a genuine observation about their product."],
      ["How many stories should you prepare?","About 6 to 8 flexible stories: success, failure, conflict, deciding with limited data, leadership, persuasion."],
      ["How should you pick a failure story?","A real failure with clear consequences, where part of the fault is yours, not a disaster like leaking customer data or a legal breach, and old enough that you have since applied the lesson on a later project."],
      ["Which part of a failure answer is scored most?","The specific lesson and evidence you applied it, which should take at least a third of the answer. The lesson must be a change in how you work, not a generic line like \"I need to communicate better\"."],
      ["First step when handling a conflict in the team?","Understand before persuading: ask questions to find the other side's real concern, which usually sits behind their surface position. Then bring the discussion back to shared goals and data."],
      ["What is a \"third option\" in a conflict?","A choice that meets both sides' core needs instead of picking a winner, such as cutting scope, running an experiment or a phased launch. Then make clear who decides and why."],
      ["A PM's sources of influence without authority?","Deeper user understanding than others, reasoning tied to each team's goals, credibility built by keeping promises and being transparent, good relationships, and involving people early."],
      ["Why meet stakeholders one-on-one before a big meeting?","To hear objections early and shape the proposal around what they care about, so you are not blocked by surprise in the meeting. Afterwards, confirm the decision, owner and deadline in writing."],
      ["How is good mentoring different from doing the work for someone?","A mentor assigns work at the right stretch and lets the person decide, for example agreeing which decisions they can make alone and which need discussion, then steps back gradually. Doing it for them solves today's task but they don't grow."],
      ["What framework works for a mentoring story?","Who the person was and where they stood, how you diagnosed the gap, what you did, what they can now do that they couldn't before, and what you learned about leading."],
      ["How to answer \"Why do you want to be a PM?\" convincingly?","Start from a real experience where you already did PM-like work, say which parts of the job you enjoy and show you understand its hard sides. Avoid \"the PM is the CEO of the product\" or \"PMs get to make decisions\"."],
      ["What should \"Why this company?\" include?","A specific observation from actually using the product, what excites you about the problem they solve, why their stage suits you, and which of your experience can help them right away."],
      ["What to ask the hiring manager at the end?","Expectations after 3 to 6 months, the metrics the team owns and which one is struggling, the biggest current challenge, or a hard product decision made recently."],
      ["Reverse questions to avoid?","Anything already on the website or job description, salary and time off in the first round, the same generic question for every interviewer, or piling on questions when time is up."],
      ["Why always confirm gross or net when discussing salary?","In Vietnam the two figures differ significantly because of tax and insurance. Mixing them up can cost you a large amount while you think you got your target."],
      ["If base salary can't go up, what can you negotiate?","Other parts of the package: a signing bonus, ESOP, title, leave days, or an early salary review with clear criteria. Put every agreed point in the written offer letter."]
    ]

      {id:"e6", q:"Write the key sections of a PRD for letting customers change the delivery time after ordering on a food delivery app.", k:["An evidence-backed problem, with assumptions stated", "Measurable goals plus a counter metric", "Scope and a not-doing section", "Edge cases: restaurant already cooking, driver already assigned", "Required tracking and open questions"]},
      {id:"e7", q:"Engineering estimates a new feature at 3 sprints, but the business wants it live in a sprint and a half to catch Tet. What do you do?", k:["Understand what the estimate is based on; don't push the number down", "Go back to the core problem to define the main flow", "Cut scope: handle rare cases manually, start with one user group", "Don't cut testing, security or tracking", "Record temporary workarounds and tech debt to address later", "Present the trade-offs clearly to stakeholders"]},
      {id:"e8", q:"Your team keeps missing its sprints because the sales team keeps inserting urgent work. How do you investigate and fix it?", k:["Find the root cause with data and the retrospective", "A clear sprint goal to guide decisions when new work appears", "Reserve fixed capacity for urgent work", "An intake rule: goes through the PM, swapped for work of the same size", "Work with stakeholders to plan earlier", "Measure the sprint goal completion rate after the change"]},
      {id:"e9", q:"Your digital bank is about to launch scheduled money transfers. Describe your launch plan.", k:["Feature flag and a kill switch tested in advance", "Staged rollout: internal first, then increasing percentages", "Success criteria and stop criteria defined upfront", "Dashboards, alerts and on-call people for launch day", "Prepare support and operations; check legal and security", "Rollback plan: who decides, who executes, how long it takes"]},
      {id:"e10", q:"An e-commerce app wants to add a paid membership but has no data on whether users are willing to pay. How do you make the decision?", k:["Classify the decision: one-way or two-way door", "Compare the cost of waiting with the cost of being wrong", "Write down the key assumption and what would disprove it", "Quick signals: user interviews, Fermi estimates", "A small experiment such as a fake door for a user group", "Record the reasoning and set a review date"]},
      {id:"e11", q:"The savings goals feature you launched 6 weeks ago has many people creating goals but very few making a second deposit. What do you do next?", k:["Compare against the goals set before launch", "Analyze the funnel and segment by user group", "Read qualitative feedback to find the cause", "Separate the novelty effect from lasting change", "Decide to invest, iterate or stop, with clear criteria", "If stopping: notify users, offer alternatives, remove the code"]}
    ],
    strategy: [
      {id:"t1", q:"Should a ride-hailing app launch a grocery shopping service?", k:["Clarify the strategic goal (usage frequency, super app)","Assets to leverage: drivers, users, payments","Market and competitors","Risks: operations, quality, unit economics","How to run a small test before investing heavily"]},
      {id:"t2", q:"Estimate the number of monthly active e-wallet users in Vietnam.", k:["Break the problem into clear factors","Round-number assumptions with reasons","Segment by age or region","A clear calculation","Sanity-check the result"]},
      {id:"t3", q:"A competitor just launched, for free, a feature identical to your flagship feature. How do you respond?", k:["Don't react hastily; assess the real impact with data","Understand why users choose you","Your hard-to-copy advantages","Options and trade-offs","Which metrics to watch"]},
      {id:"t4", q:"How would you take a Vietnamese sales-management SaaS product to Southeast Asia?", k:["Choose the first market with clear criteria","Differences in payments, language, regulation and sales channels","What needs localizing","Channels and partners","Metrics and validation milestones"]},
      {id:"t5", q:"A new digital bank wants to attract young people, while the big banks' apps already have almost every feature. How would you analyze the competition and position the product?", k:["Pick a specific customer segment to analyze", "List indirect competitors and old habits too", "Compare on the criteria customers use to choose, not feature counts", "Find gaps no one serves well", "Write a clear positioning statement and differentiator"]},
      {id:"t6", q:"An e-wallet offers free money transfers to users. How does it make money, and which revenue stream would you prioritize?", k:["Distinguish primary and secondary revenue streams", "Who pays: users, merchants or advertisers", "Direct costs per transaction", "Which streams fit the wallet's advantages and data", "Impact on user experience and trust", "Unit economics with assumed numbers"]},
      {id:"t7", q:"How would you take a sales-management app for small shop owners to market?", k:["Choose a beachhead: the shop owners with the strongest need", "Messaging that states the benefit in the customer's words", "Fitting channels: field sales, Zalo, distribution partners", "Pricing and offers that lower the barrier to trying", "Phased launch with criteria to move on", "Measure retention, not just downloads"]},
      {id:"t8", q:"How would you kick-start a marketplace connecting tutors and parents?", k:["Start with the harder side to acquire", "Narrow the scope: one city, one subject, one grade level", "Standalone value for one side", "Deliberate subsidies with a plan to taper", "Measure liquidity, match time and repeat rate", "Risk of both sides transacting directly and bypassing the platform"]},
      {id:"t9", q:"An e-wallet wants to add insurance products. Should it build, buy or partner?", k:["Is this a core differentiating capability", "Requirements for licenses, capital and expertise", "How fast it needs to reach the market", "Total cost of each option over several years", "Dependency risk and exit options", "What the wallet should own: experience, timing of offers, data"]},
      {id:"t10", q:"How would you price sales-management software for coffee shops?", k:["Understand the customers and the value they get", "Cost is the floor, value the ceiling, competitors the reference point", "Choose a value metric and design tiers", "Freemium, free trial, monthly or annual", "How to test prices safely and fairly", "Measure revenue per customer and retention, not just conversion"]},
      {id:"t11", q:"A doctor-appointment booking app that succeeded abroad wants to enter Vietnam. What would you adapt?", k:["State market assumptions and how to validate them", "Real users: adult children booking for their parents", "Notifications and support via Zalo", "Fitting payments: QR, pay at the counter", "Start in one city, don't treat it as the whole country", "Trust and legal risks around health data"]}
    ],
    ai: [
      {id:"a1", q:"Design an AI assistant that answers customer questions for a digital bank.", k:["Limit the scope of questions and what it won't do","RAG over official documents, with citations","Handoff to a human when needed","An evaluation plan before launch","Data security, compliance and success metrics"]},
      {id:"a2", q:"A support chatbot answers about 5% of questions about service fees incorrectly. Should you launch?", k:["Severity of the wrong answers","Compare with the current approach (call center, FAQ)","Mitigations: restrict topics, cite sources, hand off to humans","Phased launch with close monitoring","Clear decision criteria"]},
      {id:"a3", q:"How would you build an evaluation plan for an AI meeting-summary feature?", k:["Define what a good summary is","A representative test set including hard cases","How to grade: humans, LLM-as-judge, or both","Online metrics after launch","A feedback loop for improvement"]},
      {id:"a4", q:"Estimate the monthly cost of an AI email-summary feature for 1 million users, and how you would reduce it.", k:["Assume active users and emails per user","Input and output tokens per summary","An assumed model price and the calculation","Compare with value or revenue","Cost reduction: smaller model, caching, summarize only when needed"]},
      {id:"a5", q:"An AI feature that suggests product descriptions for sellers on an e-commerce marketplace uses a large model: quality is good, but it's slow and over budget. How would you choose a model and optimize?", k:["Define the quality bar, latency limit and budget per use", "Test smaller models on the same eval", "Routing: small model for simple cases, large model for hard ones", "Optimize architecture: when to call the model, store results, streaming", "Unit economics versus value created for sellers", "Keep the ability to switch models when better options appear"]},
      {id:"a6", q:"An insurance company's internal RAG assistant often gives wrong answers about policy benefits. How do you investigate and improve it?", k:["Separate failures in data, retrieval or answer generation", "Check document versions, effective dates and data owners", "Measure retrieval on its own: is the right passage found", "Improve chunking, hybrid search, reranking, metadata filters", "Verifiable citations and behavior when nothing is found", "Access control and adding failure cases to the eval set"]},
      {id:"a7", q:"An intercity bus ticketing app wants an AI agent to change and cancel tickets on customer request via chat. How would you design it?", k:["Assess whether an agent is needed or a fixed workflow is enough", "Least privilege: only the necessary tools", "Classify actions by risk, require confirmation for money-related actions", "Hard limits in the system, defenses against prompt injection", "Step-by-step logs, a kill switch, handoff to a human", "Metrics: completion rate, wrong-action rate, satisfaction"]},
      {id:"a8", q:"A clinic booking app wants AI to summarize patients' symptoms for the doctor before the visit. How do you handle data and privacy?", k:["Map the data flow: collection, sending out, storage, reuse", "Clear consent and transparency with patients", "Minimize data and mask identifiers before sending to the model", "Vendor commitments: no retention, no training, processing location", "Access control, log retention limits, right to delete", "Involve legal and security early"]},
      {id:"a9", q:"You launched an AI feature that suggests replies for an e-wallet's customer support agents. Three months later, leadership asks whether it's worth further investment. How do you prove impact?", k:["Usage metrics, especially repeat use", "Real-world quality: acceptance rate, edit rate of suggestions", "Business outcomes: handling time, customer satisfaction", "Comparison design: rollout by team or shift, holdout", "Watch for the novelty effect and self-selection bias", "AI cost versus value, guardrail metrics"]},
      {id:"a10", q:"Design an AI feature that helps small grocery store owners manage inventory and restocking.", k:["Clarify goals and user characteristics", "Ask whether AI is really needed or simple rules are enough", "Split work between AI and people; the owner approves before ordering", "Design for when AI is wrong and how to correct it", "Pre-launch eval, post-launch metrics and guardrails", "Data risks, cost and a gradual rollout plan"]}
    ],
    behavioral: [
      {id:"b1", q:"Tell me about a time you made a product decision with limited data.", k:["Context and why the decision mattered","How you reduced uncertainty","The decision and its reasoning","Outcome","Lesson"]},
      {id:"b2", q:"Tell me about a time you disagreed with an engineer or designer.", k:["Clear context","How you understood their perspective","How you reached a decision together","Outcome and the relationship afterwards","Lesson"]},
      {id:"b3", q:"Tell me about a product or feature you worked on that failed.", k:["A real failure, without dodging","Your share of responsibility","How you detected and handled it","A specific lesson","How you applied the lesson"]},
      {id:"b4", q:"Tell me about a time you persuaded a senior stakeholder to change a decision.", k:["Context and why you disagreed","How you prepared (data, allies)","How you presented it","Outcome","What you'd do differently"]},
      {id:"b5", q:"What is the biggest wrong decision of your PM career? If you could do it again, what would you do differently?", k:["Context and initial expectations", "The outcome fell short, with numbers if possible", "Root cause and your share of the fault, told with \"I\"", "How you limited the damage at the time", "The lesson as a concrete change in how you work", "Evidence you applied it on a later project"]},
      {id:"b6", q:"Tell me about a time marketing or business wanted to launch in time for a big event, while engineering said there wasn't enough time to do it right. You were in the middle. How did you handle it?", k:["Each side's real concern behind their surface position", "Bringing it back to shared goals and users", "Data or evidence instead of personal opinion", "A third option: cut scope, phased launch", "Who decides, and how you would escalate if needed", "Outcome and the relationships afterwards"]},
      {id:"b7", q:"Tell me about a time you persuaded a team outside your authority, such as operations, compliance or another squad, to change their priorities to support your project.", k:["Stakeholder map: who decides, who is affected, who can block", "Understanding that team's metrics and concerns", "Framing the proposal around their interests", "Lowering the risk with a small experiment and a clear stop point", "Confirming commitments in writing", "Outcome and what you learned"]},
      {id:"b8", q:"Tell me about a PM or colleague you helped grow. How did they change?", k:["Who they were, their strengths and initial gaps", "How you diagnosed and asked what they wanted to develop", "Stretch work and clear decision rights instead of doing it for them", "Direct, timely feedback with examples", "Their measurable progress", "What you learned about leading"]},
      {id:"b9", q:"Why do you want to be a Product Manager, and why did you choose our company over our competitors?", k:["A real experience showing you already did PM-like work", "An accurate view of the PM job, including its hard sides", "A specific observation from using the product", "Why their problem and stage suit you", "Which experience can help them right away"]},
      {id:"b10", q:"Your interview with the hiring manager of an e-wallet is ending and you're asked: \"Do you have any questions for us?\". What would you ask and why?", k:["Questions based on using the product or recent news", "Expectations for the role after 3 to 6 months", "Metrics the team owns and current challenges", "How the team makes product decisions", "Asking about any concerns on your fit", "Avoiding questions answered in the job description or asking about salary too early"]},
      {id:"b11", q:"You receive a PM offer, but the number is about 10% below what you hoped for (assumption). How would you respond and negotiate?", k:["Thank them, show interest, ask for time to consider", "Confirm gross or net and the full package", "Reasons based on scope, experience and market rates", "Propose a specific number", "Alternatives if base can't move: bonus, ESOP, early review", "Put every agreement in the offer letter"]}
    ]
  },
