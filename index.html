    strategy: [
      {id:"strategy-1", t:"Foundations of strategic thinking", m:5, b:[
        ["p","Strategy questions test whether you see the big picture: the market, competitors, the company's advantages, and where the product should go."],
        ["ul",["Product-market fit: the product satisfies a large enough market; signs are flattening retention and organic growth","Network effects: value grows with more users, directly (messaging apps) or indirectly (two-sided marketplaces)","Moat: hard-to-copy advantages like network effects, switching costs, proprietary data, brand, scale","Unit economics: whether each customer or order is profitable, comparing CAC (acquisition cost) with LTV (lifetime value)"]],
        ["h","A framework for analysis"],
        ["ol",["The company's goals and current position.","Customers and unmet needs.","Competitors and substitutes.","Your unique advantages.","Options, trade-offs and how to test them."]],
        ["warn",["Talking vaguely about \"huge market potential\" without numbers or reasons","Ignoring unit economics"]]
      ]},
      {id:"strategy-2", t:"\"Should we do X?\" questions", m:5, b:[
        ["p","The form \"should company A launch service B or enter market C?\". Answer with structure, and end with a clear point of view."],
        ["ol",["Strategic goal: why the company wants it (usage frequency, new revenue, defense).","Market: size, growth, who's already there.","Advantages: assets to leverage like users, network, brand, data.","Risks: operations, legal, cannibalizing the core product, opportunity cost.","How to test: small scope, metrics and thresholds for scaling up or stopping.","Conclusion: yes, no, or yes with conditions."]],
        ["ex","A ride-hailing app launching grocery shopping: it can use drivers during off-peak hours and its existing users, and it increases app opens. Risks are fresh-goods quality operations and thin margins. Recommend testing in two districts with a few partner supermarkets for 8 weeks, measuring repeat orders and profit per order."],
        ["warn",["Not reaching a conclusion","Forgetting opportunity cost: doing this means not doing something else"]]
      ]},
      {id:"strategy-3", t:"Estimation questions", m:5, b:[
        ["p","Estimation questions test how you break down a problem and reason with uncertain numbers. The final number matters less than how you get there."],
        ["ol",["Clarify the question: count what, where, over what period.","Choose an approach: top-down (population times rates) or bottom-up (one outlet times number of outlets).","Write the formula first, then fill in numbers.","Use round numbers and give a reason for each assumption.","Calculate out loud step by step.","Sanity-check and say which assumption is least certain."]],
        ["ex","Monthly active e-wallet users in Vietnam ≈ population (about 100 million) × share aged 15 to 60 (assume 65%) × share with a smartphone and payment account (assume 70%) × share using an e-wallet at least once a month (assume 60%) ≈ 27 million. Then compare with figures published by the major wallets."],
        ["warn",["Calculating silently without explaining your reasoning","Using awkward non-round numbers"]]
      ]},
      {id:"strategy-4", t:"Competitive analysis and product positioning", m:6, b:[
        ["p", "Competitive analysis isn't about building a pretty feature comparison table. The goal is to answer: what options do customers have, why do they choose you or not, and where should you win. Positioning is the short answer to that last question."],
        ["h", "Identify the right competitors"],
        ["ul", ["Direct competitors: solve the same need in the same way, for example two food delivery apps", "Indirect competitors: same need, different approach, for example an office lunch shop that takes orders over chat, or a company canteen", "Substitutes and old habits: cash, notebooks, Excel, phone calls. For many products in Vietnam, these are the biggest competitors", "Doing nothing: users live with the problem because the cost of switching outweighs the pain"]],
        ["h", "Analyze from the customer's point of view"],
        ["ol", ["Pick one specific customer segment, since each segment uses different selection criteria.", "List the 4 to 6 criteria that segment actually uses to choose: price, speed, reliability, convenience, coverage.", "Rate yourself and each competitor on those criteria, based on data, user reviews or hands-on testing.", "Find the gaps: important criteria nobody does well, or a segment that is poorly served.", "Check whether you have a real advantage to fill that gap, or just a wish."]],
        ["p", "After the analysis, write a positioning statement: For [customer segment] who have [need], [product] is a [product category] that [key benefit], unlike [alternative], which [difference]. If you can't write this sentence clearly, the team will struggle to agree on priorities."],
        ["ex", "A new digital bank wants to compete with the big banks' apps.\nOn features, they're almost identical: transfers, QR, savings. But for students and young professionals, the main criteria are fast account opening, no fees, an easy interface and spending management.\nThe positioning could be: for young professionals who want control over their money, this is a digital bank that opens an account in minutes and shows clearly where the money goes, unlike traditional banking apps that focus on transactions rather than managing spending."],
        ["h", "When a competitor launches a new feature"],
        ["ul", ["Ask first: what problem does it solve, for whom, and does it matter to your target customers", "Check the data: are your users leaving or asking for it", "Copy it only when it has become table stakes in the market; otherwise invest in your own differentiation", "Don't let competitors drive your roadmap"]],
        ["warn", ["Listing only direct competitors and ignoring old habits and manual workarounds", "Comparing feature counts instead of the criteria customers use to choose", "Positioning for everyone, so you stand out to no one", "Reacting to every competitor move"]],
        ["q", ["Who are the competitors of a food delivery app in Vietnam? How would you differentiate?", "A competitor just launched a feature that users love. Do you copy it?", "Position a new e-wallet in a market that already has several large wallets."]]
      ]},
      {id:"strategy-5", t:"Business models and how products make money", m:6, b:[
        ["p", "A PM doesn't just build products users like, but products that keep the company alive. Understanding where the money comes from helps you explain why a feature is prioritized, and keeps you from proposing things that work against the business model."],
        ["h", "Common ways to make money"],
        ["ul", ["Transaction fees (take rate): a percentage of each transaction, as with e-commerce marketplaces, food delivery apps, payment gateways", "Subscription: a recurring monthly or yearly fee, as with music apps and B2B software (SaaS)", "Advertising: users use it for free, advertisers pay to reach them, as with social networks and news apps", "Freemium: a free basic version, pay to unlock features or remove limits", "Direct sales: buy or make goods and sell them, with profit from the margin", "Financial services: interest from lending, fees for distributing insurance or investment funds, common in e-wallets and digital banks"]],
        ["p", "Many products combine several sources. An e-commerce marketplace may charge sellers, sell in-platform ads and charge shipping service fees. In interviews, state clearly which revenue stream is primary and which are secondary."],
        ["h", "Look at the economics of one order"],
        ["p", "The fastest way to understand a model is to break down one unit: one order, one paying user, one loan. Work out how much is left after direct costs (contribution margin)."],
        ["ex", "One food delivery order, all numbers assumed:\nOrder value 150,000 VND, the platform takes a 25% commission from the restaurant = 37,500 VND.\nDelivery fee paid by the customer: 15,000 VND. Total platform revenue: 52,500 VND.\nPaid to the driver: 25,000 VND. Discount code: 10,000 VND. Payment fee: 2,000 VND.\nAbout 15,500 VND remains per order to cover marketing, technology and operations.\nThis shows right away: adding another 10,000 VND of promotion per order wipes out almost two thirds of what remains, so you need to prove it brings in enough extra orders."],
        ["h", "The business model shapes product decisions"],
        ["ul", ["Advertising: time spent drives revenue, but too many ads ruin the experience. The PM has to balance the two", "Take rate: raising fees increases short-term revenue, but sellers may leave or raise prices for buyers", "Subscription: retention matters more than downloads; value must be felt again every month", "Lending: fast growth is easy, controlling bad debt is the survival problem"]],
        ["tip", "When you propose a feature in an interview, add one sentence on how it affects revenue or cost. It's a big plus with manager-level interviewers."],
        ["warn", ["Talking only about revenue and forgetting direct costs per order", "Proposing a feature that cuts into the main revenue stream without realizing it", "Assuming free for users means nobody pays", "Growing through subsidies with no path to profit"]],
        ["q", ["How does a food delivery app make money? How would you improve profit per order?", "An e-wallet offers free transfers to users. How does it make money?", "How would you decide when a feature that improves the experience reduces ad revenue?"]]
      ]},
      {id:"strategy-6", t:"Go-to-market: bringing a product to market", m:6, b:[
        ["p", "A great product that nobody knows about or tries might as well not exist. Go-to-market (GTM) is the plan for getting the product to the right customers, through the right channels, with the right message. PMs usually don't own marketing or sales, but they must lead so everyone understands who the product is for and why."],
        ["h", "The parts of a GTM plan"],
        ["ol", ["First customers: pick a narrow segment with the strongest need to start with (a beachhead), instead of targeting the whole market.", "Message: one sentence that states the benefit in the customer's language, not feature names.", "Channels: where customers discover, try and buy the product.", "Price and launch offers: whether you need a free trial or promotion to lower the barrier.", "Scope and timing: where to launch, for whom first, and whether to avoid peak operational seasons.", "Metrics and thresholds: what to measure in the first weeks, when to scale up, when to adjust."]],
        ["h", "Choosing the right channels"],
        ["ul", ["Product-led: users find it, try it and upgrade on their own; suits easy-to-understand, low-price products", "Sales-led: a sales team approaches each customer; suits high-value B2B products with complex buying processes", "Field sales: teams visit each shop, the way wallets and banks spread QR codes to small merchants", "Distribution partners: go through banks, telcos or retail chains that already have customers", "Cross-sell within the ecosystem: place the new feature in a flow users already use daily in a super app", "Community and influencers: Facebook groups, Zalo, TikTok; suits consumer products that need to spread"]],
        ["h", "Launch in stages"],
        ["p", "Instead of launching to everyone at once, go step by step: internal use, a beta with a small group, open to one city or a percentage of users, then expand. Each step has clear criteria to move on. Not every update needs a big campaign; tier your launches so resources go to what matters."],
        ["ex", "An e-wallet launches buy now, pay later.\nFirst customers: users who have paid regularly with the wallet for many months and have a good history, since there's data to assess risk.\nMessage: buy what you need today, pay on payday, no fee if you pay on time.\nChannel: shown right at checkout with a few e-commerce partners, no mass advertising.\nScope: open to a small share of eligible users, tracking activation, repeat use and late payment rates before expanding."],
        ["warn", ["Targeting everyone from the start and spreading the budget thin", "A message that describes features instead of benefits", "Forgetting to prepare customer support and operations before launch day", "Measuring downloads or sign-ups without measuring whether users come back"]],
        ["q", ["How would you bring a sales management app for small shop owners to market?", "Plan the launch of a new feature for millions of existing users.", "A newly launched product has many downloads but few returning users. What do you do next?"]]
      ]},
      {id:"strategy-7", t:"Network effects, marketplaces and durable competitive advantage", m:7, b:[
        ["p", "Many large products in Vietnam are marketplaces: ride-hailing, food delivery, e-commerce, hotel booking. They are strong thanks to network effects, but those effects are hard to create at the start and often weaker than people think. This lesson goes deeper into how to build and assess them."],
        ["h", "The chicken-and-egg problem"],
        ["p", "Buyers won't come without sellers, and sellers won't come without buyers. Some ways to break the loop:"],
        ["ul", ["Start with the harder side: usually supply, like drivers, restaurants, trusted sellers", "Narrow the scope: one city, one district, one category, to get dense enough before expanding", "Targeted subsidies: reward the side that's lacking, with a plan to taper off", "Single-player value: the product is useful even without the network, like an order management tool for sellers before opening the marketplace", "Bring your own supply: list or operate supply yourself at first"]],
        ["h", "Measuring marketplace health"],
        ["ul", ["Liquidity: the share of requests fulfilled, like the percentage of ride requests that find a driver", "Match time: how long a rider waits for a driver, how long an order waits for a courier", "Supply-demand balance: driver earnings per hour, share of sellers with orders each week", "Concentration: a few large sellers taking most orders is a risk", "Multi-homing: the share of users and partners using several platforms in parallel"]],
        ["h", "When network effects are weaker than you think"],
        ["ul", ["Local network effects: drivers in Hanoi don't help riders in Da Nang, so competitors can attack city by city", "Easy multi-homing: drivers and riders install several apps, and switching costs almost nothing", "Saturation: once wait times are short enough, adding drivers barely improves satisfaction", "Disintermediation: buyers and sellers get to know each other and trade directly over chat to avoid fees"]],
        ["p", "So durable advantage is usually a combination: network effects plus switching costs (history, balances, ratings), data that improves matching, scale that lowers costs, and a trusted brand."],
        ["ex", "A new ride-hailing app wants to enter a market with two giants.\nDon't fight nationwide. Pick one city, focus on recruiting enough drivers to match competitors' wait times, cut the driver commission so they prioritize your rides, then measure wait times and rider return rates. Because drivers and riders use several apps, the giants' advantage in each city is thinner than it looks; but sustaining subsidies long term is very expensive, so you need another differentiator such as safety or serving business customers."],
        ["warn", ["Claiming every marketplace has strong network effects without analysis", "Trying to grow both sides at once across a wide area", "Measuring only GMV without liquidity and match time", "Forgetting that subsidies also attract users who only come for promotions"]],
        ["q", ["How would you launch a marketplace connecting tutors and parents?", "Why do ride-hailing apps still compete fiercely even though they all have network effects?", "What is the durable competitive advantage of an e-commerce marketplace?"]]
      ]},
      {id:"strategy-8", t:"Expansion: new products, new markets, build, buy or partner", m:6, b:[
        ["p", "Once the core product is stable, the next question is where growth comes from. This lesson helps you choose an expansion direction and decide how to execute it: build, acquire or partner. It's a common topic in interviews with leadership."],
        ["h", "Four directions for expansion"],
        ["ul", ["Go deeper in the current market: more users, higher frequency, more value per transaction with the existing product. Lowest risk", "New products for existing customers: leverage the existing user base and trust, like a ride-hailing app adding food delivery", "Existing products for new markets: take the product to another city, another customer segment, or another country", "New products for new markets: diversification, the highest risk because little can be leveraged"]],
        ["p", "The further you move from current strengths, the higher the risk. A good answer usually starts by pointing out which company assets the expansion leverages."],
        ["h", "Build, buy or partner"],
        ["ul", ["Build: when it's a core capability that creates differentiation, you need control over experience and data, and you have enough time. The downside is that it's slow and resource-heavy", "Buy: when you need speed, or a team, technology or license that's hard to get. The downside is cost and the risk of integrating culture and systems", "Partner: when it isn't core, needs a specialized license, or you want to test quickly at low cost. The downside is dependence on the partner and revenue sharing"]],
        ["ol", ["Is this a core capability that differentiates us?", "How fast do we need to get to market?", "Do we already have the capabilities, data and licenses needed?", "What is the total cost of each option over a few years, including maintenance?", "If it doesn't work, how easy is it to exit?"]],
        ["ex", "An e-wallet wants to sell insurance.\nSetting up its own insurer requires a license, large capital and risk-pricing expertise, which aren't the wallet's strengths. Buying an insurer is too expensive for an experiment.\nThe most sensible path is to partner with an insurer for the product, while the wallet builds what it does well: a few-tap purchase experience, suggestions at the right moment (for example, offering travel insurance when someone buys a flight) and behavioral data. If insurance becomes a large business later, a deeper option can be revisited."],
        ["warn", ["Expanding before the core product has product-market fit", "Building everything yourself for control, ignoring opportunity cost", "Choosing a partnership without considering dependence risk and how to exit", "Assuming success in Hanoi and Ho Chi Minh City means success in the provinces"]],
        ["q", ["What service should a food delivery app add next? Why?", "Should a digital bank build its own credit scoring system or use a partner's?", "How would you assess a Vietnamese e-commerce marketplace expanding to another Southeast Asian country?"]]
      ]},
      {id:"strategy-9", t:"Pricing for PMs", m:6, b:[
        ["p", "Price is one of the strongest levers on revenue, yet it's often decided by gut feeling or by looking only at competitors. PMs need to treat price as part of the product: who pays, for what, how much and in what way."],
        ["h", "Three approaches to pricing"],
        ["ul", ["Cost-based: cost plus a margin. Easy, but ignores the value customers get", "Competitor-based: price close to other options in the market. Safe, but easily turns into a race to the bottom", "Value-based: based on the benefit customers get and what they're willing to pay. Hard to measure, but usually gives the best results"]],
        ["p", "In practice, cost is the floor, customer value is the ceiling, and competitors tell you what customers are comparing you with."],
        ["h", "Designing the price structure"],
        ["ul", ["Value metric: charge by something that grows with the value customers get, like number of orders, number of staff users, number of transactions", "Tiers: usually 2 to 3 tiers from basic to premium, with the middle one being the tier you want most people to choose", "Freemium or trial: freemium fits when the free version helps it spread; a time-limited trial fits when value takes time to show", "Monthly or yearly: a discounted yearly plan improves retention and brings cash upfront, a monthly plan lowers the initial barrier", "Promotions: help attract customers at first, but overuse trains them to buy only with a discount code"]],
        ["h", "Testing prices safely"],
        ["ol", ["Ask customers about willingness to pay: what price is suspiciously cheap, reasonable, expensive but still worth it, too expensive.", "Test prices with new users or in a separate market, avoiding two people seeing different prices for the same thing at the same time.", "Measure not just conversion but revenue per user, retention, refund rate and feedback.", "When raising prices for existing customers, give notice, explain the added value, and consider keeping the old price for a while."]],
        ["ex", "An English learning app, numbers assumed.\nMonthly plan 149,000 VND, yearly plan 990,000 VND. Vietnamese users are often sensitive to large one-off payments, so the monthly plan helps more people start. But if data shows monthly buyers often quit after the second month, the PM could try: a 7-day trial, then suggesting the yearly plan right when a learner completes a milestone, with an installment option through a wallet or card. The primary metric is revenue per new user after 6 months, not just first-day purchase rate."],
        ["tip", "In an interview, when asked what price to set, don't rush to a number. Ask about the customer, the value they get, costs and alternatives, then propose how to test."],
        ["warn", ["Pricing based only on cost or only copying competitors", "Discounting to grow without measuring whether customers stay after the promotion ends", "Measuring conversion and forgetting revenue and retention", "Price tests that make customers feel treated unfairly"]],
        ["q", ["How would you price sales management software for coffee shops?", "Should a food delivery app raise its delivery fee? How would you decide?", "Freemium or a 14-day free trial: which would you choose for a language learning app?"]]
      ]},
      {id:"strategy-10", t:"Reading the Vietnam and Southeast Asia market context", m:7, b:[
        ["p", "Interviewers in Vietnam value candidates who understand local users and markets, rather than applying templates from American or Chinese companies as-is. This lesson collects the traits that often affect product decisions. The market changes fast, so treat these as questions to check, and always refresh figures from reliable sources before using them."],
        ["h", "Traits to remember in Vietnam"],
        ["ul", ["Mobile-first: many people use the internet mainly through phones, sometimes low-end devices on unstable connections", "Messaging apps are the main channel: Zalo and Facebook are used for keeping in touch, selling, customer support and notifications", "Payments: QR bank transfers are very common, but cash and cash on delivery (COD) remain in many situations", "Price sensitivity: users are used to discount codes and free shipping, and compare prices across apps", "Trust: fear of scams and leaked personal data strongly affects sign-up, identity verification and payment", "Regional differences: behavior in Hanoi and Ho Chi Minh City differs a lot from small provinces and rural areas", "Changing regulations: rules on personal data, payments, lending and identity verification can change, so work with the legal team early"]],
        ["h", "Southeast Asia is not one market"],
        ["ul", ["Each country has its own language, payment methods, popular messaging apps and regulations", "Income levels and logistics infrastructure vary widely between and within countries", "Many countries have strong local companies that understand the market better than newcomers", "Data storage and licensing rules may require a local entity and local infrastructure", "A product that succeeds in Vietnam still needs real localization, not just a translated interface"]],
        ["h", "Bringing context into interview answers"],
        ["ol", ["State your market assumptions clearly, and acknowledge they need to be checked.", "Segment by region, age, income and familiarity with technology.", "Choose channels that fit local habits, for example Zalo, field sales teams, retail partners.", "Design payment and sign-up flows that fit local habits and levels of trust.", "Mention specific legal and operational risks."]],
        ["ex", "Prompt: design a strategy for a medical appointment booking app.\nA generic answer: build a nice app, run ads, integrate card payments.\nAn answer with context: bookings are often made by adult children for their parents, so allow several profiles in one account; send confirmations and reminders via Zalo because older people rarely open apps; support QR transfers and paying at the counter; start in one big city with a few private clinics before working with public hospitals, whose processes are more complex."],
        ["warn", ["Quoting market figures without a source and presenting them as fact", "Applying a foreign model as-is without adapting it", "Treating Hanoi and Ho Chi Minh City as representative of the whole country", "Treating Southeast Asia as a single market", "Ignoring trust and legal factors"]],
        ["q", ["A product that succeeded in the US wants to enter Vietnam. What would you adapt?", "Why does cash on delivery still exist even though QR payments are common?", "If the company wants to expand to another Southeast Asian country, what would you research first?"]]
      ]}
    ],
    ai: [
      {id:"ai-1", t:"How LLMs work, at the level a PM needs", m:6, b:[
        ["p","PMs don't need the math behind it, but must understand enough to know what AI can do, where it fails and what it costs."],
        ["ul",["Predicting what comes next: an LLM generates text by predicting small pieces (tokens) from context. It doesn't look up facts, so it can be wrong while sounding very confident","Tokens: the unit of text the model processes and the unit of pricing. Vietnamese usually takes more tokens than English for the same idea","Context window: the maximum tokens in one call, including instructions, documents, conversation history and the answer","Non-deterministic: the same question can produce different answers; higher temperature means more variety","Hallucination: making up plausible information. It can't be eliminated, only reduced","Knowledge cutoff: the model doesn't know events after its training unless you provide them"]],
        ["p","Product implication: every AI feature has an error rate. The PM's question isn't \"how do we never get it wrong\" but \"what error rate is acceptable, and what happens when it's wrong\"."],
        ["q",["Explain hallucination to a non-technical stakeholder.","Why does a chatbot answer the same question differently?"]]
      ]},
      {id:"ai-2", t:"Ways to build AI features", m:6, b:[
        ["p","Go from simple to complex, and only move up a level when the previous one isn't enough."],
        ["ol",["Prompting: write clear instructions with examples and a specific output format. Fast, cheap, always try first.","RAG (Retrieval-Augmented Generation): find relevant document passages and add them to the prompt. Use it when you need company-specific or frequently changing knowledge; it allows citations.","Fine-tuning: further training on your own data. Use it when you need very consistent style or format at scale; it takes effort to prepare data and maintain.","Agents: the model plans and calls tools (APIs, search, databases) over multiple steps. Powerful but hard to control; limit permissions and require confirmation before important actions."]],
        ["h","When not to use AI"],
        ["ul",["Clear rules that need perfect accuracy (fees, taxes)","A single error has serious consequences and nobody checks it","There's no way to evaluate quality","Cost and latency outweigh the value"]],
        ["ex","An HR policy Q&A chatbot: start with RAG over the employee handbook, answer with citations to the relevant section, and hand off to HR when a question involves a personal case. No fine-tuning needed."]
      ]},
      {id:"ai-3", t:"Quality evaluation (evals)", m:7, b:[
        ["p","Evals are the clearest skill separating strong AI PMs from people repeating the hype. Without evals you don't know how good the feature is, or whether changes make it worse."],
        ["h","Offline evals, before launch"],
        ["ul",["Test set (golden set): dozens to hundreds of representative examples, including hard and potentially harmful cases","Clear criteria: correct content, completeness, tone, safety","Grading: human graders, automatic matching, or LLM-as-judge (regularly compared with humans)","Rerun on every prompt, model or data change to catch regressions"]],
        ["h","Online evals, after launch"],
        ["ul",["Direct signals: likes or dislikes, whether users edit or discard output","Behavioral metrics: task success rate, handoff-to-human rate, retention","Read samples of real logs regularly"]],
        ["h","Precision and recall"],
        ["p","Precision: of what the system flags as positive, how much is actually correct. Recall: of everything actually positive, how much the system catches. Prioritize based on the cost of each error: fraud filtering favors recall, auto-sending replies to customers favors precision."],
        ["warn",["Judging by feel after a few tries","A test set with only easy cases"]]
      ]},
      {id:"ai-4", t:"Designing AI experiences and managing risk", m:7, b:[
        ["p","Because AI can be wrong, the experience has to be designed for both right and wrong answers."],
        ["ul",["Set expectations: tell users it's AI and what it's good at","Make it verifiable: cite sources, show the underlying data","Allow edits and undo: AI suggests, the user decides at important steps (human-in-the-loop)","Exit path: hand off to a human or a manual way of doing it","Latency: stream results, show progress, use faster models for simple steps"]],
        ["h","Cost"],
        ["p","Cost ≈ number of calls × (input tokens + output tokens) × price. Reduce it with smaller models for simple tasks, caching, shorter context, and calling AI only when truly needed. Always compare cost with value or revenue per user."],
        ["h","Safety and compliance"],
        ["ul",["Prompt injection: external content (emails, web pages) containing malicious instructions; treat data as data and limit the AI's permissions","Personal data: follow regulations and internal policy, anonymize where possible","Bias: check results across user groups when AI affects decisions about people"]],
        ["q",["A chatbot gets 5% of fee questions wrong. Should you launch?","How would you design the experience when the AI isn't sure of the answer?"]]
      ]},
      {id:"ai-5", t:"Cost, latency and choosing a model", m:6, b:[
        ["p", "The strongest model is not always the right choice. For a PM, picking a model is a product decision: balancing quality, cost and speed against the value the feature brings to users and to the business."],
        ["h", "Three axes of trade-off"],
        ["ul", ["Quality: larger models usually reason better, handle hard cases and produce more natural Vietnamese, but cost more and run slower", "Cost: charged per input and output token, multiplied by the number of calls. A feature that runs automatically for every user (for example summarizing every product review) costs very differently from one that runs only when a user taps a button", "Latency: time until the user sees the first word, and time to completion. Chat can tolerate a few seconds with streaming; search-as-you-type suggestions must feel almost instant", "Other constraints: whether data may leave the company, whether it must run on internal infrastructure, whether the vendor is stable and well supported"]],
        ["h", "Choosing a model step by step"],
        ["ol", ["Define the minimum bar: how much quality is enough (measured with evals), maximum latency, budget per user or per transaction.", "Try a strong model first to learn the quality ceiling. If even the best model falls short, the problem lies in the task or the data, not the model.", "Try progressively smaller models on the same eval set and stop at the cheapest one that still meets the bar.", "Consider routing: simple jobs like intent classification go to a small model, only hard cases go to a large one.", "Work out unit economics: AI cost per order, per session or per active user, compared with the revenue earned or cost saved.", "Design so the model can be swapped: models and prices change fast, so keep evals and the integration layer flexible enough to switch without a rebuild."]],
        ["ex", "Feature: summarizing product reviews on an e-commerce marketplace.\nAssumption: 2 million product pages with reviews, each summary uses about 3,000 tokens.\nIf you re-summarize every time someone views the page, cost grows with page views and gets very large. If you only summarize after 20 new reviews arrive and store the result, cost is almost fixed and users see the result instantly because they don't wait for the model.\nLesson: architecture (when you call the model) often saves more than switching to a cheaper model."],
        ["h", "Latency as users perceive it"],
        ["ul", ["Streaming: showing text as it is generated makes a 5-second wait feel acceptable", "Precompute: prepare results that can be predicted, such as summaries or suggestions", "Run in the background: long jobs like analyzing a bank statement should run in the background and notify when done, rather than making users stare at a loading screen", "Split the work: fast steps answer immediately, slow steps fill in later"]],
        ["warn", ["Choosing a model by leaderboards or news instead of your own product's evals", "Estimating cost with a few hundred beta users, then being surprised when opening to everyone", "Forgetting that long answers also cost money and time, not just the input", "Tying the product tightly to one model, making it hard to switch when a better option appears"]],
        ["q", ["Your AI feature works well but costs three times the budget. What do you do?", "How would you choose between a larger, more accurate model and a smaller, faster one?", "How do you know whether an AI feature is profitable?"]]
      ]},
      {id:"ai-6", t:"RAG in practice: data, retrieval and citations", m:7, b:[
        ["p", "On paper, RAG is simple: find relevant documents and give them to the model to answer. In practice, most failures of a RAG system come not from the model but from the input data and the search step. A PM needs to understand these failure points to ask the engineering team the right questions."],
        ["h", "Data: garbage in, garbage out"],
        ["ul", ["The right sources, with owners: each document set needs a person or team responsible for keeping it current. Without an owner, documents go stale", "Versions: if old and new fee schedules both sit in the store, the model may cite the old one. Tag effective dates and remove expired versions", "Formats: tables in PDFs, scanned images and Excel files are often read incorrectly when ingested. Check important document types carefully", "Access rights: branch staff must not see documents meant only for executives; the system must filter by the asker's permissions before anything reaches the model"]],
        ["h", "Retrieval: finding the right passage"],
        ["ul", ["Chunking: documents are cut into passages. Too small loses context, too large mixes in irrelevant information", "Semantic and keyword search: semantic search catches different phrasings, keyword search catches product codes, plan names and clause numbers. Combining both (hybrid) usually works better", "Reranking: retrieve many results, then pick the few most relevant passages before passing them to the model", "Metadata filters: product, region, effective date, customer type", "Measure retrieval separately: for each test question, check whether the right passage appears in the results. If retrieval is wrong, no model, however good, will answer correctly"]],
        ["h", "Citations and when nothing is found"],
        ["p", "Citations let users verify answers and help the team debug. Each important point should link to a specific source passage the user can open. Equally important is behavior when no suitable document exists: the system should say clearly that it found nothing and offer a way out, instead of letting the model guess."],
        ["ex", "An internal Q&A assistant for call-center agents at a digital bank.\nProblem after launch: the assistant gave the wrong fee for international transfers.\nInvestigation: the answer cited a real document, but it was last year's fee schedule still sitting in the store. The fault was in the data process, not the model.\nFix: tag every document with an effective date, prefer the latest version during retrieval, make the cards product team the owner of the fee schedule, and add fee questions to the eval set to rerun on every update."],
        ["warn", ["Dumping the company's entire shared drive into the system without cleanup or permissions", "Evaluating only the final answer and not the retrieval step, so you can't tell where the error is", "Showing citations whose sources don't actually contain the stated information", "Not designing a response for when nothing is found"]],
        ["q", ["Your RAG chatbot answered a policy question wrongly. How do you investigate?", "How do you make sure users only get information they are allowed to see?", "Which metrics would you use to measure the quality of a RAG system?"]]
      ]},
      {id:"ai-7", t:"AI agents and tool use: when to use them and how to limit risk", m:7, b:[
        ["p", "An agent is a system where the model decides its own next step and calls tools such as looking up orders, creating support tickets or issuing refunds. Agents open up many possibilities, but each autonomous step is another place where things can go wrong. A PM's first question is always: does this really need an agent?"],
        ["h", "When to use an agent"],
        ["ul", ["Fixed workflow: the steps are known in advance and AI handles only a few of them, such as classification or drafting. Easy to control and measure, and it should be the default", "Agent: use it when the path changes case by case, there are too many combinations to script, and users accept waiting longer to get the whole problem solved", "Signs you should stay with a workflow: 80% of cases follow a few familiar scenarios, or a single wrong step causes immediate financial loss", "A middle option: AI suggests the action and a staff member clicks to confirm. Often a sensible first step"]],
        ["h", "Limiting risk"],
        ["ol", ["Least privilege: the agent only gets the tools it needs. A customer-care assistant doesn't need permission to change product prices.", "Classify actions by risk: reading information can be automatic; reversible changes can be done and reported; anything involving money or that can't be undone requires confirmation from the user or a staff member.", "Hard limits live in the system, not in the prompt: for example a maximum refund per order and a maximum number of steps per session.", "Defend against prompt injection: content read from outside, such as customer notes or email text, must not be treated as instructions.", "Log every step in full so you can review and explain when there is a complaint.", "Have a quick kill switch and a path to a human."]],
        ["ex", "An order-issue assistant on a food delivery app.\nThe customer writes: \"I'm missing a bubble tea\".\nThe agent looks up the order, checks the driver's delivery photo and reviews the account's complaint history.\nIf the value is under the limit (assumed 50,000 VND) and the account shows nothing unusual: refund to the wallet and tell the customer.\nIf it exceeds the limit or looks like fraud: create a ticket with a summary for staff to approve.\nThe limit and checks live inside the refund API, so even if the prompt is tricked, the agent cannot exceed them."],
        ["h", "Measuring an agent"],
        ["ul", ["Rate of tasks completed end to end without human intervention", "Rate of wrong actions or actions that had to be reversed", "Average steps and time per task, which drive cost", "Customer satisfaction and repeat complaint rate"]],
        ["warn", ["Using an agent for a job that a few-step workflow could handle", "Putting safety rules only in the prompt instead of enforcing them in the system", "Giving the agent broad permissions from day one instead of expanding them based on measured results", "Demoing only the happy path and never testing customers who deliberately try to trick it"]],
        ["q", ["Would you let AI issue refunds automatically? How would you design it?", "When would you choose an agent over a fixed workflow?", "How do you stop users from tricking an agent into doing things outside its scope?"]]
      ]},
      {id:"ai-8", t:"Data, privacy and compliance in AI products", m:6, b:[
        ["p", "AI features often need user data to be useful, and that is also where trust is most easily lost. In Vietnam, personal data protection rules are getting stricter, especially for banks, e-wallets and healthcare. A PM doesn't need to memorize the law, but must know where data goes and bring legal and security in early."],
        ["h", "Track where the data goes"],
        ["ul", ["Collection: what data the feature uses, whether users know and agree, whether sensitive data (health, finance, location, ID documents) gets pulled in", "Sending outside: if you use an external vendor's model, does data leave the company's infrastructure or the country, and does the contract commit to not training on your data", "Storage: where prompts, answers and conversation logs are stored, for how long, and who can read them", "Reuse: whether the data is used to improve models or build eval sets, and whether that is within what users agreed to"]],
        ["h", "Working principles"],
        ["ol", ["Minimize: only send the model the data needed for the job. Summarizing a complaint doesn't need the full account number.", "Mask or replace identifiers (phone numbers, national ID numbers, card numbers) before sending them out and before logging.", "Be transparent: tell users when they are dealing with AI and how their data is used, in plain language.", "Give choices: turn off the feature, delete history, opt out of having their data used to improve the system.", "Access control and retention: only a small group can view sensitive logs, which are deleted automatically after a set period.", "Review before launch: go through the data flow with legal and security and record the decisions."]],
        ["ex", "A digital bank wants AI to summarize customer-care calls so agents no longer take notes by hand.\nRisks: transcripts contain names, account numbers, balances, sometimes even an OTP the customer read out by mistake.\nDesign: transcribe speech to text inside the bank's infrastructure, automatically mask account numbers and OTPs, send only the masked text to the model, have a vendor contract that forbids storing or training on the data, store the summary in the customer record under the existing retention period, and let agents edit before saving.\nWhat you must show legal: a data-flow diagram and the list of data fields sent out."],
        ["warn", ["Assuming that data already in the system can be used for AI in any way", "Letting staff paste customer data into public AI tools", "Keeping all conversations forever \"to analyze later\"", "Inviting legal in when the product is about to launch"]],
        ["tip", "In interviews, mentioning privacy concretely (which fields you mask, how long you keep data, who approves) is far more impressive than a generic \"we'll comply with regulations\"."],
        ["q", ["You're building an AI spending-insights feature in an e-wallet. What do you consider about user data?", "A staff member wants to use an external AI tool to process customer data. How do you respond?"]]
      ]},
      {id:"ai-9", t:"Measuring the impact of AI features after launch", m:6, b:[
        ["p", "Evals tell you how well the AI answers, but not whether the feature creates value. After launch, a PM must answer leadership's question: how does this feature change user behavior and business results, and at what cost?"],
        ["h", "Four layers of metrics"],
        ["ul", ["Usage: how many people see the feature, try it and come back. Repeat usage matters more than first tries because AI easily sparks curiosity", "Real-world quality: acceptance rate of outputs, how often users edit, ignore or re-ask, negative feedback, hand-off rate to a human", "Business outcomes: the metric the feature was built to move, such as conversion rate, ticket handling time, retention", "Counter metrics (guardrails): AI cost per user, latency, complaints, safety incidents, and metrics of other areas that may be affected"]],
        ["h", "Proving impact with experiments"],
        ["ol", ["A/B test when you can: a group with the feature and a group without, comparing business metrics, not just usage.", "Keep a long-term holdout group for major features to measure cumulative impact after a few months.", "Watch out for the novelty effect: users try it a lot in week one, then usage fades. Run long enough before concluding.", "Be careful comparing users of the feature with non-users: people who actively use AI are often more engaged to begin with, and that gap is not caused by the feature.", "For internal tools such as an assistant for call-center agents, roll out by team or by shift so you have a comparison group."]],
        ["ex", "Natural-language search on a food delivery app (\"soup dish, not too spicy, under 50k, fast delivery\").\nPrimary metric: share of search sessions that lead to an order.\nQuality metrics: rate of immediate re-search after seeing results, rate of searches returning no dishes.\nCounter metrics: search latency, cost per search, average order value, revenue of small restaurants (to avoid pushing everything to a few big brands).\nIn week one usage was high, but conversion only matched the old search; reading the logs showed that searches by restaurant name still worked better with the old search. Decision: use AI only for long, need-describing queries and keep regular search for the rest."],
        ["h", "Monitoring over time"],
        ["p", "AI quality can drift: user behavior changes, data changes, vendors update their models. You need a weekly quality dashboard, rerun evals whenever something changes, and regularly read samples of real conversations to spot problems the numbers don't show yet."],
        ["warn", ["Reporting AI usage counts as if they were business impact", "Drawing conclusions after a few days while the novelty effect is still strong", "Not tracking cost alongside outcomes, so you don't know if the feature pays off", "Stopping quality measurement after launch"]],
        ["q", ["How would you measure the success of a customer-care chatbot?", "An AI feature has many users but business metrics haven't moved. What do you do next?", "How do you know whether users trust the AI's answers?"]]
      ]},
      {id:"ai-10", t:"Common AI PM interview questions and how to answer them", m:7, b:[
        ["p", "An AI PM interview is still a PM interview: interviewers want to see you start from the user and the problem. The difference is that they also test whether you understand AI's limits, know how to measure quality and can weigh cost and risk."],
        ["h", "Common question types"],
        ["ul", ["Designing an AI feature: \"Design an AI assistant for sellers on an e-commerce marketplace\"", "Whether to use AI: \"Should we use AI to approve loan applications automatically?\"", "Measurement and evals: \"How would you measure chatbot quality?\", \"Define success for a summarization feature\"", "Incident handling: \"The chatbot gave a wrong answer and screenshots went viral on social media. What do you do?\"", "Technical trade-offs: choosing a model, RAG or fine-tuning, cost and latency", "Experience: \"Tell me about an AI product you worked on and what you'd do differently\""]],
        ["h", "A framework for AI feature design questions"],
        ["ol", ["Clarify the goal and users as in any product sense question.", "Identify the problem and ask: is AI really the best approach, or would simple rules do.", "Describe the solution and which part AI does and which part humans do.", "State how AI can be wrong and the experience when it is: verification, editing, a way out.", "Measurement: evals before launch, metrics after launch, counter metrics.", "Risks and constraints: data, safety, cost.", "Launch plan: test with a small group, expand based on results."]],
        ["ex", "Question: \"Should a digital bank use AI to automatically approve small loans?\"\nShort answer: \"Let me clarify whether the goal is faster approval or reaching more customers. This decision directly affects users' finances and is tightly regulated, so I wouldn't let AI decide alone. I'd propose an explainable scoring model that fast-tracks very low-risk applications, sends borderline cases to a credit officer, and gives reasons when declining. I'd track bad-debt rates by customer segment, check for bias across groups, and widen the automatic threshold only when a few months of data show it is safe.\"\nWhy it works: no instant yes or no, risk tiers, a way to measure, a roadmap."],
        ["h", "When asked about experience or trends"],
        ["p", "If you haven't built an AI product, describe a small project of your own: writing prompts, building a test set of a few dozen questions, noting what worked and what didn't. For trend questions, talk about the impact on users and products rather than listing new technologies."],
        ["warn", ["Answering every problem with \"use AI\" or \"build a chatbot\"", "Using lots of jargon but being unable to say how you'd measure quality", "Not mentioning what happens when the AI is wrong", "Promising 100% accuracy"]],
        ["tip", "A short line like \"before building, I'd put together 50 real questions to measure against\" shows the interviewer you have done this for real."],
        ["q", ["Design an AI feature that helps ride-hailing drivers earn more.", "Your chatbot gave a wrong answer that went viral. What do you do in the first 24 hours?", "Tell me about a time you decided not to use AI for a problem."]]
      ]}
    ],
    behavioral: [
      {id:"behavioral-1", t:"Telling stories with STAR", m:5, b:[
        ["p","Behavioral questions (\"Tell me about a time...\") assess how you actually worked. Interviewers trust past behavior more than promises."],
        ["ol",["Situation: brief context, enough to show why it mattered (1 to 2 sentences).","Task: your own responsibility or problem.","Action: what you did, step by step, and why. This is the longest part.","Result: the outcome, with numbers if possible, and what you learned."]],
        ["h","Tips"],
        ["ul",["Say \"I\" for your actions; credit the team in the result","Keep it to 2 to 3 minutes and let the interviewer ask more","Use numbers: \"cut support tickets by 30%\" beats \"reduced significantly\"","Prepare for follow-ups: \"What would you do differently?\""]],
        ["warn",["Too much context, too little action","Telling the team's story with your role unclear","A fake failure like \"I work too hard\""]]
      ]},
      {id:"behavioral-2", t:"Building a story bank", m:5, b:[
        ["p","Instead of preparing an answer for every question, prepare 6 to 8 real stories, each usable for several questions."],
        ["ul",["The success you're proudest of","A failure and its lesson","Conflict with an engineer, designer or stakeholder","Deciding with limited data","Persuading someone more senior","Leading without formal authority","Handling a crisis or a delay","Using data or user feedback to change product direction"]],
        ["h","A note template for each story"],
        ["p","Short title. Two sentences of context. Your role. Three key actions. A result with numbers. The lesson. Which questions this story can answer."],
        ["p","If you're moving into product from another role, you can draw stories from your previous job, side projects or extracurricular work, as long as they show product thinking: understanding users, prioritizing, measuring."],
        ["tip","Use the Practice tab of this topic to tell each story and get feedback."]
      ]},
      {id:"behavioral-3", t:"Common HR and culture-fit questions", m:5, b:[
        ["ul",["Tell me about yourself: 60 to 90 seconds, flowing from present to relevant experience to why you're here. Don't read your CV","Why product management: based on concrete experiences showing you've already done PM-like work","Why this company: connect their mission or product with your experience, and share a genuine observation about their product","Why leave your current job: positive, focused on the new opportunity, never badmouth your employer","Weaknesses: a real weakness that isn't core to the role, plus what you're doing to improve","Salary expectations: research the market first, give a range, or ask for the company's band","Do you have any questions: always prepare 2 to 3 about the team, how decisions are made, the product's biggest challenge"]],
        ["warn",["Generic answers that would fit any company","Not preparing questions for the interviewer"]]
      ]},
      {id:"behavioral-4", t:"Talking about failure and what you learned", m:6, b:[
        ["p", "\"Tell me about a time you failed\" is almost guaranteed to come up. Interviewers aren't looking for someone who has never been wrong; they want to see whether you own your part, understand why it went wrong and changed how you work afterwards."],
        ["h", "How to choose the story"],
        ["ul", ["A real failure: with clear consequences, such as a feature nobody used, a delay that hurt a partner, or a wrong decision that dropped a metric", "You share responsibility: the mistake lies in your decision or approach, not entirely with others or circumstances", "Not a disaster: avoid stories of leaking customer data or legal violations through carelessness, as they make the listener worry about your judgment", "Old enough: ideally a story where you've already applied the lesson in a later project"]],
        ["h", "Answer structure"],
        ["ol", ["Context and initial expectations: what you set out to do and what the goal was.", "What happened: state plainly that the outcome fell short, with numbers if possible.", "Root cause: which part was yours, said clearly with \"I\".", "How you handled it at the time: limiting damage, reporting, fixing.", "A specific lesson: a change in how you work, not a generic sentence.", "Evidence you applied it: a later time you did things differently and got a better result."]],
        ["p", "The lesson and the evidence of applying it should take at least a third of your answer. This is the part interviewers score most heavily."],
        ["ex", "Context: as a PM at an e-wallet, I rushed a group bill-splitting feature because a competitor had just launched one. I skipped user interviews to fit the sprint.\nOutcome: after a month, adoption was far below target (assumption: under 2% of active users). Looking back, users mostly split money via bank transfers inside group chats, not by opening the wallet.\nMy part: I treated the competitor having the feature as proof of demand.\nLesson: before building, I now always spend a few days validating with a small prototype or 5 to 8 interviews. On the next project, this helped the team drop an idea worth two sprints before writing a single line of code."],
        ["warn", ["Choosing a fake failure or a disguised brag, like \"I'm too much of a perfectionist\"", "Blaming engineers, your manager or the market", "Spending ages on the failure and one sentence on the lesson", "Generic lessons like \"I learned to communicate better\"", "Still sounding upset or embarrassed when telling it"]],
        ["q", ["Tell me about a product or feature you launched that didn't succeed.", "What is the biggest wrong decision in your career?", "If you could redo that project, what would you do differently?"]]
      ]},
      {id:"behavioral-5", t:"Handling conflict and disagreement in the team", m:6, b:[
        ["p", "PMs work between engineering, design, business, operations and legal, so disagreement is a daily event. Conflict questions test whether you can resolve disagreements while keeping relationships intact and reaching a good decision for users."],
        ["h", "Common types of conflict"],
        ["ul", ["Scope and deadlines: business wants to launch before a big sale day, engineering says it needs more time to do it right", "Priorities: two teams want the same squad's capacity", "Solutions: design and engineering pick different approaches to the same problem", "Quality versus speed: accept tech debt to hit the date, or wait", "With leadership: you disagree with your manager's or an executive's decision"]],
        ["h", "The approach interviewers want to see"],
        ["ol", ["Understand before persuading: ask to learn the other side's real concern, which often sits behind their surface position.", "Return to the shared goal: the users and metrics both sides care about.", "Put data or evidence on the table instead of personal opinion.", "Look for a third option: cut scope, run an experiment, launch in phases.", "Make a clear decision, who decides and why. If you can't agree, explain how you escalated transparently.", "Follow up: how the relationship is afterwards and whether the decision turned out right."]],
        ["ex", "Context: at a food delivery app, marketing wanted to launch a new voucher programme before a big sale day, while the tech lead worried the payment system couldn't handle the load.\nI sat down one-on-one with the tech lead and learned the specific concern was voucher redemption during order spikes. I asked marketing what they needed most: it turned out to be a programme to promote, not necessarily every voucher type.\nThe option: launch only one simple voucher type, cap redemptions per hour, and build the complex parts after the sale. Both sides agreed, sale day had no incidents, and the full programme launched two weeks later."],
        ["tip", "If asked about disagreeing with your manager, a good ending is: you raised your view with reasons, your manager still decided otherwise, and you fully backed the execution (disagree and commit)."],
        ["warn", ["Telling a story where you were entirely right and the other side entirely wrong", "Picking a trivial conflict, like debating a button colour", "Winning by getting your manager to force it, so nobody truly agreed", "Avoiding conflict or saying \"I've never had a conflict\""]],
        ["q", ["Tell me about a time you disagreed with an engineer about feature scope.", "What do you do when you disagree with your manager's decision?", "Tell me about a time you worked with a difficult colleague."]]
      ]},
      {id:"behavioral-6", t:"Influencing without authority", m:6, b:[
        ["p", "Most PMs don't directly manage engineers, designers or business partners, yet still have to get them moving in one direction. Influence questions test how you build alignment when you can't give orders."],
        ["h", "A PM's sources of influence"],
        ["ul", ["User understanding: data, interviews and customer support notes that others don't have", "Clear reasoning: tying the proposal to the company's goals and that team's own goals", "Accumulated credibility: keeping promises, being open when wrong, crediting others", "Relationships: knowing which metrics each stakeholder is measured on and what worries them", "Involving people early: letting them shape it from the start rather than just approve the final result"]],
        ["h", "Steps to persuade a stakeholder"],
        ["ol", ["Map stakeholders: who decides, who is affected, who can block.", "Meet each person privately before the big meeting to hear objections and adjust the proposal.", "Frame the proposal around what they care about: for operations it's less manual work, for finance it's cost and risk.", "Lower the risk of saying yes: propose a small experiment with a clear stopping point.", "Confirm commitments in writing after the meeting: decision, owner, deadline."]],
        ["ex", "Context: at a digital bank, I wanted to shorten the online account-opening flow, but the compliance team was worried about fraud risk.\nInstead of emailing a proposal, I asked to sit with them and review recent fraud cases, and found most were stopped at the face verification step, not at the declaration questions I wanted to remove.\nI proposed testing the shorter flow on a small share of new users for 4 weeks, with compliance able to stop it if fraud rose. Completion rate went up, fraud stayed flat, and the compliance team itself presented the results to leadership."],
        ["warn", ["Saying \"I convinced them\" without describing what you actually did", "Relying on your title or your manager's name to force people", "Using only data and ignoring people's motives and concerns", "Only telling stories about persuading peers, with no example involving more senior people"]],
        ["q", ["Tell me about a time you persuaded a team you didn't manage to change its priorities.", "How do you get leadership buy-in for a new idea?", "Tell me about a time you failed to persuade someone. What did you do next?"]]
      ]},
      {id:"behavioral-7", t:"Leading, mentoring and developing others", m:6, b:[
        ["p", "For Senior PM, Lead or Head of Product roles, interviewers will ask how you help others get better. Even for PMs who don't manage anyone, leadership questions still come up: leading a project, guiding a new PM, raising the team's overall quality."],
        ["h", "What interviewers look for"],
        ["ul", ["You see each person's strengths and gaps rather than applying one approach to everyone", "You delegate work at the right level of difficulty and let the person decide, rather than doing it for them", "You give direct but respectful feedback, at the right time, with concrete examples", "You can handle someone who is underperforming", "You can measure other people's growth, not just product results"]],
        ["h", "A framework for mentoring stories"],
        ["ol", ["Who the person was and where they stood: for example a new PM moving over from operations whose PRDs lacked a problem section.", "How you diagnosed it: observing, and asking the person what they wanted to develop.", "What you did: co-writing one document, then gradually stepping back and giving feedback on each draft.", "Their outcome: what they could do that they couldn't before.", "What you learned about leading."]],
        ["ex", "Context: at an e-commerce marketplace, I mentored an Associate PM who owned the returns flow.\nThey worked hard but brought every small question to me. Together we wrote down which decisions they could make alone (copy changes, step order) and which needed discussion (policy changes, cost impact).\nEach week we spent 30 minutes reviewing the decisions they had made. After about a quarter, they led the review with the operations team on their own and proposed a change that reduced returns tickets. I learned that clear delegation works better than just saying \"be more confident\"."],
        ["warn", ["Talking about leadership in slogans like \"I always inspire people\" with no example", "Describing mentoring that was really doing the other person's work", "Dodging questions about underperformers or having to let someone go", "Only describing team achievements without showing your role in each person's growth"]],
        ["q", ["Tell me about someone you helped develop. How did they change?", "How do you handle a team member who repeatedly misses expectations?", "How do you give hard feedback to a colleague?"]]
      ]},
      {id:"behavioral-8", t:"Answering \"Why PM, and why this company?\"", m:5, b:[
        ["p", "These two questions usually come at the very start and set the tone for the whole interview. A good answer shows real motivation, an accurate understanding of the PM job and genuine research into the company, not generic praise."],
        ["h", "Why do you want to be a PM"],
        ["ul", ["Start from real experience: a time you did PM-like work, such as finding a user problem, coordinating several parties, measuring results", "Talk about the parts you enjoy: understanding users, making trade-offs, seeing the product turn into numbers", "Show you understand the hard parts: deciding with incomplete data, owning outcomes without managerial authority", "Connect to strengths you bring from your previous career, if you're switching"]],
        ["h", "Why this company"],
        ["ol", ["Product: you've tried it and have a specific observation, including something that could be improved.", "Problem and market: what about the problem they solve excites you.", "Stage and ways of working: a startup searching for product-market fit or a large company optimising at scale, and why that stage suits you.", "Fit: which of your experiences can help them right away."]],
        ["ex", "Example for a PM role at a ride-hailing app, from a candidate moving over from operations:\n\"In two years running driver operations, I saw many drivers leave the app because they didn't understand how their earnings were calculated. I made an earnings summary myself and sent it through group chats, and calls to the hotline dropped noticeably. That's when I realised I prefer solving problems with product rather than handling cases one by one. I chose your company because the driver app is a key battleground between the players, and when I tried it, I found the earnings screen still hard to read for older drivers. My experience working with drivers lets me contribute in this area right away.\""],
        ["warn", ["\"I want to be the CEO of the product\" or \"PMs get to make the decisions\": shows a misunderstanding of the job", "Generic praise like \"big company, dynamic environment\" that fits anywhere", "Never having used the company's product", "Giving salary or title as the main reason", "Criticising the product harshly without understanding their context"]],
        ["q", ["Why do you want to be a Product Manager?", "Why did you choose us rather than a competitor?", "What do you like and dislike about our product?"]]
      ]},
      {id:"behavioral-9", t:"Asking the interviewer questions", m:5, b:[
        ["p", "\"Do you have any questions?\" is not an afterthought. Good questions show you think like a PM and help you work out whether the job suits you. Having no questions is often read as a lack of interest."],
        ["h", "Who to ask what"],
        ["ul", ["HR or recruiter: remaining rounds, expected timeline, whether the role is new growth or a replacement", "Hiring manager: expectations after 3 to 6 months, metrics the team owns, the biggest current challenge", "Engineer or designer: how the PM and team collaborate, who sets priorities, the process from idea to launch", "Leadership: next year's product strategy, how the company balances growth and profitability"]],
        ["h", "Some good questions"],
        ["ol", ["What would a PM who does really well in this role have achieved after 6 months?", "What's a recent hard product decision the team made? How was it made?", "Which metrics does the team measure success by, and which one is struggling?", "What do you enjoy most and find hardest about working here?", "Is there anything from today that leaves you unsure about my fit?"]],
        ["ex", "Situation: interviewing with the hiring manager at an e-wallet, and you've read that the company is pushing bill payments.\nA good question: \"I noticed the app recently moved bill payments onto the home screen. Is the team prioritising new users for this area, or repeat payment frequency among existing users? Which part would this role own?\"\nThis shows you've used the product, understand the difference between acquisition and retention, and helps you clarify the scope of the job."],
        ["tip", "Prepare 5 to 6 questions, since some may already be answered during the interview. Note the answers so you can compare offers later."],
        ["warn", ["Asking things already on the website or in the job description", "Asking about salary, leave or remote work in the first round", "Asking every interviewer the same generic question", "Asking too many questions when time is up"]],
        ["q", ["Do you have any questions for us?", "What else would you like to know to decide whether to take this role?"]]
      ]},
      {id:"behavioral-10", t:"Negotiating salary and offers", m:6, b:[
        ["p", "Negotiation comes last but affects your income for years. In Vietnam many people hesitate to negotiate for fear of losing the offer, but polite, well-grounded negotiation is normal and employers usually leave room for it."],
        ["h", "Prepare in advance"],
        ["ul", ["Market rates: ask peers at the same level, consult public salary reports, ask the recruiter for the role's band", "Your numbers: the figure you want, an acceptable figure, and the minimum to leave your current job", "Gross or net: in Vietnam these differ significantly because of tax and insurance, so always confirm which one is being discussed", "The whole package: 13th-month salary, performance bonus, shares or ESOP, health insurance, leave days, remote work, learning budget", "Your alternative: another offer or staying at your current company, so you know when to walk away"]],
        ["h", "Negotiation steps"],
        ["ol", ["When asked for expected salary early: give a well-grounded range, or ask for the company's band first.", "When you get the offer: thank them, show interest, ask for a few days to consider. You don't have to accept on the spot.", "Respond with reasons: scope of responsibility, relevant experience, market rates, another offer if it's real.", "Propose a specific number, not just \"could it be higher?\".", "If base salary can't move, shift to a signing bonus, ESOP, title, or an earlier salary review.", "Get everything agreed into the offer letter in writing."]],
        ["ex", "Situation: you receive a PM offer from an e-commerce company, about 10% below what you hoped for (assumption).\nYou reply: \"Thank you, I'm very excited about the role and the team. This role covers both the checkout and promotions flows, a wider scope than my current job, and I have direct experience integrating e-wallets. Based on the market rates I've researched, I'm hoping for a gross salary of X. If the base is hard to adjust, I'd like a salary review after 6 months with clear criteria.\""],
        ["warn", ["Naming a number before you know the scope and the company's band", "Inventing another offer to create pressure", "Focusing only on base salary and ignoring bonus, ESOP and benefits", "Agreeing verbally and then renegotiating after accepting", "Being confrontational or issuing ultimatums to the recruiter, who will later be a colleague"]],
        ["q", ["What is your expected salary?", "Do you have any other offers?", "If we can't meet that salary, would you still consider this role?"]]
      ]}
    ]
  }

const DATA_VI = {
  topics: Object.fromEntries(TOPICS.map(t => [t.id, [t.name, t.desc]])),
  cards: clone(CARDS), questions: clone(QUESTIONS), rubrics: clone(RUBRICS),
  rounds: Object.fromEntries(Object.entries(ROUNDS).map(([k, r]) => [k, {name: r.name, title: r.title, brief: r.brief}])),
  companies: clone(COMPANIES), companyShort: clone(COMPANY_SHORT), styles: clone(STYLES), styleShort: clone(STYLE_SHORT),
  quizCats: clone(QUIZ_CATS), quizBank: clone(QUIZ_BANK), lessons: clone(LESSONS), askChips: ASK_CHIPS.slice()
};
let CUR_LANG = "vi";
function isEn(){ return CUR_LANG === "en"; }
function setObj(target, src){ for(const k of Object.keys(target)) delete target[k]; Object.assign(target, clone(src)); }
function setArr(target, src){ target.length = 0; clone(src).forEach(x => target.push(x)); }
function applyLang(l){
  CUR_LANG = l === "en" ? "en" : "vi";

  setObj(CARDS, d.cards); setObj(QUESTIONS, d.questions); setObj(RUBRICS, d.rubrics);
  for(const k of Object.keys(ROUNDS)) if(d.rounds[k]) Object.assign(ROUNDS[k], d.rounds[k]);
  setObj(COMPANIES, d.companies); setObj(COMPANY_SHORT, d.companyShort); setObj(STYLES, d.styles); setObj(STYLE_SHORT, d.styleShort);
  setObj(QUIZ_CATS, d.quizCats); setArr(QUIZ_BANK, d.quizBank); setObj(LESSONS, d.lessons); setArr(ASK_CHIPS, d.askChips);
  for(const k of Object.keys(LESSON_BY_ID)) delete LESSON_BY_ID[k];
  Object.values(LESSONS).flat().forEach(x => { LESSON_BY_ID[x.id] = x; });
  document.documentElement.lang = CUR_LANG;
  document.title = isEn() ? "Product Interview Room" : "Phòng phỏng vấn Product";
  const nav = {learn:["Kiến thức","Knowledge"], interview:["Phỏng vấn thử","Mock interview"], settings:["Cài đặt","Settings"]};
  document.querySelectorAll(".nav button[data-go]").forEach(b => { const v = nav[b.dataset.go]; if(v) b.lastChild.nodeValue = v[isEn() ? 1 : 0]; });

function ensureLang(){ const want = S.profile.uiLang === "en" ? "en" : "vi"; if(want !== CUR_LANG) applyLang(want); }

/* DOM translation (Vietnamese UI strings -> English) */
function normWs(s){ return s.replace(/\s+/g, " ").trim(); }
function tr(s){
  if(!isEn() || !s) return s;
  const k = normWs(s);
  if(Object.prototype.hasOwnProperty.call(I18N_DICT, k)) return I18N_DICT[k];
  for(const [re, f] of I18N_PATTERNS){ const m = k.match(re); if(m) return f(...m); }
  return s;
}
function translateDom(root){
  if(!isEn() || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; let n; while((n = w.nextNode())) nodes.push(n);
  for(const node of nodes){
    const p = node.parentNode; if(!p || p.nodeName === "TEXTAREA" || p.nodeName === "SCRIPT" || p.nodeName === "STYLE") continue;
    const raw = node.nodeValue, s = raw.trim(); if(!s) continue;
    const t = tr(s); if(t !== s) node.nodeValue = raw.replace(s, t);
  }
  root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(el => {
    for(const a of ["placeholder","aria-label","title"]){ const v = el.getAttribute(a); if(v){ const t = tr(v); if(t !== v) el.setAttribute(a, t); } }
  });
}

function enWrap(s){
  const add = x => typeof x === "string" ? x + EN_NOTE : x.map((m, i) => i === 0 ? Object.assign({}, m, {content: m.content + EN_NOTE}) : m);
  const f = (i, o) => s(add(i), o); f.json = (i, o) => s.json(add(i), o); return f;
}

];

restoreLive();
view = resolveView(parseRoute(location.hash)); syncUrl(true);
render();
initStore();
getSample();
// Cài app và dùng offline: chỉ đăng ký service worker khi chạy qua http(s), không chạy trong Claude hay trong iframe
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !IN_CLAUDE && window.top === window){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(e => console.warn("sw", e)); });
}
</script>
</body>
</html>
