<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phòng phỏng vấn Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#F2F5F4; --surface:#FFFFFF; --surface-2:#E9EEEC; --ink:#1C2433; --ink-2:#596375; --line:#D7DFDC;
  --blue:#2457C5; --blue-soft:#E3EBFB; --green:#17855A; --green-soft:#DDF2E8; --red:#C63A31; --red-soft:#F9E1DF;
  --amber:#A86A12; --amber-soft:#FBEBCF; --postit:#DCE7FD; --postit-ink:#173A86; --on-blue:#FFFFFF; --primary:#2457C5; --on-primary:#FFFFFF;
  --shadow-paper:0 1px 0 rgba(28,36,51,.05), 0 14px 28px -16px rgba(28,36,51,.35);
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#13171C; --surface:#1B2129; --surface-2:#232B35; --ink:#E7ECF2; --ink-2:#9AA6B6; --line:#2E3742;
    --blue:#7BA2FF; --blue-soft:#1F2C47; --green:#4CC490; --green-soft:#16302A; --red:#FF8279; --red-soft:#3A2023;
    --amber:#F0B65A; --amber-soft:#3A2D16; --postit:#22345A; --postit-ink:#DCE6FF; --on-blue:#0F1520; --primary:#3D6CF0; --on-primary:#FFFFFF;
    --shadow-paper:0 1px 0 rgba(0,0,0,.3), 0 16px 30px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --board:#13171C; --surface:#1B2129; --surface-2:#232B35; --ink:#E7ECF2; --ink-2:#9AA6B6; --line:#2E3742;
  --blue:#7BA2FF; --blue-soft:#1F2C47; --green:#4CC490; --green-soft:#16302A; --red:#FF8279; --red-soft:#3A2023;
  --amber:#F0B65A; --amber-soft:#3A2D16; --postit:#22345A; --postit-ink:#DCE6FF; --on-blue:#0F1520; --primary:#3D6CF0; --on-primary:#FFFFFF;
  --shadow-paper:0 1px 0 rgba(0,0,0,.3), 0 16px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--board);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem)}
h2{font-size:1.35rem}
h3{font-size:1.08rem;font-weight:500}
p{margin:0}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

/* Shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--board);border-bottom:1px solid var(--line)}
.top-in{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 20px}
.brand{font-family:var(--display);font-weight:700;font-size:1.12rem;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:.95rem;transform:rotate(-4deg)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue);font-weight:600}
.nav .ico{display:none}
main{max-width:920px;margin:0 auto;padding:28px 20px 64px}
@media (max-width:719px){
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;padding:6px 10px;border-radius:12px;flex:1}
  .nav .ico{display:block}
  .nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
  main{padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
}

/* Generic */
.stack>*+*{margin-top:var(--gap,16px)}
.stack>label{display:block}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);min-height:44px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--primary) 70%,transparent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.primary:disabled{box-shadow:none}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2);padding-inline:10px}
.btn.ghost:hover{color:var(--ink);border-color:transparent}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.back{margin:-6px 0 8px -10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.label{display:block;font-weight:500;font-size:.92rem;margin-bottom:6px}
select,input[type=text],input[type=password],textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:140px;line-height:1.55}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--blue)}
.ai-form{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr) auto;gap:10px}
@media (max-width:520px){.ai-form{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:500}
.note{border-left:4px solid var(--amber);background:var(--amber-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.92rem}
.note.err{border-color:var(--red);background:var(--red-soft)}
.prewrap{white-space:pre-wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Home */
.hero{display:grid;gap:18px}
.hero p{max-width:60ch}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.today-item{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;cursor:pointer;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.today-item:hover{border-color:var(--ink-2)}
.today-item .big{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1}
.today-item.yellow{background:var(--postit);color:var(--postit-ink);border-color:transparent;box-shadow:var(--shadow-paper);transform:rotate(-1deg)}
.today-item.yellow:hover{transform:rotate(0)}
.today.compact{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.today.compact .today-item{flex-direction:row;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;min-width:0}
.today.compact .today-item .big{font-size:1.6rem}
.today.compact .today-item .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.today.compact .today-item .one{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-sum{display:flex;flex-wrap:wrap;gap:6px 18px}

/* Marker bar */
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--c,var(--blue))}

/* Topic list */
.tlist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.trow{display:grid;grid-template-columns:1fr 150px;gap:6px 20px;align-items:center;padding:16px 20px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);cursor:pointer;color:var(--ink)}
.trow:first-child{border-top:0}
.trow:hover{background:var(--surface-2)}
.trow .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 16px;font-size:.85rem;color:var(--ink-2)}
.trow .meta span{white-space:nowrap}
@media (max-width:520px){.trow{grid-template-columns:1fr}}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
@media (max-width:520px){.tabs{gap:0}.tabs button{padding:10px 9px;font-size:.92rem}}
.tabs button{flex:none;white-space:nowrap;border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}

/* Post-it flashcard */
.deck{display:grid;justify-items:center;gap:18px;padding-top:8px}
.postit{width:min(100%,520px);min-height:260px;background:var(--postit);color:var(--postit-ink);border-radius:4px 4px 18px 4px;box-shadow:var(--shadow-paper);padding:28px 28px 22px;cursor:pointer;border:0;text-align:left;display:flex;flex-direction:column;gap:14px;transform:rotate(-.8deg);transition:transform .25s ease}
.postit:hover{transform:rotate(0)}
.postit .front{display:block;font-family:var(--display);font-size:1.4rem;font-weight:500;line-height:1.3}
.postit .back{font-size:1.02rem;line-height:1.6;border-top:2px dashed color-mix(in srgb,var(--postit-ink) 25%,transparent);padding-top:14px}
.postit .hint{margin-top:auto;font-size:.82rem;opacity:.7}
.postit.flip{animation:flip .3s ease}
@keyframes flip{0%{transform:rotate(-.8deg) rotateX(0)}50%{transform:rotate(-.8deg) rotateX(80deg)}100%{transform:rotate(-.8deg) rotateX(0)}}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,520px)}
.rate .btn{flex-direction:column;gap:0;padding:8px 6px;font-size:.92rem}
.rate .btn small{color:var(--ink-2);font-size:.75rem;font-weight:400}
.rate .again{border-color:var(--red-soft)}
.rate .good{border-color:var(--green)}
.ai-box{width:min(100%,520px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}

/* Question list */
.qlist{display:grid;gap:10px}
.qitem{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.qitem:hover{border-color:var(--ink-2)}
.qitem .score{margin-left:auto;font-family:var(--display);font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-weight:500}
.tag.ai{background:var(--blue-soft);color:var(--blue)}

/* Results */
.verdict{display:flex;align-items:center;gap:18px;padding:18px 20px;border-radius:16px;background:var(--vbg);color:var(--ink)}
.verdict .num{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1;color:var(--vc);white-space:nowrap}
.verdict .num small{font-size:.9rem;font-weight:500;opacity:.75;margin-left:2px}
.verdict .vsum{font-size:.95rem;line-height:1.55}
.verdict .vbody{display:flex;flex-direction:column;gap:4px;min-width:0}
@media (max-width:520px){
  .verdict{flex-direction:column;align-items:flex-start;gap:8px;padding:16px}
}
.eval h3{font-size:1.02rem;font-weight:700}
.eval .panel>h3{margin-bottom:6px}
.crit .c-name{font-weight:500}
.crit b .muted{font-weight:400;font-size:.8em}
.fb>h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fb>h3::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--dot,var(--blue))}
.fb-good{--dot:var(--green)} .fb-improve{--dot:var(--amber)} .fb-missing{--dot:var(--red)}
.fb .list{font-size:.95rem}
.fb .list li+li{margin-top:8px}
.fb-outline .list{margin-bottom:10px}
.fb-grid{align-items:stretch}
.verdict .vt{font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--vc)}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:4px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.crit:first-of-type{border-top:0}
.crit .c-comment{grid-column:1/-1;font-size:.9rem;color:var(--ink-2)}
.crit b{font-family:var(--display);text-align:right;white-space:nowrap}
.list{margin:0;padding-left:1.2em}
.list li+li{margin-top:6px}
.outline{background:var(--surface-2);border-radius:12px;padding:14px 16px;font-size:.95rem}

/* Interview room */
.room-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.step.now{background:var(--primary);color:var(--on-primary)}
.step.pass{background:var(--green-soft);color:var(--green)}
.step.fail{background:var(--red-soft);color:var(--red)}
.chat{display:flex;flex-direction:column;gap:16px;padding:8px 0}
.msg{max-width:min(640px,92%);display:flex;gap:12px;align-items:flex-start}
.msg .who{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--postit);color:var(--postit-ink)}
.msg .bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 16px;white-space:pre-wrap}
.msg .name{font-size:.8rem;color:var(--ink-2);margin-bottom:2px}
.msg.me{align-self:flex-end}
.msg.me .bubble{background:var(--blue-soft);border-color:transparent;border-radius:16px 4px 16px 16px}
.thinking{color:var(--ink-2);font-style:italic}
.composer{position:sticky;bottom:0;background:var(--board);padding:12px 0 8px;border-top:1px solid var(--line)}
@media (max-width:719px){.composer{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
.composer textarea{min-height:110px}
.btn.mic.on{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.btn.mic.on svg{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.hint-box{margin-left:50px;background:var(--blue-soft);border-radius:14px;padding:14px 16px}
@media (max-width:520px){.hint-box{margin-left:0}}
@media (max-width:719px){.composer textarea{min-height:84px}}
.timer{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--ink-2)}
.timer.over{color:var(--amber);font-weight:600}

/* Progress */
.hist{display:grid;gap:8px}
.hrow{display:flex;gap:14px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.hrow:hover{border-color:var(--ink-2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}


/* Quiz */
.qdots{display:flex;flex-wrap:wrap;gap:6px}
.qdot{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:.85rem;font-variant-numeric:tabular-nums}
.qdot.done{background:var(--blue-soft);border-color:var(--blue-soft);color:var(--blue)}
.qdot.now{border-color:var(--ink);font-weight:600}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:14px 16px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer;color:var(--ink);line-height:1.5}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-checked="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt-l{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-weight:600;font-size:.88rem}
.opt[aria-checked="true"] .opt-l{background:var(--primary);color:var(--on-primary)}
.qrev{border-left:4px solid var(--green);background:var(--surface);border-radius:0 12px 12px 0;padding:12px 16px;display:grid;gap:6px}
.qrev.bad{border-left-color:var(--red)}
.optrev{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.93rem}
.optrev li{padding:4px 8px;border-radius:8px}
.optrev .right{background:var(--green-soft)}
.optrev .wrong{background:var(--red-soft)}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:14px 20px}
.page-actions{flex:none}
@media (max-width:520px){.page-actions{flex:1 1 100%;flex-wrap:nowrap}.page-actions .btn{flex:1 1 0;padding-inline:10px}.page-actions .btn.primary{order:-1}}
.note-act{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 10px 10px 14px}
.note-act>span{flex:1 1 200px}
.note-act .btn{min-height:38px;padding:6px 16px}
.qz-early{min-height:32px;padding:4px 10px;font-size:.88rem}
.qz-nav .btn.primary{min-width:140px}
.qexp{margin-top:6px;background:var(--blue-soft);border-radius:10px;padding:10px 14px;font-size:.92rem;line-height:1.55}
.qexp-l{font-weight:600;color:var(--blue);font-size:.8rem;letter-spacing:.02em;margin-bottom:2px}

/* Lessons */
.llist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.lrow:hover{border-color:var(--ink-2)}
.lnum{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.lnum.done{background:var(--green-soft);color:var(--green)}
.ltitle{font-weight:500}
.lesson{max-width:70ch}
.lbody{font-size:1.03rem;line-height:1.75}
.lbody>*+*{margin-top:14px}
.lbody h2{font-size:1.15rem;margin-top:26px}
.lbody .list li+li{margin-top:8px}
.lex{background:var(--postit);color:var(--postit-ink);border-radius:4px 4px 14px 4px;padding:14px 18px;box-shadow:var(--shadow-paper)}
.lex .muted{color:inherit;opacity:.7}
.lwarn{border-left:4px solid var(--red);background:var(--red-soft);border-radius:0 12px 12px 0;padding:12px 16px}
.lq{border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:0 12px 12px 0;padding:12px 16px}
.lwarn h3,.lq h3{margin-bottom:6px}

/* Targets / JD */
.trgs{display:grid;gap:8px}
.trg{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:4px 6px 4px 2px;background:var(--surface)}
.trg.on{border-color:var(--blue);background:var(--blue-soft)}
.trg-act{gap:2px;flex-wrap:nowrap}
.trg-pick{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;cursor:pointer;padding:10px;color:var(--ink)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-2);flex:none}
.trg.on .radio{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px var(--blue-soft)}
.jdan{border-top:1px solid var(--line);padding-top:16px}
.lang-toggle{margin-left:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.85rem;cursor:pointer;min-height:36px}
.lang-toggle:hover{border-color:var(--ink-2)}
@media (max-width:719px){.lang-toggle{margin-left:auto}}
/* Chữ trên điện thoại: thu nhỏ cả thang chữ, giữ ô nhập 16px để iOS không tự phóng to khi chạm */
@media (max-width:520px){
  html{font-size:15px}
  body{line-height:1.55}
  h1{font-size:1.6rem}
  h2{font-size:1.22rem}

const CARDS = {
  sense: [
    ["Khung CIRCLES gồm những bước nào?","Comprehend (làm rõ bối cảnh), Identify customer, Report needs, Cut through prioritization, List solutions, Evaluate trade-offs, Summarize. Dùng như checklist trong đầu, đừng đọc tên từng bước cho người phỏng vấn."],

  metrics: [

    ["Phễu AARRR","Acquisition, Activation, Retention, Referral, Revenue. Dùng để tìm xem người dùng rơi rụng nhiều nhất ở bước nào."],

      ["p","Chỉ số tốt phản ánh giá trị người dùng nhận được và gắn với mục tiêu kinh doanh. Khi trả lời, hãy đi từ mục tiêu xuống chỉ số, không phải ngược lại."],
      ["h","Ba lớp chỉ số"],
      ["ul",["North Star Metric: một chỉ số phản ánh giá trị cốt lõi và dẫn dắt tăng trưởng dài hạn, ví dụ số đơn giao thành công mỗi tuần","Chỉ số đầu vào: những thứ team tác động trực tiếp, như tỉ lệ chuyển đổi ở trang thanh toán, thời gian giao trung bình","Chỉ số đối trọng: canh để tối ưu chỗ này không làm hỏng chỗ khác, như tỉ lệ hủy đơn, lượng phàn nàn"]],
      ["h","Khung hỗ trợ"],
      ["ul",["AARRR: Acquisition, Activation, Retention, Referral, Revenue; hợp để tìm điểm rơi trong phễu","HEART: Happiness, Engagement, Adoption, Retention, Task success; hợp để đo trải nghiệm một tính năng, đi kèm Goals, Signals, Metrics"]],
      ["h","Một chỉ số tốt cần"],
      ["ul",["Định nghĩa chính xác (\"người dùng hoạt động\" là làm gì, trong bao lâu)","Đo được và thay đổi đủ nhanh để ra quyết định","Khó bị làm đẹp giả tạo"]],
      ["warn",["Chọn chỉ số phù phiếm như lượt tải app, lượt xem trang","Chỉ nêu một chỉ số mà không có chỉ số đối trọng","Không định nghĩa rõ chỉ số"]],
      ["q",["North Star Metric của một app nghe nhạc là gì?","Đo thành công của tính năng bình luận trên một app thương mại điện tử thế nào?"]]
    ]},
    {id:"metrics-2", t:"Chẩn đoán khi chỉ số thay đổi", m:6, b:[
      ["p","\"Chỉ số X giảm 15%, bạn làm gì?\" là dạng câu rất phổ biến. Người phỏng vấn muốn thấy bạn có hệ thống, không đoán mò."],
      ["ol",["Làm rõ: giảm so với khi nào, đo thế nào, giảm đột ngột hay từ từ.","Kiểm tra dữ liệu: lỗi tracking, đổi định nghĩa, bản phát hành mới làm hỏng log.","Yếu tố bên ngoài: mùa vụ, lễ Tết, thời tiết, đối thủ khuyến mãi, sự cố cổng thanh toán.","Khoanh vùng: theo nền tảng, phiên bản app, khu vực, người dùng mới hay cũ, bước nào trong phễu.","Đặt giả thuyết theo thứ tự khả năng và cách kiểm chứng từng cái.","Đề xuất hành động ngắn hạn và dài hạn."]],
      ["p","Phân rã chỉ số thành các thành phần cũng rất hữu ích: doanh thu = số người dùng × tỉ lệ mua × giá trị đơn trung bình. Thành phần nào thay đổi sẽ chỉ ra hướng điều tra."],
      ["ex","Đơn hàng app giao đồ ăn giảm 15%. Sau khi loại lỗi tracking, bạn thấy chỉ người dùng Android bản mới giảm, và rơi ở bước thanh toán. Giả thuyết mạnh nhất là lỗi trong bản cập nhật luồng thanh toán, nên đề xuất rollback hoặc hotfix, đồng thời đặt cảnh báo tự động cho tỉ lệ thanh toán thành công."],
      ["warn",["Đưa ra nguyên nhân ngay từ câu đầu","Không kiểm tra dữ liệu trước","Liệt kê nhiều giả thuyết nhưng không ưu tiên"]]
    ]},
    {id:"metrics-3", t:"A/B test căn bản cho PM", m:5, b:[
      ["p","A/B test chia người dùng ngẫu nhiên thành nhóm đối chứng và nhóm thử nghiệm để biết một thay đổi có thật sự tạo khác biệt hay không."],
      ["h","Thiết kế một test"],
      ["ol",["Giả thuyết: thay đổi X sẽ làm chỉ số Y tăng vì lý do Z.","Một chỉ số chính và vài chỉ số đối trọng.","Đơn vị chia nhóm: thường theo người dùng, không theo lượt xem.","Tính trước cỡ mẫu và thời gian chạy, thường ít nhất trọn một đến hai tuần để gồm cả ngày thường và cuối tuần.","Đặt tiêu chí quyết định trước khi xem kết quả."]],
      ["h","Bẫy hay gặp"],
      ["ul",["Nhìn trộm và dừng sớm: thấy kết quả đẹp là dừng làm tăng khả năng kết luận sai","Hiệu ứng mới lạ: người dùng tò mò lúc đầu rồi quay lại thói quen cũ","Theo dõi quá nhiều chỉ số: kiểu gì cũng có một chỉ số \"có ý nghĩa\" chỉ do ngẫu nhiên","Hiệu ứng lan tỏa: ở marketplace, thay đổi cho nhóm A có thể ảnh hưởng nhóm B"]],
      ["p","Không phải lúc nào cũng nên A/B test: khi lượng người dùng quá ít, khi thay đổi mang tính chiến lược dài hạn, hoặc khi đối xử khác nhau giữa các nhóm là không phù hợp về đạo đức."],
      ["q",["Test tăng chuyển đổi 3% nhưng sau hai tuần hiệu quả biến mất. Vì sao?","Khi nào bạn không chạy A/B test?"]]
    ]}
  ],
  execution: [
    {id:"execution-1", t:"Các khung ưu tiên", m:5, b:[
      ["p","Ưu tiên là việc PM làm hằng ngày. Người phỏng vấn ít quan tâm bạn dùng khung nào, mà quan tâm bạn có bám mục tiêu và giải thích đánh đổi rõ ràng không."],
      ["ul",["RICE: Reach × Impact × Confidence ÷ Effort. Hữu ích để so sánh nhiều hạng mục, nhưng điểm số chỉ tốt bằng giả định đằng sau","Impact và Effort: ma trận 2×2, nhanh, hợp khi trao đổi với stakeholder","MoSCoW: Must, Should, Could, Won't; hợp khi chốt phạm vi một bản phát hành","Kano: tính năng cơ bản, hiệu suất, gây thích thú; giúp không bỏ quên những thứ bắt buộc phải có"]],
      ["h","Cách trả lời một câu hỏi ưu tiên"],
      ["ol",["Nhắc lại mục tiêu của team hoặc công ty trong giai đoạn này.","Gom các yêu cầu theo vấn đề gốc; nhiều yêu cầu thực chất là cùng một vấn đề.","Đánh giá theo tác động lên mục tiêu, công sức, rủi ro, sự phụ thuộc.","Chọn, và nói rõ cái gì không làm, vì sao.","Cách thông báo với người bị từ chối và khi nào xem lại quyết định."]],
      ["warn",["Dùng khung máy móc, coi điểm số như sự thật","Ưu tiên theo người nói to nhất, thường là sếp"]]
    ]},
    {id:"execution-2", t:"Từ ý tưởng đến backlog", m:6, b:[
      ["p","PO và PM cần biến vấn đề thành những việc team làm được. Các công cụ cơ bản:"],
      ["ul",["PRD: vấn đề, mục tiêu, người dùng, phạm vi (làm và không làm), yêu cầu, chỉ số, rủi ro, câu hỏi còn mở","User story: \"Là [ai], tôi muốn [gì], để [giá trị]\"","Acceptance criteria: điều kiện để coi là xong, thường viết theo Given, When, Then","INVEST: story nên Independent, Negotiable, Valuable, Estimable, Small, Testable"]],
      ["ex","Là người dùng quên mật khẩu, tôi muốn đặt lại qua email để đăng nhập lại mà không cần gọi tổng đài.\nGiven tôi nhập email đã đăng ký, When tôi bấm gửi, Then tôi nhận email chứa link đặt lại có hiệu lực 30 phút.\nGiven tôi nhập email chưa đăng ký, When tôi bấm gửi, Then màn hình vẫn hiện cùng một thông báo như trên, để không tiết lộ email nào đã có tài khoản."],
      ["h","Scrum trong một đoạn"],
      ["p","Team làm theo sprint 1 đến 2 tuần. Sprint planning chọn việc từ backlog, daily stand-up đồng bộ tiến độ, sprint review demo kết quả, retrospective cải tiến cách làm. PO chịu trách nhiệm backlog luôn được ưu tiên và rõ ràng."],
      ["warn",["Story quá to, không làm xong trong một sprint","Acceptance criteria thiếu các trường hợp lỗi và trường hợp biên"]]
    ]},
    {id:"execution-3", t:"Làm việc với stakeholder và xử lý sự cố", m:5, b:[
      ["p","Câu hỏi thực thi thường là tình huống: trễ hạn, CEO đòi thêm việc, engineer không đồng ý. Câu trả lời tốt có điểm chung: hiểu vấn đề gốc, nêu phương án kèm đánh đổi, giao tiếp sớm và minh bạch."],
      ["h","Khi dự án bị trễ"],
      ["ol",["Hiểu nguyên nhân và độ tin cậy của ước lượng mới.","Liệt kê phương án: cắt phạm vi, ra mắt từng phần, thêm người (thường không nhanh hơn ngay), dời ngày.","Chọn phương án theo điều quan trọng nhất với khách hàng.","Báo sớm cho stakeholder kèm đề xuất, không chỉ báo tin xấu.","Rút kinh nghiệm cho lần ước lượng sau."]],
      ["h","Khi bị yêu cầu thêm việc gấp"],
      ["p","Hỏi mục đích thật (\"buổi demo cần nhà đầu tư thấy điều gì?\"), tìm cách nhỏ nhất đạt mục đích (mockup, prototype, bật tính năng cho nhóm nhỏ), và nói rõ cái giá với kế hoạch hiện tại để người có thẩm quyền quyết định."],
      ["warn",["Nhận hết mọi yêu cầu để làm vui lòng cấp trên","Từ chối thẳng mà không tìm hiểu mục đích"]]
    ]}
  ],
  strategy: [
    {id:"strategy-1", t:"Nền tảng tư duy chiến lược", m:5, b:[
      ["p","Câu hỏi chiến lược kiểm tra bạn có nhìn được bức tranh lớn: thị trường, đối thủ, lợi thế của công ty, và sản phẩm nên đi về đâu."],
      ["ul",["Product-market fit: sản phẩm thỏa mãn một thị trường đủ lớn; dấu hiệu là retention đi ngang và tăng trưởng tự nhiên","Hiệu ứng mạng: giá trị tăng khi có thêm người dùng, trực tiếp (app nhắn tin) hoặc gián tiếp (marketplace hai mặt)","Moat: lợi thế khó sao chép như hiệu ứng mạng, chi phí chuyển đổi, dữ liệu riêng, thương hiệu, quy mô","Kinh tế đơn vị: mỗi khách hàng hoặc mỗi đơn có lãi không, so sánh CAC (chi phí có khách) với LTV (giá trị vòng đời)"]],
      ["h","Khung gợi ý khi phân tích"],
      ["ol",["Mục tiêu của công ty và vị trí hiện tại.","Khách hàng và nhu cầu chưa được đáp ứng.","Đối thủ và sản phẩm thay thế.","Lợi thế riêng của mình.","Lựa chọn, đánh đổi và cách thử nghiệm."]],
      ["warn",["Nói chung chung về \"tiềm năng thị trường lớn\" mà không có con số hay lý do","Bỏ qua kinh tế đơn vị"]]
    ]},
    {id:"strategy-2", t:"Dạng câu \"Có nên làm X không?\"", m:5, b:[
      ["p","Dạng \"công ty A có nên mở dịch vụ B hoặc vào thị trường C?\". Hãy trả lời có cấu trúc, và cuối cùng phải đưa ra quan điểm."],
      ["ol",["Mục tiêu chiến lược: vì sao công ty muốn làm (tăng tần suất sử dụng, doanh thu mới, phòng thủ).","Thị trường: quy mô, tăng trưởng, ai đang có mặt.","Lợi thế: tài sản tận dụng được như người dùng, mạng lưới, thương hiệu, dữ liệu.","Rủi ro: vận hành, pháp lý, ăn mòn sản phẩm chính, chi phí cơ hội.","Cách thử: phạm vi nhỏ, chỉ số và ngưỡng để mở rộng hoặc dừng.","Kết luận: có, không, hoặc có với điều kiện."]],
      ["ex","App gọi xe mở dịch vụ đi chợ hộ: tận dụng được tài xế giờ thấp điểm và người dùng sẵn có, tăng tần suất mở app. Rủi ro là vận hành chất lượng hàng tươi và biên lợi nhuận mỏng. Đề xuất thử ở hai quận với vài siêu thị đối tác trong 8 tuần, đo tỉ lệ đặt lại và lợi nhuận mỗi đơn."],
      ["warn",["Không đưa ra kết luận","Quên chi phí cơ hội: làm việc này thì không làm được việc gì khác"]]
    ]},
    {id:"strategy-3", t:"Ước lượng (estimation)", m:5, b:[
      ["p","Câu ước lượng kiểm tra cách bạn chia nhỏ vấn đề và lập luận với số liệu không chắc chắn. Con số cuối cùng ít quan trọng hơn cách đi tới nó."],
      ["ol",["Làm rõ câu hỏi: đếm cái gì, ở đâu, trong khoảng thời gian nào.","Chọn cách tiếp cận: từ trên xuống (dân số nhân tỉ lệ) hoặc từ dưới lên (một điểm bán nhân số điểm bán).","Viết công thức trước, rồi mới điền số.","Dùng số tròn, nói lý do cho mỗi giả định.","Tính thành lời từng bước.","Kiểm tra độ hợp lý và nói giả định nào kém chắc chắn nhất."]],
      ["ex","Người dùng ví điện tử hoạt động hằng tháng ở Việt Nam ≈ dân số (khoảng 100 triệu) × tỉ lệ ở độ tuổi 15 đến 60 (giả định 65%) × tỉ lệ có smartphone và tài khoản thanh toán (giả định 70%) × tỉ lệ dùng ví ít nhất một lần mỗi tháng (giả định 60%) ≈ 27 triệu. Sau đó đối chiếu với số liệu công bố của các ví lớn để kiểm tra."],
      ["warn",["Im lặng tính nhẩm, không nói lập luận","Dùng số lẻ khó tính"]]
    ]}
  ],
  ai: [
    {id:"ai-1", t:"LLM hoạt động thế nào, ở mức PM cần biết", m:6, b:[
      ["p","PM không cần biết toán phía sau, nhưng phải hiểu đủ để biết AI làm được gì, sai ở đâu và tốn bao nhiêu."],
      ["ul",["Dự đoán phần tiếp theo: LLM tạo văn bản bằng cách dự đoán từng phần nhỏ (token) dựa trên ngữ cảnh. Nó không tra cứu sự thật, nên có thể sai mà vẫn rất tự tin","Token: đơn vị văn bản model xử lý và cũng là đơn vị tính tiền. Tiếng Việt thường tốn nhiều token hơn tiếng Anh cho cùng một ý","Context window: lượng token tối đa trong một lần gọi, gồm hướng dẫn, tài liệu, lịch sử hội thoại và câu trả lời","Không xác định: cùng một câu hỏi có thể ra câu trả lời khác nhau; temperature càng cao càng đa dạng","Hallucination: bịa thông tin nghe hợp lý. Không loại bỏ được hoàn toàn, chỉ giảm được","Mốc kiến thức: model không biết các sự kiện sau thời điểm huấn luyện nếu không được cung cấp thêm"]],
      ["p","Hệ quả với sản phẩm: mọi tính năng AI đều có tỉ lệ sai. Câu hỏi của PM không phải \"làm sao để không bao giờ sai\", mà là \"sai bao nhiêu thì chấp nhận được, và khi sai thì chuyện gì xảy ra\"."],
      ["q",["Giải thích hallucination cho một stakeholder không làm kỹ thuật.","Vì sao cùng một câu hỏi, chatbot lại trả lời khác nhau?"]]
    ]},
    {id:"ai-2", t:"Các cách xây tính năng AI", m:6, b:[
      ["p","Đi từ đơn giản đến phức tạp, và chỉ lên bậc tiếp theo khi bậc trước không đủ."],
      ["ol",["Prompting: viết hướng dẫn rõ ràng, có ví dụ, định dạng đầu ra cụ thể. Nhanh, rẻ, luôn thử trước.","RAG (Retrieval-Augmented Generation): tìm các đoạn tài liệu liên quan rồi đưa vào prompt. Dùng khi cần kiến thức riêng của công ty hoặc thay đổi thường xuyên; cho phép trích nguồn.","Fine-tuning: huấn luyện thêm trên dữ liệu riêng. Dùng khi cần phong cách hoặc định dạng rất ổn định ở quy mô lớn; tốn công chuẩn bị dữ liệu và bảo trì.","Agent: model tự lập kế hoạch và gọi công cụ (API, tìm kiếm, cơ sở dữ liệu) qua nhiều bước. Mạnh nhưng khó kiểm soát; cần giới hạn quyền và xác nhận trước hành động quan trọng."]],
      ["h","Khi nào không nên dùng AI"],
      ["ul",["Quy tắc rõ ràng, cần chính xác tuyệt đối (tính phí, tính thuế)","Một lần sai gây hậu quả nghiêm trọng mà không có người kiểm tra","Không có cách đánh giá chất lượng","Chi phí và độ trễ lớn hơn giá trị mang lại"]],
      ["ex","Chatbot hỏi đáp chính sách nhân sự: bắt đầu bằng RAG trên sổ tay nhân sự, trả lời kèm trích dẫn mục liên quan, và chuyển cho phòng nhân sự khi câu hỏi liên quan tới trường hợp cá nhân. Không cần fine-tune."]
    ]},
    {id:"ai-3", t:"Đánh giá chất lượng (eval)", m:7, b:[
      ["p","Eval là kỹ năng phân biệt rõ nhất giữa AI PM giỏi và người chỉ nói theo trend. Không có eval thì không biết tính năng tốt đến đâu, cũng không biết thay đổi có làm nó tệ đi không."],
      ["h","Eval offline, trước khi ra mắt"],

<script>
"use strict";
/* ================= STATE & STORAGE ================= */
const LS_KEY = "pmprep:v1", LS_SESS = "pmprep:sessions:v1";
const DAY = 86400000;
function defaultState(){
  return {v:1, profile:{role:"pm", level:"mid", company:"product", jd:"", lang:"vi", style:"neutral", followups:3, activeJd:"", uiLang:"vi"}, cards:{}, scores:[], custom:{}, practice:{}, lessons:{}, jds:[], customLessons:{}, settings:{apiKey:"", model:"", keyMod:0}};
}
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function normalize(raw){
  const d = defaultState();
  if(!raw || typeof raw !== "object") return d;
  const s = Object.assign(d, clone(raw));
  s.profile = Object.assign(defaultState().profile, s.profile || {});
  s.settings = Object.assign(defaultState().settings, s.settings || {});
  if(!ROLES[s.profile.role]) s.profile.role = "pm";
  s.cards = s.cards || {}; s.scores = Array.isArray(s.scores) ? s.scores : []; s.custom = s.custom || {}; s.practice = s.practice || {}; s.lessons = s.lessons || {}; s.customLessons = s.customLessons || {};
  s.jds = Array.isArray(s.jds) ? s.jds : [];
  if(s.profile.jd && s.profile.jd.trim() && !s.jds.length){ const id = "jd" + Date.now().toString(36); s.jds.push({id, name:"JD đã lưu", role:s.profile.role, level:s.profile.level, company:s.profile.company, text:s.profile.jd, createdAt:Date.now(), analysis:null}); s.profile.activeJd = id; }
  s.profile.jd = "";
  if(!s.jds.some(j => j.id === s.profile.activeJd)) s.profile.activeJd = "";
  return s;
}
let S = normalize(lsGet(LS_KEY));
const Store = {db:null, uid:null, ready:false, sessions: lsGet(LS_SESS) || [], timer:null, note:""};
function stateRef(){ return Store.db.doc("data/users/" + Store.uid + "/state"); }
function sessCol(){ return stateRef().collection("sessions"); }

async function initStore(){
  if(!window.claude || typeof claude.use !== "function"){ Store.ready = true; Store.note = "local"; render(); return; }
  try{
    const [user, db] = await Promise.all([claude.use("user"), claude.use("db")]);
    const uid = user ? await user.id() : null;
    if(db && uid){
      Store.db = db; Store.uid = uid;
      const snap = await stateRef().get();
      if(snap.exists){ S = normalize(snap.data()); lsSet(LS_KEY, S); }
      else { await stateRef().set(clone(S)); }
      try{
        const qs = await sessCol().orderBy("createdAt","desc").limit(40).get();
        const remote = qs.docs.map(d => clone(d.data()));
        if(remote.length || !Store.sessions.length) Store.sessions = remote;
        else for(const s of Store.sessions) sessCol().doc(s.id).set(clone(s)).catch(()=>{});
      }catch(e){ console.warn("sessions", e); }
    } else Store.note = "local";
  }catch(e){ console.warn("store", e); Store.db = null; Store.note = "local"; }
  Store.ready = true;
  render();
}
function save(){
  if(S.scores.length > 400) S.scores = S.scores.slice(-400);
  S._t = Date.now();
  lsSet(LS_KEY, S);
  gdSchedule();
  if(!Store.db) return;
  clearTimeout(Store.timer);
  Store.timer = setTimeout(() => { stateRef().set(clone(S)).catch(e => console.warn("save", e)); }, 700);
}
function saveSession(sess){
  const i = Store.sessions.findIndex(x => x.id === sess.id);
  if(i >= 0) Store.sessions[i] = clone(sess); else Store.sessions.unshift(clone(sess));
  Store.sessions = Store.sessions.slice(0, 40);
  lsSet(LS_SESS, Store.sessions);
  gdSchedule();
  if(Store.db) sessCol().doc(sess.id).set(clone(sess)).catch(e => console.warn("session", e));
}

/* ================= SYNC MERGE (pure) ================= */
// Gộp hai bản tiến độ (máy này và Google Drive). Bản ghi sau lần "Xóa toàn bộ tiến độ" mới nhất mới được giữ.
function mergeState(a, b){
  a = normalize(a); b = normalize(b);
  const [nw, od] = (b._t || 0) > (a._t || 0) ? [b, a] : [a, b];
  const reset = Math.max(a._resetAt || 0, b._resetAt || 0);
  const out = clone(nw); out._resetAt = reset || undefined; if(!reset) delete out._resetAt;
  const byId = new Map(); for(const j of od.jds.concat(nw.jds)) if(j && j.id) byId.set(j.id, j);
  out.jds = [...byId.values()];
  // Gemini key và model đi cùng nhau, lấy theo lần sửa key sau cùng (keyMod), không theo _t
  const ks = (od.settings.keyMod || 0) > (nw.settings.keyMod || 0) ? od.settings : nw.settings;
  out.settings = {apiKey: ks.apiKey, model: ks.model, keyMod: ks.keyMod || 0};
  if(!out.settings.apiKey && !nw.settings.keyMod && !od.settings.keyMod && od.settings.apiKey) Object.assign(out.settings, {apiKey: od.settings.apiKey, model: od.settings.model});
  if((od._t || 0) < reset) return out;
  for(const [id, r] of Object.entries(od.cards)){ const c = out.cards[id]; if(!c || (r.n || 0) > (c.n || 0) || ((r.n || 0) === (c.n || 0) && (r.due || 0) > (c.due || 0))) out.cards[id] = r; }
  const sk = x => x.t + "|" + x.d + "|" + (x.src || ""), seen = new Set(out.scores.map(sk));
  for(const x of od.scores) if(!seen.has(sk(x))){ seen.add(sk(x)); out.scores.push(x); }
  out.scores = out.scores.filter(x => x.d > reset).sort((x, y) => x.d - y.d).slice(-400);
  for(const [id, r] of Object.entries(od.practice)){ const c = out.practice[id]; out.practice[id] = c ? {best: Math.max(c.best || 0, r.best || 0), last: Math.max(c.last || 0, r.last || 0)} : r; }
  for(const [id, ts] of Object.entries(od.lessons)) out.lessons[id] = Math.max(out.lessons[id] || 0, ts || 0);
  for(const k of ["custom", "customLessons"]) for(const [t, xs] of Object.entries(od[k])){ const have = out[k][t] || [], ids = new Set(have.map(x => x.id)); out[k][t] = have.concat((xs || []).filter(x => !ids.has(x.id))); }
  return out;
}
function mergeSessions(a, b, resetAt){
  const m = new Map();
  for(const s of (a || []).concat(b || [])){ if(!s || !s.id) continue; const c = m.get(s.id); if(!c || (s.results || []).length > (c.results || []).length) m.set(s.id, s); }
  return [...m.values()].filter(s => (s.createdAt || 0) > (resetAt || 0)).sort((x, y) => y.createdAt - x.createdAt).slice(0, 40);
}

/* ================= GOOGLE DRIVE SYNC ================= */
// Lưu một file JSON trong thư mục ẩn appDataFolder của Google Drive (người dùng không thấy, app khác không đọc được).
const GD_CID_LS = "pmprep:gdrive:cid", GD_ON_LS = "pmprep:gdrive:on", GD_FILE = "careerlift-sync.json";
const GD_API = "https://www.googleapis.com/drive/v3/files", GD_UP = "https://www.googleapis.com/upload/drive/v3/files";
const GD = {token:null, exp:0, fileId:null, busy:false, again:false, err:"", last:0, timer:null, gis:null};
function gdCid(){ return lsStr(GD_CID_LS).trim(); }
function gdOn(){ return lsStr(GD_ON_LS) === "1" && !!gdCid(); }
function gdHasToken(){ return !!GD.token && Date.now() < GD.exp - 60000; }
function gdLoadGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(!GD.gis) GD.gis = new Promise((ok, bad) => { const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true; s.onload = ok; s.onerror = () => { GD.gis = null; bad(new Error("Không tải được Google Identity Services")); }; document.head.appendChild(s); });
  return GD.gis;
}
async function gdToken(){
  if(gdHasToken()) return GD.token;
  await gdLoadGis();
  return new Promise((ok, bad) => {
    const client = google.accounts.oauth2.initTokenClient({client_id: gdCid(), scope: "https://www.googleapis.com/auth/drive.appdata",
      callback: r => { if(r.error){ bad(new Error(r.error_description || r.error)); return; } GD.token = r.access_token; GD.exp = Date.now() + (Number(r.expires_in) || 3600) * 1000; ok(GD.token); },
      error_callback: e => bad(new Error(e && e.type === "popup_failed_to_open" ? "Trình duyệt chặn cửa sổ đăng nhập Google" : (e && e.message) || "Chưa đăng nhập Google"))});
    client.requestAccessToken({prompt: lsStr(GD_ON_LS) === "1" ? "" : "consent"});
  });
}
async function gdFetch(url, opts){
  opts = opts || {};
  const res = await fetch(url, Object.assign({}, opts, {headers: Object.assign({authorization: "Bearer " + GD.token}, opts.headers || {})}));
  if(res.status === 401){ GD.token = null; throw new Error("Phiên Google đã hết hạn, bấm Đồng bộ ngay để đăng nhập lại"); }
  if(res.status === 404 && GD.fileId && url.includes(GD.fileId)){ GD.fileId = null; throw new Error("retry"); }
  if(!res.ok) throw new Error("Google Drive lỗi " + res.status);
  return res.status === 204 ? null : res.json();
}
function gdApply(remote){
  if(!remote || typeof remote !== "object") return false;
  const before = JSON.stringify([S, Store.sessions]);
  if(remote.state) S = mergeState(S, remote.state);
  Store.sessions = mergeSessions(Store.sessions, remote.sessions, S._resetAt);
  if(JSON.stringify([S, Store.sessions]) === before) return false;
  lsSet(LS_KEY, S); lsSet(LS_SESS, Store.sessions);
  if(Store.db){ stateRef().set(clone(S)).catch(()=>{}); Store.sessions.forEach(s => sessCol().doc(s.id).set(clone(s)).catch(()=>{})); }
  return true;
}
async function gdSync(){
  if(!gdCid()) return;
  if(GD.busy){ GD.again = true; return; }
  GD.busy = true; GD.err = ""; gdPaint();
  let changed = false;
  try{
    await gdToken();
    for(let attempt = 0; attempt < 2; attempt++){
      try{
        if(!GD.fileId){ const r = await gdFetch(GD_API + "?spaces=appDataFolder&fields=files(id)&q=" + encodeURIComponent("name='" + GD_FILE + "'")); GD.fileId = (r && r.files && r.files[0] && r.files[0].id) || null; }
        if(GD.fileId) changed = gdApply(await gdFetch(GD_API + "/" + GD.fileId + "?alt=media")) || changed;
        const body = JSON.stringify({app:"careerlift", v:1, at:Date.now(), state:S, sessions:Store.sessions});
        if(GD.fileId) await gdFetch(GD_UP + "/" + GD.fileId + "?uploadType=media", {method:"PATCH", headers:{"content-type":"application/json"}, body});
        else {
          const fd = new FormData();
          fd.append("metadata", new Blob([JSON.stringify({name: GD_FILE, parents: ["appDataFolder"]})], {type:"application/json"}));
          fd.append("file", new Blob([body], {type:"application/json"}));
          GD.fileId = (await gdFetch(GD_UP + "?uploadType=multipart&fields=id", {method:"POST", body: fd})).id;
        }
        break;
      }catch(e){ if(e.message !== "retry" || attempt) throw e; }
    }
    try{ localStorage.setItem(GD_ON_LS, "1"); }catch(e){}
    GD.last = Date.now();
  }catch(e){ GD.err = e.message || String(e); console.warn("gdrive", e); }
  GD.busy = false;
  if(changed && !(view.name === "interview" && IV)) render(); else gdPaint();
  if(GD.again){ GD.again = false; gdSchedule(); }
}
function gdSchedule(){
  if(!gdOn() || !gdHasToken()) return;
  clearTimeout(GD.timer);
  GD.timer = setTimeout(gdSync, 3000);
}
function gdStatus(){
  if(GD.busy) return "Đang đồng bộ…";
  if(GD.err) return GD.err;
  if(GD.last) return "Đã đồng bộ lúc " + fmtDate(GD.last);
  return gdOn() ? "Bấm Đồng bộ ngay để đăng nhập Google và tải tiến độ mới nhất." : "Chưa bật.";
}
function gdPanel(){
  if(IN_CLAUDE) return "";
  const cid = gdCid();
  return `<section class="panel stack" style="--gap:12px" id="gd-panel">
    <h2>Đồng bộ Google Drive</h2>
    <p class="small muted">Lưu tiến độ học, lịch sử phỏng vấn và Gemini API key vào Google Drive của bạn để dùng trên nhiều máy, nhiều trình duyệt. Dữ liệu nằm trong thư mục ẩn của app, không hiện trong Drive.</p>
    ${cid ? `<p class="small ${GD.err ? "note err" : ""}" role="status">${esc(gdStatus())}</p>

function localSampler(key){
  const call = async (input, opts, asJson) => {
    opts = opts || {};
    const turns = typeof input === "string" ? [{role:"user", content: input}] : input;
    const contents = [];
    for(const m of turns){
      const role = m.role === "assistant" ? "model" : "user";
      const last = contents[contents.length - 1];
      if(last && last.role === role) last.parts[0].text += "\n\n" + m.content;
      else contents.push({role, parts:[{text: m.content}]});
    }
    const custom = getModel();
    const model = custom || (opts.modelTier === "quick" ? QUICK_MODEL : DEFAULT_MODEL);
    const generationConfig = {maxOutputTokens: 8192};
    if(asJson) generationConfig.responseMimeType = "application/json";
    let res;
    try{
      res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent", {
        method:"POST", signal: opts.signal,
        headers:{"content-type":"application/json", "x-goog-api-key": key},
        body: JSON.stringify({contents, generationConfig})
      });
    }catch(e){ throw {code: e && e.name === "AbortError" ? "cancelled" : "upstream_error"}; }
    let data = null; try{ data = await res.json(); }catch(e){}
    if(!res.ok){
      const msg = JSON.stringify(data || {});
      if(res.status === 403 || /API_KEY_INVALID|API key not valid/i.test(msg)) throw {code:"bad_key"};
      if(res.status === 429) throw {code:"rate_limited"};
      if(res.status === 404) throw {code:"bad_model"};
      throw {code:"upstream_error"};
    }
    if(data && data.promptFeedback && data.promptFeedback.blockReason) throw {code:"refused"};
    const cand = data && data.candidates && data.candidates[0];
    const text = ((cand && cand.content && cand.content.parts) || []).filter(p => p.text && !p.thought).map(p => p.text).join("");
    if(!text.trim()) throw {code: cand && cand.finishReason === "SAFETY" ? "refused" : "empty_completion"};
    if(opts.onText) opts.onText({text, delta: text});
    return {text, truncated: !!(cand && cand.finishReason === "MAX_TOKENS")};
  };
  const f = (input, opts) => call(input, opts, false);
  f.json = async (input, opts) => {
    const {text} = await call(input, opts, true);
    const tryParse = s => { try{ return JSON.parse(s); }catch(e){ return undefined; } };
    let v = tryParse(text.trim());
    if(v === undefined){ const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); if(m) v = tryParse(m[1]); }
    if(v === undefined){ const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf("}"), text.lastIndexOf("]")); if(a >= 0 && b > a) v = tryParse(text.slice(a, b + 1)); }
    if(v === undefined) throw {code:"invalid_json", text};
    return v;
  };
  return f;
}

  if(IN_CLAUDE){

    return samplePromise;
  }

}

  if(c === "session_expired") return "Phiên đăng nhập đã hết hạn. Đăng nhập lại Claude rồi thử lại.";
  if(c === "invalid_json") return "AI trả về kết quả không đúng định dạng. Bấm thử lại.";

}

function normEval(o){
  o = o && typeof o === "object" ? o : {};
  const arr = x => Array.isArray(x) ? x.map(v => clean(v)).filter(Boolean) : [];
  const scores = Array.isArray(o.scores) ? o.scores.map(x => ({criterion: clean(x && x.criterion), score: clamp(Math.round(Number(x && x.score) || 0), 0, 5), comment: clean(x && x.comment)})).filter(x => x.criterion) : [];
  let overall = Math.round(Number(o.overall));
  if(!isFinite(overall)) overall = scores.length ? Math.round(scores.reduce((a,b) => a + b.score, 0) / scores.length * 20) : 0;
  overall = clamp(overall, 0, 100);
  return {scores, overall, verdict: verdictOf(overall), summary: clean(o.summary), strengths: arr(o.strengths), improvements: arr(o.improvements), missing: arr(o.missing), betterAnswer: clean(o.betterAnswer), weakTopics: Array.isArray(o.weakTopics) ? o.weakTopics.filter(t => TOPIC[t]) : []};
}

// Trang hiện tại nằm trên URL (#/...) để tải lại trang và nút Back của trình duyệt giữ đúng chỗ
function routeOf(v){
  const e = encodeURIComponent;
  switch(v.name){
    case "topic": return "#/topic/" + e(v.topic) + "/" + e(v.tab || "lessons");
    case "lesson": return "#/lesson/" + e(v.id);
    case "newlesson": return "#/new-lesson" + (v.topic ? "/" + e(v.topic) : "");
    case "practice": return "#/practice/" + e(v.topic) + "/" + e(v.qid);
    case "quiz": return "#/quiz/" + e(v.topic);
    case "report": return "#/report/" + e(v.id);
    case "review": case "interview": case "settings": return "#/" + v.name;
    default: return "#/";
  }
}
function parseRoute(h){
  let parts = []; try{ parts = (h || "").replace(/^#\/?/, "").split("/").map(decodeURIComponent); }catch(e){}
  const [name, a, b] = parts;
  if(name === "topic" && TOPIC[a]) return {name, topic: a, tab: ["lessons","cards","practice","quiz"].includes(b) ? b : "lessons"};
  if(name === "lesson" && a) return {name, id: a};
  if(name === "new-lesson") return {name: "newlesson", topic: TOPIC[a] ? a : ""};
  if(name === "practice" && TOPIC[a] && b) return {name, topic: a, qid: b};
  if(name === "quiz" && TOPIC[a]) return {name, topic: a};
  if(name === "report" && a) return {name, id: a};
  if(["review","interview","settings"].includes(name)) return {name};
  return {name: "learn"};
}

    PR = {topic: v.topic, qid: v.qid, answer:"", status:"idle", result:null, err:"", showKeys:false, start:Date.now()};

  if(v.name === "review" && !RV) return {name: "learn"};
  return v;
}

${j.text.slice(0, 8000)}
"""

let RV = null;

function nextIntervals(id){
  const i = (S.cards[id] && S.cards[id].i) || 0;
  return {again: 0, hard: Math.max(1, i * 1.2), good: i < 1 ? 1 : i * 2.5, easy: i < 1 ? 4 : i * 3.5};
}
function vReview(){
  const backBtn = RV && RV.from === "topic" ? `<button class="btn ghost back" data-act="open-topic" data-topic="${RV.topic}">← ${esc(TOPIC[RV.topic].name)}</button>` : `<button class="btn ghost back" data-go="learn">← Kiến thức</button>`;
  if(!RV || RV.idx >= RV.queue.length){
    return `<div class="stack">${backBtn}<div class="deck"><div class="postit" style="cursor:default"><p class="front">Xong ${RV ? RV.done : 0} thẻ.</p><p>Thẻ bạn chưa nhớ sẽ quay lại sau 10 phút, còn lại sẽ hẹn ôn vào những ngày tới.</p></div>

  }

  const ai = RV.ai;
  return `<div class="stack">${backBtn}
  <div class="deck">
    <p class="small muted">Thẻ ${RV.idx + 1}/${RV.queue.length}, chủ đề ${esc(TOPIC[c.topic].name)}</p>

      ${RV.flipped ? `<span class="back">${esc(c.back)}</span>` : `<span class="hint">Tự trả lời trong đầu, rồi chạm để xem đáp án</span>`}
    </button>
    ${RV.flipped ? `<div class="rate">
      <button class="btn again" data-act="rate" data-r="again">Chưa nhớ<small>${fmtInterval(nx.again)}</small></button>
      <button class="btn" data-act="rate" data-r="hard">Hơi nhớ<small>${fmtInterval(nx.hard)}</small></button>

    </div>
    ${ai ? `<div class="ai-box"><p class="small muted" style="margin-bottom:6px">AI giải thích thêm</p><p class="prewrap ${ai.status === "loading" && !ai.text ? "thinking" : ""}" id="ai-explain">${esc(ai.text || (ai.status === "loading" ? "Đang suy nghĩ…" : ""))}</p>${ai.err ? `<p class="note err">${esc(ai.err)}</p>` : ""}</div>`
      : `<button class="btn ghost" data-act="explain">Hỏi AI: ví dụ thực tế và câu hỏi phỏng vấn liên quan</button>`}` : ""}
  </div></div>`;
}
function rate(r){
  const id = RV.queue[RV.idx], nx = nextIntervals(id), now = Date.now();
  const rec = S.cards[id] || {i:0, n:0};
  rec.n = (rec.n || 0) + 1;
  rec.i = nx[r];
  rec.due = r === "again" ? now + 10 * 60000 : now + rec.i * DAY;
  S.cards[id] = rec;
  save();
  RV.idx++; RV.done++; RV.flipped = false; RV.ai = null;
  render();
}

function fbPanel(title, items, tone){
  return items.length ? `<section class="panel fb fb-${tone}"><h3>${title}</h3><ul class="list">${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>` : "";

// Dàn ý AI trả về dạng "- Ý: giải thích" mỗi dòng: hiện thành danh sách, phần trước dấu hai chấm in đậm
function outlineHtml(text){
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const bullet = l => /^[-•*]\s*/.test(l);
  if(lines.filter(bullet).length < Math.max(2, lines.length / 2)) return `<div class="prewrap">${esc(text)}</div>`;
  return `<ul class="list">${lines.map(l => {
    const t = l.replace(/^[-•*]\s*/, ""), i = t.indexOf(":");
    return `<li>${i > 0 && i < 48 ? `<b>${esc(t.slice(0, i + 1))}</b>${esc(t.slice(i + 1))}` : esc(t)}</li>`;
  }).join("")}</ul>`;
}
function renderEval(r, opts){
  opts = opts || {};
  const vc = scoreColor(r.overall);
  return `<div class="stack eval" style="--gap:16px">
  <div class="verdict" style="--vbg:${scoreSoft(r.overall)};--vc:${vc}"><span class="num">${r.overall}<small>/100</small></span><span class="vbody"><span class="vt">${VERDICT_TEXT[r.verdict]}</span>${r.summary ? `<span class="vsum">${esc(r.summary)}</span>` : ""}</span></div>
  ${r.scores.length ? `<section class="panel"><h3>Điểm theo tiêu chí</h3>${r.scores.map(s => `<div class="crit"><span class="c-name">${esc(s.criterion)}</span>${bar(s.score * 20)}<b>${s.n ? s.right + "/" + s.n : `${s.score}<span class="muted">/5</span>`}</b>${s.comment ? `<span class="c-comment">${esc(s.comment)}</span>` : ""}</div>`).join("")}</section>` : ""}
  ${r.strengths.length || r.improvements.length ? `<div class="grid2 fb-grid">${fbPanel("Làm tốt", r.strengths, "good")}${fbPanel("Cần cải thiện", r.improvements, "improve")}</div>` : ""}
  ${fbPanel("Ý còn thiếu", r.missing, "missing")}
  ${r.betterAnswer ? `<section class="panel fb fb-outline"><h3>Dàn ý tham khảo</h3>${outlineHtml(r.betterAnswer)}<p class="small muted">Đây là một cách tiếp cận, không phải đáp án duy nhất.</p></section>` : ""}
  ${!opts.practice && !opts.noTopics && r.weakTopics.length ? `<section class="stack" style="--gap:10px"><h3>Nên ôn tiếp</h3><div class="chips">${r.weakTopics.map(t => `<button class="chip" data-act="open-topic" data-topic="${t}">${esc(TOPIC[t].name)}</button>`).join("")}</div></section>` : ""}

}

function quizRemaining(){ return Math.max(0, QZ.duration - (Date.now() - QZ.start)); }
function fmtClock(ms){ const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2,"0") + ":" + String(s % 60).padStart(2,"0"); }
function catName(c, topic){ return QUIZ_CATS[c] || (TOPIC[topic] ? TOPIC[topic].name : "Chung"); }
function quizEval(qz){
  const n = qz.questions.length;
  let right = 0; const byCat = {};
  qz.questions.forEach((q, i) => { const ok = qz.answers[i] === q.a; if(ok) right++; const k = q.c || "general"; byCat[k] = byCat[k] || {r:0, n:0}; byCat[k].n++; if(ok) byCat[k].r++; });
  const overall = Math.round(right / n * 100);
  const cats = Object.entries(byCat);
  const used = Math.min(qz.duration, (qz.endedAt || Date.now()) - qz.start);
  return {
    scores: cats.map(([c, v]) => ({criterion: catName(c, qz.topic), score: Math.round(v.r / v.n * 5), right: v.r, n: v.n, comment: ""})),
    overall, verdict: verdictOf(overall),
    summary: `${right}/${n} câu đúng, làm trong ${fmtClock(used)}${Object.keys(qz.answers).length < n ? `, bỏ trống ${n - Object.keys(qz.answers).length} câu` : ""}.`,
    strengths: cats.filter(([, v]) => v.r === v.n).map(([c]) => "Nắm chắc: " + catName(c, qz.topic)),
    improvements: cats.filter(([, v]) => v.r / v.n < .6).map(([c]) => "Ôn lại: " + catName(c, qz.topic)),
    missing: [], betterAnswer: "", weakTopics: overall < 70 ? [qz.topic] : []
  };
}

// Đọc chính tả bằng Web Speech API: chữ được điền thẳng vào ô trả lời để sửa trước khi gửi
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let MIC = null, micErr = "";
const MIC_SVG = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const STOP_SVG = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>';
function micBtn(target){
  if(!SpeechRec) return "";
  const on = !!(MIC && MIC.target === target);
  return `<button class="btn mic${on ? " on" : ""}" data-act="mic" data-target="${target}" aria-pressed="${on}" title="${on ? "Dừng ghi âm" : "Trả lời bằng giọng nói"}">${on ? STOP_SVG : MIC_SVG}${on ? "Dừng" : "Trả lời"}</button>`;
}
function micNote(target){ return micErr && (!MIC || MIC.target === target) ? `<p class="note err">${esc(micErr)}</p>` : ""; }
function stopMic(){ if(MIC){ const r = MIC.rec; MIC = null; try{ r.stop(); }catch(e){} } }
function toggleMic(target){
  const same = MIC && MIC.target === target;
  stopMic(); micErr = "";
  if(same){ render(); return; }
  const ta = document.getElementById(target); if(!ta) return;
  const lang = target === "iv-answer" && IV ? IV.lang : S.profile.lang;
  const rec = new SpeechRec();
  rec.lang = lang === "en" ? "en-US" : "vi-VN"; rec.continuous = true; rec.interimResults = true;
  const base = ta.value.trim() ? ta.value.replace(/\s*$/, " ") : "";
  let done = "";
  rec.onresult = e => {
    let interim = "";
    for(let i = e.resultIndex; i < e.results.length; i++){ const r = e.results[i]; if(r.isFinal) done += r[0].transcript; else interim += r[0].transcript; }
    const el = document.getElementById(target);
    if(el){ el.value = base + done + interim; el.dispatchEvent(new Event("input", {bubbles: true})); }
  };
  rec.onerror = e => {
    if(e.error === "no-speech" || e.error === "aborted") return;
    micErr = e.error === "not-allowed" || e.error === "service-not-allowed" ? "Trình duyệt chưa cho phép dùng micro. Bấm biểu tượng ổ khóa cạnh thanh địa chỉ để cho phép, rồi thử lại." : "Không ghi âm được. Hãy thử lại hoặc gõ câu trả lời.";
  };
  rec.onend = () => { if(MIC && MIC.rec === rec) MIC = null; render(); };
  MIC = {target, rec};
  try{ rec.start(); }catch(e){ MIC = null; micErr = "Không ghi âm được. Hãy thử lại hoặc gõ câu trả lời."; }
  render();
  const el = document.getElementById(target); if(el) el.focus();
}

    await sample(prompt, {modelTier:"quick", cache:false, onText: ({text}) => {
      if(IV !== me || !IV.hint || IV.hint.turn !== turn) return;
      IV.hint.text = clean(text); const el = document.getElementById("hint-text"); if(el){ el.textContent = IV.hint.text; el.classList.remove("thinking"); }
    }});
    if(IV === me && IV.hint && IV.hint.turn === turn) IV.hint.status = "done";
  }catch(e){ if(IV === me && IV.hint && IV.hint.turn === turn){ IV.hint.status = "error"; IV.hint.err = aiErrText(e); } }
  if(view.name === "interview") render();
}
function hintHtml(){
  const h = IV.hint;
  if(!h || h.turn !== IV.turns.length) return "";
  return `<div class="hint-box"><p class="small muted" style="margin-bottom:6px">Gợi ý hướng trả lời</p><p class="prewrap ${h.status === "loading" && !h.text ? "thinking" : ""}" id="hint-text">${esc(h.text || (h.status === "loading" ? "Đang nghĩ gợi ý…" : ""))}</p>${h.err ? `<p class="note err">${esc(h.err)}</p>` : ""}</div>`;
}
function sendAnswer(){
  const text = IV.draft.trim();
  if(!text) return;
  stopMic();
  IV.turns.push({role:"user", content: text});
  IV.answers++; IV.draft = "";
  if(IV.answers >= 1 + IV.followups) evaluateRound();
  else askNext();
}
async function evaluateRound(){
  const rid = IV.rounds[IV.idx], r = ROUNDS[rid], me = IV;
  IV.status = "evaluating"; IV.err = "";
  render(); scrollBottom();
  try{
    const sample = await needSample();
    const transcript = IV.turns.map(t => (t.role === "assistant" ? "NGƯỜI PHỎNG VẤN: " : "ỨNG VIÊN: ") + t.content).join("\n\n");
    const prompt = `Bạn là hội đồng chấm phỏng vấn product giàu kinh nghiệm ở công ty công nghệ. Hãy chấm vòng "${r.name}".
${profileText(IV.profile)}
Tiêu chí, mỗi tiêu chí 1 đến 5 điểm, 3 nghĩa là đạt kỳ vọng của cấp ${LEVELS[IV.profile.level]}:
${RUBRICS[r.rubric].map(k => "- " + k).join("\n")}
Chỉ chấm dựa trên những gì ứng viên thực sự nói. Câu trả lời quá ngắn, chung chung hoặc lạc đề thì điểm thấp. Nghiêm khắc như phỏng vấn thật. overall là điểm 0-100 (từ 70 là đạt, 55-69 là cân nhắc, dưới 55 là trượt). Nhận xét dẫn chứng từ chính câu trả lời. betterAnswer là dàn ý trả lời tốt hơn cho câu hỏi chính. weakTopics chọn từ: ${TOPICS.map(t => t.id).join(", ")}. Viết bằng tiếng Việt kể cả khi buổi phỏng vấn dùng tiếng Anh${IV.lang === "en" ? "; thêm vào improvements một nhận xét ngắn về cách diễn đạt tiếng Anh" : ""}.
${IV.hintsRound ? `Lưu ý: ứng viên đã bấm xem gợi ý hướng trả lời từ AI ${IV.hintsRound} lần trong vòng này; khi chấm tiêu chí về cấu trúc và tư duy, cân nhắc điều đó và nêu trong improvements.\n` : ""}Bản ghi buổi phỏng vấn:
${transcript.slice(0, 40000)}

Chỉ trả về một đối tượng JSON theo đúng dạng:
${JSON_SHAPE}`;
    const ev = normEval(await sample.json(prompt, {cache:false}));
    if(IV !== me) return;
    IV.results.push({roundId: rid, transcript: clone(IV.turns), eval: ev, hints: IV.hintsRound || 0});
    S.scores.push({t: r.topic, s: ev.overall, d: Date.now(), src: "interview"});
    save();
    saveSession(sessionFromIV());
    IV.status = "roundDone";
  }catch(e){
    if(IV !== me) return;
    IV.status = "evalError"; IV.err = aiErrText(e);
  }
  if(view.name === "interview"){ render(); window.scrollTo(0, 0); }
}
function sessionFromIV(){
  return {id: IV.id, createdAt: IV.createdAt, jdId: IV.profile.jdId || "", jdName: IV.profile.jdName || "", role: IV.profile.role, level: IV.profile.level, company: IV.profile.company, mode: IV.mode, lang: IV.lang, rounds: IV.rounds.slice(), results: clone(IV.results)};
}
function scrollBottom(){ requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight)); }
function vRoom(){
  const r = curRound(), total = 1 + IV.followups;
  const steps = IV.rounds.map((rid, i) => { const res = IV.results.find(x => x.roundId === rid && i <= IV.idx); const cls = res ? (res.eval.verdict === "fail" ? "fail" : "pass") : i === IV.idx ? "now" : ""; return `<span class="step ${cls}">${esc(ROUNDS[rid].name)}</span>`; }).join("");
  const head = `<div class="room-head"><div class="stack" style="--gap:4px"><h1 style="font-size:1.5rem">${esc(r.name)}</h1><span class="small muted">${r.kind === "quiz" ? `${QUIZ_SIZE} câu trắc nghiệm, ${QUIZ_MIN} phút` : esc(r.who) + ", " + esc(r.title) + "."} ${IV.status === "roundDone" || IV.status === "finished" || r.kind === "quiz" ? "" : `Câu ${Math.min(IV.answers + 1, total)}/${total}`}</span></div><span class="spacer"></span><button class="btn ghost danger" data-act="iv-leave">Hủy</button></div>
    ${IV.rounds.length > 1 ? `<div class="steps">${steps}</div>` : ""}`;
  if(IV.status === "finished") return vFinal();
  if(IV.status === "quiz" && QZ) return `<div class="stack" style="--gap:16px">${head}${quizBody()}</div>`;
  if(IV.status === "roundDone"){
    const res = IV.results[IV.results.length - 1], last = IV.idx >= IV.rounds.length - 1, failed = res.eval.verdict === "fail";
    return `<div class="stack" style="--gap:20px">${head}
      <h2>Kết quả vòng ${esc(r.name)}</h2>
      ${res.hints ? `<p class="small muted">Bạn đã xem gợi ý ${res.hints} lần trong vòng này.</p>` : ""}
      ${renderEval(res.eval)}
      <details class="panel"><summary style="cursor:pointer">${res.quiz ? "Xem lại từng câu" : "Xem lại bản ghi"}</summary>${res.quiz ? `<div style="margin-top:12px">${quizReview(res.quiz)}</div>` : `<div class="chat" style="margin-top:12px">${chatHtml(res.transcript, r)}</div>`}</details>
      ${!last && failed ? `<p class="note">Trong quy trình thật, bạn sẽ dừng ở vòng này. Bạn có thể kết thúc hoặc vẫn luyện tiếp vòng sau.</p>` : ""}
      <div class="row">${last ? `<button class="btn primary" data-act="iv-finish">${IV.rounds.length > 1 ? "Xem tổng kết" : "Hoàn tất"}</button>`
        : `<button class="btn ${failed ? "" : "primary"}" data-act="iv-next">${failed ? "Vẫn luyện" : "Sang"} vòng ${esc(ROUNDS[IV.rounds[IV.idx + 1]].name)}</button>${failed ? `<button class="btn primary" data-act="iv-finish">Kết thúc tại đây</button>` : ""}`}</div>
    </div>`;
  }
  const asking = IV.status === "asking", evaluating = IV.status === "evaluating";
  let tail = "";
  if(asking) tail = msgHtml("assistant", IV.stream || "Đang suy nghĩ…", r, "stream", !IV.stream);
  if(evaluating) tail = msgHtml("assistant", IV.lang === "en" ? "Thanks, that's all for this round." : "Cảm ơn bạn, vòng này mình dừng ở đây nhé.", r) + `<p class="thinking">Đang chấm điểm vòng này theo ${RUBRICS[r.rubric].length} tiêu chí. Thường mất 20 đến 60 giây.</p>`;
  let composer = "";
  if(IV.status === "answer"){
    composer = `<div class="composer stack" style="--gap:8px">
      <div class="row"><label class="label" for="iv-answer" style="margin:0">Câu trả lời của bạn</label><span class="spacer"></span><span class="timer" id="iv-timer"></span></div>
      <textarea id="iv-answer" placeholder="Trả lời hoặc hỏi lại để làm rõ. Ctrl + Enter để gửi.">${esc(IV.draft)}</textarea>
      ${micNote("iv-answer")}
      <div class="row"><button class="btn primary" data-act="iv-send">Gửi câu trả lời</button>${micBtn("iv-answer")}${IV.hint && IV.hint.turn === IV.turns.length ? "" : `<button class="btn" data-act="iv-hint">Gợi ý</button>`}${IV.answers >= 1 ? `<button class="btn" data-act="iv-end" title="Bỏ qua các câu hỏi vặn còn lại và chấm vòng này">Chấm điểm ngay</button>` : ""}</div></div>`;
  } else if(asking){
    composer = `<div class="row"><button class="btn ghost" data-act="iv-stop">Dừng</button></div>`;
  } else if(IV.status === "error"){
    composer = `<div class="note err note-act" role="alert"><span>${esc(IV.err)}</span><button class="btn primary" data-act="iv-retry">Hỏi lại</button></div>`;
  } else if(IV.status === "evalError"){
    composer = `<div class="note err note-act" role="alert"><span>${esc(IV.err)}</span><button class="btn primary" data-act="iv-reeval">Chấm lại</button></div>`;
  }
  return `<div class="stack" style="--gap:16px">${head}
    <div class="chat" aria-live="polite">${chatHtml(IV.turns, r)}${tail}${IV.status === "answer" ? hintHtml() : ""}</div>
    ${composer}</div>`;
}
function msgHtml(role, text, r, id, thinking){
  if(role === "assistant") return `<div class="msg"><span class="who" aria-hidden="true">${esc(r.who[0])}</span><div><div class="name">${esc(r.who)}</div><div class="bubble ${thinking ? "thinking" : ""}" ${id ? `id="${id}"` : ""}>${esc(text)}</div></div></div>`;
  return `<div class="msg me"><div class="bubble">${esc(text)}</div></div>`;
}
function chatHtml(turns, r){ return turns.map(t => msgHtml(t.role, t.content, r)).join(""); }
function overallOf(results){ return results.length ? Math.round(results.reduce((a,b) => a + b.eval.overall, 0) / results.length) : 0; }
function finalVerdict(results, roundsTotal){
  const anyFail = results.some(x => x.eval.verdict === "fail");
  const complete = results.length >= roundsTotal;
  if(!anyFail && complete) return {t:"Nhận offer", c:"var(--green)", bg:"var(--green-soft)", d:"Bạn qua tất cả các vòng. Xem lại phần cần cải thiện để vào buổi thật tự tin hơn."};
  if(anyFail) return {t:"Chưa đạt", c:"var(--red)", bg:"var(--red-soft)", d:"Có vòng chưa đạt. Ôn các chủ đề được gợi ý rồi thử lại."};
  return {t:"Chưa hoàn tất", c:"var(--amber)", bg:"var(--amber-soft)", d:"Buổi phỏng vấn kết thúc trước khi đi hết các vòng."};
}
function vFinal(){ return `<div class="stack" style="--gap:20px">${sessionSummary(sessionFromIV(), false, `<button class="btn" data-act="open-report" data-id="${IV.id}">Xem tổng kết</button><button class="btn primary" data-act="iv-new">Phỏng vấn mới</button>`)}</div>`; }
// report: trang báo cáo đầy đủ. Buổi một vòng thì kết quả vòng đã là tổng kết, không lặp lại khối điểm chung
function sessionSummary(s, report, actions){
  const fv = finalVerdict(s.results, s.rounds.length), ov = overallOf(s.results);
  const weak = [...new Set(s.results.flatMap(x => x.eval.weakTopics))];
  const single = s.rounds.length === 1;
  const head = `<div class="page-head"><div class="stack" style="--gap:6px"><h1>${single && report ? "Kết quả vòng " + esc(ROUNDS[s.rounds[0]].name) : "Tổng kết buổi phỏng vấn"}</h1>
  <p class="muted small">${s.jdName ? "JD " + esc(s.jdName) + ". " : ""}${esc(ROLES[s.role] ? ROLES[s.role].name : "")}, ${esc(LEVELS[s.level] || "")}, ${esc(COMPANY_SHORT[s.company] || "")}. ${fmtDate(s.createdAt)}</p></div>${actions ? `<div class="row page-actions">${actions}</div>` : ""}</div>`;
  if(single && report) return head;
  return `${head}
  <div class="verdict" style="--vbg:${fv.bg};--vc:${fv.c}"><span class="num">${ov}<small>/100</small></span><span class="vbody"><span class="vt">${fv.t}</span><span class="vsum">${fv.d}</span></span></div>
  ${single ? "" : `<section class="panel"><h3 style="margin-bottom:6px">Các vòng</h3>${s.rounds.map(rid => { const res = s.results.find(x => x.roundId === rid); return `<div class="crit"><span class="c-name">${esc(ROUNDS[rid].name)}</span>${res ? bar(res.eval.overall) : `<span class="small muted">Chưa thi</span>`}<b>${res ? res.eval.overall : ""}</b></div>`; }).join("")}</section>`}
  ${weak.length ? `<section class="stack" style="--gap:10px"><h3>Nên ôn tiếp</h3><div class="chips">${weak.map(t => `<button class="chip" data-act="open-topic" data-topic="${t}">${esc(TOPIC[t].name)}</button>`).join("")}</div></section>` : ""}`;
}

/* ================= PROGRESS & REPORTS ================= */
function historyHtml(){
  return `${jdStatsHtml()}
  <section class="stack" style="--gap:12px"><h2>Lịch sử phỏng vấn</h2>
    ${Store.sessions.length ? `<div class="hist">${Store.sessions.slice().sort((a,b) => b.createdAt - a.createdAt).map(s => { const ov = overallOf(s.results), fv = finalVerdict(s.results, s.rounds.length); return `<button class="hrow" data-act="open-report" data-id="${s.id}"><span class="dot" style="--c:${fv.c}"></span><span><b>${s.rounds.length > 1 ? "Trọn quy trình" : esc(ROUNDS[s.rounds[0]].name)}</b><br><span class="small muted">${s.jdName ? esc(s.jdName) + ", " : ""}${fmtDate(s.createdAt)}, ${s.results.length}/${s.rounds.length} vòng</span></span><span class="spacer"></span><b style="font-family:var(--display);color:${scoreColor(ov)}">${s.results.length ? ov : "–"}</b></button>`; }).join("")}</div>`
      : `<p class="small muted">Chưa có buổi phỏng vấn nào.</p>`}
  </section>`;
}
function vReport(){
  const s = Store.sessions.find(x => x.id === view.id);
  if(!s) return `<button class="btn ghost back" data-go="interview">← Phỏng vấn thử</button><p>Không tìm thấy buổi phỏng vấn này.</p>`;
  return `<div class="stack" style="--gap:20px">
    <button class="btn ghost back" data-go="interview">← Phỏng vấn thử</button>
    ${sessionSummary(s, true)}
    ${s.results.map(res => { const r = ROUNDS[res.roundId], single = s.rounds.length === 1; return `<section class="stack" style="--gap:14px${single ? "" : ";padding-top:16px;border-top:1px solid var(--line)"}">${single ? "" : `<h2>${esc(r.name)}</h2>`}${res.hints ? `<p class="small muted">Bạn đã xem gợi ý ${res.hints} lần trong vòng này.</p>` : ""}${renderEval(res.eval, {noTopics: !single})}<details class="panel"><summary style="cursor:pointer">${res.quiz ? "Xem lại từng câu" : "Xem lại bản ghi"}</summary>${res.quiz ? `<div style="margin-top:12px">${quizReview(res.quiz)}</div>` : `<div class="chat" style="margin-top:12px">${chatHtml(res.transcript, r)}</div>`}</details></section>`; }).join("")}
  </div>`;
}

/* ================= EVENTS ================= */
function arm(btn, msg){
  if(btn.dataset.armed === "1") return true;
  btn.dataset.armed = "1"; const old = btn.textContent; btn.textContent = tr(msg);
  setTimeout(() => { if(btn.isConnected){ btn.dataset.armed = ""; btn.textContent = old; } }, 4000);
  return false;
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g){ editingProfile = false; editingTarget = null; go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]");
  if(!a) return;
  const d = a.dataset;
  switch(d.act){
    case "review-due": { const ids = dueIds(); startReview(ids.length ? ids : TOPICS.flatMap(t => cardIds(t.id)), "learn"); break; }
    case "review-topic": startReview(dueIds(d.topic), "topic", d.topic); break;
    case "review-topic-all": startReview(cardIds(d.topic), "topic", d.topic); break;
    case "flip": if(!RV.flipped){ RV.flipped = true; render(); const c = document.getElementById("card"); if(c){ c.classList.add("flip"); } } break;
    case "rate": rate(d.r); break;
    case "explain": explainCard(); break;
    case "quick-practice": { const qs = questionsOf(d.topic); const fresh = qs.filter(q => !S.practice[q.id]); const pick = (fresh.length ? fresh : qs)[Math.floor(Math.random() * (fresh.length ? fresh : qs).length)]; PR = null; openPractice(d.topic, pick.id); break; }
    case "open-topic": go("topic", {topic: d.topic, tab: d.tab || "lessons"}); break;
    case "tab": view.tab = d.tab; syncUrl(true); render(); break;
    case "open-q": openPractice(d.topic, d.q); break;
    case "gen-q": genQuestion(d.topic); break;
    case "grade": grade(); break;
    case "toggle-keys": PR.showKeys = !PR.showKeys; render(); break;
    case "edit-profile": editingProfile = true; render(); break;
    case "cancel-profile": editingProfile = false; render(); break;
    case "goto-profile": editingTarget = "new"; go("interview"); break;
    case "pick-target": case "su-target": S.profile.activeJd = d.id !== undefined ? d.id : d.v; SU.loop = null; save(); render(); break;
    case "edit-target": editingTarget = d.id; render(); { const el = document.getElementById("tf-name") || document.getElementById("tf-role"); if(el) el.scrollIntoView({block:"center"}); } break;
    case "cancel-target": editingTarget = null; render(); break;
    case "del-jd": {
      if(!arm(a, "Bấm lần nữa để xóa")) break;
      S.jds = S.jds.filter(j => j.id !== d.id); if(S.profile.activeJd === d.id) S.profile.activeJd = ""; SU.loop = null; save(); render(); break;
    }
    case "save-target": {
      const val = id => ((document.getElementById(id) || {}).value || "");
      const role = val("tf-role"), level = val("tf-level"), company = val("tf-company");
      if(d.id === "general"){ Object.assign(S.profile, {role, level, company}); }
      else {
        const text = val("tf-text").trim(), name = val("tf-name").trim() || ("JD " + (S.jds.length + 1));
        if(text.length < 40){ const er = document.getElementById("tf-err"); if(er){ er.textContent = tr("Dán nội dung JD (ít nhất vài dòng) trước khi lưu."); er.style.display = "block"; } break; }
        if(d.id === "new"){ const j = {id: "jd" + uid(), name, role, level, company, text, createdAt: Date.now(), analysis: null}; S.jds.push(j); S.profile.activeJd = j.id; }
        else { const j = S.jds.find(x => x.id === d.id); if(j){ if(j.text !== text || j.role !== role || j.level !== level || j.company !== company) j.analysis = null; Object.assign(j, {name, role, level, company, text}); } }
      }
      editingTarget = null; SU.loop = null; save(); render(); break;
    }
    case "analyze-jd": analyzeJd(d.id); break;
    case "jd-interview": { const j = activeJd(); SU.mode = "loop"; SU.loop = (j && j.analysis && j.analysis.rounds.length ? j.analysis.rounds : ROLES[effectiveProfile().role].loop).slice(); startInterview(); break; }
    case "jd-practice": {
      const j = activeJd(); const q = j && j.analysis && j.analysis.questions[+d.i]; if(!q) break;
      const list = S.custom[q.topic] = S.custom[q.topic] || [];
      let item = list.find(x => x.q === q.q);
      if(!item){ item = {id: "c" + uid(), q: q.q, k: [], jdId: j.id}; list.push(item); save(); }
      PR = null; openPractice(q.topic, item.id); break;
    }
    case "save-profile": {
      const p = S.profile, oldRole = p.role;
      p.role = document.getElementById("pf-role").value; p.level = document.getElementById("pf-level").value;
      p.company = document.getElementById("pf-company").value; p.jd = document.getElementById("pf-jd").value;
      if(oldRole !== p.role) SU.loop = null;
      save(); editingProfile = false; render(); break;
    }
    case "su-mode": SU.mode = d.v; render(); break;
    case "su-single": SU.single = d.v; render(); break;
    case "su-loop": { const i = SU.loop.indexOf(d.v); if(i >= 0) SU.loop.splice(i, 1); else SU.loop.push(d.v); render(); break; }
    case "su-fu": S.profile.followups = +d.v; save(); render(); break;
    case "su-style": S.profile.style = d.v; save(); render(); break;
    case "su-lang": S.profile.lang = d.v; save(); render(); break;
    case "iv-start": startInterview(); break;
    case "iv-send": sendAnswer(); break;
    case "iv-hint": askHint(); break;
    case "mic": toggleMic(d.target); break;
    case "iv-end": stopMic(); if(IV.draft.trim()){ IV.turns.push({role:"user", content: IV.draft.trim()}); IV.answers++; IV.draft = ""; } evaluateRound(); break;
    case "iv-stop": if(IV && IV.ctl) IV.ctl.abort(); break;
    case "iv-retry": askNext(); break;
    case "iv-reeval": evaluateRound(); break;
    case "iv-next": IV.idx++; startRound(); break;
    case "iv-finish": IV.status = "finished"; render(); window.scrollTo(0,0); break;
    case "iv-new": IV = null; render(); break;
    case "iv-leave":
      if(!arm(a, IV.results.length ? "Bấm lần nữa: vòng này sẽ không được chấm" : "Bấm lần nữa: buổi này sẽ không được lưu")) break;
      stopMic(); if(IV.ctl) IV.ctl.abort(); IV = null; render();
      break;
    case "qz-pick": if(QZ && !QZ.submitted){ QZ.answers[QZ.idx] = +d.i; render(); } break;
    case "qz-go": if(QZ){ QZ.idx = clamp(+d.i, 0, QZ.questions.length - 1); render(); } break;
    case "qz-submit": {
      const left = QZ.questions.length - Object.keys(QZ.answers).length;

    case "open-gen": GL.err = ""; go("newlesson", {topic: d.topic || ""}); setTimeout(() => { const el = document.getElementById("gl-subject"); if(el) el.focus(); }, 0); break;

      if(S.customLessons[tid]) S.customLessons[tid] = S.customLessons[tid].filter(x => x.id !== d.id);
      delete S.lessons[d.id]; save(); go("topic", {topic: tid, tab: "lessons"}); break;
    }
    case "open-report": go("report", {id: d.id}); break;
    case "gd-connect": { const v = ((document.getElementById("gd-cid") || {}).value || "").trim(); if(!v) break; try{ localStorage.setItem(GD_CID_LS, v); localStorage.removeItem(GD_ON_LS); }catch(e){} gdSync().then(render); render(); break; }
    case "gd-sync": gdSync().then(render); break;

    case "reset":
      if(!arm(a, "Bấm lần nữa để xóa vĩnh viễn")) break;
      { const prof = S.profile, jds = S.jds; const settings = S.settings; S = defaultState(); S.profile = prof; S.jds = jds; S.settings = settings; S._resetAt = Date.now(); save();
        if(Store.db) Store.sessions.forEach(s => sessCol().doc(s.id).delete().catch(()=>{}));
